function Dash({ scopeData, blockData, blocks, standards }) {
  // Scope 1: calcScope1Total이 이미 연간+월별 모두 처리 (v25 중복 합산 버그 수정)
  let s1total = calcScope1Total(scopeData.s1, YEAR_LATEST);
  
  // Scope 2: 최신 연도 기준 (3년치 구조 호환)
  let s2total = 0;
  {
    const s2 = scopeData.s2;
    const inputType = s2.input_type || "kWh";
    // yearly_val_2025 (최신) 우선 → 호환 yearly_val → 월별 합계
    let v = parseFloat(s2["yearly_val_" + YEAR_LATEST]) || parseFloat(s2.yearly_val) || 0;
    if (!v) {
      const monthly = s2["_monthly_" + YEAR_LATEST];
      if (Array.isArray(monthly)) {
        v = monthly.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      } else {
        for (let i = 0; i < 12; i++) v += parseFloat(s2[i]) || 0;
      }
    }
    const kwh = inputType === "원" ? v / 165 : v;
    s2total = (kwh / 1000) * getPowerEF(YEAR_LATEST);
  }
  
  // Scope 3
  // Scope 3: 최신 연도 기준 (3년치 구조 호환)
  let s3total = 0;
  S3.forEach(c => {
    if (!c.ef) return;
    const raw = scopeData.s3[c.id];
    let v = 0;
    if (typeof raw === "object" && raw !== null) {
      v = parseFloat(raw[YEAR_LATEST]) || 0;
    } else {
      v = parseFloat(raw) || 0;
    }
    s3total += v * c.ef;
  });
  const grand = s1total + s2total + s3total;

  const totalBlocks = blocks.length;
  const isDone = (b) => {
    if (b.input_type === 'scope1_table') {
      const hasYearly = [...SF, ...MF].some(f => {
        const v = scopeData.s1[f.id];
        if (typeof v === "number") return v > 0;
        if (typeof v === "object" && v !== null) return Object.values(v).some(x => parseFloat(x) > 0);
        return parseFloat(v) > 0;
      });
      const hasMonthly = Object.keys(scopeData.s1).some(k => {
        if (!k.startsWith("_monthly_")) return false;
        const m = scopeData.s1[k];
        if (Array.isArray(m)) return m.some(v => v);
        if (m && typeof m === "object") return Object.values(m).some(arr => Array.isArray(arr) && arr.some(v => v));
        return false;
      });
      return hasYearly || hasMonthly;
    }
    if (b.input_type === 'scope2_table') {
      return scopeData.s2.yearly_val || Object.keys(scopeData.s2).some(k => !isNaN(parseInt(k)) && scopeData.s2[k]);
    }
    if (b.input_type === 'scope3_table') return S3.some(c => {
      if (c.id === 'c7') return false;
      const raw = scopeData.s3[c.id];
      if (typeof raw === "object" && raw !== null) return Object.values(raw).some(x => parseFloat(x) > 0);
      return parseFloat(raw) > 0;
    });
    const v = blockData[b.id];
    if (b.input_type === 'text') return v?.content_text && v.content_text.length > 10;
    return v?.content_json && v.content_json.length > 0 && v.content_json.some(r => Object.values(r||{}).some(x => x));
  };
  const doneBlocks = blocks.filter(isDone).length;
  const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;

  return <div>
    <div style={{ marginBottom: 28 }}>
      <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>대시보드</h2>
      <p style={{ fontSize: 14, color: T.g500, marginTop: 2 }}>{YEAR_LATEST}년 온실가스 배출량 및 GRI 작성 현황</p>
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 16 }}>
      <KPI label="총 배출량" value={grand} unit="tCO₂eq" />
      <KPI label="Scope 1" value={s1total} unit="tCO₂eq · 직접배출" />
      <KPI label="Scope 2" value={s2total} unit="tCO₂eq · 전력" />
      <KPI label="Scope 3" value={s3total} unit="tCO₂eq · 공급망" />
    </div>
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>전체 입력 진행률</span>
        <span style={{ fontSize: 24, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{pct}%</span>
      </div>
      <Bar pct={pct} color={T.g900} h={6}/>
      <div style={{ marginTop: 16 }}>
        {standards.map(s => {
          const sBlocks = blocks.filter(b => b.gri_code === s.code);
          const sDone = sBlocks.filter(isDone).length;
          const p = sBlocks.length ? Math.round(sDone / sBlocks.length * 100) : 0;
          return <div key={s.code} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
            <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 200 }}>{s.title}</span>
            <div style={{ flex: 1 }}><Bar pct={p} color={T.g500} h={4}/></div>
            <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{sDone}/{sBlocks.length}</span>
          </div>;
        })}
      </div>
    </div>

    {/* 🎯 이중중대성평가 현황 카드 (v23) */}
    {(() => {
      const matData = (blockData["materiality_v2"] && blockData["materiality_v2"].content_json) || {};
      const responses = matData.responses || {};
      const meta = matData.meta || {};
      const applicable = Object.values(responses).filter(r => r && r.applicable === true).length;
      const assessed = Object.values(responses).filter(r => r && r.applicable === true && r.scale > 0 && r.scope > 0 && r.irrem > 0 && r.finImpact > 0 && r.finLikelihood > 0).length;
      const confirmed = matData.confirmed;
      const coreTopics = matData.coreTopics || [];
      const vcCount = Object.values(meta.valueChain || {}).filter(Boolean).length;
      const anomalies = detectAnomalies(responses);
      const highAnomalies = anomalies.filter(a => a.severity === "high").length;
      const totalProgress = Math.round(
        ((vcCount > 0 ? 1 : 0) * 15 +
         (Object.keys(responses).length > 0 ? 1 : 0) * 15 +
         (applicable > 0 ? 1 : 0) * 10 +
         (assessed > 0 ? assessed / 15 * 30 : 0) +
         (confirmed ? 1 : 0) * 30)
      );

      return (
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div>
              <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>🎯 이중중대성평가 진행 현황</span>
              <span style={{ fontSize: 10, background: T.emerald, color: T.white, padding: "2px 8px", borderRadius: 3, fontWeight: 700, marginLeft: 8 }}>v2</span>
            </div>
            <span style={{ fontSize: 24, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{totalProgress}%</span>
          </div>
          <Bar pct={totalProgress} color={T.emerald} h={6}/>
          <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
            <div style={{ padding: 10, background: T.emeraldBg, borderRadius: 6 }}>
              <div style={{ fontSize: 10, color: T.g500, marginBottom: 2 }}>가치사슬</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: T.g900 }}>{vcCount}<span style={{ fontSize: 10, color: T.g500 }}>/6</span></div>
            </div>
            <div style={{ padding: 10, background: T.emeraldBg, borderRadius: 6 }}>
              <div style={{ fontSize: 10, color: T.g500, marginBottom: 2 }}>해당 주제</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: T.g900 }}>{applicable}<span style={{ fontSize: 10, color: T.g500 }}>/15</span></div>
            </div>
            <div style={{ padding: 10, background: T.emeraldBg, borderRadius: 6 }}>
              <div style={{ fontSize: 10, color: T.g500, marginBottom: 2 }}>평가 완료</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: T.g900 }}>{assessed}<span style={{ fontSize: 10, color: T.g500 }}>/{applicable || 0}</span></div>
            </div>
            <div style={{ padding: 10, background: highAnomalies > 0 ? "#fef2f2" : T.emeraldBg, borderRadius: 6 }}>
              <div style={{ fontSize: 10, color: T.g500, marginBottom: 2 }}>이상치</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: highAnomalies > 0 ? "#991b1b" : T.g900 }}>{anomalies.length}<span style={{ fontSize: 10, color: T.g500 }}>건</span></div>
            </div>
            <div style={{ padding: 10, background: confirmed ? T.emeraldBg : T.g100, borderRadius: 6 }}>
              <div style={{ fontSize: 10, color: T.g500, marginBottom: 2 }}>상태</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: confirmed ? T.emerald : T.g400, marginTop: 2 }}>{confirmed ? "✓ 확정" : "미확정"}</div>
            </div>
          </div>
          {coreTopics.length > 0 && (
            <div style={{ marginTop: 14, padding: 10, background: "#fef3c7", borderRadius: 6 }}>
              <div style={{ fontSize: 10, color: "#92400e", fontWeight: 700, marginBottom: 4 }}>🎯 핵심 이슈 (보고서 우선 공시 대상)</div>
              <div style={{ fontSize: 11, color: "#92400e" }}>{coreTopics.join(" · ")}</div>
            </div>
          )}
          {highAnomalies > 0 && (
            <div style={{ marginTop: 10, padding: 10, background: "#fef2f2", border: "1px solid #fca5a5", borderRadius: 6 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#991b1b" }}>⛔ 재검토 필수 이상치 {highAnomalies}건 — 4단계 이상치 리포트에서 확인하세요.</div>
            </div>
          )}
        </div>
      );
    })()}
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24 }}>
      <span style={{ fontSize: 14, fontWeight: 600, color: T.g800, display: "block", marginBottom: 16 }}>부서별 담당 항목 진행률</span>
      {Object.entries(DEPTS).map(([k, d]) => {
        const deptBlocks = blocks.filter(b => b.default_dept === k);
        if (!deptBlocks.length) return null;
        const deptDone = deptBlocks.filter(isDone).length;
        const p = Math.round(deptDone / deptBlocks.length * 100);
        return <div key={k} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 120 }}>{d.name.split(" · ")[0]}</span>
          <div style={{ flex: 1 }}><Bar pct={p} color={d.color} h={4}/></div>
          <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{deptDone}/{deptBlocks.length}</span>
        </div>;
      })}
    </div>
  </div>;
}

      if (rows && rows.length > 0) {
        const sd = { s1:{}, s2:{}, s3:{} };
        rows.forEach(r => {
          if (r.category === "s1") sd.s1 = r.data || {};
          else if (r.category === "s2") sd.s2 = r.data || {};
          else if (r.category === "s3") sd.s3 = r.data || {};
        });
        setScopeData(sd);
      }
      const stds = await sbFetch("gri_standards?select=*&order=display_order");
      if (stds) setStandards(stds);
      const bls = await sbFetch("input_blocks?select=*&order=display_order");
      if (bls) setBlocks(bls);
      const gms = await sbFetch("block_gri_mapping?select=block_id,gri_disclosure");
      if (gms) { const m = {}; gms.forEach(g => { (m[g.block_id] = m[g.block_id] || []).push(g.gri_disclosure); }); setGriMap(m); }
      const vms = await sbFetch("block_vsme_mapping?select=block_id,vsme_code");
      if (vms) { const m = {}; vms.forEach(v => { (m[v.block_id] = m[v.block_id] || []).push(v.vsme_code); }); setVsmeMap(m); }
      const bds = await sbFetch("block_data?select=*");
      if (bds) { 
        const m = {}; 
        bds.forEach(d => { m[d.block_id] = { content_text: d.content_text, content_json: d.content_json, status: d.status }; }); 
        // ═ v25.1: Supabase 응답을 localStorage 복구분과 병합 (덮어쓰기 X) ═
        // Supabase에 없는 materiality_v2·_102_sub·_103_meta 같은 로컬 전용 키는 localStorage에서 유지
        setBlockDataState(prev => ({ ...prev, ...m })); 
      }
    } catch(e) { console.log("Load error:", e); }
    setLoaded(true);
  }, [sbFetch]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const scopeTimer = React.useRef(null);
  const saveScope = useCallback((cat, val) => {
    // ═ v25: localStorage 즉시 저장 ═
    try {
      const c = localStorage.getItem("esg_scopedata_ycchem");
      const p = c ? JSON.parse(c) : { s1:{}, s2:{}, s3:{} };
      p[cat] = val;
      localStorage.setItem("esg_scopedata_ycchem", JSON.stringify(p));
    } catch(e) { console.log("localStorage scope save error:", e); }
    if (scopeTimer.current) clearTimeout(scopeTimer.current);
    setSaving(true);
    scopeTimer.current = setTimeout(async () => {
      try {
        await sbFetch("esg_data?category=eq." + cat, {
          method: "PATCH",
          body: JSON.stringify({ data: val, updated_at: new Date().toISOString() }),
        });
      } catch(e) { console.log("Save error:", e); }
      setSaving(false);
    }, 800);
  }, [sbFetch]);

  const blockTimer = React.useRef(null);
  const blockPendingRef = React.useRef({});
  const setBlockData = useCallback((blockId, data) => {
    setBlockDataState(prev => {
      const merged = { ...prev, [blockId]: { ...prev[blockId], ...data } };
      blockPendingRef.current[blockId] = merged[blockId];
      // ═ v25: localStorage 즉시 저장 (새로고침해도 데이터 유지) ═
      try { localStorage.setItem("esg_blockdata_ycchem", JSON.stringify(merged)); } catch(e) {}
      return merged;
    });
    if (blockTimer.current) clearTimeout(blockTimer.current);
    setSaving(true);
    blockTimer.current = setTimeout(async () => {
      const pending = { ...blockPendingRef.current };
      blockPendingRef.current = {};
      for (const [bid, val] of Object.entries(pending)) {
        try {
          const payload = {
            block_id: bid,
            company_id: 'ycchem',
            content_text: val.content_text || null,
            content_json: val.content_json || null,
            updated_at: new Date().toISOString(),
          };
          await sbFetch("block_data", {
            method: "POST",
            body: JSON.stringify(payload),
            headers: { "Prefer": "resolution=merge-duplicates,return=minimal" }

      }
      setSaving(false);

  const setS2 = useCallback((i, v) => {

// Severity = (Scale × Scope × Irremediable)^(1/3) 기하평균 → 0~1 정규화
function calcSeverity(scale, scope, irrem) {
  if (!scale || !scope || !irrem) return 0;
  const geo = Math.pow(scale * scope * irrem, 1/3);
  return geo / 5; // 0~1
}

// Impact = Severity × (Likelihood/5)
// 실제: 잠재 영향은 Likelihood 반영, 실제 영향은 Likelihood=5로 간주
function calcImpact(resp) {
  if (!resp || !resp.applicable) return 0;
  const severity = calcSeverity(resp.scale, resp.scope, resp.irrem);
  const likelihood = resp.isActual ? 1.0 : LIKERT5_MAP[resp.likelihood] || 0;
  return severity * likelihood;
}

// Financial = FinImpact × FinLikelihood
function calcFinancial(resp) {
  if (!resp || !resp.applicable) return 0;
  const impact = LIKERT5_MAP[resp.finImpact] || 0;
  const likelihood = LIKERT5_MAP[resp.finLikelihood] || 0;
  return impact * likelihood;
}

function calculateMaterialityV2(responses, thresholdMode) {
  const applicable = MATERIALITY_TOPICS.filter(t => {
    const r = responses[t.code];
    return r && r.applicable && 
           r.scale > 0 && r.scope > 0 && r.irrem > 0 && 
           r.finImpact > 0 && r.finLikelihood > 0;
  });

  const scored = applicable.map(t => {
    const r = responses[t.code];
    const impact = calcImpact(r);
    const financial = calcFinancial(r);
    // 총점: 둘 중 높은 것 기준 (GRI 3 의도 - 한 축만 높아도 material)
    const maxAxis = Math.max(impact, financial);
    const avgAxis = (impact + financial) / 2;
    return {
      code: t.code, title: t.title, cat: t.cat, color: t.color,
      gri: t.gri, kesg: t.kesg,
      impact, financial,
      maxAxis, avgAxis,
      severity: calcSeverity(r.scale, r.scope, r.irrem),
      isActual: r.isActual,
      scale: r.scale, scope: r.scope, irrem: r.irrem,
      likelihood: r.likelihood,
      finImpact: r.finImpact, finLikelihood: r.finLikelihood,
    };
  });

  // 정렬: maxAxis 기준 (한 축이라도 높으면 중요)
  scored.sort((a, b) => b.maxAxis - a.maxAxis);

  // Threshold 적용
  const mode = thresholdMode || "top35";
  const n = scored.length;
  let core = [], manage = [], monitor = [];

  if (mode === "top35") {
    // 상위 35% 핵심, 다음 35% 관리, 나머지 참고
    const coreCount = Math.max(1, Math.ceil(n * 0.35));
    const manageCount = Math.max(1, Math.ceil(n * 0.35));
    core = scored.slice(0, coreCount);
    manage = scored.slice(coreCount, coreCount + manageCount);
    monitor = scored.slice(coreCount + manageCount);
  } else if (mode === "axis06") {
    // 한 축 0.6 이상 → 핵심, 한 축 0.3 이상 → 관리
    core = scored.filter(s => s.maxAxis >= 0.6);
    manage = scored.filter(s => s.maxAxis >= 0.3 && s.maxAxis < 0.6);
    monitor = scored.filter(s => s.maxAxis < 0.3);
  } else if (mode === "both05") {
    // 두 축 모두 0.5 이상 (엄격 기준 - 기존 매트릭스 방식)
    core = scored.filter(s => s.impact >= 0.5 && s.financial >= 0.5);
    manage = scored.filter(s => 
      !(s.impact >= 0.5 && s.financial >= 0.5) && 
      (s.impact >= 0.3 || s.financial >= 0.3)
    );
    monitor = scored.filter(s => s.impact < 0.3 && s.financial < 0.3);
  }

  return { all: scored, core, manage, monitor };
}

// 이상치 탐지 (리포트용)
function detectAnomalies(responses) {
  const anomalies = [];

  MATERIALITY_TOPICS.forEach(t => {
    const r = responses[t.code];
    if (!r) return;

    const impact = calcImpact(r);
    const financial = calcFinancial(r);
    const severity = calcSeverity(r.scale || 0, r.scope || 0, r.irrem || 0);

    // 1. 해당이라고 했는데 모두 0점
    if (r.applicable && 
        (!r.scale || r.scale === 0) && 
        (!r.scope || r.scope === 0) && 
        (!r.irrem || r.irrem === 0) &&
        (!r.finImpact || r.finImpact === 0)) {
      anomalies.push({
        type: "zero_all",
        severity: "high",
        code: t.code, title: t.title,
        msg: "해당된다고 표시하셨으나 평가 항목이 모두 비어있습니다. 재검토가 필요합니다."
      });
      return;
    }

    // 2. Impact와 Financial 괴리 큼 (절대차 0.4 이상)
    if (r.applicable && impact > 0 && financial > 0) {
      const gap = Math.abs(impact - financial);
      if (gap >= 0.4) {
        anomalies.push({
          type: "gap",
          severity: "medium",
          code: t.code, title: t.title,
          msg: `영향(${(impact*100).toFixed(0)}점)과 재무(${(financial*100).toFixed(0)}점) 점수 괴리가 큽니다 (${(gap*100).toFixed(0)}점). 재무 영향 관점을 다시 검토해보세요.`
        });
      }
    }

    // 3. 업계 평균 대비 현저히 낮음
    const bm = INDUSTRY_BENCHMARK[t.code];
    if (bm && r.applicable && impact > 0) {
      if (impact < bm.impact - 0.3) {
        anomalies.push({
          type: "below_industry_impact",
          severity: "medium",
          code: t.code, title: t.title,
          msg: `영향 평가(${(impact*100).toFixed(0)}점)가 업계 평균(${(bm.impact*100).toFixed(0)}점)보다 30점 이상 낮습니다. 동종 업계 관점에서 재검토가 필요합니다.`
        });
      }
      if (financial < bm.financial - 0.3) {
        anomalies.push({
          type: "below_industry_fin",
          severity: "medium",
          code: t.code, title: t.title,
          msg: `재무 평가(${(financial*100).toFixed(0)}점)가 업계 평균(${(bm.financial*100).toFixed(0)}점)보다 30점 이상 낮습니다. 규제·고객 요구 변화를 고려하세요.`
        });
      }
    }

    // 4. 반도체·화학 특화 - E1·S1 핵심 이슈인데 낮은 평가
    if ((t.code === "E1" || t.code === "S1") && r.applicable) {
      if (impact < 0.4 && financial < 0.4) {
        anomalies.push({
          type: "core_too_low",
          severity: "high",
          code: t.code, title: t.title,
          msg: `반도체·화학 제조업 공통 핵심 이슈인 「${t.title}」이(가) 영향·재무 모두 40점 미만으로 평가되었습니다. 근거 재확인이 필요합니다.`
        });
      }
    }

    // 5. 해당 없음인데 반도체 필수 주제
    if ((t.code === "E1" || t.code === "S1" || t.code === "E5") && r.applicable === false) {
      anomalies.push({
        type: "mandatory_excluded",
        severity: "high",
        code: t.code, title: t.title,
        msg: `반도체·화학 업종에서 「${t.title}」은 일반적으로 필수 평가 대상입니다. '해당 없음' 사유를 명확히 하거나 재검토를 권장합니다.`
      });
    }

    // 6. Scale/Scope/Irrem 중 하나만 매우 높고 나머지 매우 낮은 경우 (불일치)
    if (r.applicable && r.scale && r.scope && r.irrem) {
      const vals = [r.scale, r.scope, r.irrem];
      const max = Math.max(...vals), min = Math.min(...vals);
      if (max - min >= 3) {
        anomalies.push({
          type: "severity_inconsistent",
          severity: "low",
          code: t.code, title: t.title,
          msg: `Scale(${r.scale})·Scope(${r.scope})·회복불가능성(${r.irrem}) 평가 편차가 큽니다. 논리적 일관성을 재확인해주세요.`
        });
      }
    }
  });

  return anomalies;
}

    "both05": "영향·재무 두 축이 모두 0.5 이상인 주제를 핵심 이슈로 선정"
  }[threshold];

  const methodology = `당사는 GRI 3: Material Topics 2021의 공식 4단계 절차에 따라 이중중대성평가를 수행하였습니다. 영향 중요도(Impact Materiality)는 Scale(규모)·Scope(범위)·Irremediable character(회복불가능성)의 3요소로 심각도(Severity)를 산정하고, 잠재적 영향에 대해서는 발생 가능성(Likelihood)을 추가 반영하였습니다. 재무 중요도(Financial Materiality)는 재무적 영향의 규모와 발생 가능성을 2요소로 평가하였습니다. ESRS 1 Materiality Assessment 및 K-ESG 가이드라인을 참조하여 반도체·화학 중소기업에 적합한 15개 주제를 선정하였으며, ${thresholdDesc}하였습니다.`;

  const vcStages = Object.entries(valueChain).filter(([k,v]) => v).map(([k]) => {
    return VALUE_CHAIN_STAGES.find(s => s.key === k)?.label;
  }).filter(Boolean);
  const valueChainText = vcStages.length > 0 ? 
    `가치사슬 전반(${vcStages.join(", ")})에 대한 영향 매핑을 수행하였으며, 각 단계의 주요 영향·리스크·기회를 식별하였습니다.` : "";

  let coreText = "";
  if (core.length > 0) {
    const coreList = core.map(c => `「${c.title}」`).join(", ");
    coreText = `평가 결과, ${coreList} 등 ${core.length}개 주제가 당사의 핵심 중요 이슈로 도출되었습니다.`;
  }

  const coreDetails = core.map(c => {
    const griList = c.gri.join(", ");
    const kesgList = c.kesg.join(", ");
    return `■ ${c.title} (${c.code})
  · GRI 연계: ${griList}
  · K-ESG 항목: ${kesgList}
  · 영향 중요도: ${(c.impact * 100).toFixed(0)}점 (Severity ${(c.severity * 100).toFixed(0)}점)
  · 재무 중요도: ${(c.financial * 100).toFixed(0)}점
  · 종합: 영향·재무 중 최대값 ${(c.maxAxis * 100).toFixed(0)}점`;
  }).join("\n\n");

  let manageText = "";
  if (manage.length > 0) {
    const mList = manage.map(m => `「${m.title}」`).join(", ");
    manageText = `${mList}는 관리 이슈로 분류되어, 지속적 모니터링 및 개선 활동을 통해 리스크를 관리해 나갈 계획입니다.`;
  }

  return { methodology, valueChainText, coreText, coreDetails, manageText, stakeholder };
}

// ────────────────────────────────────────────────────────────────────────
// 매트릭스 SVG (업계 평균 점선 + GRI 3 해석)
// ────────────────────────────────────────────────────────────────────────
function MaterialityMatrixV2({ result, width = 640, height = 480 }) {
  const padding = { top: 40, right: 40, bottom: 60, left: 70 };
  const plotW = width - padding.left - padding.right;
  const plotH = height - padding.top - padding.bottom;
  const xScale = v => padding.left + v * plotW;
  const yScale = v => padding.top + (1 - v) * plotH;
  const colorMap = { emerald: "#10b981", blue: "#3b82f6", violet: "#8b5cf6" };

  return (
    <svg width={width} height={height} style={{ background: "#fafafa", borderRadius: 8 }}>
      <rect x={padding.left + plotW * 0.5} y={padding.top} width={plotW * 0.5} height={plotH * 0.5} fill="#fef3c7" opacity="0.3" />
      <text x={padding.left + plotW * 0.75} y={padding.top + 20} textAnchor="middle" fontSize="11" fill="#92400e" fontWeight="700">핵심 이슈 영역</text>

      <line x1={xScale(0.5)} y1={padding.top} x2={xScale(0.5)} y2={padding.top + plotH} stroke="#e5e7eb" strokeDasharray="4,4" />
      <line x1={padding.left} y1={yScale(0.5)} x2={padding.left + plotW} y2={yScale(0.5)} stroke="#e5e7eb" strokeDasharray="4,4" />

      <line x1={padding.left} y1={padding.top + plotH} x2={padding.left + plotW} y2={padding.top + plotH} stroke="#6b7280" strokeWidth="1.5" />
      <line x1={padding.left} y1={padding.top} x2={padding.left} y2={padding.top + plotH} stroke="#6b7280" strokeWidth="1.5" />

      <text x={padding.left + plotW / 2} y={height - 15} textAnchor="middle" fontSize="12" fill="#374151" fontWeight="600">환경·사회 영향 (Impact) →</text>
      <text x={20} y={padding.top + plotH / 2} textAnchor="middle" fontSize="12" fill="#374151" fontWeight="600" transform={`rotate(-90, 20, ${padding.top + plotH / 2})`}>재무 영향 (Financial) →</text>

      {result.all.map((d) => {
        const cx = xScale(d.impact);
        const cy = yScale(d.financial);
        const isCore = result.core.some(c => c.code === d.code);
        return (
          <g key={d.code}>
            <circle cx={cx} cy={cy} r={isCore ? 10 : 7} fill={colorMap[d.color]} opacity={isCore ? 0.9 : 0.55} stroke="#fff" strokeWidth="2" />
            <text x={cx} y={cy + 3} textAnchor="middle" fontSize="9" fill="#fff" fontWeight="700">{d.code}</text>
          </g>
        );
      })}

      {(() => {
        const bms = Object.values(INDUSTRY_BENCHMARK);
        if (bms.length === 0) return null;
        const avgImpact = bms.reduce((s, b) => s + b.impact, 0) / bms.length;
        const avgFinancial = bms.reduce((s, b) => s + b.financial, 0) / bms.length;
        return (
          <g>
            <line x1={xScale(avgImpact)} y1={padding.top} x2={xScale(avgImpact)} y2={padding.top + plotH} stroke="#9ca3af" strokeDasharray="2,3" opacity="0.6" />
            <line x1={padding.left} y1={yScale(avgFinancial)} x2={padding.left + plotW} y2={yScale(avgFinancial)} stroke="#9ca3af" strokeDasharray="2,3" opacity="0.6" />
            <text x={xScale(avgImpact) + 4} y={padding.top + 12} fontSize="9" fill="#6b7280">업계 평균</text>
          </g>
        );
      })()}
    </svg>
  );
}

// ────────────────────────────────────────────────────────────────────────
// 메인 컴포넌트 (라우팅)
// ────────────────────────────────────────────────────────────────────────
function MaterialityPanel({ subPage, blockData, setBlockData, ud, isAdmin }) {
  const MAT_KEY = "materiality_v2";
  const data = (blockData[MAT_KEY] && blockData[MAT_KEY].content_json) || {};
  const responses = data.responses || {};
  const meta = data.meta || { valueChain: {}, threshold: "top35", stakeholderNotes: "" };

  const updateResponse = (code, patch) => {
    const newResponses = { ...responses, [code]: { ...(responses[code] || {}), ...patch } };
    setBlockData(MAT_KEY, { content_json: { ...data, responses: newResponses }, content_text: null });
  };
  const updateMeta = (patch) => {
    const newMeta = { ...meta, ...patch };
    setBlockData(MAT_KEY, { content_json: { ...data, meta: newMeta }, content_text: null });
  };
  const clearResponse = (code) => {
    const newResponses = { ...responses };
    delete newResponses[code];
    setBlockData(MAT_KEY, { content_json: { ...data, responses: newResponses }, content_text: null });
  };

  if (subPage === "valuechain") return <ValueChainPage meta={meta} updateMeta={updateMeta} />;
  if (subPage === "topics") return <TopicsPage responses={responses} updateResponse={updateResponse} />;
  if (subPage === "assess") return <AssessPage responses={responses} updateResponse={updateResponse} clearResponse={clearResponse} />;
  if (subPage === "anomaly") return <AnomalyPage responses={responses} />;
  if (subPage === "matrix") return <MatrixPage responses={responses} meta={meta} updateMeta={updateMeta} />;
  if (subPage === "confirm") return <ConfirmPage responses={responses} data={data} setBlockData={setBlockData} MAT_KEY={MAT_KEY} meta={meta} />;
  if (subPage === "report") return <ReportPage responses={responses} data={data} setBlockData={setBlockData} MAT_KEY={MAT_KEY} meta={meta} updateMeta={updateMeta} />;

  return <ValueChainPage meta={meta} updateMeta={updateMeta} />;
}

function AssessPage({ responses, updateResponse, clearResponse }) {
  const applicable = MATERIALITY_TOPICS.filter(t => responses[t.code] && responses[t.code].applicable === true);
  const evaluated = applicable.filter(t => {
    const r = responses[t.code];
    return r.scale > 0 && r.scope > 0 && r.irrem > 0 && r.finImpact > 0 && r.finLikelihood > 0;

      <div style={{ maxWidth: 700, padding: 40, textAlign: "center" }}>
        <h2 style={{ fontSize: 20, fontWeight: 700, color: "#111827", marginBottom: 12 }}>평가할 주제가 없습니다</h2>
        <p style={{ fontSize: 13, color: "#6b7280" }}>먼저 <strong>2단계 주제 진단</strong>에서 해당되는 주제를 선택해주세요.</p>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 980 }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: "#111827", margin: 0 }}>⚖️ 중요성평가 · 3단계: 이중 평가</h2>
          {evaluated > 0 && <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: "#10b981", padding: "3px 10px", borderRadius: 4 }}>✅ 자동저장됨 ({evaluated}/{applicable.length})</span>}
        </div>
        <p style={{ fontSize: 13, color: "#6b7280", marginBottom: 4 }}>
          <strong>GRI 3 공식 방법</strong>에 따라 Scale·Scope·Irremediable·Likelihood·Financial 5요소로 평가합니다.
        </p>
        <p style={{ fontSize: 12, color: "#9ca3af" }}>진행: {evaluated} / {applicable.length} · 클릭 즉시 저장 · 🔄 재평가 버튼으로 수정 가능</p>
      </div>

      <div style={{ background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 8, padding: 14, marginBottom: 16, fontSize: 12, color: "#1e40af" }}>
        💡 <strong>영향 중요도</strong> = Severity(Scale × Scope × Irremediable) × Likelihood · <strong>재무 중요도</strong> = 재무영향 × 발생가능성
      </div>

      {applicable.map(t => {
        const r = responses[t.code] || {};
        const catColor = { "환경": "#10b981", "사회": "#3b82f6", "지배구조": "#8b5cf6" }[t.cat];
        const isComplete = r.scale > 0 && r.scope > 0 && r.irrem > 0 && r.finImpact > 0 && r.finLikelihood > 0;
        const isExpanded = expandedCode === t.code;

        const financial = calcFinancial(r);

        return (
          <div key={t.code} style={{ background: "#fff", border: `1px solid ${isComplete ? catColor : "#e5e7eb"}`, borderRadius: 8, marginBottom: 10 }}>
            {/* 헤더 (클릭해서 펼침) */}
            <div onClick={() => setExpandedCode(isExpanded ? null : t.code)}
              style={{ padding: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 10 }}>

                  </div>
                </div>

                {/* 영향 평가: Scale */}
                <FactorRow label="① Scale (규모)" desc="영향의 크기·심각성" options={SCALE_OPTS} value={r.scale} onChange={v => updateResponse(t.code, { scale: v })} color={catColor} />
                <FactorRow label="② Scope (범위)" desc="영향을 받는 대상·지역" options={SCOPE_OPTS} value={r.scope} onChange={v => updateResponse(t.code, { scope: v })} color={catColor} />
                <FactorRow label="③ Irremediable (회복불가능성)" desc="회복이 어려운 정도" options={IRREM_OPTS} value={r.irrem} onChange={v => updateResponse(t.code, { irrem: v })} color={catColor} />
                
                {/* 잠재 영향인 경우에만 Likelihood */}
                {r.isActual === false && (
                  <FactorRow label="④ Likelihood (발생 가능성)" desc="잠재 영향 전용" options={LIKELIHOOD_OPTS} value={r.likelihood} onChange={v => updateResponse(t.code, { likelihood: v })} color={catColor} />
                )}

                {/* 재무 평가 */}
                <div style={{ marginTop: 16, padding: 12, background: "#fffbeb", border: "1px solid #fcd34d", borderRadius: 6 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#92400e", marginBottom: 10 }}>💰 재무 중요도 평가</div>
                  <FactorRow label="⑤ 재무 영향 규모" desc="매출·이익·비용 영향" options={FIN_IMPACT_OPTS} value={r.finImpact} onChange={v => updateResponse(t.code, { finImpact: v })} color="#d97706" />
                  <FactorRow label="⑥ 재무 발생 가능성" desc="해당 재무 영향이 실제 발생할 확률" options={LIKELIHOOD_OPTS} value={r.finLikelihood} onChange={v => updateResponse(t.code, { finLikelihood: v })} color="#d97706" />
                </div>

                {/* 실시간 계산 결과 */}
                {isComplete && (
                  <div style={{ marginTop: 14, padding: 12, background: "#ecfdf5", border: "1px solid #10b981", borderRadius: 6, fontSize: 12 }}>
                    <div style={{ fontWeight: 700, color: "#065f46", marginBottom: 6 }}>📊 계산 결과</div>
                    <div style={{ color: "#065f46", lineHeight: 1.7 }}>
                      · Severity (규모×범위×회복불가)<sup>1/3</sup> = <strong>{((calcSeverity(r.scale, r.scope, r.irrem)) * 100).toFixed(0)}점</strong><br/>
                      · 영향 중요도 = Severity × {r.isActual ? "1.0 (실제)" : `${(LIKERT5_MAP[r.likelihood] || 0).toFixed(1)} (잠재)`} = <strong>{(impact * 100).toFixed(0)}점</strong><br/>
                      · 재무 중요도 = {(LIKERT5_MAP[r.finImpact] || 0).toFixed(1)} × {(LIKERT5_MAP[r.finLikelihood] || 0).toFixed(1)} = <strong>{(financial * 100).toFixed(0)}점</strong>
                    </div>
                  </div>
                )}

                {/* 초기화 */}
                <div style={{ marginTop: 12, textAlign: "right" }}>
                  <button onClick={() => {
                    if (confirm(`${t.title} 평가를 초기화하시겠습니까?`)) {
                      clearResponse(t.code);
                      updateResponse(t.code, { applicable: true });
                    }
                  }} style={{ fontSize: 11, color: "#dc2626", background: "#fff", border: "1px solid #fca5a5", padding: "4px 10px", borderRadius: 4, cursor: "pointer" }}>
                    🔄 이 주제 재평가
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// 5단계 선택 바
function FactorRow({ label, desc, options, value, onChange, color }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: "#374151", marginBottom: 2 }}>{label}</div>
      <div style={{ fontSize: 10, color: "#9ca3af", marginBottom: 6 }}>{desc}</div>
      <div style={{ display: "flex", gap: 4 }}>
        {options.map(opt => (
          <button key={opt.v} onClick={() => onChange(opt.v)}
            title={opt.desc}
            style={{ 
              flex: 1, padding: "6px 4px", fontSize: 10, fontWeight: 600,
              border: `1.5px solid ${value === opt.v ? color : "#e5e7eb"}`,
              background: value === opt.v ? color : "#fff",
              color: value === opt.v ? "#fff" : "#6b7280",
              borderRadius: 5, cursor: "pointer",
              lineHeight: 1.2
            }}>
            {opt.v}<br/>
            <span style={{ fontSize: 8 }}>{opt.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

          <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: "#3b82f6", padding: "3px 10px", borderRadius: 4 }}>🔄 실시간 자동생성</span>

            </div>

            { items: high, title: "⛔ 재검토 필수", color: "#991b1b", bg: "#fef2f2", border: "#fca5a5" },

// 5단계: 매트릭스 (Threshold 선택 포함)

    return (
      <div style={{ maxWidth: 700, padding: 40, textAlign: "center" }}>
        <h2 style={{ fontSize: 20, fontWeight: 700, color: "#111827", marginBottom: 12 }}>평가 결과가 없습니다</h2>
        <p style={{ fontSize: 13, color: "#6b7280" }}>먼저 <strong>1·2·3단계</strong>를 완료해주세요.</p>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 980 }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: "#111827", margin: 0 }}>📊 중요성평가 · 5단계: 결과 매트릭스</h2>
          <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: "#10b981", padding: "3px 10px", borderRadius: 4 }}>✅ 자동저장됨</span>

        <p style={{ fontSize: 13, color: "#6b7280" }}>평가된 {result.all.length}개 주제의 영향 × 재무 분포 · Threshold 변경 시 즉시 저장</p>

        <div style={{ fontSize: 13, fontWeight: 700, color: "#111827", marginBottom: 10 }}>🎯 핵심 이슈 선정 기준 (Threshold)</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
          {[
            { v: "top35", label: "상위 35%", desc: "평가된 주제 중 상위 35%", badge: "중소기업 권장" },
            { v: "axis06", label: "한 축 0.6 이상", desc: "영향·재무 중 하나라도 0.6 이상", badge: "GRI 3 권장" },
            { v: "both05", label: "두 축 0.5 이상", desc: "두 축 모두 0.5 이상 (엄격)", badge: "전통적 방식" },

// 6단계: 확정
// ────────────────────────────────────────────────────────────────────────
function ConfirmPage({ responses, data, setBlockData, MAT_KEY, meta }) {
  const result = calculateMaterialityV2(responses, meta.threshold || "top35");
  const confirmed = data.confirmed || false;
  const confirmedAt = data.confirmedAt;
  const anomalies = detectAnomalies(responses);
  const highAnomalies = anomalies.filter(a => a.severity === "high").length;

  const handleConfirm = () => {
    setBlockData(MAT_KEY, {
      content_json: { 
        ...data, 
        confirmed: true, 
        confirmedAt: new Date().toISOString(), 
        coreTopics: result.core.map(c => c.code),
        history: [...(data.history || []), {
          at: new Date().toISOString(),
          coreTopics: result.core.map(c => c.code),
          threshold: meta.threshold,
        }]
      },
      content_text: null,
    });
  };

  const handleReopen = () => {
    if (confirm("확정을 해제하고 수정 모드로 전환하시겠습니까? 이력은 보존됩니다.")) {
      setBlockData(MAT_KEY, {
        content_json: { ...data, confirmed: false },
        content_text: null,
      });
    }
  };

  if (result.all.length === 0) {
    return (
      <div style={{ maxWidth: 700, padding: 40, textAlign: "center" }}>
        <p style={{ fontSize: 13, color: "#6b7280" }}>먼저 평가를 완료해주세요.</p>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 900 }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: "#111827", margin: 0 }}>✅ 중요성평가 · 6단계: 확정</h2>
          {confirmed 
            ? <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: "#059669", padding: "3px 10px", borderRadius: 4 }}>🔒 확정 완료 · 자동저장됨</span>
            : <span style={{ fontSize: 11, fontWeight: 700, color: "#92400e", background: "#fef3c7", padding: "3px 10px", borderRadius: 4, border: "1px solid #fcd34d" }}>확정 대기</span>
          }
        </div>
        <p style={{ fontSize: 13, color: "#6b7280" }}>아래 {result.core.length}개 주제가 보고서 필수 공시 대상으로 확정됩니다. 확정 후에도 "재오픈"으로 수정 가능 (이력 보존).</p>
      </div>

      {highAnomalies > 0 && (
        <div style={{ background: "#fef2f2", border: "2px solid #fca5a5", borderRadius: 8, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#991b1b", marginBottom: 4 }}>⛔ 재검토 필수 이슈 {highAnomalies}건</div>
          <div style={{ fontSize: 12, color: "#991b1b", lineHeight: 1.6 }}>확정 전 4단계 이상치 리포트를 확인하시기 바랍니다.</div>
        </div>
      )}

      <div style={{ background: "#fff", border: "2px solid #d97706", borderRadius: 8, padding: 18, marginBottom: 16 }}>
        <h3 style={{ fontSize: 15, fontWeight: 700, color: "#92400e", marginBottom: 12 }}>🎯 확정 대상 핵심 이슈</h3>
        {result.core.map(c => (
          <div key={c.code} style={{ padding: "10px 12px", background: "#fef3c7", borderRadius: 5, marginBottom: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <strong>{c.code}</strong> · {c.title}
                <div style={{ fontSize: 10, color: "#92400e", marginTop: 2 }}>GRI: {c.gri.join(" · ")} &nbsp;|&nbsp; K-ESG: {c.kesg.join(" · ")}</div>
              </div>
              <div style={{ fontSize: 11, color: "#92400e" }}>영향 {(c.impact*100).toFixed(0)} / 재무 {(c.financial*100).toFixed(0)}</div>
            </div>
          </div>
        ))}
      </div>

      {confirmed ? (
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ flex: 1, background: "#d1fae5", border: "1px solid #10b981", borderRadius: 8, padding: 14, fontSize: 13, color: "#065f46" }}>
            ✓ <strong>확정 완료</strong> · {new Date(confirmedAt).toLocaleDateString("ko-KR")} · 보고서 공시에 자동 반영됩니다.
          </div>
          <button onClick={handleReopen} style={{ padding: "12px 20px", fontSize: 13, fontWeight: 600, background: "#fff", color: "#dc2626", border: "1.5px solid #fca5a5", borderRadius: 8, cursor: "pointer" }}>
            🔄 수정 모드 전환
          </button>
        </div>
      ) : (
        <button onClick={handleConfirm} style={{ width: "100%", padding: "12px 20px", fontSize: 14, fontWeight: 700, background: "#d97706", color: "#fff", border: "none", borderRadius: 8, cursor: "pointer" }}>
          ✓ 핵심 주제 확정하기
        </button>
      )}

      {data.history && data.history.length > 0 && (
        <div style={{ marginTop: 20, background: "#fff", border: "1px solid #e5e7eb", borderRadius: 8, padding: 14 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#6b7280", marginBottom: 8 }}>📅 확정 이력</div>
          {data.history.slice().reverse().map((h, i) => (
            <div key={i} style={{ fontSize: 11, color: "#9ca3af", padding: "4px 0", borderTop: i > 0 ? "1px solid #f3f4f6" : "none" }}>
              {new Date(h.at).toLocaleString("ko-KR")} · 핵심 이슈 {h.coreTopics?.length || 0}개 · 기준: {h.threshold}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ReportPage({ responses, data, setBlockData, MAT_KEY, meta, updateMeta }) {

  const paragraphs = generateReportParagraphsV2(result, meta);

    navigator.clipboard.writeText(text).then(() => {
      alert("복사되었습니다.");
    });
  };

  const printReport = () => window.print();

  if (result.all.length === 0) {
    return (
      <div style={{ maxWidth: 700, padding: 40, textAlign: "center" }}>
        <p style={{ fontSize: 13, color: "#6b7280" }}>먼저 평가를 완료해주세요.</p>

  const stakeholderSection = stakeholderNotes ? `\n\n[이해관계자 의견 반영]\n${stakeholderNotes}` : "";
  const vcSection = paragraphs.valueChainText ? `\n\n[가치사슬 매핑]\n${paragraphs.valueChainText}` : "";

  const fullText = `
[이중중대성평가]

${paragraphs.methodology}
${vcSection}

${paragraphs.coreText}

${paragraphs.coreDetails}

${paragraphs.manageText}${stakeholderSection}

  return (
    <div style={{ maxWidth: 900 }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: "#111827", margin: 0 }}>📝 중요성평가 · 7단계: 보고서 생성</h2>
          <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: "#3b82f6", padding: "3px 10px", borderRadius: 4 }}>🔄 실시간 자동생성</span>
          {stakeholderNotes && <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: "#10b981", padding: "3px 10px", borderRadius: 4 }}>✅ 이해관계자 의견 저장됨</span>}
        </div>
        <p style={{ fontSize: 13, color: "#6b7280" }}>지속가능경영 보고서의 중요성평가 섹션 초안입니다. 3~6단계 수정하면 즉시 반영됩니다.</p>
      </div>

      <div style={{ background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 8, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontSize: 13, fontWeight: 700, color: "#1e40af", marginBottom: 6 }}>💬 이해관계자 의견 (GRI 3-1-c 요건)</h3>
        <p style={{ fontSize: 11, color: "#1e40af", marginBottom: 10, lineHeight: 1.5 }}>
          이해관계자(고객·협력사·임직원·지역사회 등)의 의견을 어떻게 수렴·반영했는지 기록하면 보고서에 자동 포함됩니다.
        </p>
        <textarea
          value={stakeholderNotes}
          onChange={e => updateMeta({ stakeholderNotes: e.target.value })}
          placeholder="예: 주요 고객사 ESG 평가 설문(연 1회), 협력사 대표자 간담회(연 2회), 임직원 ESG 인식 조사(2024) 결과를 반영하였습니다."
          style={{ width: "100%", minHeight: 80, padding: 10, fontSize: 12, border: "1px solid #bfdbfe", borderRadius: 5, resize: "vertical", fontFamily: "inherit" }}
        />
      </div>

      <div style={{ background: "#fff", border: "1px solid #e5e7eb", borderRadius: 8, padding: 20, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 14, fontWeight: 700, color: "#111827", margin: 0 }}>📄 자동 생성 문단</h3>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={printReport} style={{ padding: "6px 12px", fontSize: 11, fontWeight: 600, background: "#6b7280", color: "#fff", border: "none", borderRadius: 5, cursor: "pointer" }}>
              🖨 PDF로 저장
            </button>
            <button onClick={() => copyToClipboard(fullText)} style={{ padding: "6px 12px", fontSize: 11, fontWeight: 600, background: "#10b981", color: "#fff", border: "none", borderRadius: 5, cursor: "pointer" }}>
              📋 전체 복사
            </button>
          </div>
        </div>

        <div style={{ fontSize: 13, lineHeight: 1.7, color: "#374151" }}>
          <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 방법론</div>
          <p style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap" }}>{paragraphs.methodology}</p>

          {paragraphs.valueChainText && (
            <>
              <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 가치사슬 매핑</div>
              <p style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap" }}>{paragraphs.valueChainText}</p>
            </>
          )}

          <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 핵심 이슈 도출 결과</div>
          <p style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap" }}>{paragraphs.coreText}</p>

          <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 핵심 이슈별 상세</div>
          <pre style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap", fontFamily: "inherit", fontSize: 12, background: "#f9fafb", padding: 12, borderRadius: 5 }}>{paragraphs.coreDetails}</pre>

          {paragraphs.manageText && (
            <>
              <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 관리 이슈</div>
              <p style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap" }}>{paragraphs.manageText}</p>
            </>
          )}

          {stakeholderNotes && (
            <>
              <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 이해관계자 의견 반영</div>
              <p style={{ margin: "0", whiteSpace: "pre-wrap" }}>{stakeholderNotes}</p>
            </>
          )}
        </div>
      </div>

      <div style={{ background: "#eff6ff", border: "1px solid #3b82f6", borderRadius: 8, padding: 14, fontSize: 12, color: "#1e40af" }}>
        💡 이 문단은 <strong>GRI 3 Material Topics 2021 공시 요건</strong>을 충족하는 골격입니다. 회사 맥락을 추가로 반영하시기 바랍니다.
      </div>
    </div>
  );
}



ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
