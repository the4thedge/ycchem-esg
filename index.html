// ═══════════════════════════════════════════════════════════════════════
// 🎯 단계별 작성 컴포넌트 — 한 번에 항목 1개, 진행바, 뒤로/앞으로
// ═══════════════════════════════════════════════════════════════════════
function QuizLayered({ quiz, savedAnswers, savedText, onSave, disabled }) {
  const [mode, setMode] = useState(savedText ? "saved" : "quiz"); // quiz | preview | saved | manual
  const [stepIdx, setStepIdx] = useState(0);
  const [answers, setAnswers] = useState(savedAnswers || {});
  const [manualText, setManualText] = useState(savedText || "");
  const [editingStep, setEditingStep] = useState(null); // 특정 단계만 수정 중
  
  const steps = quiz.steps;
  const step = steps[stepIdx];
  const progress = Math.round(((stepIdx + 1) / steps.length) * 100);
  const canNext = step && (
    step.type === "single" ? !!answers[step.id] :
    step.type === "multi" ? (answers[step.id] || []).length > 0 : true
  );
  const isLast = stepIdx === steps.length - 1;
  
  // 답변을 사람이 읽을 수 있는 라벨로 변환
  const renderAnswer = (stepDef, ans) => {
    if (!ans) return <span style={{ color: T.g400 }}>(미선택)</span>;
    if (stepDef.type === "single") {
      const opt = stepDef.options.find(o => o.key === ans);
      return opt?.label || ans;
    }
    if (stepDef.type === "multi") {
      const labels = (ans || []).map(k => stepDef.options.find(o => o.key === k)?.label).filter(Boolean);
      return labels.length ? labels.join(", ") : <span style={{ color: T.g400 }}>(미선택)</span>;
    }
    return String(ans);
  };
  
  // 저장된 답 보기 모드 (새로운 프로세스 표시 형태)
  if (mode === "saved") {
    return (
      <div>
        {/* 헤더 */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.emerald, padding: "3px 10px", borderRadius: 4 }}>
            ✅ 작성 완료
          </span>
          <span style={{ fontSize: 11, color: T.g500 }}>{steps.length}개 항목 모두 선택됨</span>
          {!disabled && (
            <button onClick={() => { 
              setMode("quiz"); 
              setStepIdx(0); 
              setAnswers({}); 
            }}
              style={{ 
                marginLeft: "auto", fontSize: 11, color: T.rose, 
                background: T.white, border: `1px solid ${T.rose}`, 
                padding: "4px 10px", borderRadius: 4, cursor: "pointer", fontWeight: 500
              }}>
              🔄 처음부터 다시 작성
            </button>
          )}
        </div>
        
        {/* 작성 프로세스 전체 표시 */}
        <div style={{ background: T.g50, border: `1px solid ${T.g200}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: T.g600, marginBottom: 12, letterSpacing: "0.04em" }}>
            📋 작성하신 내용
          </p>
          {steps.map((s, i) => (
            <div key={s.id} style={{
              display: "flex", alignItems: "flex-start", gap: 10,
              padding: "10px 0",
              borderTop: i > 0 ? `1px solid ${T.g200}` : "none"
            }}>
              <span style={{
                flexShrink: 0, width: 22, height: 22, borderRadius: "50%",
                background: T.emerald, color: T.white, fontSize: 11, fontWeight: 700,
                display: "inline-flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 12, color: T.g500, marginBottom: 3 }}>
                  {s.question}
                </p>
                <p style={{ fontSize: 13, fontWeight: 600, color: T.g800, margin: 0 }}>
                  → {renderAnswer(s, answers[s.id])}
                </p>
              </div>
              {!disabled && (
                <button onClick={() => { 
                  setEditingStep(i); 
                  setStepIdx(i); 
                  setMode("quiz"); 
                }}
                  style={{
                    fontSize: 11, color: T.blue, background: T.blueBg,
                    border: "none", padding: "4px 10px", borderRadius: 4, 
                    cursor: "pointer", fontWeight: 500, whiteSpace: "nowrap"
                  }}>
                  ✏️ 이것만 수정
                </button>
              )}
            </div>
          ))}
        </div>
        
        {/* 검토된 문안 */}
        <div style={{ background: T.violetBg, border: `1px solid ${T.violet}33`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: T.violet }}>📝 검토된 문안</span>
            {!disabled && (
              <button onClick={() => setMode("manual")}
                style={{
                  marginLeft: "auto", fontSize: 11, color: T.g600,
                  background: T.white, border: `1px solid ${T.g300}`,
                  padding: "3px 8px", borderRadius: 4, cursor: "pointer"
                }}>
                ✏️ 내용 수정
              </button>
            )}
          </div>
          <p style={{ fontSize: 13, color: T.g800, lineHeight: 1.7, margin: 0, whiteSpace: "pre-wrap" }}>
            {savedText}
          </p>
        </div>
      </div>
    );
  }
  
  // 직접 수정 모드
  if (mode === "manual") {
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <span style={{ fontSize: 12, fontWeight: 700, color: T.g600 }}>✏️ 내용 수정</span>
          <button onClick={() => setMode(savedText ? "saved" : "quiz")}
            style={{ marginLeft: "auto", fontSize: 11, color: T.g500, background: "none", border: `1px solid ${T.g300}`, padding: "3px 8px", borderRadius: 4, cursor: "pointer" }}>
            ← 취소
          </button>
        </div>
        <textarea value={manualText} onChange={e => setManualText(e.target.value)}
          disabled={disabled} rows={8}
          style={{ width: "100%", padding: "12px 14px", borderRadius: 8, border: `1px solid ${T.g200}`, fontSize: 13, lineHeight: 1.7, fontFamily: "inherit", resize: "vertical" }}/>
        <button onClick={() => { onSave({ answers, text: manualText }); setMode("saved"); }}
          disabled={!manualText.trim()}
          style={{ marginTop: 10, padding: "8px 16px", background: T.emerald, color: T.white, border: "none", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: manualText.trim() ? "pointer" : "not-allowed", opacity: manualText.trim() ? 1 : 0.5 }}>
          💾 저장
        </button>
      </div>
    );
  }
  
  // 미리보기 모드
  if (mode === "preview") {
    const text = quiz.assemble(answers);
    return (
      <div>
        {/* 작성한 항목 요약 (미리보기에도 표시) */}
        <div style={{ background: T.g50, border: `1px solid ${T.g200}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: T.g600, marginBottom: 10, letterSpacing: "0.04em" }}>📋 작성 내용 확인</p>
          {steps.map((s, i) => (
            <div key={s.id} style={{
              padding: "8px 0",
              borderTop: i > 0 ? `1px solid ${T.g200}` : "none",
              display: "flex", gap: 10
            }}>
              <span style={{
                flexShrink: 0, width: 20, height: 20, borderRadius: "50%",
                background: T.emerald, color: T.white, fontSize: 10, fontWeight: 700,
                display: "inline-flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 11, color: T.g500, margin: "0 0 2px" }}>{s.question}</p>
                <p style={{ fontSize: 12, fontWeight: 600, color: T.g800, margin: 0 }}>→ {renderAnswer(s, answers[s.id])}</p>
              </div>
              <button onClick={() => { setStepIdx(i); setMode("quiz"); }}
                style={{
                  fontSize: 10, color: T.blue, background: T.blueBg,
                  border: "none", padding: "3px 8px", borderRadius: 4, cursor: "pointer",
                  alignSelf: "flex-start", whiteSpace: "nowrap"
                }}>✏️ 수정</button>
            </div>
          ))}
        </div>
        
        <div style={{ background: T.violetBg, border: `1px solid ${T.violet}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.violet, marginBottom: 8 }}>📝 검토된 문안 (미리보기)</div>
          <p style={{ fontSize: 13, color: T.g800, lineHeight: 1.7, margin: 0 }}>{text}</p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { onSave({ answers, text }); setMode("saved"); }}
            disabled={disabled}
            style={{ flex: 1, padding: "10px 16px", background: T.emerald, color: T.white, border: "none", borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            ✅ 이대로 저장
          </button>
          <button onClick={() => { setManualText(text); setMode("manual"); }}
            style={{ padding: "10px 16px", background: T.white, color: T.g600, border: `1px solid ${T.g300}`, borderRadius: 6, fontSize: 13, cursor: "pointer" }}>
            ✏️ 직접 수정
          </button>
        </div>
      </div>
    );
  }
  
  // 작성 모드 (단계별)
  const select = (v) => {
    setAnswers(prev => ({ ...prev, [step.id]: v }));
  };
  const toggleMulti = (key) => {
    setAnswers(prev => {
      const cur = prev[step.id] || [];
      return { ...prev, [step.id]: cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key] };
    });
  };
  
  // 이 단계만 수정 모드인 경우: 저장 후 saved로 바로 복귀
  const handleNextOrSave = () => {
    if (editingStep !== null) {
      // 특정 단계만 수정 중 → 완료 후 바로 saved 복귀하며 문안 재조립
      const newText = quiz.assemble(answers);
      onSave({ answers, text: newText });
      setEditingStep(null);
      setMode("saved");
    } else if (isLast) {
      setMode("preview");
    } else {
      setStepIdx(stepIdx + 1);
    }
  };
  
  return (
    <div>
      {/* 진행 표시 — editingStep 모드일 때는 '이 항목만 수정 중' 뱃지 */}
      {editingStep !== null ? (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16,
          background: T.blueBg, border: `1px solid ${T.blue}33`, padding: "8px 12px", borderRadius: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.blue }}>✏️ 이 항목만 수정 중</span>
          <span style={{ fontSize: 11, color: T.g600 }}>· 저장하면 완료 화면으로 돌아갑니다</span>
          <button onClick={() => { setEditingStep(null); setMode("saved"); }}
            style={{ marginLeft: "auto", fontSize: 11, color: T.g500, background: "none", 
              border: `1px solid ${T.g300}`, padding: "3px 8px", borderRadius: 4, cursor: "pointer" }}>
            ← 취소
          </button>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: T.g500 }}>작성 진행: {stepIdx + 1} / {steps.length}</span>
          <div style={{ flex: 1, height: 6, background: T.g100, borderRadius: 999, overflow: "hidden" }}>
            <div style={{ width: `${progress}%`, height: "100%", background: T.emerald, transition: "width 0.3s" }}/>
          </div>
        </div>
      )}
      
      {/* 질문 */}
      <div style={{ marginBottom: 16 }}>
        <h4 style={{ fontSize: 15, fontWeight: 700, color: T.g900, marginBottom: 6, lineHeight: 1.5 }}>
          {step.question}
        </h4>
        {step.hint && (
          <p style={{ fontSize: 12, color: T.g500, lineHeight: 1.6 }}>💡 {step.hint}</p>
        )}
      </div>
      
      {/* 선택지 */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
        {step.options.map(opt => {
          const selected = step.type === "single" 
            ? answers[step.id] === opt.key
            : (answers[step.id] || []).includes(opt.key);
          return (
            <button key={opt.key}
              onClick={() => step.type === "single" ? select(opt.key) : toggleMulti(opt.key)}
              disabled={disabled}
              style={{
                textAlign: "left", padding: "12px 14px",
                background: selected ? T.emeraldBg : T.white,
                border: `1.5px solid ${selected ? T.emerald : T.g200}`,
                borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer",
                display: "flex", alignItems: "flex-start", gap: 10,
                transition: "all 0.15s"
              }}>
              <span style={{
                width: 18, height: 18, flexShrink: 0,
                borderRadius: step.type === "single" ? "50%" : 4,
                border: `2px solid ${selected ? T.emerald : T.g300}`,
                background: selected ? T.emerald : T.white,
                marginTop: 2,
                display: "inline-flex", alignItems: "center", justifyContent: "center",
                color: T.white, fontSize: 11, fontWeight: 700
              }}>{selected ? "✓" : ""}</span>
              <span style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>{opt.label}</div>
                {opt.desc && <div style={{ fontSize: 11, color: T.g500, marginTop: 2 }}>{opt.desc}</div>}
              </span>
            </button>
          );
        })}
      </div>
      
      {/* 네비게이션 */}
      <div style={{ display: "flex", gap: 8 }}>
        {stepIdx > 0 && editingStep === null && (
          <button onClick={() => setStepIdx(stepIdx - 1)}
            style={{ padding: "10px 14px", background: T.white, color: T.g600, border: `1px solid ${T.g300}`, borderRadius: 6, fontSize: 13, cursor: "pointer" }}>
            ← 이전
          </button>
        )}
        <button onClick={handleNextOrSave}
          disabled={!canNext}
          style={{
            flex: 1, padding: "10px 16px",
            background: canNext ? T.emerald : T.g200, color: T.white,
            border: "none", borderRadius: 6, fontSize: 14, fontWeight: 600,
            cursor: canNext ? "pointer" : "not-allowed"
          }}>
          {editingStep !== null ? "💾 저장하고 완료 화면으로" : (isLast ? "📝 작성 결과 보기 →" : "다음 →")}
        </button>
      </div>
    </div>
  );
}

// Sub-field 입력 컴포넌트 (단일 필드)
function SubField({ field, value, onChange, disabled }) {
  const [showTpl, setShowTpl] = useState(false);
  const handleType = (v) => onChange({ ...value, v });
  
  const renderInput = () => {
    if (field.type === "quiz") {
      const quizMap = { 
        "102-1a": QUIZ_102_1a,
        "102-1b": QUIZ_102_1b,
        "102-1d": QUIZ_102_1d,
        "102-1e": QUIZ_102_1e,
        "102-1g": QUIZ_102_1g,
        "102-1j": QUIZ_102_1j,
        "102-2b": QUIZ_102_2b,
        "102-3": QUIZ_102_3,
        "102-4": QUIZ_102_4,
      };
      const quiz = quizMap[field.quiz];
      if (!quiz) return <div style={{ color: T.rose }}>작성 트리 '{field.quiz}' 미정의</div>;
      return (
        <QuizLayered 
          quiz={quiz}
          savedAnswers={value?.answers}
          savedText={value?.v}
          onSave={(result) => onChange({ answers: result.answers, v: result.text })}
          disabled={disabled}
        />
      );
    }
    if (field.type === "textarea") {
      return (
        <textarea
          value={value?.v || ""}
          onChange={e => handleType(e.target.value)}
          disabled={disabled}
          rows={field.rows || 3}
          placeholder={field.placeholder || field.hint || ""}
          style={{
            width: "100%", padding: "12px 14px", borderRadius: 8,
            border: `1px solid ${T.g200}`, fontSize: 14, lineHeight: 1.6,
            fontFamily: "inherit", resize: "vertical",
            background: disabled ? T.g50 : T.white, color: T.g800
          }}
        />
      );
    }
    if (field.type === "number") {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <input
            type="number" value={value?.v || ""}
            onChange={e => handleType(e.target.value)}
            disabled={disabled}
            placeholder="숫자 입력"
            style={{
              flex: 1, padding: "10px 12px", borderRadius: 8,
              border: `1px solid ${T.g200}`, fontSize: 14,
              background: disabled ? T.g50 : T.white, textAlign: "right"
            }}
          />
          <span style={{ fontSize: 13, color: T.g500, fontWeight: 500 }}>{field.unit}</span>
        </div>
      );
    }
    if (field.type === "radio") {
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {field.options.map((opt, i) => (
            <label key={i} style={{
              display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px",
              border: `1px solid ${value?.v === opt ? T.emerald : T.g200}`,
              borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer",
              background: value?.v === opt ? T.emeraldBg : T.white,
              fontSize: 13, lineHeight: 1.5
            }}>
              <input type="radio" name={field.id} value={opt}
                checked={value?.v === opt}
                onChange={e => handleType(e.target.value)}
                disabled={disabled}
                style={{ marginTop: 2 }}/>
              <span style={{ color: T.g700, flex: 1 }}>{opt}</span>
            </label>
          ))}
        </div>
      );
    }
    if (field.type === "checkbox") {
      const selected = value?.v || [];
      const toggle = (opt) => {
        const next = selected.includes(opt) ? selected.filter(x => x !== opt) : [...selected, opt];
        handleType(next);
      };
      return (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {field.options.map((opt, i) => (
            <label key={i} style={{
              display: "flex", alignItems: "center", gap: 6, padding: "6px 10px",
              border: `1px solid ${selected.includes(opt) ? T.emerald : T.g200}`,
              borderRadius: 6, cursor: disabled ? "not-allowed" : "pointer",
              background: selected.includes(opt) ? T.emeraldBg : T.white,
              fontSize: 12
            }}>
              <input type="checkbox" checked={selected.includes(opt)}
                onChange={() => toggle(opt)} disabled={disabled}/>
              <span style={{ color: T.g700 }}>{opt}</span>
            </label>
          ))}
        </div>
      );
    }
    return null;
  };
  
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{
          fontSize: 10, fontWeight: 700, color: T.emerald,
          background: T.emeraldBg, padding: "2px 6px", borderRadius: 4
        }}>{field.gri}</span>
        <label style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>
          {field.glossary ? (
            <GlossaryTooltip termKey={field.glossary}>{field.label}</GlossaryTooltip>
          ) : field.label}
        </label>
        {field.template && field.type !== "quiz" && !disabled && (
          <button onClick={() => {
            handleType(field.template);
            setShowTpl(false);
          }} style={{
            marginLeft: "auto", fontSize: 11, color: T.blue, background: T.blueBg,
            border: "none", padding: "3px 8px", borderRadius: 4, cursor: "pointer", fontWeight: 500
          }}>📝 예시 문구 채우기</button>
        )}
      </div>
      {field.hint && (
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 8, lineHeight: 1.5 }}>💡 {field.hint}</p>
      )}
      {renderInput()}
    </div>
  );
}

// 기후변화 대응 대시보드 그래프 (Recharts)
function ClimateGraphs({ scopeData, blockData }) {
  const R = window.Recharts;
  if (!R) return null;
  const { BarChart, Bar, LineChart, Line, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = R;
  
  // Scope 1 3년치
  const s1Yearly = calcScope1Yearly(scopeData.s1);
  const s1Latest = s1Yearly[2] || 0;
  
  // Scope 2 (현재 단일 연도, 최신 연도에 매핑)
  // Scope 2 연도별 계산 (3년치 구조 + 호환)
  const calcScope2 = (s2, year) => {
    // yearly_val_YYYY 우선 체크
    let val = parseFloat(s2["yearly_val_" + year]) || 0;
    // 호환: yearly_val 단일 값은 최신 연도에만 매핑
    if (!val && year === YEAR_LATEST) {
      val = parseFloat(s2.yearly_val) || 0;
    }
    // 월별 데이터 합산
    if (!val) {
      const monthly = s2["_monthly_" + year];
      if (Array.isArray(monthly)) {
        val = monthly.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      } else if (year === YEAR_LATEST) {
        // 기존 구조: data[0..11]
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += parseFloat(s2[i]) || 0;
        if (sum > 0) val = sum;
      }
    }
    const kwh = (s2.input_type === "원") ? val / 165 : val;
    return (kwh / 1000) * getPowerEF(year);
  };
  
  const s2Yearly = REPORT_YEARS.map(y => calcScope2(scopeData.s2, y));
  const s2Latest = s2Yearly[2] || 0;
  
  // Scope 3 연도별 계산 (3년치 객체 구조 + 단일 숫자 호환)
  const calcScope3 = (s3, year) => {
    return S3.reduce((sum, c) => {
      if (c.id === "c7") {
        // 통근은 별도 구조 (최신 연도에만)
        if (year !== YEAR_LATEST) return sum;
        const d = s3.commute || {};
        return sum + ((d.people||0) * (d.distance||0) * 250 * 0.17 / 1000);
      }
      const raw = s3[c.id];
      let val = 0;
      if (typeof raw === "object" && raw !== null) {
        val = parseFloat(raw[year]) || 0;
      } else if (year === YEAR_LATEST) {
        val = parseFloat(raw) || 0;
      }
      return sum + val * (c.ef || 0);
    }, 0);
  };
  
  const s3Yearly = REPORT_YEARS.map(y => calcScope3(scopeData.s3, y));
  const s3Latest = s3Yearly[2] || 0;
  
  // 1. 3년 추세 (Scope 1, 2, 3 모두 연도별)
  const yearlyTrend = REPORT_YEARS.map((y, i) => ({
    year: y + "",
    "Scope 1": +(s1Yearly[i] || 0).toFixed(2),
    "Scope 2": +(s2Yearly[i] || 0).toFixed(2),
    "Scope 3": +(s3Yearly[i] || 0).toFixed(2),
  }));
  
  // 2. 최신 연도 Scope 1·2·3 비교
  const scopeData123 = [
    { name: "Scope 1", value: +s1Latest.toFixed(2), fill: T.rose },
    { name: "Scope 2", value: +s2Latest.toFixed(2), fill: T.amber },
    { name: "Scope 3", value: +s3Latest.toFixed(2), fill: T.violet },
  ];
  
  // 3. Scope 1 breakdown (최신 연도 기준)
  const stationaryTotal = SF.reduce((sum, f) => {
    const amt = getYearValue(scopeData.s1[f.id], YEAR_LATEST);
    if (!amt) return sum;
    const unit = scopeData.s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const baseAmt = conv ? amt * conv.factor : amt;
    return sum + calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
  }, 0);
  const mobileTotal = MF.reduce((sum, f) => {
    const amt = getYearValue(scopeData.s1[f.id], YEAR_LATEST);
    if (!amt) return sum;
    const unit = scopeData.s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const baseAmt = conv ? amt * conv.factor : amt;
    return sum + calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
  }, 0);
  
  const s1Breakdown = [];
  if (stationaryTotal > 0) s1Breakdown.push({ name: "고정연소", value: +stationaryTotal.toFixed(2), fill: T.blue });
  if (mobileTotal > 0) s1Breakdown.push({ name: "이동연소", value: +mobileTotal.toFixed(2), fill: T.indigo });
  
  // 4. 감축 목표 진척
  const baseYearEmission = parseFloat(blockData["_102_sub"]?.["4_base_year_emission"]?.v) || (s1Latest + s2Latest);
  const currentEmission = s1Latest + s2Latest;
  const targetAnnual = parseFloat(blockData["_102_sub"]?.["4_target_short"]?.v) || 1.5;
  const targetEmission = baseYearEmission * (1 - targetAnnual/100);
  const progress = baseYearEmission > 0 ? Math.max(0, Math.min(100, ((baseYearEmission - currentEmission) / (baseYearEmission - targetEmission)) * 100)) : 0;
  
  const total = s1Latest + s2Latest + s3Latest;
  const s1HasMultiYear = s1Yearly.some(v => v > 0);
  
  if (total < 0.01 && !s1HasMultiYear) {
    return (
      <div style={{ padding: 40, textAlign: "center", background: T.g50, borderRadius: 12, color: T.g500 }}>
        💡 Scope 1/2/3 배출량 데이터를 입력하면 그래프가 실시간으로 표시됩니다.
      </div>
    );
  }
  
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
      {/* 그래프 1: 3년 추세 막대그래프 (전체 폭) */}
      <div style={{ gridColumn: "1 / -1", background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800 }}>📈 3년 배출량 추세 ({REPORT_YEARS[0]}~{REPORT_YEARS[2]})</h4>
          {s1Yearly[1] > 0 && s1Yearly[2] > 0 && (
            <span style={{
              fontSize: 11, fontWeight: 700,
              color: s1Yearly[2] < s1Yearly[1] ? T.emerald : T.rose,
              background: s1Yearly[2] < s1Yearly[1] ? T.emeraldBg : T.roseBg,
              padding: "2px 8px", borderRadius: 4
            }}>
              Scope 1 전년 대비 {s1Yearly[2] < s1Yearly[1] ? "▼" : "▲"} {Math.abs((s1Yearly[2]-s1Yearly[1])/s1Yearly[1]*100).toFixed(1)}%
            </span>
          )}
        </div>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>단위: tCO₂eq · GRI 102-5/6/7 · Scope 1·2·3 전체 3년치 추이</p>
        <ResponsiveContainer width="100%" height={260}>
          <BarChart data={yearlyTrend}>
            <CartesianGrid strokeDasharray="3 3" stroke={T.g200}/>
            <XAxis dataKey="year" tick={{fontSize: 12}}/>
            <YAxis tick={{fontSize: 12}}/>
            <Tooltip/>
            <Legend wrapperStyle={{fontSize: 12}}/>
            <Bar dataKey="Scope 1" fill={T.rose} radius={[4, 4, 0, 0]}/>
            <Bar dataKey="Scope 2" fill={T.amber} radius={[4, 4, 0, 0]}/>
            <Bar dataKey="Scope 3" fill={T.violet} radius={[4, 4, 0, 0]}/>
          </BarChart>
        </ResponsiveContainer>
      </div>
      
      {/* 그래프 2: 최신 연도 Scope 1·2·3 */}
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 4 }}>{YEAR_LATEST}년 Scope 1·2·3</h4>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>최신 연도 기준 · tCO₂eq</p>
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={scopeData123}>
            <CartesianGrid strokeDasharray="3 3" stroke={T.g200}/>
            <XAxis dataKey="name" tick={{fontSize: 12}}/>
            <YAxis tick={{fontSize: 12}}/>
            <Tooltip/>
            <Bar dataKey="value" radius={[6, 6, 0, 0]}>
              {scopeData123.map((e, i) => <Cell key={i} fill={e.fill}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      
      {/* 그래프 3: Scope 1 breakdown */}
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>

}

function calcScope1Total(s1, targetYear) {
  const year = targetYear || YEAR_LATEST;
  let total = 0;
  [...SF, ...MF].forEach(f => {
    const raw = s1[f.id];
    const amt = getYearValue(raw, year);
    const unit = s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const factor = conv?.factor || 1;
    if (amt) {
      total += calc(amt * factor, f.ncv, f.co2, f.ch4, f.n2o).t;
    }
    // 월별 데이터 (연도별 객체 · 기존 배열 호환)
    const monthly = s1["_monthly_" + f.id];
    let arr = null;
    if (Array.isArray(monthly)) {
      arr = year === YEAR_LATEST ? monthly : null;
    } else if (monthly && typeof monthly === "object") {
      arr = Array.isArray(monthly[year]) ? monthly[year] : null;
    }
    if (arr && arr.length > 0) {
      const sum = arr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      total += calc(sum * factor, f.ncv, f.co2, f.ch4, f.n2o).t;
    }
  });
  return total;
}

// 3년치 Scope 1 배출량 배열 반환 [2023, 2024, 2025]
function calcScope1Yearly(s1) {
  return REPORT_YEARS.map(y => calcScope1Total(s1, y));
}

// GRI 102 고급 입력 페이지 (서술 공시 sub-block 렌더)
function GRI102AdvancedPanel({ disclosureCode, blockData, setBlockData, disabled }) {
  const disclosure = GRI102_FIELDS[disclosureCode];
  if (!disclosure) return null;
  
  const storedKey = "_102_sub";
  const stored = blockData[storedKey] || {};
  
  const updateField = (fid, v) => {
    const next = { ...stored, [fid]: v };
    setBlockData(storedKey, { content_json: next });
  };
  
  const filledCount = disclosure.fields.filter(f => {
    const v = stored[f.id]?.v;
    if (Array.isArray(v)) return v.length > 0;
    return v && String(v).trim().length > 0;
  }).length;
  const progress = Math.round((filledCount / disclosure.fields.length) * 100);
  
  return (
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 20 }}>
      <div style={{ marginBottom: 20, paddingBottom: 16, borderBottom: `1px solid ${T.g100}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.emerald, padding: "3px 10px", borderRadius: 4 }}>
            공시 {disclosureCode}
          </span>
          <h3 style={{ fontSize: 17, fontWeight: 700, color: T.g900 }}>
            {disclosure.glossary ? (
              <GlossaryTooltip termKey={disclosure.glossary}>{disclosure.title}</GlossaryTooltip>
            ) : disclosure.title}
          </h3>
          <span style={{ marginLeft: "auto", fontSize: 12, fontWeight: 600, color: progress >= 80 ? T.emerald : progress >= 40 ? T.amber : T.rose }}>
            {filledCount}/{disclosure.fields.length} · {progress}%
          </span>
        </div>
        <p style={{ fontSize: 13, color: T.g500, lineHeight: 1.6 }}>{disclosure.desc}</p>
      </div>
      
      {/* 📘 공시 일반 설명 박스 */}
      <DisclosureGuide code={disclosureCode}/>
      
      {disclosure.fields.map(field => (
        <SubField key={field.id} field={field} 
          value={stored[field.id]} 
          onChange={v => updateField(field.id, v)}
          disabled={disabled}/>
      ))}
    </div>
  );
}

          <button onClick={() => setOtherOpen(!otherOpen)}
            style={{ fontSize: 12, fontWeight: 500, color: T.g400, background: "none", border: "none", cursor: "pointer", padding: "8px 0", display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 10, transform: otherOpen ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s", display: "inline-block" }}>▶</span>
            다른 부서 항목 ({otherBlocks.length})
          </button>
          {otherOpen && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 4 }}>
              {otherBlocks.map(b => renderBlock(b, false))}
            </div>
          )}
        </div>
      )}

      {ud === "all" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {visibleBlocks.map(b => renderBlock(b, true))}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// ⚡ GRI 103: 에너지 2025
// ═══════════════════════════════════════════════════════════════════════
function GRI103Panel({ subPage, scopeData, blockData, setBlockData, ud, isAdmin }) {
  const ce = d => ud === "all" || ud === d;
  const isUserEnv = ce("env") || isAdmin;
  
  const energyMeta = blockData["_103_meta"] || {};
  const setEnergyMeta = (key, val) => {
    setBlockData(d => ({ ...d, "_103_meta": { ...(d["_103_meta"] || {}), [key]: val } }));
  };
  
  const calcFuelEnergyGJ = (year) => {
    let total = 0;
    const s1 = scopeData.s1 || {};
    const fuelMap = { gas: "gasoline", diesel_m: "diesel", diesel_b: "diesel", lng: "lng", lpg: "lpg", lpg_m: "lpg", kero: "kero", bcoil: "bcoil" };
    for (const [fId, mapId] of Object.entries(fuelMap)) {
      const raw = s1[fId];
      let amount = 0;
      if (typeof raw === "object" && raw !== null) amount = parseFloat(raw[year]) || 0;
      else if (year === YEAR_LATEST) amount = parseFloat(raw) || 0;
      if (amount > 0) total += fuelToGJ(mapId, amount);
    }
    return total;
  };
  
  const calcElectricityGJ = (year) => {
    const s2 = scopeData.s2 || {};
    let kwh = parseFloat(s2["yearly_val_" + year]) || 0;
    if (!kwh && year === YEAR_LATEST) kwh = parseFloat(s2.yearly_val) || 0;
    if (!kwh) {
      const m = s2["_monthly_" + year];
      if (Array.isArray(m)) kwh = m.reduce((a, b) => a + (parseFloat(b) || 0), 0);
    }
    return kwhToGJ(kwh);
  };
  
  const getSelfRenewableGJ = (year) => parseFloat(energyMeta["self_renew_" + year]) || 0;
  
  const calcTotalEnergyGJ = (year) => 
    calcFuelEnergyGJ(year) + calcElectricityGJ(year) + getSelfRenewableGJ(year);
  
  const energyByYear = REPORT_YEARS.map(y => ({
    year: y,
    fuel: calcFuelEnergyGJ(y),
    electricity: calcElectricityGJ(y),
    renewable: getSelfRenewableGJ(y),
    total: calcTotalEnergyGJ(y),
  }));
  
  const Header = ({ icon, sub }) => (
    <div style={{ marginBottom: 24 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
        <span style={{ fontSize: 13, fontWeight: 500, color: T.g400 }}>환경</span>
        <span style={{ color: T.g300 }}>·</span>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>{icon} GRI 103: 에너지 2025</h2>
      </div>
      <p style={{ fontSize: 14, color: T.g500 }}>{sub}</p>
    </div>
  );
  
  if (subPage === "consumption" || !subPage) {
    const latest = energyByYear[2];
    const renewablePct = latest.total > 0 ? (latest.renewable / latest.total * 100) : 0;
    return (
      <div>
        <Header icon="⚡" sub="조직 내 총 에너지 소비량 (GRI 103-2) — 연료·구매전력·자체생산 재생에너지 자동 합산"/>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
          <div style={{ background: T.blueBg, border: `1px solid ${T.blue}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>총 에너지 소비 ({YEAR_LATEST})</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.total.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ</p>
          </div>
          <div style={{ background: T.amberBg, border: `1px solid ${T.amber}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>연료 (Scope 1)</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.fuel.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ · 비재생</p>
          </div>
          <div style={{ background: T.violetBg, border: `1px solid ${T.violet}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>구매전력 (Scope 2)</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.electricity.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ</p>
          </div>
          <div style={{ background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>재생에너지 비율</p>

          </div>

        <div style={{ padding: 14, background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, marginBottom: 16 }}>

        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden", marginBottom: 20 }}>

          </div>
          <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
            <thead>

                <th style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, color: T.g500, fontWeight: 600 }}>구분</th>
                {REPORT_YEARS.map(y => (
                  <th key={y} style={{ padding: "10px 14px", textAlign: "right", fontSize: 11, color: y === YEAR_LATEST ? T.g800 : T.g500, fontWeight: 600 }}>

            </thead>
            <tbody>
              <tr style={{ borderBottom: `1px solid ${T.g100}` }}>
                <td style={{ padding: "10px 14px", color: T.g700 }}>🔥 연료 소비 (비재생) <span style={{ fontSize: 10, color: T.g400 }}>- 103-2-a</span></td>
                {energyByYear.map(e => (
                  <td key={e.year} style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: T.g800, fontFeatureSettings: "'tnum'" }}>
                    {e.fuel > 0 ? e.fuel.toFixed(1) : "-"}
                  </td>

              </tr>
              <tr style={{ borderBottom: `1px solid ${T.g100}` }}>
                <td style={{ padding: "10px 14px", color: T.g700 }}>⚡ 구매 전력 <span style={{ fontSize: 10, color: T.g400 }}>- 103-2-b</span></td>
                {energyByYear.map(e => (
                  <td key={e.year} style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: T.g800, fontFeatureSettings: "'tnum'" }}>
                    {e.electricity > 0 ? e.electricity.toFixed(1) : "-"}
                  </td>
                ))}
              </tr>
              <tr style={{ borderBottom: `1px solid ${T.g100}` }}>
                <td style={{ padding: "10px 14px", color: T.g700 }}>☀️ 자체 생산 재생에너지 <span style={{ fontSize: 10, color: T.g400 }}>- 103-2-c · 수동 입력 (GJ)</span></td>
                {REPORT_YEARS.map(y => (
                  <td key={y} style={{ padding: "4px 8px", textAlign: "right" }}>
                    <input type="number" value={energyMeta["self_renew_" + y] || ""}
                      disabled={!isUserEnv}
                      onChange={e => setEnergyMeta("self_renew_" + y, e.target.value)}
                      placeholder="0"
                      style={{ width: 100, padding: "6px 10px", borderRadius: 5, border: `1px solid ${T.g200}`,
                        fontSize: 12, fontWeight: 600, textAlign: "right", background: isUserEnv ? T.white : T.g50 }} />
                  </td>
                ))}
              </tr>
              <tr style={{ background: T.g50 }}>
                <td style={{ padding: "12px 14px", color: T.g900, fontWeight: 800 }}>조직 내 총 에너지 소비</td>
                {energyByYear.map(e => (
                  <td key={e.year} style={{ padding: "12px 14px", textAlign: "right", fontWeight: 800, color: T.g900, fontSize: 14, fontFeatureSettings: "'tnum'" }}>
                    {e.total.toFixed(1)}
                  </td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
        <p style={{ fontSize: 11, color: T.g400, lineHeight: 1.6, paddingTop: 8 }}>
          💡 발열량 출처: 환경부고시 제2024-155호 [별표 12] · 전력 환산: 1 kWh = 0.0036 GJ · 연료 → MJ 발열량 × 사용량 → GJ.
        </p>
      </div>

  }
  
  if (subPage === "intensity") {
    const latest = energyByYear[2];
    const revenue = parseFloat(energyMeta["revenue_" + YEAR_LATEST]) || 0;
    const production = parseFloat(energyMeta["production_" + YEAR_LATEST]) || 0;

    const iR = revenue > 0 ? (latest.total / revenue).toFixed(2) : "-";
    const iP = production > 0 ? (latest.total / production).toFixed(2) : "-";
    const iE = employees > 0 ? (latest.total / employees).toFixed(2) : "-";

      <div>

        <div style={{ padding: 14, background: T.blueBg, border: `1px solid ${T.blue}33`, borderRadius: 10, marginBottom: 16 }}>
          <p style={{ fontSize: 12, color: T.g700, lineHeight: 1.6 }}>

          </p>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20, marginBottom: 16 }}>
          <p style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 14 }}>📝 조직별 지표 (분모) 입력</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
            {[
              { key: "revenue", label: "매출액 (억원)", icon: "💰" },
              { key: "production", label: "생산량 (톤)", icon: "🏭" },
              { key: "employees", label: "임직원 수 (명)", icon: "👥" },
            ].map(m => (
              <div key={m.key}>
                <p style={{ fontSize: 11, color: T.g500, marginBottom: 6, fontWeight: 500 }}>{m.icon} {m.label}</p>
                {REPORT_YEARS.map(y => (
                  <div key={y} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                    <span style={{ fontSize: 10, color: T.g400, width: 40 }}>{y}년</span>
                    <input type="number" value={energyMeta[m.key + "_" + y] || ""}
                      disabled={!isUserEnv}
                      onChange={e => setEnergyMeta(m.key + "_" + y, e.target.value)}
                      placeholder="0"
                      style={{ flex: 1, padding: "6px 10px", borderRadius: 5, border: `1px solid ${T.g200}`,
                        fontSize: 12, fontWeight: 600, textAlign: "right", background: isUserEnv ? T.white : T.g50 }} />
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 20 }}>
          <div style={{ background: T.blueBg, border: `1px solid ${T.blue}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>매출 집약도</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{iR}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ / 억원</p>
          </div>
          <div style={{ background: T.amberBg, border: `1px solid ${T.amber}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>생산량 집약도</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{iP}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ / 톤</p>
          </div>
          <div style={{ background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>인당 집약도</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{iE}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ / 명</p>
          </div>
        </div>
      </div>
    );
  }
  
  if (subPage === "reduction") {
    const baseYear = parseInt(energyMeta["base_year"]) || REPORT_YEARS[0];
    const baseEnergy = calcTotalEnergyGJ(baseYear);
    const currentEnergy = energyByYear[2].total;

    const reductionPct = baseEnergy > 0 ? (reduction / baseEnergy * 100) : 0;
    return (
      <div>

            <p style={{ fontSize: 22, fontWeight: 700, color: reduction > 0 ? T.emerald : T.rose, fontFeatureSettings: "'tnum'" }}>
              {reduction > 0 ? "▼" : "▲"} {Math.abs(reductionPct).toFixed(1)}%
            </p>

            onChange={e => setEnergyMeta("reduction_activities", e.target.value)}
            placeholder="예: 2024년 공정 재설계를 통해 LNG 사용량 12% 감축. 고효율 보일러 교체 (2,500 GJ 절감). 사무동 LED 전환 (180 GJ)."
            style={{ width: "100%", padding: "12px 14px", borderRadius: 8, border: `1px solid ${T.g200}`, fontSize: 13, minHeight: 140, resize: "vertical", lineHeight: 1.6 }} />
        </div>
      </div>

  }
  
  if (subPage === "policy") {
    return (
      <div>
        <Header icon="📝" sub="에너지 정책 및 약속 (GRI 103-1) — 에너지 관리 방침, 목표, 거버넌스"/>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {[
            { key: "policy_statement", label: "에너지 정책 방침", placeholder: "예: 당사는 파리협정 1.5°C 경로 부합을 위해 2030년까지 에너지 소비 10% 감축을 목표로 합니다. ISO 50001 에너지경영시스템을 구축·운영합니다." },
            { key: "policy_target", label: "에너지 관리 목표", placeholder: "예: 단기(~2026년) 연 1.5% 감축 / 중기(~2030년) 누적 10% 감축 / 장기 재생에너지 비중 30%" },
            { key: "policy_governance", label: "거버넌스 체계", placeholder: "예: 대표이사 직속 ESG위원회 분기 개최, 에너지경영위원회 월 1회, 전사 FEMS 실시간 관리" },
            { key: "policy_iso", label: "적용 표준 및 인증", placeholder: "예: ISO 50001 에너지경영 / ISO 14001 환경경영 / IPCC 2006 / GHG Protocol Scope 2 Guidance" },
          ].map(f => (

function ReportPreview({ scopeData, blockData }) {
  const sub = blockData["_102_sub"] || {};
  const getText = (fid) => {
    const v = sub[fid];
    if (!v) return null;
    if (typeof v === "object" && v.v) return v.v;
    if (typeof v === "string") return v;
    return null;
  };
  const getNumber = (fid) => {
    const v = sub[fid];
    if (!v) return null;
    if (typeof v === "object" && v.v) return v.v;
    if (typeof v === "string" || typeof v === "number") return v;
    return null;
  };
  
  // 3년치 배출량 계산
  const s1Yearly = calcScope1Yearly(scopeData.s1);
  
  const calcS2 = (year) => {
    const s2 = scopeData.s2;
    let v = parseFloat(s2["yearly_val_" + year]) || 0;
    if (!v && year === YEAR_LATEST) v = parseFloat(s2.yearly_val) || 0;
    if (!v) {
      const m = s2["_monthly_" + year];
      if (Array.isArray(m)) v = m.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      else if (year === YEAR_LATEST) {
        for (let i = 0; i < 12; i++) v += parseFloat(s2[i]) || 0;
      }
    }
    const kwh = s2.input_type === "원" ? v / 165 : v;
    return (kwh / 1000) * getPowerEF(year);
  };
  const s2Yearly = REPORT_YEARS.map(y => calcS2(y));
  
  const calcS3 = (year) => S3.reduce((sum, c) => {
    if (c.id === "c7" && year !== YEAR_LATEST) return sum;

    return sum + val * (c.ef || 0);

function Dash({ scopeData, blockData, blocks, standards }) {
  // Scope 1: 최신 연도 기준 (3년치 구조 호환)
  let s1total = calcScope1Total(scopeData.s1, YEAR_LATEST);
  // 월별 추가 (연도별 구조 + 기존 배열 호환)
  [...SF, ...MF].forEach(f => {
    const uk = scopeData.s1[f.id + "_unit"] || (f.units?.[0]?.key);
    const unit = (f.units || []).find(u => u.key === uk) || f.units?.[0];
    const monthly = scopeData.s1["_monthly_" + f.id];
    let monthlyArr = null;
    if (Array.isArray(monthly)) {
      monthlyArr = monthly; // 기존 구조
    } else if (monthly && typeof monthly === "object") {
      monthlyArr = Array.isArray(monthly[YEAR_LATEST]) ? monthly[YEAR_LATEST] : null;
    }
    if (monthlyArr && monthlyArr.length > 0) {
      const sum = monthlyArr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      s1total += calc(sum * (unit?.factor || 1), f.ncv, f.co2, f.ch4, f.n2o).t;
    }
  });
  
  // Scope 2: 최신 연도 기준 (3년치 구조 호환)
  let s2total = 0;
  {
    const s2 = scopeData.s2;
    const inputType = s2.input_type || "kWh";
    // yearly_val_2025 (최신) 우선 → 호환 yearly_val → 월별 합계
    let v = parseFloat(s2["yearly_val_" + YEAR_LATEST]) || parseFloat(s2.yearly_val) || 0;
    if (!v) {
      const monthly = s2["_monthly_" + YEAR_LATEST];
      if (Array.isArray(monthly)) {
        v = monthly.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      } else {
        for (let i = 0; i < 12; i++) v += parseFloat(s2[i]) || 0;
      }
    }
    const kwh = inputType === "원" ? v / 165 : v;
    s2total = (kwh / 1000) * getPowerEF(YEAR_LATEST);
  }
  
  // Scope 3
  // Scope 3: 최신 연도 기준 (3년치 구조 호환)
  let s3total = 0;
  S3.forEach(c => {
    if (!c.ef) return;
    const raw = scopeData.s3[c.id];
    let v = 0;
    if (typeof raw === "object" && raw !== null) {
      v = parseFloat(raw[YEAR_LATEST]) || 0;
    } else {
      v = parseFloat(raw) || 0;
    }
    s3total += v * c.ef;
  });
  const grand = s1total + s2total + s3total;

  const totalBlocks = blocks.length;
  const isDone = (b) => {
    if (b.input_type === 'scope1_table') {
      const hasYearly = [...SF, ...MF].some(f => {
        const v = scopeData.s1[f.id];
        if (typeof v === "number") return v > 0;
        if (typeof v === "object" && v !== null) return Object.values(v).some(x => parseFloat(x) > 0);
        return parseFloat(v) > 0;
      });
      const hasMonthly = Object.keys(scopeData.s1).some(k => {
        if (!k.startsWith("_monthly_")) return false;
        const m = scopeData.s1[k];
        if (Array.isArray(m)) return m.some(v => v);
        if (m && typeof m === "object") return Object.values(m).some(arr => Array.isArray(arr) && arr.some(v => v));
        return false;
      });
      return hasYearly || hasMonthly;
    }
    if (b.input_type === 'scope2_table') {
      return scopeData.s2.yearly_val || Object.keys(scopeData.s2).some(k => !isNaN(parseInt(k)) && scopeData.s2[k]);

    if (b.input_type === 'scope3_table') return S3.some(c => {

      return parseFloat(raw) > 0;

    const v = blockData[b.id];
    if (b.input_type === 'text') return v?.content_text && v.content_text.length > 10;
    return v?.content_json && v.content_json.length > 0 && v.content_json.some(r => Object.values(r||{}).some(x => x));

  const doneBlocks = blocks.filter(isDone).length;
  const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;

// 업계 벤치마크 시드 (6개사 실측치 기반 · 9개 주제만 확보됨)
// ────────────────────────────────────────────────────────────────────────
const INDUSTRY_BENCHMARK = {
  E1: { impact: 0.72, financial: 0.55, n: 6 },
  E2: { impact: 0.65, financial: 0.50, n: 6 },
  E3: { impact: 0.48, financial: 0.32, n: 6 },
  E4: { impact: 0.55, financial: 0.42, n: 6 },
  E5: { impact: 0.52, financial: 0.38, n: 6 },
  E6: { impact: 0.58, financial: 0.50, n: 6 },
  S1: { impact: 0.62, financial: 0.48, n: 6 },
  S2: { impact: 0.42, financial: 0.38, n: 6 },
  S3: { impact: 0.45, financial: 0.32, n: 5 },
  // S4·S5·G1~G4: 데이터 축적 중
};

// ────────────────────────────────────────────────────────────────────────
// 평가 로직
// ────────────────────────────────────────────────────────────────────────
const LIKERT_MAP = { 0: 0, 1: 0.2, 2: 0.4, 3: 0.6, 4: 0.8, 5: 1.0 };
const LIKERT_LABELS = {
  0: "해당 없음",
  1: "매우 낮음",
  2: "낮음",
  3: "보통",
  4: "높음",
  5: "매우 높음",
};

function calculateMateriality(responses) {
  // responses: { E1: {applicable: true, impact: 4, financial: 3}, ... }
  const applicable = MATERIALITY_TOPICS.filter(t => {
    const r = responses[t.code];
    return r && r.applicable && r.impact > 0 && r.financial > 0;
  });

  const scored = applicable.map(t => {
    const r = responses[t.code];
    const impactVal = LIKERT_MAP[r.impact] || 0;
    const financialVal = LIKERT_MAP[r.financial] || 0;
    const total = (impactVal + financialVal) / 2;
    return {
      code: t.code,
      title: t.title,
      cat: t.cat,
      color: t.color,
      impact: impactVal,
      financial: financialVal,
      total,
      gri: t.gri,
      kesg: t.kesg,
    };
  });

  scored.sort((a, b) => b.total - a.total);

  // 핵심 이슈: 상위 5개 또는 total >= 0.6
  const n = scored.length;
  const coreCount = Math.min(5, Math.max(1, Math.ceil(n * 0.35)));
  return {
    all: scored,
    core: scored.slice(0, coreCount),
    manage: scored.slice(coreCount, coreCount + Math.ceil(n * 0.35)),
    monitor: scored.slice(coreCount + Math.ceil(n * 0.35)),
  };
}

function compareToBenchmark(code, impact, financial) {
  const b = INDUSTRY_BENCHMARK[code];
  if (!b) return null;
  const impactDiff = impact - b.impact;
  const financialDiff = financial - b.financial;
  const impactSig = Math.abs(impactDiff) > 0.15 ? (impactDiff > 0 ? "above" : "below") : "similar";
  const financialSig = Math.abs(financialDiff) > 0.15 ? (financialDiff > 0 ? "above" : "below") : "similar";
  return { impactSig, financialSig, impactDiff, financialDiff, benchmark: b };
}

// 보고서 문단 자동 생성 (템플릿 기반)
// ────────────────────────────────────────────────────────────────────────
function generateReportParagraphs(result) {
  const { core, manage, monitor } = result;

  // 방법론 섹션
  const methodology = `당사는 GRI 3: Material Topics 2021의 공식 4단계 절차에 따라 이중중대성평가를 수행하였습니다. ESRS 1 Materiality Assessment 및 한국 산업통상자원부 K-ESG 가이드라인의 진단항목을 참조하여 반도체·화학 중소기업에 적합한 15개 주제를 선정하였으며, 각 주제에 대해 환경·사회에 미치는 영향(Impact Materiality)과 사업에 미치는 재무 영향(Financial Materiality)을 각각 평가하였습니다.`;

  // 핵심 이슈 섹션
  let coreText = "";
  if (core.length > 0) {
    const coreList = core.map(c => `「${c.title}」`).join(", ");
    coreText = `평가 결과, ${coreList} ${core.length}개 주제가 당사의 핵심 중요 이슈로 도출되었습니다. 이들 주제는 환경·사회 영향과 재무 영향이 모두 높게 평가되어, 보고서의 주요 공시 대상으로 선정되었습니다.`;
  }

  // 각 핵심 이슈 상세
  const coreDetails = core.map(c => {
    const griList = c.gri.join(", ");
    const kesgList = c.kesg.join(", ");
    return `■ ${c.title}\n  · GRI 연계: ${griList}\n  · K-ESG 항목: ${kesgList}\n  · 영향 중요도: ${(c.impact * 100).toFixed(0)}점 / 재무 중요도: ${(c.financial * 100).toFixed(0)}점\n  · 종합 중요도: ${(c.total * 100).toFixed(0)}점`;
  }).join("\n\n");

  // 관리 이슈 섹션
  let manageText = "";
  if (manage.length > 0) {
    const mList = manage.map(m => `「${m.title}」`).join(", ");
    manageText = `${mList}는 관리 이슈로 분류되어, 지속적 모니터링 및 개선 활동을 통해 리스크를 관리해 나갈 계획입니다.`;
  }

  return { methodology, coreText, coreDetails, manageText };
}

// ────────────────────────────────────────────────────────────────────────
// 매트릭스 SVG 렌더러
// ────────────────────────────────────────────────────────────────────────
function MaterialityMatrix({ result, width = 640, height = 480 }) {
  const padding = { top: 40, right: 40, bottom: 60, left: 70 };
  const plotW = width - padding.left - padding.right;
  const plotH = height - padding.top - padding.bottom;

  const xScale = v => padding.left + v * plotW;
  const yScale = v => padding.top + (1 - v) * plotH;

  const colorMap = { emerald: "#10b981", blue: "#3b82f6", violet: "#8b5cf6" };

  return (
    <svg width={width} height={height} style={{ background: "#fafafa", borderRadius: 8 }}>
      {/* 배경 사분면 */}
      <rect x={padding.left + plotW * 0.5} y={padding.top} width={plotW * 0.5} height={plotH * 0.5} fill="#fef3c7" opacity="0.3" />
      <text x={padding.left + plotW * 0.75} y={padding.top + 20} textAnchor="middle" fontSize="11" fill="#92400e" fontWeight="700">핵심 이슈</text>

      {/* 중앙선 */}
      <line x1={xScale(0.5)} y1={padding.top} x2={xScale(0.5)} y2={padding.top + plotH} stroke="#e5e7eb" strokeDasharray="4,4" />
      <line x1={padding.left} y1={yScale(0.5)} x2={padding.left + plotW} y2={yScale(0.5)} stroke="#e5e7eb" strokeDasharray="4,4" />

      {/* 축 */}
      <line x1={padding.left} y1={padding.top + plotH} x2={padding.left + plotW} y2={padding.top + plotH} stroke="#6b7280" strokeWidth="1.5" />
      <line x1={padding.left} y1={padding.top} x2={padding.left} y2={padding.top + plotH} stroke="#6b7280" strokeWidth="1.5" />

      {/* 축 레이블 */}
      <text x={padding.left + plotW / 2} y={height - 15} textAnchor="middle" fontSize="12" fill="#374151" fontWeight="600">환경·사회 영향 (Impact) →</text>
      <text x={20} y={padding.top + plotH / 2} textAnchor="middle" fontSize="12" fill="#374151" fontWeight="600" transform={`rotate(-90, 20, ${padding.top + plotH / 2})`}>재무 영향 (Financial) →</text>

      {/* 데이터 포인트 */}
      {result.all.map((d, i) => {
        const cx = xScale(d.impact);
        const cy = yScale(d.financial);
        const isCore = result.core.some(c => c.code === d.code);
        return (
          <g key={d.code}>
            <circle cx={cx} cy={cy} r={isCore ? 10 : 7} fill={colorMap[d.color]} opacity={isCore ? 0.9 : 0.55} stroke="#fff" strokeWidth="2" />
            <text x={cx} y={cy + 3} textAnchor="middle" fontSize="9" fill="#fff" fontWeight="700">{d.code}</text>
          </g>
        );
      })}

      {/* 업계 중위값 점선 (모든 핵심 주제에 공통 적용) */}
      {/* 평균 계산 */}
      {(() => {
        const bms = Object.values(INDUSTRY_BENCHMARK);
        if (bms.length === 0) return null;
        const avgImpact = bms.reduce((s, b) => s + b.impact, 0) / bms.length;
        const avgFinancial = bms.reduce((s, b) => s + b.financial, 0) / bms.length;
        return (
          <g>
            <line x1={xScale(avgImpact)} y1={padding.top} x2={xScale(avgImpact)} y2={padding.top + plotH} stroke="#9ca3af" strokeDasharray="2,3" opacity="0.6" />
            <line x1={padding.left} y1={yScale(avgFinancial)} x2={padding.left + plotW} y2={yScale(avgFinancial)} stroke="#9ca3af" strokeDasharray="2,3" opacity="0.6" />
            <text x={xScale(avgImpact) + 4} y={padding.top + 12} fontSize="9" fill="#6b7280">업계 평균</text>
          </g>
        );
      })()}
    </svg>
  );
}

// 메인 컴포넌트
// ────────────────────────────────────────────────────────────────────────
function MaterialityPanel({ subPage, blockData, setBlockData, ud, isAdmin }) {
  const MAT_KEY = "materiality_v1";
  const data = (blockData[MAT_KEY] && blockData[MAT_KEY].content_json) || {};
  const responses = data.responses || {};

  const updateResponse = (code, patch) => {
    const newResponses = { ...responses, [code]: { ...(responses[code] || {}), ...patch } };
    setBlockData(MAT_KEY, { content_json: { ...data, responses: newResponses }, content_text: null });
  };

  // 서브페이지 라우팅
  if (subPage === "topics") return <TopicsPage responses={responses} updateResponse={updateResponse} />;
  if (subPage === "assess") return <AssessPage responses={responses} updateResponse={updateResponse} />;
  if (subPage === "matrix") return <MatrixPage responses={responses} />;
  if (subPage === "confirm") return <ConfirmPage responses={responses} data={data} setBlockData={setBlockData} MAT_KEY={MAT_KEY} />;
  if (subPage === "report") return <ReportPage responses={responses} data={data} setBlockData={setBlockData} MAT_KEY={MAT_KEY} />;

  return <TopicsPage responses={responses} updateResponse={updateResponse} />;
}

// ────────────────────────────────────────────────────────────────────────
// 서브페이지 2: 이중 평가 (영향 × 재무)
// ────────────────────────────────────────────────────────────────────────
function AssessPage({ responses, updateResponse }) {
  const applicable = MATERIALITY_TOPICS.filter(t => responses[t.code] && responses[t.code].applicable === true);
  const evaluated = applicable.filter(t => responses[t.code].impact > 0 && responses[t.code].financial > 0).length;

  if (applicable.length === 0) {
    return (
      <div style={{ maxWidth: 700, padding: 40, textAlign: "center" }}>
        <h2 style={{ fontSize: 20, fontWeight: 700, color: "#111827", marginBottom: 12 }}>평가할 주제가 없습니다</h2>
        <p style={{ fontSize: 13, color: "#6b7280" }}>먼저 <strong>1단계 주제 진단</strong>에서 해당되는 주제를 선택해주세요.</p>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 980 }}>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: "#111827", marginBottom: 6 }}>⚖️ 중요성평가 · 2단계: 이중 평가</h2>
        <p style={{ fontSize: 13, color: "#6b7280", marginBottom: 4 }}>
          각 주제의 <strong>환경·사회 영향(Impact)</strong>과 <strong>재무 영향(Financial)</strong>을 각각 평가하세요.
        </p>
        <p style={{ fontSize: 12, color: "#9ca3af" }}>진행: {evaluated} / {applicable.length}</p>
      </div>

      {applicable.map(t => {
        const r = responses[t.code] || {};
        const catColor = { "환경": "#10b981", "사회": "#3b82f6", "지배구조": "#8b5cf6" }[t.cat];
        const bm = compareToBenchmark(t.code, LIKERT_MAP[r.impact] || 0, LIKERT_MAP[r.financial] || 0);

        return (
          <div key={t.code} style={{ background: "#fff", border: "1px solid #e5e7eb", borderRadius: 8, padding: 16, marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: catColor, background: catColor + "15", padding: "2px 6px", borderRadius: 3 }}>{t.code}</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: "#111827" }}>{t.title}</span>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              {/* 영향 평가 */}
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: "#374151", marginBottom: 4 }}>🌍 환경·사회 영향</div>
                <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 8, lineHeight: 1.5 }}>{t.impactQ}</div>
                <div style={{ display: "flex", gap: 4 }}>
                  {[0, 1, 2, 3, 4, 5].map(v => (
                    <button key={v} onClick={() => updateResponse(t.code, { impact: v })}
                      style={{ flex: 1, padding: "6px 4px", fontSize: 10, fontWeight: 600, border: `1.5px solid ${r.impact === v ? catColor : "#e5e7eb"}`, background: r.impact === v ? catColor : "#fff", color: r.impact === v ? "#fff" : "#6b7280", borderRadius: 5, cursor: "pointer" }}>
                      {v}<br /><span style={{ fontSize: 8 }}>{LIKERT_LABELS[v]}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* 재무 평가 */}
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: "#374151", marginBottom: 4 }}>💰 재무 영향</div>
                <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 8, lineHeight: 1.5 }}>{t.financialQ}</div>
                <div style={{ display: "flex", gap: 4 }}>
                  {[0, 1, 2, 3, 4, 5].map(v => (
                    <button key={v} onClick={() => updateResponse(t.code, { financial: v })}
                      style={{ flex: 1, padding: "6px 4px", fontSize: 10, fontWeight: 600, border: `1.5px solid ${r.financial === v ? catColor : "#e5e7eb"}`, background: r.financial === v ? catColor : "#fff", color: r.financial === v ? "#fff" : "#6b7280", borderRadius: 5, cursor: "pointer" }}>
                      {v}<br /><span style={{ fontSize: 8 }}>{LIKERT_LABELS[v]}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* 벤치마크 비교 + 검증 경고 */}
            {bm && r.impact > 0 && r.financial > 0 && (
              <div style={{ marginTop: 10, padding: "6px 10px", background: "#f3f4f6", borderRadius: 5, fontSize: 10, color: "#6b7280" }}>
                📊 업계 평균 대비: 영향 {bm.impactSig === "above" ? `▲ ${(bm.impactDiff * 100).toFixed(0)}점 높음` : bm.impactSig === "below" ? `▼ ${(Math.abs(bm.impactDiff) * 100).toFixed(0)}점 낮음` : "비슷"} / 재무 {bm.financialSig === "above" ? `▲ ${(bm.financialDiff * 100).toFixed(0)}점 높음` : bm.financialSig === "below" ? `▼ ${(Math.abs(bm.financialDiff) * 100).toFixed(0)}점 낮음` : "비슷"} (n={bm.benchmark.n})
              </div>
            )}

            {/* ⚠️ 검증 경고 (0% 경고 · 업계 평균 대비 과도한 저평가) */}
            {(() => {
              const impactVal = LIKERT_MAP[r.impact] || 0;
              const financialVal = LIKERT_MAP[r.financial] || 0;
              const warnings = [];

              // 0% 경고 (해당된다고 했는데 둘 다 0점)
              if (r.impact === 0 && r.financial === 0 && r.applicable === true) {
                warnings.push("해당된다고 표시하셨는데 영향·재무 모두 0점입니다. 정말 관리할 이슈가 없는지 재확인을 권장합니다.");
              }

              // 업계 평균 대비 50% 이상 낮음 (시드 있는 주제만)
              if (bm) {
                if (bm.impactDiff < -0.3) {
                  warnings.push(`영향 평가가 업계 평균보다 ${(Math.abs(bm.impactDiff) * 100).toFixed(0)}점 낮습니다. 동종 업계에서는 중요하게 보는 이슈로, 재검토를 권장합니다.`);
                }
                if (bm.financialDiff < -0.3) {
                  warnings.push(`재무 평가가 업계 평균보다 ${(Math.abs(bm.financialDiff) * 100).toFixed(0)}점 낮습니다. 규제·고객 요구 변화를 고려하여 재검토를 권장합니다.`);
                }
              }

              // 반도체·화학 특화 경고 (E1·S1은 절대 낮으면 안 됨)
              if ((t.code === "E1" || t.code === "S1") && (impactVal < 0.4 || financialVal < 0.4)) {
                warnings.push(`반도체·화학 제조업에서 「${t.title}」은 전 업계 공통 핵심 이슈입니다. 점수가 낮게 평가된 근거를 명확히 해주세요.`);
              }

              if (warnings.length === 0) return null;
              return (
                <div style={{ marginTop: 8, padding: "8px 12px", background: "#fef3c7", border: "1px solid #f59e0b", borderRadius: 5 }}>
                  {warnings.map((w, i) => (
                    <div key={i} style={{ fontSize: 11, color: "#92400e", lineHeight: 1.5, marginBottom: i < warnings.length - 1 ? 4 : 0 }}>
                      ⚠️ {w}
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>
        );
      })}
    </div>
  );
}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
        <ResultBox title="🎯 핵심 이슈" color="#d97706" bg="#fef3c7" items={result.core} desc="보고서 우선 공시 대상" />
        <ResultBox title="📋 관리 이슈" color="#2563eb" bg="#dbeafe" items={result.manage} desc="지속적 관리·모니터링" />
        <ResultBox title="👀 참고 이슈" color="#6b7280" bg="#f3f4f6" items={result.monitor} desc="변화 추적" />
      </div>
    </div>
  );
}

function ResultBox({ title, color, bg, items, desc }) {
  return (
    <div style={{ background: bg, borderRadius: 8, padding: 14 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color, marginBottom: 4 }}>{title}</div>
      <div style={{ fontSize: 10, color: "#6b7280", marginBottom: 10 }}>{desc}</div>
      {items.length === 0 ? (
        <div style={{ fontSize: 11, color: "#9ca3af", fontStyle: "italic" }}>해당 없음</div>
      ) : items.map(i => (
        <div key={i.code} style={{ background: "#fff", padding: "6px 10px", borderRadius: 5, marginBottom: 4, fontSize: 11, display: "flex", justifyContent: "space-between" }}>
          <span><strong>{i.code}</strong> {i.title}</span>
          <span style={{ color: "#9ca3af" }}>{(i.total * 100).toFixed(0)}</span>
        </div>
      ))}
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────
// 서브페이지 4: 확정
// ────────────────────────────────────────────────────────────────────────
function ConfirmPage({ responses, data, setBlockData, MAT_KEY }) {
  const result = calculateMateriality(responses);
  const confirmed = data.confirmed || false;
  const confirmedAt = data.confirmedAt;

  const handleConfirm = () => {
    setBlockData(MAT_KEY, {
      content_json: { ...data, confirmed: true, confirmedAt: new Date().toISOString(), coreTopics: result.core.map(c => c.code) },
      content_text: null,
    });
  };

  if (result.all.length === 0) {
    return (
      <div style={{ maxWidth: 700, padding: 40, textAlign: "center" }}>
        <p style={{ fontSize: 13, color: "#6b7280" }}>먼저 평가를 완료해주세요.</p>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 900 }}>
      <div style={{ marginBottom: 20 }}>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: "#111827", marginBottom: 6 }}>🎯 중요성평가 · 4단계: 핵심 주제 확정</h2>
        <p style={{ fontSize: 13, color: "#6b7280" }}>아래 {result.core.length}개 주제가 보고서 필수 공시 대상으로 확정됩니다.</p>
      </div>

      <div style={{ background: "#fff", border: "2px solid #d97706", borderRadius: 8, padding: 18, marginBottom: 16 }}>
        <h3 style={{ fontSize: 15, fontWeight: 700, color: "#92400e", marginBottom: 12 }}>🎯 확정 대상 핵심 이슈</h3>
        {result.core.map(c => (
          <div key={c.code} style={{ padding: "10px 12px", background: "#fef3c7", borderRadius: 5, marginBottom: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <strong>{c.code}</strong> · {c.title}
                <div style={{ fontSize: 10, color: "#92400e", marginTop: 2 }}>GRI: {c.gri.join(" · ")} &nbsp;|&nbsp; K-ESG: {c.kesg.join(" · ")}</div>
              </div>
              <div style={{ fontSize: 11, color: "#92400e" }}>종합 {(c.total * 100).toFixed(0)}점</div>
            </div>
          </div>
        ))}
      </div>

      {confirmed ? (
        <div style={{ background: "#d1fae5", border: "1px solid #10b981", borderRadius: 8, padding: 14, fontSize: 13, color: "#065f46" }}>
          ✓ <strong>확정 완료</strong> · {new Date(confirmedAt).toLocaleDateString("ko-KR")} · 보고서 공시에 자동 반영됩니다.
        </div>
      ) : (
        <button onClick={handleConfirm} style={{ width: "100%", padding: "12px 20px", fontSize: 14, fontWeight: 700, background: "#d97706", color: "#fff", border: "none", borderRadius: 8, cursor: "pointer" }}>
          ✓ 핵심 주제 확정하기
        </button>
      )}
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────
// 서브페이지 5: 보고서 문단 자동 생성 ⭐ 캐시카우 훅
// ────────────────────────────────────────────────────────────────────────
function ReportPage({ responses, data, setBlockData, MAT_KEY }) {
  const result = calculateMateriality(responses);
  const paragraphs = generateReportParagraphs(result);
  const stakeholderNotes = data.stakeholderNotes || "";

  const updateStakeholderNotes = (v) => {
    setBlockData(MAT_KEY, { content_json: { ...data, stakeholderNotes: v }, content_text: null });
  };

  const copyToClipboard = (text) => {
    navigator.clipboard.writeText(text).then(() => {
      alert("복사되었습니다.");
    });
  };

  const printReport = () => {
    window.print();
  };

  if (result.all.length === 0) {
    return (
      <div style={{ maxWidth: 700, padding: 40, textAlign: "center" }}>
        <p style={{ fontSize: 13, color: "#6b7280" }}>먼저 평가를 완료해주세요.</p>
      </div>
    );
  }

  const stakeholderSection = stakeholderNotes ?
    `\n\n[이해관계자 의견 반영]\n${stakeholderNotes}` : "";

  const fullText = `
[이중중대성평가]

${paragraphs.methodology}

${paragraphs.coreText}

${paragraphs.coreDetails}

${paragraphs.manageText}${stakeholderSection}
  `.trim();

  return (
    <div style={{ maxWidth: 900 }}>
      <div style={{ marginBottom: 20 }}>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: "#111827", marginBottom: 6 }}>📝 중요성평가 · 5단계: 보고서 문단 자동 생성</h2>
        <p style={{ fontSize: 13, color: "#6b7280" }}>지속가능경영 보고서의 중요성평가 섹션에 그대로 사용할 수 있는 초안입니다.</p>
      </div>

      {/* 이해관계자 의견 입력 (GRI 3 필수 요건) */}
      <div style={{ background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 8, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontSize: 13, fontWeight: 700, color: "#1e40af", marginBottom: 6 }}>💬 이해관계자 의견 (선택)</h3>
        <p style={{ fontSize: 11, color: "#1e40af", marginBottom: 10, lineHeight: 1.5 }}>
          GRI 3-1-c 요건 · 이해관계자(고객·협력사·임직원·지역사회 등)의 의견을 어떻게 수렴·반영했는지 간단히 기록하면 자동 생성 문단에 포함됩니다.
        </p>
        <textarea
          value={stakeholderNotes}
          onChange={e => updateStakeholderNotes(e.target.value)}
          placeholder="예: 주요 고객사 ESG 평가 설문, 협력사 대표자 간담회(연 2회), 임직원 ESG 인식 조사(2024) 결과를 반영하였습니다."
          style={{ width: "100%", minHeight: 80, padding: 10, fontSize: 12, border: "1px solid #bfdbfe", borderRadius: 5, resize: "vertical", fontFamily: "inherit" }}
        />
      </div>

      <div style={{ background: "#fff", border: "1px solid #e5e7eb", borderRadius: 8, padding: 20, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 14, fontWeight: 700, color: "#111827", margin: 0 }}>📄 자동 생성 문단</h3>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={printReport} style={{ padding: "6px 12px", fontSize: 11, fontWeight: 600, background: "#6b7280", color: "#fff", border: "none", borderRadius: 5, cursor: "pointer" }}>
              🖨 PDF로 저장
            </button>
            <button onClick={() => copyToClipboard(fullText)} style={{ padding: "6px 12px", fontSize: 11, fontWeight: 600, background: "#10b981", color: "#fff", border: "none", borderRadius: 5, cursor: "pointer" }}>
              📋 전체 복사
            </button>
          </div>
        </div>

        <div style={{ fontSize: 13, lineHeight: 1.7, color: "#374151" }}>
          <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 방법론</div>
          <p style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap" }}>{paragraphs.methodology}</p>

          <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 핵심 이슈 도출 결과</div>
          <p style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap" }}>{paragraphs.coreText}</p>

          <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 핵심 이슈별 상세</div>
          <pre style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap", fontFamily: "inherit", fontSize: 12, background: "#f9fafb", padding: 12, borderRadius: 5 }}>{paragraphs.coreDetails}</pre>

          {paragraphs.manageText && (
            <>
              <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 관리 이슈</div>
              <p style={{ margin: "0 0 16px 0", whiteSpace: "pre-wrap" }}>{paragraphs.manageText}</p>
            </>
          )}

          {stakeholderNotes && (
            <>
              <div style={{ fontWeight: 700, marginBottom: 8, color: "#111827" }}>■ 이해관계자 의견 반영</div>
              <p style={{ margin: "0", whiteSpace: "pre-wrap" }}>{stakeholderNotes}</p>
            </>
          )}
        </div>
      </div>

      <div style={{ background: "#eff6ff", border: "1px solid #3b82f6", borderRadius: 8, padding: 14, fontSize: 12, color: "#1e40af" }}>
        💡 이 문단은 <strong>GRI 3 Material Topics 2021 공시 요건</strong>을 충족하는 기본 골격입니다. 실제 보고서에 사용하실 때는 회사 맥락·이해관계자 의견 반영을 추가하시기 바랍니다.
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
