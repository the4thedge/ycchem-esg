// ═══════════════════════════════════════════
// 법정 배출계수 · 순발열량 · GWP
// 출처: 환경부고시 제2024-155호 [별표 12] + IPCC AR5 + GIR 2025.12 공표
// ═══════════════════════════════════════════

// 지구온난화지수 (IPCC AR5, 100-year)
const GWP = { co2: 1, ch4: 28, n2o: 265 };

// 전력 배출계수 (기후에너지환경부 2025.12.17 공표, 2023년 기준)
const EFS2 = 0.4173; // tCO₂eq/MWh

// 연도별 전력배출계수 이력 (공시 시점·정확성 향상용)
// 2025.12 이전: 3년 평균, 3년 주기 공표
// 2025.12 이후: 1년 평균, 1년 주기 공표 (기후에너지환경부 갱신 정책 변경)
const POWER_EF_HISTORY = {
  2011: 0.4594, // 2017 공표 (2011~2013 평균) - 배출권거래제 할당용 법정 고정값
  2012: 0.4594,
  2013: 0.4594,
  2014: 0.4594,
  2015: 0.4594,
  2016: 0.4594,
  2017: 0.4594,
  2018: 0.4594,
  2019: 0.4594,
  2020: 0.4541, // 2025.03 공표 (2020~2022 평균)
  2021: 0.4541,
  2022: 0.4541,
  2023: 0.4173, // 2025.12.17 공표 (2023년 기준, 최신)
  2024: 0.4173, // 2024년 전용 공표 전까지 2023년 값 적용
  2025: 0.4173, // 2025년 전용 공표 전까지 2023년 값 적용
};

// 연도별 최적 계수 반환 (없으면 최신값)
const getPowerEF = (year) => {
  if (!year) return EFS2;
  return POWER_EF_HISTORY[year] || EFS2;
};

// 배출계수 최신 공표 정보
const EFS2_SOURCE = {
  value: 0.4173,
  publishedDate: "2025.12.17",
  source: "기후에너지환경부 온실가스종합정보센터",
  baseYear: 2023,
  note: "2025년 12월부터 1년 주기 공표로 변경 (기존 3년 주기)"
};

// 3년치 보고 연도 (오늘 기준 3년: 2023, 2024, 2025)
const REPORT_YEARS = (() => {
  const current = new Date().getFullYear();
  return [current - 3, current - 2, current - 1];
})();
const YEAR_LATEST = REPORT_YEARS[2];

// 3년치 데이터 구조에서 연도별 값 추출 (기존 단일 숫자 호환)
const getYearValue = (data, year) => {
  if (data === null || data === undefined) return 0;
  if (typeof data === "number") {
    return year === YEAR_LATEST ? data : 0;
  }
  if (typeof data === "object") {
    return parseFloat(data[year]) || 0;
  }
  return parseFloat(data) || 0;
};

// ═══════════════════════════════════════════════════════════════════════
// 📦 GRI 103 에너지 관련 상수
// ═══════════════════════════════════════════════════════════════════════

// 연료별 발열량 (저위발열량 LHV 기준, IPCC 2006 가이드라인 + 환경부고시 제2024-155호)
// 단위: MJ/단위(ℓ, kg, Nm³ 등) → TJ 환산 시 × 10^-6
const FUEL_HEAT = {
  lng:      { name: "LNG (도시가스)", unit: "Nm³", heat: 39.4, renewable: false },  // MJ/Nm³
  lpg:      { name: "LPG (프로판)", unit: "kg", heat: 46.4, renewable: false },      // MJ/kg
  kero:     { name: "등유", unit: "ℓ", heat: 36.6, renewable: false },
  diesel:   { name: "경유", unit: "ℓ", heat: 37.7, renewable: false },
  gasoline: { name: "휘발유", unit: "ℓ", heat: 32.6, renewable: false },
  bcoil:    { name: "B-C유 (중유)", unit: "ℓ", heat: 40.5, renewable: false },
  biomass:  { name: "바이오매스", unit: "ton", heat: 11800, renewable: true },       // MJ/ton
  solar:    { name: "태양광 (자가소비)", unit: "kWh", heat: 3.6, renewable: true },   // MJ/kWh (1kWh = 3.6MJ)
  wind:     { name: "풍력 (자가소비)", unit: "kWh", heat: 3.6, renewable: true },
};

// GJ 환산 계수 (MWh → GJ)
const KWH_TO_GJ = 0.0036;  // 1 kWh = 0.0036 GJ = 3.6 MJ

// 전력 → GJ 환산
const kwhToGJ = (kwh) => kwh * KWH_TO_GJ;

// 연료 → GJ 환산 (연료 사용량 × 발열량 MJ → GJ)
const fuelToGJ = (fuelId, amount) => {
  const f = FUEL_HEAT[fuelId];
  if (!f || !amount) return 0;
  // 바이오매스는 MJ/ton이라 스케일 조정 불필요
  return (amount * f.heat) / 1000; // MJ → GJ
};

// 3년치 구조에 연도별 값 설정
const setYearValue = (data, year, value) => {
  const base = (typeof data === "object" && data !== null) 
    ? { ...data } 
    : (typeof data === "number" 
        ? { [YEAR_LATEST]: data } 
        : {});
  base[year] = value;
  return base;
};

// 연료 사용량(기본단위) → 배출량 (tCO₂eq)
// 공식: 사용량 × NCV × EF × GWP / 10⁶
const calc = (amt, ncv, co2EF, ch4EF, n2oEF) => {
  if (!amt) return { e: 0, t: 0, co2: 0, ch4: 0, n2o: 0 };
  const e = amt * ncv / 1000000; // TJ
  const co2 = e * co2EF / 1000 * GWP.co2;
  const ch4 = e * ch4EF / 1000 * GWP.ch4;
  const n2o = e * n2oEF / 1000 * GWP.n2o;
  return { e: e * 1000, co2, ch4, n2o, t: co2 + ch4 + n2o };
};

    { key: "excel", label: "📊 엑셀 업로드", hint: "파일로 한 번에" },
  ];

    <div style={{ display: "flex", gap: 0, marginBottom: 16, background: T.g100, padding: 3, borderRadius: 10 }}>

            flex: 1, padding: "9px 12px", borderRadius: 7, border: "none",

            color: mode === t.key ? T.g900 : T.g500,

      ))}

}

// ═══════════════════════════════════════════
// 공통 컴포넌트: 엑셀 업로드
// ═══════════════════════════════════════════
function ExcelUpload({ templateName, expectedFormat, onParse, hint, onApplied }) {
  const [fileName, setFileName] = useState("");
  const [error, setError] = useState("");
  const [preview, setPreview] = useState(null);
  const [applied, setApplied] = useState(false);

  const handleFile = async (file) => {
    if (!file) return;
    setFileName(file.name);
    setError("");
    setApplied(false);
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: "array" });
      const result = onParse(wb);
      if (result.error) {
        setError(result.error);
        setPreview(null);
      } else {
        setPreview(result);
      }
    } catch (e) {
      setError("파일 읽기 실패: " + e.message);
    }
  };
  
  const handleApply = () => {
    if (!preview || !preview.apply) return;
    try {
      preview.apply();
      setApplied(true);
      if (onApplied) onApplied();
    } catch (e) {
      setError("적용 중 오류: " + e.message);
    }
  };

  return (
    <div>
      <div style={{ padding: 16, background: T.g50, borderRadius: 10, marginBottom: 12 }}>
        <p style={{ fontSize: 13, color: T.g600, lineHeight: 1.6, marginBottom: 8 }}>
          <strong>📖 {hint || "자동 인식 가능 형식:"}</strong>
        </p>
        <p style={{ fontSize: 12, color: T.g500, lineHeight: 1.6 }}>{expectedFormat}</p>
      </div>

      <label style={{ display: "block" }}>
        <div style={{
          border: `2px dashed ${T.g300}`, borderRadius: 12, padding: "32px 20px",
          textAlign: "center", cursor: "pointer", background: T.g50,
          transition: "all 0.15s"
        }}
          onDragOver={e => { e.preventDefault(); e.currentTarget.style.background = T.blueBg; e.currentTarget.style.borderColor = T.blue; }}
          onDragLeave={e => { e.currentTarget.style.background = T.g50; e.currentTarget.style.borderColor = T.g300; }}
          onDrop={e => {
            e.preventDefault();
            e.currentTarget.style.background = T.g50;
            e.currentTarget.style.borderColor = T.g300;
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
          }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📁</div>
          <p style={{ fontSize: 14, fontWeight: 600, color: T.g700, marginBottom: 4 }}>
            엑셀 파일을 여기에 드롭하거나 클릭해서 선택
          </p>
          <p style={{ fontSize: 12, color: T.g400 }}>.xlsx, .xls 지원</p>
        </div>
        <input type="file" accept=".xlsx,.xls" style={{ display: "none" }}
          onChange={e => handleFile(e.target.files[0])} />
      </label>

      {fileName && !error && (
        <p style={{ fontSize: 13, color: T.emerald, marginTop: 10 }}>
          ✅ 파일: <strong>{fileName}</strong>
        </p>
      )}

      {error && (
        <div style={{ marginTop: 10, padding: 12, background: T.roseBg, borderRadius: 8, border: `1px solid ${T.rose}33` }}>
          <p style={{ fontSize: 13, color: T.rose, fontWeight: 500 }}>⚠ {error}</p>
          <p style={{ fontSize: 12, color: T.g500, marginTop: 4 }}>템플릿을 다운로드하여 양식에 맞춰 작성해주세요.</p>
        </div>
      )}

      {preview && preview.preview && !applied && (
        <div style={{ marginTop: 12, padding: 16, background: T.emeraldBg, borderRadius: 10, border: `1px solid ${T.emerald}33` }}>
          <p style={{ fontSize: 13, fontWeight: 600, color: T.g800, marginBottom: 8 }}>
            ✅ {preview.message}
          </p>
          <pre style={{ fontSize: 12, color: T.g600, background: T.white, padding: 10, borderRadius: 6, overflow: "auto", maxHeight: 200, whiteSpace: "pre-wrap" }}>
            {preview.preview}
          </pre>
          <button onClick={handleApply}
            style={{ marginTop: 10, padding: "10px 22px", borderRadius: 6, border: "none",
              background: T.emerald, color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
            📥 데이터 반영하기
          </button>
          <p style={{ fontSize: 11, color: T.g500, marginTop: 8 }}>
            💡 반영 후 자동으로 "연간 총량" 탭으로 이동하여 입력된 값을 확인하실 수 있습니다.
          </p>
        </div>
      )}
      
      {applied && (
        <div style={{ marginTop: 12, padding: 20, background: T.emeraldBg, borderRadius: 10, border: `2px solid ${T.emerald}`, textAlign: "center" }}>
          <div style={{ fontSize: 42, marginBottom: 8 }}>🎉</div>
          <p style={{ fontSize: 16, fontWeight: 700, color: T.emerald, marginBottom: 6 }}>
            데이터 반영 완료!
          </p>
          <p style={{ fontSize: 13, color: T.g600, marginBottom: 12 }}>
            "연간 총량" 탭 또는 "월별 입력" 탭에서 입력된 값을 확인하세요.
          </p>
          <button onClick={() => { setApplied(false); setPreview(null); setFileName(""); }}
            style={{ padding: "6px 14px", borderRadius: 6, border: `1px solid ${T.emerald}`,
              background: T.white, color: T.emerald, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
            🔄 새 파일 올리기
          </button>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════
// 공통 컴포넌트: 연료별 입력 행 (연간)
// ═══════════════════════════════════════════
function FuelRowYearly({ fuel, value, unitKey, onChange, onUnitChange, disabled, highlightEmpty }) {
  const selectedUnit = (fuel.units || []).find(u => u.key === unitKey) || (fuel.units || [])[0];
  const factor = selectedUnit?.factor || 1;
  
  // 연도별 값 추출 (기존 단일 숫자 호환)
  const yearVals = REPORT_YEARS.map(y => getYearValue(value, y));
  
  // 연도별 배출량 계산
  const yearEmissions = yearVals.map(v => {
    const baseAmt = (parseFloat(v) || 0) * factor;
    return calc(baseAmt, fuel.ncv, fuel.co2, fuel.ch4, fuel.n2o);
  });
  
  // 3년 합계
  const totalEm = yearEmissions.reduce((s, e) => s + e.t, 0);
  // 최신 연도 vs 전년 증감률
  const [, y2Em, y3Em] = yearEmissions;
  const changePct = y2Em.t > 0 ? ((y3Em.t - y2Em.t) / y2Em.t * 100) : null;
  
  const updateYear = (yearIdx, newVal) => {
    const year = REPORT_YEARS[yearIdx];
    const next = setYearValue(value, year, newVal);
    onChange(next);
  };
  
  const isAllEmpty = yearVals.every(v => !v || v === 0);
  const highlight = highlightEmpty && isAllEmpty && !disabled;
  
  return (
    <tr style={{ borderBottom: `1px solid ${T.g100}`, background: highlight ? '#fff5f5' : "transparent" }}>
      <td style={{ padding: "12px 14px", fontWeight: 500, color: T.g800, verticalAlign: "top" }}>
        <div>{fuel.name}</div>
        <div style={{ marginTop: 6 }}>
          <select value={unitKey || selectedUnit?.key} disabled={disabled}
            onChange={e => onUnitChange(e.target.value)}
            style={{
              padding: "4px 8px", borderRadius: 5, border: `1px solid ${T.g200}`,
              background: T.white, fontSize: 11, color: T.g700, cursor: "pointer",
              opacity: disabled ? 0.5 : 1
            }}>
            {(fuel.units || []).map(u => (
              <option key={u.key} value={u.key}>{u.label}</option>
            ))}
          </select>
        </div>
      </td>
      {/* 3개 연도 입력 */}
      {REPORT_YEARS.map((year, idx) => {
        const v = yearVals[idx];
        const isLatest = idx === 2;
        const emptyY = !v || v === 0;
        const hl = highlightEmpty && emptyY && !disabled && isLatest;
        return (
          <td key={year} style={{ padding: "8px 6px", verticalAlign: "top" }}>
            <p style={{ fontSize: 10, color: T.g400, marginBottom: 3, fontWeight: isLatest ? 700 : 500 }}>
              {year}{isLatest ? " (최신)" : ""}
            </p>
            <input type="number" step="0.01" value={v || ""} disabled={disabled}
              onChange={e => updateYear(idx, e.target.value)}
              placeholder={hl ? "입력 필요" : "0"}
              style={{
                width: "100%", padding: "6px 8px", borderRadius: 5,
                border: hl ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
                background: disabled ? T.g50 : (isLatest ? T.white : T.g50),
                color: T.g900, textAlign: "right", fontSize: 13, fontWeight: 600,
                opacity: disabled ? 0.5 : 1
              }} />
            <p style={{ fontSize: 10, color: T.g400, marginTop: 3, textAlign: "right" }}>
              {yearEmissions[idx].t > 0 ? yearEmissions[idx].t.toFixed(2) + " t" : "-"}
            </p>
          </td>
        );
      })}
      <td style={{ padding: "12px 14px", textAlign: "right", fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'", verticalAlign: "top" }}>
        {totalEm > 0 ? totalEm.toFixed(2) : "-"}
        {changePct !== null && (
          <div style={{ fontSize: 10, color: changePct < 0 ? T.emerald : T.rose, fontWeight: 500, marginTop: 4 }}>
            {changePct < 0 ? "▼" : "▲"} {Math.abs(changePct).toFixed(1)}%
          </div>
        )}
      </td>
    </tr>
  );
}

// ═══════════════════════════════════════════
// Scope 1 · 고정연소 + 이동연소
// ═══════════════════════════════════════════
function Scope1P({ data, set, setS2Direct, ud }) {
  const [mode, setMode] = useState("yearly");
  const [units, setUnits] = useState({});
  const [monthlyYear, setMonthlyYear] = useState(YEAR_LATEST); // 월별 입력 대상 연도
  const ce = d => ud === "all" || ud === d;

  const setUnit = (fuelId, unitKey) => setUnits(p => ({ ...p, [fuelId]: unitKey }));

  // data 구조: { lng: 450, lng_unit: "Nm³", lpg: 12, lpg_unit: "톤", ..., _monthly: { lng: [월1~12] } }
  const getValue = (fuelId) => data[fuelId] || "";
  const getUnit = (fuelId, fuel) => data[fuelId + "_unit"] || units[fuelId] || (fuel.units?.[0]?.key);

  const renderYearlyTable = (title, fuels, dk) => {
    let totalSum = 0;
    const yearSums = { [REPORT_YEARS[0]]: 0, [REPORT_YEARS[1]]: 0, [REPORT_YEARS[2]]: 0 };
    const visibleFuels = fuels.filter(f => ce(f.dept) || ud === "all" || true);
    return (
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>{title}</span>
          <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>{DEPTS[dk].name}</span>
          <span style={{ marginLeft: "auto", fontSize: 11, fontWeight: 600, color: T.blue, background: T.blueBg, padding: "3px 8px", borderRadius: 4 }}>
            📅 3년치 입력
          </span>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
          <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
            <thead><tr style={{ borderBottom: `1px solid ${T.g200}`, background: T.g50 }}>
              <th style={{ padding: "12px 14px", textAlign: "left", fontSize: 12, fontWeight: 600, color: T.g500, width: "18%" }}>연료 · 단위</th>
              {REPORT_YEARS.map(y => (
                <th key={y} style={{ padding: "12px 8px", textAlign: "center", fontSize: 12, fontWeight: 600, color: y === YEAR_LATEST ? T.g800 : T.g500 }}>
                  {y}년{y === YEAR_LATEST ? " (최신)" : ""}
                </th>
              ))}
              <th style={{ padding: "12px 14px", textAlign: "right", fontSize: 12, fontWeight: 600, color: T.g500 }}>3년 합계 (tCO₂eq)</th>
            </tr></thead>
            <tbody>
              {fuels.map(f => {
                const canEdit = ce(f.dept);
                const val = getValue(f.id);
                const uk = getUnit(f.id, f);
                const unit = (f.units || []).find(u => u.key === uk) || (f.units || [])[0];
                const factor = unit?.factor || 1;
                // 연도별 누적
                REPORT_YEARS.forEach(y => {
                  const yv = getYearValue(val, y);
                  const baseAmt = (parseFloat(yv) || 0) * factor;
                  const em = calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o);
                  yearSums[y] += em.t;
                  totalSum += em.t;
                });
                return (
                  <FuelRowYearly key={f.id} fuel={f}
                    value={val} unitKey={uk}
                    onChange={v => set(f.id, v)}
                    onUnitChange={u => { setUnit(f.id, u); set(f.id + "_unit", u); }}
                    disabled={!canEdit}
                    highlightEmpty={ud !== "all"}
                  />
                );
              })}
              <tr style={{ background: T.g50, borderTop: `2px solid ${T.g300}` }}>
                <td style={{ padding: "12px 14px", fontSize: 13, fontWeight: 700, color: T.g700 }}>연도별 소계</td>
                {REPORT_YEARS.map(y => (
                  <td key={y} style={{ padding: "12px 8px", textAlign: "center", fontWeight: 700, fontSize: 14, color: T.g900, fontFeatureSettings: "'tnum'" }}>
                    {yearSums[y] > 0 ? yearSums[y].toFixed(2) : "-"}
                  </td>
                ))}
                <td style={{ padding: "12px 14px", textAlign: "right", fontWeight: 800, fontSize: 16, color: T.g900, fontFeatureSettings: "'tnum'" }}>{totalSum.toFixed(2)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  // 월별 데이터 헬퍼 (연도별 구조 · 기존 배열 호환)
  const getMonthly = (fuelId, year) => {
    const raw = data["_monthly_" + fuelId];
    if (Array.isArray(raw)) {
      // 기존 구조 (단일 연도 배열) → 최신 연도로 매핑
      return year === YEAR_LATEST ? raw : [];
    }
    if (raw && typeof raw === "object") {
      return Array.isArray(raw[year]) ? raw[year] : [];
    }
    return [];
  };
  
  const setMonthly = (fuelId, year, newMonthly) => {
    const raw = data["_monthly_" + fuelId];
    let base = {};
    if (Array.isArray(raw)) {
      // 기존 배열 → 객체로 전환하며 기존 데이터는 최신 연도에 유지
      base = { [YEAR_LATEST]: raw };
    } else if (raw && typeof raw === "object") {
      base = { ...raw };
    }
    base[year] = newMonthly;
    set("_monthly_" + fuelId, base);
  };

  const renderMonthlyTable = (title, fuels, dk) => {
    return (
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>{title}</span>
          <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>{DEPTS[dk].name}</span>
          {/* 📅 연도 선택 */}
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8, background: T.blueBg, padding: "4px 10px", borderRadius: 6 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: T.blue }}>📅 입력 연도</span>
            <select value={monthlyYear} onChange={e => setMonthlyYear(parseInt(e.target.value))}
              style={{ padding: "3px 8px", borderRadius: 4, border: `1px solid ${T.blue}44`, background: T.white, fontSize: 12, fontWeight: 700, color: T.g800, cursor: "pointer" }}>
              {REPORT_YEARS.map(y => (
                <option key={y} value={y}>{y}년{y === YEAR_LATEST ? " (최신)" : ""}</option>
              ))}
            </select>
          </div>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden", padding: 16 }}>
          {fuels.map(f => {
            const canEdit = ce(f.dept);
            const monthly = getMonthly(f.id, monthlyYear);
            const uk = getUnit(f.id, f);
            const unit = (f.units || []).find(u => u.key === uk) || (f.units || [])[0];
            let sum = 0;
            // 3년치 월별 합계 미리보기
            const yearlyPreview = REPORT_YEARS.map(y => {
              const arr = getMonthly(f.id, y);
              return arr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
            });
            return (
              <div key={f.id} style={{ marginBottom: 18, paddingBottom: 18, borderBottom: `1px solid ${T.g100}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>{f.name}</span>
                  <select value={uk} disabled={!canEdit}
                    onChange={e => set(f.id + "_unit", e.target.value)}
                    style={{ padding: "4px 8px", borderRadius: 6, border: `1px solid ${T.g200}`, background: T.white, fontSize: 12, color: T.g700 }}>
                    {(f.units || []).map(u => <option key={u.key} value={u.key}>{u.key}</option>)}
                  </select>
                  <span style={{ fontSize: 11, color: T.g500, marginLeft: "auto" }}>
                    📊 3년 연간합계: {REPORT_YEARS.map((y, i) => (
                      <span key={y} style={{ marginLeft: 8, color: y === monthlyYear ? T.blue : T.g400, fontWeight: y === monthlyYear ? 700 : 500 }}>
                        {y}: {yearlyPreview[i].toLocaleString()}
                      </span>
                    ))}
                  </span>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6 }}>
                  {MO.map((m, i) => {
                    const v = monthly[i] || "";
                    const highlight = canEdit && ud !== "all" && !v && monthlyYear === YEAR_LATEST;
                    sum += parseFloat(v) || 0;
                    return (
                      <div key={i}>
                        <p style={{ fontSize: 11, color: T.g500, marginBottom: 3 }}>{m}</p>
                        <input type="number" value={v} disabled={!canEdit}
                          onChange={e => {
                            const newMonthly = [...monthly]; newMonthly[i] = e.target.value;
                            setMonthly(f.id, monthlyYear, newMonthly);
                          }}
                          style={{
                            width: "100%", padding: "6px 8px", borderRadius: 5,
                            border: highlight ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
                            fontSize: 13, textAlign: "right", fontWeight: 500,
                            background: canEdit ? T.white : T.g50, opacity: canEdit ? 1 : 0.5
                          }} />
                      </div>
                    );
                  })}
                </div>
                <div style={{ marginTop: 8, textAlign: "right", fontSize: 12, color: T.g500 }}>
                  {monthlyYear}년 연간 합계: <strong style={{ color: T.g800 }}>{sum.toLocaleString()}</strong> {uk}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const parseExcel = (wb) => {
    try {
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // 포맷 자동 감지 + 3년치(연도별) 자동 분리 추출
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      const matchFuel = (name) => {
        if (!name) return null;
        const n = String(name).toUpperCase();
        if (n.includes("LNG") || n.includes("도시가스")) return SF.find(f => f.id === "lng");
        if (n.includes("LPG") && (n.includes("차량") || n.includes("이동"))) return MF.find(f => f.id === "lpg_m");
        if (n.includes("LPG") || n.includes("프로판")) return SF.find(f => f.id === "lpg");
        if (n.includes("휘발유") || n.includes("GASOLINE")) return MF.find(f => f.id === "gas");
        if (n.includes("경유") && (n.includes("보일러"))) return SF.find(f => f.id === "diesel_b");
        if (n.includes("경유") || n.includes("디젤") || n.includes("DIESEL")) return MF.find(f => f.id === "diesel_m");
        if (n.includes("등유") || n.includes("KEROSENE")) return SF.find(f => f.id === "kero");
        if (n.includes("B-C") || n.includes("BC유") || n.includes("중유")) return SF.find(f => f.id === "bcoil");
        return null;
      };
      
      const matchUnit = (fuel, unitStr) => {
        if (!fuel) return null;
        const u = String(unitStr || "").trim();
        return (fuel.units || []).find(opt => u.includes(opt.key) || opt.key.includes(u)) || fuel.units?.[0];
      };

      // parsed: Scope 1 연료 데이터 [{ fuelId, fuelName, unit, byYear, byYearMonthly }]
      const parsed = [];
      let formatDetected = "unknown";
      
      // Scope 2 자동 전달용 (Scope 1 파서가 같은 엑셀에서 전력도 함께 추출)
      const electricByYear = {};       // { 2023: kWh, 2024: kWh }
      const electricMonthlyByYear = {}; // { 2023: [12개월], 2024: [12개월] }
      
      const mergeFuel = (fuelId, fuelName, year, val, unit) => {
        let entry = parsed.find(p => p.fuelId === fuelId);
        if (!entry) {
          entry = { fuelId, fuelName, unit, byYear: {} };
          parsed.push(entry);
        }
        entry.byYear[year] = (entry.byYear[year] || 0) + val;
        if (!entry.unit && unit) entry.unit = unit;
      };
      
      // ━━━ 포맷 A: 정부 보급 인벤토리 툴 ('1 활동도 입력' 시트) ━━━
      // 구조: R5[c]="연료명" · R5[c+1]=실제연료명 · R8[c]="사용량" · R9[c]=단위
      //       연도 합계 행은 B열(인덱스1)에 연도 숫자만
      //       짝수 칼럼=사용량, 홀수 칼럼=사용금액(스킵)
      const sheetA = wb.SheetNames.find(n => n.includes("활동도") || n.includes("1 활동"));
      if (sheetA) {
        const ws = wb.Sheets[sheetA];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        
        // 연도 합계 행 전부 수집
        const yearRows = {};
        for (let i = 0; i < rows.length; i++) {
          const v = rows[i]?.[1];
          const yr = parseInt(v);
          if (!isNaN(yr) && yr >= 2020 && yr <= 2030 && String(v).trim() === String(yr)) {
            yearRows[yr] = i;
          }
        }
        
        if (Object.keys(yearRows).length > 0) {
          const r5 = rows[4] || [];
          const r9 = rows[8] || [];
          
          // 보고 대상 연도(REPORT_YEARS)만 추출
          const targetYears = REPORT_YEARS.filter(y => yearRows[y] !== undefined);
          
          if (targetYears.length > 0) {
            for (let c = 2; c < r5.length; c++) {
              if (c % 2 !== 0) continue; // 짝수 칼럼만 (사용량)
              const fuelName = r5[c + 1]; // 옆 홀수 칼럼에 실제 연료명
              const unit = r9[c];
              if (!fuelName || String(unit || "").includes("원")) continue;
              
              // 연료별 연도별 값 수집
              const byYear = {};
              // 월별 데이터: byYearMonthly[year] = [12개월 배열]
              const byYearMonthly = {};
              
              for (const yr of targetYears) {
                const yrRow = yearRows[yr];
                const val = parseFloat(rows[yrRow]?.[c]);
                if (val > 0) byYear[yr] = val;
                
                // 월별 = 연도 합계 행 위쪽 12개 행
                const monthlyArr = [];
                let hasMonthly = false;
                for (let m = 0; m < 12; m++) {
                  const rowIdx = yrRow - 12 + m;
                  if (rowIdx < 0) break;
                  const mVal = parseFloat(rows[rowIdx]?.[c]);
                  monthlyArr.push(mVal > 0 ? mVal : 0);
                  if (mVal > 0) hasMonthly = true;
                }
                if (hasMonthly) byYearMonthly[yr] = monthlyArr;
              }
              
              if (Object.keys(byYear).length === 0) continue;
              
              // 전력은 Scope 2 담당 → electricByYear에 수집 (나중에 Scope 2로 전달)
              if (String(fuelName).includes("전력")) {
                // 단위를 kWh로 환산
                const unitStr = String(unit || "");
                const kwhFactor = unitStr.includes("MWh") ? 1000 : 1;
                for (const [yr, v] of Object.entries(byYear)) {
                  electricByYear[yr] = (electricByYear[yr] || 0) + v * kwhFactor;
                }
                // 월별도 수집
                for (const [yr, arr] of Object.entries(byYearMonthly)) {
                  if (!electricMonthlyByYear[yr]) electricMonthlyByYear[yr] = new Array(12).fill(0);
                  for (let m = 0; m < 12; m++) {
                    electricMonthlyByYear[yr][m] += (arr[m] || 0) * kwhFactor;
                  }
                }
                continue;
              }
              
              // 스팀은 현재 미처리 (향후)
              if (String(fuelName).includes("스팀")) continue;
              
              const fuel = matchFuel(fuelName);
              if (!fuel) continue;
              const matchedUnit = matchUnit(fuel, unit);
              
              let entry = parsed.find(p => p.fuelId === fuel.id);
              if (!entry) {
                entry = { fuelId: fuel.id, fuelName: fuel.name, unit: matchedUnit?.key || fuel.baseUnit, byYear: {}, byYearMonthly: {} };
                parsed.push(entry);
              }
              for (const [yr, v] of Object.entries(byYear)) {
                entry.byYear[yr] = (entry.byYear[yr] || 0) + v;
              }
              for (const [yr, arr] of Object.entries(byYearMonthly)) {
                if (!entry.byYearMonthly[yr]) entry.byYearMonthly[yr] = new Array(12).fill(0);
                for (let m = 0; m < 12; m++) {
                  entry.byYearMonthly[yr][m] += arr[m] || 0;
                }
              }
            }
            
            if (parsed.length > 0 || Object.keys(electricByYear).length > 0) {
              formatDetected = "정부 인벤토리 툴 포맷 (Scope 1 + Scope 2 동시 추출)";
            }
          }
        }
      }
      
      // ━━━ 포맷 B: 공급망 가치사슬 관리 툴 ━━━
      if (parsed.length === 0) {
        const sheetB = wb.SheetNames.find(n => n.includes("Scope1") || n.includes("Scope 1") || n.includes("Scope1&2"));
        if (sheetB) {
          const ws = wb.Sheets[sheetB];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
          
          let hdrRow = -1, fuelCol = -1, amtCol = -1, unitCol = -1, facCol = -1, yearCol = -1;
          for (let i = 0; i < Math.min(15, rows.length); i++) {
            const r = rows[i] || [];
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "").trim();
              if (cell === "연료명") { fuelCol = j; hdrRow = i; }
              if (cell === "활동자료" || cell === "사용량") amtCol = j;
              if (cell === "단위") unitCol = j;
              if (cell === "배출시설" || cell === "시설") facCol = j;
              if (cell === "연도" || cell === "기준년도" || cell.match(/^20\d\d년?$/)) yearCol = j;
            }
            if (fuelCol >= 0 && amtCol >= 0) break;
          }
          
          if (hdrRow >= 0 && fuelCol >= 0 && amtCol >= 0) {
            formatDetected = "공급망 가치사슬 관리 툴 포맷";
            for (let i = hdrRow + 1; i < rows.length; i++) {
              const r = rows[i] || [];
              const fuelName = r[fuelCol];
              const val = parseFloat(r[amtCol]);
              if (!fuelName || !val) continue;
              const facName = facCol >= 0 ? String(r[facCol] || "") : "";
              if (facName.includes("예)") || String(r[0] || "").includes("예시")) continue;
              
              const fuel = matchFuel(fuelName);
              if (!fuel) continue;
              const matchedUnit = matchUnit(fuel, r[unitCol]);
              
              // 연도 칼럼 있으면 그 연도, 없으면 최신 연도
              let year = YEAR_LATEST;
              if (yearCol >= 0) {
                const y = parseInt(r[yearCol]);
                if (!isNaN(y) && y >= 2020) year = y;
              }
              mergeFuel(fuel.id, fuel.name, year, val, matchedUnit?.key || fuel.baseUnit);
            }
          }
        }
      }
      
      // ━━━ 포맷 C: 범용 (연료·사용량·단위 헤더 + 연도 옵션) ━━━
      if (parsed.length === 0) {
        const sheetName = wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        
        let headerRow = -1;
        let fuelCol = -1, amountCol = -1, unitCol = -1, yearCol = -1;
        // 연도별 칼럼 (2023, 2024, 2025) 찾기
        const yearColMap = {};
        
        for (let i = 0; i < Math.min(10, rows.length); i++) {
          const row = rows[i] || [];
          for (let j = 0; j < row.length; j++) {
            const cell = String(row[j] || "").trim();
            if (cell.includes("연료") || cell.includes("품목")) { fuelCol = j; headerRow = i; }
            if (cell.includes("사용") || cell.includes("소비") || cell.includes("수량") || cell === "량") amountCol = j;
            if (cell.includes("단위")) unitCol = j;
            if (cell === "연도" || cell === "기준년도") yearCol = j;
            // 연도가 직접 헤더인 경우 (2023, 2024년 등)
            const ym = cell.match(/^(20\d\d)년?$/);
            if (ym) {
              const y = parseInt(ym[1]);
              if (REPORT_YEARS.includes(y)) {
                yearColMap[y] = j;
                if (headerRow < 0) headerRow = i;
                if (fuelCol < 0 && j > 0) fuelCol = 0; // 맨 앞 칼럼이 연료명일 것
              }
            }
          }
          if (headerRow >= 0 && (amountCol >= 0 || Object.keys(yearColMap).length > 0)) break;
        }
        
        if (headerRow >= 0) {
          // 연도별 가로 배치: A=연료, B=2023, C=2024, D=2025, 단위
          if (Object.keys(yearColMap).length > 0 && fuelCol >= 0) {
            formatDetected = "범용 포맷 (연도 칼럼 가로 배치)";
            for (let i = headerRow + 1; i < rows.length; i++) {
              const row = rows[i] || [];
              const name = String(row[fuelCol] || "").trim();
              if (!name) continue;
              const fuel = matchFuel(name);
              if (!fuel) continue;
              const unitStr = unitCol >= 0 ? String(row[unitCol] || "").trim() : fuel.baseUnit;
              const matchedUnit = matchUnit(fuel, unitStr);
              
              for (const [yr, col] of Object.entries(yearColMap)) {
                const v = parseFloat(row[col]);
                if (v > 0) mergeFuel(fuel.id, fuel.name, parseInt(yr), v, matchedUnit?.key || fuel.baseUnit);
              }
            }
          }
          // 단일 연도 (연도 칼럼 세로 또는 없음)
          else if (amountCol >= 0) {
            formatDetected = "범용 포맷 (단일 연도)";
            for (let i = headerRow + 1; i < rows.length; i++) {
              const row = rows[i] || [];
              const name = String(row[fuelCol] || "").trim();
              const amt = parseFloat(row[amountCol]);
              if (!name || !amt) continue;
              const fuel = matchFuel(name);
              if (!fuel) continue;
              const unitStr = unitCol >= 0 ? String(row[unitCol] || "").trim() : fuel.baseUnit;
              const matchedUnit = matchUnit(fuel, unitStr);
              
              let year = YEAR_LATEST;
              if (yearCol >= 0) {
                const y = parseInt(row[yearCol]);
                if (!isNaN(y) && y >= 2020) year = y;
              }
              mergeFuel(fuel.id, fuel.name, year, amt, matchedUnit?.key || fuel.baseUnit);
            }
          }
        }
      }
      
      if (parsed.length === 0 && Object.keys(electricByYear).length === 0) {
        return { 
          error: "인식 가능한 연료 데이터가 없습니다.\n\n지원 포맷:\n① 정부 인벤토리 툴 포맷 ('1 활동도 입력' 시트, 연도별 합계 행 자동 추출)\n② 공급망 가치사슬 관리 툴 포맷\n③ 범용 포맷 ([연료] [2023] [2024] [단위] 등)\n\n💡 엑셀 구조가 많이 다르면 수동 매핑 UI로 해결 예정" 
        };
      }
      
      // 미리보기: Scope 1 연료 + Scope 2 전력
      const s1Lines = parsed.map(p => {
        const yearStr = REPORT_YEARS.map(y => {
          const v = p.byYear[y];
          return v ? `${y}: ${v.toLocaleString(undefined,{maximumFractionDigits:2})}` : `${y}: -`;
        }).join(" · ");
        return `• ${p.fuelName} (${p.unit}) — ${yearStr}`;
      }).join("\n");
      
      const electricLines = Object.keys(electricByYear).length > 0
        ? "\n\n━━━ 🔌 Scope 2 (전력) 자동 추출 ━━━\n" + REPORT_YEARS.map(y => {
            const v = electricByYear[y];
            return v ? `• ${y}년: ${v.toLocaleString(undefined,{maximumFractionDigits:0})} kWh` : `• ${y}년: 데이터 없음`;
          }).join("\n")
        : "";
      
      const previewLines = (s1Lines ? "━━━ 🔥 Scope 1 (직접배출) ━━━\n" + s1Lines : "") + electricLines;
      
      const yearSet = new Set();
      parsed.forEach(p => Object.keys(p.byYear).forEach(y => yearSet.add(y)));
      Object.keys(electricByYear).forEach(y => yearSet.add(y));
      const extractedYears = [...yearSet].sort();
      
      const hasElectric = Object.keys(electricByYear).length > 0;
      const msgParts = [];
      if (parsed.length > 0) msgParts.push(`Scope 1 연료 ${parsed.length}개`);
      if (hasElectric) msgParts.push(`Scope 2 전력 ${Object.keys(electricByYear).length}개 연도`);
      
      return {
        message: `✅ ${formatDetected}\n${msgParts.join(" + ")} · 보고 연도 ${extractedYears.join(", ")}`,
        preview: previewLines,
        apply: () => {
          // Scope 1 저장
          parsed.forEach(p => {
            set(p.fuelId + "_unit", p.unit);
            set(p.fuelId, { ...p.byYear });
            if (p.byYearMonthly && Object.keys(p.byYearMonthly).length > 0) {
              set("_monthly_" + p.fuelId, { ...p.byYearMonthly });
            }
          });
          
          // Scope 2 전력 자동 저장 (setS2Direct prop 사용)
          if (hasElectric && setS2Direct) {
            for (const [yr, kwh] of Object.entries(electricByYear)) {
              setS2Direct("yearly_val_" + yr, kwh);
            }
            // 최신 연도는 yearly_val에도 (호환)
            if (electricByYear[YEAR_LATEST]) {
              setS2Direct("yearly_val", electricByYear[YEAR_LATEST]);
            }
            setS2Direct("input_type", "kWh");
            
            // Scope 2 월별도 저장
            for (const [yr, arr] of Object.entries(electricMonthlyByYear)) {
              setS2Direct("_monthly_" + yr, arr);
            }
          }
        }
      };
    } catch (e) {
      return { error: "엑셀 파싱 오류: " + e.message };
    }
  };

  return (
    <div>
      <InputTabs mode={mode} onChange={setMode}/>
      
      {mode === "yearly" && (
        <div>
          {renderYearlyTable("🔥 고정연소 (보일러·발전기·난방)", SF, "fac")}
          {renderYearlyTable("🚗 이동연소 (업무 차량)", MF, "admin")}
        </div>
      )}
      
      {mode === "monthly" && (
        <div>
          {renderMonthlyTable("🔥 고정연소 (월별)", SF, "fac")}
          {renderMonthlyTable("🚗 이동연소 (월별)", MF, "admin")}
        </div>
      )}
      
      {mode === "excel" && (
        <ExcelUpload
          hint="업체 엑셀 그대로 올리세요. Scope 1 + Scope 2(전력)까지 한 번에 자동 추출됩니다. 활동량(사용량)만 추출하고 배출계수는 국가 최신값을 자동 적용합니다."
          expectedFormat={"✅ 지원 포맷:\n① 정부 인벤토리 툴 포맷 — '1 활동도 입력' 시트에서 연료별 + 전력 3년치 자동 추출\n② 공급망 가치사슬 관리 툴 포맷\n③ 범용 포맷 — [연료] [2023] [2024] [단위] 헤더\n\n💡 연료명 자동 인식: LNG·LPG·경유·휘발유·등유·B-C유·전력\n💡 Scope 2(전력) 데이터는 자동으로 Scope 2 블록에도 반영됩니다\n\n⚡ 배출계수 자동 적용: 업체 엑셀에 계산된 tCO₂eq 값이 있어도 무시하고, 환경부고시 제2024-155호 + 기후에너지환경부 2025.12.17 공표 최신 전력계수 0.4173 tCO₂eq/MWh를 일괄 적용합니다. 이는 6개사 비교 일관성 확보 및 국가 최신 기준 부합을 위함입니다."}
          onParse={parseExcel}
          onApplied={() => setTimeout(() => setMode("yearly"), 1500)}
        />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════
// Scope 2 · 전력
// ═══════════════════════════════════════════
function Scope2P({ data, set, ud }) {
  const [mode, setMode] = useState("yearly");
  const ce = ud === "all" || ud === "admin";

  // data: { yearly_kwh: 1250400, monthly: [1월~12월], input_type: "원" }
  const inputType = data.input_type || "kWh"; // kWh | 원

  const getKwhFromValue = (val) => {
    if (!val) return 0;
    if (inputType === "kWh") return parseFloat(val);
    if (inputType === "원") return parseFloat(val) / 165; // 산업용 을 평균 165원/kWh
    return parseFloat(val);
  };

  const renderYearly = () => {
    // 3년치 입력 (기존 yearly_val 호환: 최신 연도로 매핑)
    const getYearVal = (y) => {
      if (y === YEAR_LATEST && data.yearly_val && !data["yearly_val_" + y]) {
        return data.yearly_val; // 호환: 기존 단일 연도 값
      }
      return data["yearly_val_" + y] || "";
    };
    
    // 연도별 환산 (연도별 최적 계수 적용)
    const yearCalc = REPORT_YEARS.map(y => {
      const val = getYearVal(y);
      const kwh = getKwhFromValue(val);
      const ef = getPowerEF(y);
      return { year: y, val, kwh, mwh: kwh / 1000, co2: (kwh / 1000) * ef, ef };
    });
    
    // 3년 합계
    const totalKwh = yearCalc.reduce((s, e) => s + e.kwh, 0);
    const totalCo2 = yearCalc.reduce((s, e) => s + e.co2, 0);
    // 전년 대비
    const [, y2, y3] = yearCalc;
    const changePct = y2.kwh > 0 ? ((y3.kwh - y2.kwh) / y2.kwh * 100) : null;
    
    return (
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>📅 3년치 전력 사용량</span>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.blue, background: T.blueBg, padding: "3px 8px", borderRadius: 4 }}>
            {REPORT_YEARS[0]} ~ {REPORT_YEARS[2]}
          </span>
        </div>
        
        {/* 최신 배출계수 안내 배너 */}
        <div style={{ 
          padding: "10px 14px", marginBottom: 14, 
          background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 8,
          display: "flex", alignItems: "center", gap: 10
        }}>
          <span style={{ fontSize: 16 }}>⚡</span>
          <div style={{ flex: 1 }}>
            <p style={{ fontSize: 12, fontWeight: 700, color: T.g800, marginBottom: 2 }}>
              최신 국가 표준 배출계수 자동 적용
            </p>
            <p style={{ fontSize: 11, color: T.g600, lineHeight: 1.5 }}>
              {EFS2_SOURCE.publishedDate} {EFS2_SOURCE.source} 공표 · {EFS2_SOURCE.baseYear}년 기준 {EFS2} tCO₂eq/MWh · 업체별 과거 계수 차이를 배제하여 6개사 비교 일관성 확보
            </p>
          </div>
        </div>
        
        <p style={{ fontSize: 13, color: T.g500, marginBottom: 14, lineHeight: 1.6 }}>
          💡 한전 사이버지점에서 각 연도별 연간 합계를 입력하세요. 엑셀 업로드 시 자동 채워집니다.
        </p>
        
        {/* 입력 타입 공통 */}
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontSize: 12, color: T.g500, fontWeight: 500 }}>입력 단위:</span>
          <select value={inputType} disabled={!ce}
            onChange={e => set("input_type", e.target.value)}
            style={{
              padding: "6px 12px", borderRadius: 6, border: `1px solid ${T.g200}`,
              background: T.white, fontSize: 13, fontWeight: 500, color: T.g700, cursor: "pointer"
            }}>
            <option value="kWh">kWh</option>
            <option value="원">원 (전기요금)</option>
          </select>
          {inputType === "원" && (
            <span style={{ fontSize: 11, color: T.g400 }}>💡 산업용 평균 165원/kWh 역산</span>
          )}
        </div>
        
        {/* 3년치 입력 그리드 */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 16 }}>
          {yearCalc.map(e => {
            const isLatest = e.year === YEAR_LATEST;
            const highlight = ce && ud !== "all" && !e.val && isLatest;
            return (
              <div key={e.year} style={{
                padding: 14,
                background: isLatest ? T.emeraldBg : T.g50,
                border: `1px solid ${isLatest ? T.emerald + "44" : T.g200}`,
                borderRadius: 10
              }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: isLatest ? T.emerald : T.g600, marginBottom: 8 }}>
                  📆 {e.year}년{isLatest ? " (최신)" : ""}
                </div>
                <input type="number" value={e.val} disabled={!ce}
                  onChange={ev => set("yearly_val_" + e.year, ev.target.value)}
                  placeholder={highlight ? "입력 필요" : "0"}
                  style={{
                    width: "100%", padding: "10px 12px", borderRadius: 8,
                    border: highlight ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
                    fontSize: 15, fontWeight: 600, textAlign: "right",
                    background: T.white, opacity: ce ? 1 : 0.5
                  }} />
                <div style={{ marginTop: 8, fontSize: 11, color: T.g500, lineHeight: 1.5 }}>
                  {e.kwh > 0 ? (
                    <>
                      <div>{(e.kwh).toLocaleString(undefined, { maximumFractionDigits: 0 })} kWh</div>
                      <div style={{ fontWeight: 700, color: T.g800 }}>
                        = {e.co2.toFixed(2)} tCO₂eq
                      </div>
                    </>
                  ) : (
                    <div style={{ color: T.g400 }}>-</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        
        {/* 3년 합계 및 증감률 */}
        {totalKwh > 0 && (
          <div style={{ padding: 14, background: T.g50, borderRadius: 10, display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ flex: 1 }}>
              <p style={{ fontSize: 11, color: T.g500, marginBottom: 4 }}>3년 합계</p>
              <p style={{ fontSize: 16, fontWeight: 700, color: T.g900 }}>
                {totalKwh.toLocaleString(undefined, { maximumFractionDigits: 0 })} kWh · {totalCo2.toFixed(2)} tCO₂eq
              </p>
            </div>
            {changePct !== null && (
              <div style={{
                padding: "8px 14px",
                background: changePct < 0 ? T.emeraldBg : T.roseBg,
                border: `1px solid ${changePct < 0 ? T.emerald : T.rose}`,
                borderRadius: 8
              }}>
                <p style={{ fontSize: 10, color: T.g500, marginBottom: 2 }}>
                  {REPORT_YEARS[2]} vs {REPORT_YEARS[1]}
                </p>
                <p style={{ fontSize: 14, fontWeight: 700, color: changePct < 0 ? T.emerald : T.rose }}>
                  {changePct < 0 ? "▼" : "▲"} {Math.abs(changePct).toFixed(1)}%
                </p>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  const [s2MonthlyYear, setS2MonthlyYear] = useState(YEAR_LATEST);
  
  const renderMonthly = () => {
    // 연도별 월 데이터 getter/setter
    const getMonthlyArr = (year) => {
      // 기존 구조: data[0], data[1], ..., data[11] (인덱스 숫자) - 최신 연도로 매핑
      if (year === YEAR_LATEST && !data["_monthly_" + year]) {
        const legacy = [];
        let hasLegacy = false;
        for (let i = 0; i < 12; i++) {
          if (data[i]) { legacy[i] = data[i]; hasLegacy = true; }
        }
        if (hasLegacy) return legacy;
      }
      return data["_monthly_" + year] || [];
    };
    
    const setMonthlyVal = (year, monthIdx, val) => {
      const arr = [...(getMonthlyArr(year))];
      arr[monthIdx] = val;
      set("_monthly_" + year, arr);
    };
    
    const monthly = getMonthlyArr(s2MonthlyYear);
    let total = 0;
    
    // 3년 연간합계 미리보기
    const yearlyPreview = REPORT_YEARS.map(y => {
      const arr = getMonthlyArr(y);
      return arr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
    });
    
    return (
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>월별 전력 사용량</span>
          {/* 연도 선택 */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, background: T.blueBg, padding: "4px 10px", borderRadius: 6 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: T.blue }}>📅 입력 연도</span>
            <select value={s2MonthlyYear} onChange={e => setS2MonthlyYear(parseInt(e.target.value))}
              style={{ padding: "3px 8px", borderRadius: 4, border: `1px solid ${T.blue}44`, background: T.white, fontSize: 12, fontWeight: 700, color: T.g800, cursor: "pointer" }}>
              {REPORT_YEARS.map(y => (
                <option key={y} value={y}>{y}년{y === YEAR_LATEST ? " (최신)" : ""}</option>
              ))}
            </select>
          </div>
          <span style={{ fontSize: 12, color: T.g400, marginLeft: "auto" }}>배출계수 {EFS2} tCO₂eq/MWh</span>
        </div>
        
        {/* 3년 연간합계 미리보기 */}
        <div style={{ display: "flex", gap: 10, marginBottom: 14, padding: "8px 12px", background: T.g50, borderRadius: 6 }}>
          <span style={{ fontSize: 11, color: T.g500, fontWeight: 500 }}>📊 3년 연간합계:</span>
          {REPORT_YEARS.map((y, i) => (
            <span key={y} style={{ fontSize: 11, color: y === s2MonthlyYear ? T.blue : T.g400, fontWeight: y === s2MonthlyYear ? 700 : 500 }}>
              {y}: {yearlyPreview[i].toLocaleString()} kWh
            </span>
          ))}
        </div>
        
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16 }}>
          {[0, 6].map(start => (
            <div key={start}>
              {[...Array(6)].map((_, idx) => {
                const i = start + idx;
                const v = monthly[i] || "";
                const kwh = parseFloat(v) || 0;
                total += kwh;
                const highlight = ce && ud !== "all" && !v && s2MonthlyYear === YEAR_LATEST;
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                    <span style={{ fontSize: 12, fontWeight: 500, color: T.g500, width: 30 }}>{MO[i]}</span>
                    <input type="number" value={v} disabled={!ce}
                      onChange={e => setMonthlyVal(s2MonthlyYear, i, e.target.value)}
                      placeholder={highlight ? "입력" : "0"}
                      style={{
                        flex: 1, padding: "7px 10px", borderRadius: 6,
                        border: highlight ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
                        fontSize: 13, textAlign: "right", fontWeight: 500,
                        background: ce ? T.white : T.g50, opacity: ce ? 1 : 0.5
                      }} />
                    <span style={{ fontSize: 11, color: T.g400, width: 30 }}>kWh</span>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
        <div style={{ marginTop: 16, padding: 14, background: T.g50, borderRadius: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: 13, color: T.g500 }}>{s2MonthlyYear}년 연간 합계</span>
            <span style={{ fontSize: 15, fontWeight: 700, color: T.g900 }}>
              {total.toLocaleString()} kWh · {(total * EFS2 / 1000).toFixed(2)} tCO₂eq
            </span>
          </div>
        </div>
      </div>
    );
  };

  const parseExcel = (wb) => {
    try {
      // ━━━ 포맷 A: 정부 인벤토리 툴 (3년치 전력 자동 추출) ━━━
      const sheetA = wb.SheetNames.find(n => n.includes("활동도") || n.includes("1 활동"));
      if (sheetA) {
        const ws = wb.Sheets[sheetA];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        
        // 연도 합계 행 전부 찾기
        const yearRows = {};
        for (let i = 0; i < rows.length; i++) {
          const v = rows[i]?.[1];
          const yr = parseInt(v);
          if (!isNaN(yr) && yr >= 2020 && yr <= 2030 && String(v).trim() === String(yr)) {
            yearRows[yr] = i;
          }
        }
        
        const targetYears = REPORT_YEARS.filter(y => yearRows[y] !== undefined);
        
        if (targetYears.length > 0) {
          const r5 = rows[4] || [];
          const r9 = rows[8] || [];
          
          // 연도별 전력 총계
          const electricByYear = {};
          for (let c = 2; c < r5.length; c++) {
            if (c % 2 !== 0) continue; // 짝수 칼럼 (사용량)
            const fuelName = r5[c + 1]; // 옆 칼럼에 연료명
            const unit = r9[c];
            if (!fuelName || !String(fuelName).includes("전력")) continue;
            if (!String(unit).includes("kWh") && !String(unit).includes("MWh")) continue;
            
            for (const yr of targetYears) {
              const val = parseFloat(rows[yearRows[yr]]?.[c]);
              if (val > 0) {
                const kwh = String(unit).includes("MWh") ? val * 1000 : val;
                electricByYear[yr] = (electricByYear[yr] || 0) + kwh;
              }
            }
          }
          
          if (Object.keys(electricByYear).length > 0) {
            const extractedYears = Object.keys(electricByYear).sort();
            const previewLines = REPORT_YEARS.map(y => {
              const v = electricByYear[y];
              if (!v) return `${y}년: 데이터 없음`;
              return `${y}년: ${v.toLocaleString()} kWh = ${(v/1000).toFixed(2)} MWh = ${(v/1000 * EFS2).toFixed(2)} tCO₂eq`;
            }).join("\n");
            
            return {
              message: `✅ 정부 인벤토리 툴 포맷 (3년치 자동 추출)\n전력 데이터 ${extractedYears.length}개 연도 (${extractedYears.join(", ")})`,
              preview: previewLines,
              apply: () => {
                // 연도별 저장: yearly_val_{year} 구조로
                for (const [yr, v] of Object.entries(electricByYear)) {
                  set("yearly_val_" + yr, v);
                }
                // 호환: 최신 연도 값을 yearly_val 에도 저장
                const latestV = electricByYear[YEAR_LATEST] || electricByYear[REPORT_YEARS[1]] || electricByYear[REPORT_YEARS[0]];
                if (latestV) set("yearly_val", latestV);
                set("input_type", "kWh");
                setMode("yearly");
              }
            };
          }
        }
      }
      
      // ━━━ 포맷 B: 공급망 가치사슬 관리 툴 (Scope1&2 시트) ━━━
      const sheetB = wb.SheetNames.find(n => n.includes("Scope1&2") || n.includes("Scope 1&2") || (n.includes("Scope2") && !n.includes("EF")));
      if (sheetB) {
        const ws = wb.Sheets[sheetB];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        
        // 헤더에 "전력" 또는 kWh 행 찾기
        let totalKwh = 0;
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i] || [];
          for (let j = 0; j < r.length; j++) {
            const cell = String(r[j] || "");
            if (cell.includes("전력") || cell.includes("외부 전기") || cell.includes("구매전력")) {
              // 같은 행에서 kWh/MWh 값 찾기
              for (let k = j + 1; k < r.length; k++) {
                const val = parseFloat(r[k]);
                if (!isNaN(val) && val > 100) {
                  // 단위 열 확인
                  const unitCellValue = String(r[k+1] || "").trim();
                  if (unitCellValue.toLowerCase().includes("kwh")) totalKwh += val;
                  else if (unitCellValue.toLowerCase().includes("mwh")) totalKwh += val * 1000;
                  break;
                }
              }
            }
          }
        }
        
        if (totalKwh > 0) {
          return {
            message: `✅ 공급망 가치사슬 관리 툴 포맷 인식 완료`,
            preview: `연간 전력 사용량: ${totalKwh.toLocaleString()} kWh\n= ${(totalKwh/1000).toFixed(2)} MWh\n= ${(totalKwh/1000 * EFS2).toFixed(2)} tCO₂eq`,
            apply: () => {
              set("yearly_val", totalKwh);
              set("input_type", "kWh");
              setMode("yearly");
            }
          };
        }
      }
      
      // ━━━ 포맷 C: 한전 사이버지점 / 월별 일반 ━━━
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
      
      // 월 행 찾기 + kWh 열 찾기
      let monthCol = -1, kwhCol = -1, headerRow = -1;
      for (let i = 0; i < Math.min(15, rows.length); i++) {
        const row = rows[i] || [];
        for (let j = 0; j < row.length; j++) {
          const cell = String(row[j] || "").trim();
          if (cell.includes("청구년월") || cell === "년월" || cell === "월" || cell.includes("사용월")) monthCol = j;
          if (cell.includes("kWh") || cell.includes("사용량") || cell.includes("사용전력")) kwhCol = j;
        }
        if (monthCol >= 0 && kwhCol >= 0) { headerRow = i; break; }
      }
      
      if (kwhCol < 0) return { 
        error: "전력 데이터를 찾을 수 없습니다.\n\n지원 포맷:\n① 월별 시계열 인벤토리 포맷 ('활동도 입력' 시트)\n② 공급망 가치사슬 관리 툴 포맷\n③ 한전 사이버지점/한전ON 다운로드 (청구년월·사용량)\n④ 범용 [월 | 사용량(kWh)] 형식" 
      };
      
      // 12개월 데이터 추출
      const monthly = new Array(12).fill(null);
      for (let i = headerRow + 1; i < rows.length; i++) {
        const row = rows[i] || [];
        const kwh = parseFloat(row[kwhCol]);
        if (!kwh) continue;
        
        let monthNum = -1;
        if (monthCol >= 0) {
          const m = String(row[monthCol]).match(/2\d{3}[-.\s]*?(\d{1,2})|(\d{1,2})월/);
          if (m) monthNum = parseInt(m[1] || m[2]) - 1;
        }
        if (monthNum < 0 || monthNum > 11) monthNum = monthly.findIndex(v => v === null);
        if (monthNum >= 0 && monthNum < 12) monthly[monthNum] = kwh;
      }
      
      const count = monthly.filter(v => v).length;
      if (count === 0) return { error: "월별 데이터를 찾을 수 없습니다." };
      
      return {
        message: `✅ 월별 전력 데이터 인식 완료 (${count}개월)`,
        preview: monthly.map((v, i) => v ? `${MO[i]}: ${v.toLocaleString()} kWh` : `${MO[i]}: -`).join("\n"),
        apply: () => {
          monthly.forEach((v, i) => { if (v) set(i, v); });
          setMode("monthly");
        }
      };
    } catch (e) {
      return { error: "엑셀 파싱 오류: " + e.message };
    }
  };

  return (
    <div>
      <InputTabs mode={mode} onChange={setMode}/>
      {mode === "yearly" && renderYearly()}
      {mode === "monthly" && renderMonthly()}
      {mode === "excel" && (
        <ExcelUpload
          hint="한전 사이버지점 다운로드 또는 업체 엑셀 그대로. 전력 사용량(kWh)만 추출하고 최신 배출계수 0.4173을 자동 적용합니다."
          expectedFormat={"✅ 지원 포맷:\n① 월별 시계열 인벤토리 포맷 — '활동도 입력' 시트에서 전력 사용량 자동 추출\n② 공급망 가치사슬 관리 툴 포맷 — 사업장별 전력 사용 데이터\n③ 한전 사이버지점/한전ON 다운로드 — 청구년월 + 사용량(kWh) 표\n④ 범용 — [월 | 사용량(kWh)] 형식 엑셀\n\n⚡ 배출계수 정책: 업체 엑셀에 계산된 tCO₂eq 값은 무시하고, 기후에너지환경부 2025.12.17 공표 최신 계수(0.4173 tCO₂eq/MWh)를 자동 적용합니다."}
          onParse={parseExcel}
          onApplied={() => setTimeout(() => setMode("yearly"), 1500)}
        />
      )}
    </div>
  );
}

function Scope3P({ data, set, ud }) {
  const [mode, setMode] = useState("yearly");
  const ce = d => ud === "all" || ud === d;

  const renderYearly = () => {
    // Scope 3 연도별 getter/setter
    const getS3Year = (cid, year) => {
      const raw = data[cid];
      if (typeof raw === "object" && raw !== null) {
        return parseFloat(raw[year]) || 0;
      }
      // 호환: 단일 숫자 = 최신 연도
      if (year === YEAR_LATEST) return parseFloat(raw) || 0;
      return 0;
    };
    
    const setS3Year = (cid, year, val) => {
      const raw = data[cid];
      let obj = (typeof raw === "object" && raw !== null) 
        ? { ...raw } 
        : (parseFloat(raw) > 0 ? { [YEAR_LATEST]: parseFloat(raw) } : {});
      obj[year] = parseFloat(val) || 0;
      set(cid, obj);
    };
    
    return (
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
        <div style={{ padding: "14px 20px", borderBottom: `1px solid ${T.g100}`, background: T.g50 }}>
          <p style={{ fontSize: 13, color: T.g600, lineHeight: 1.6 }}>
            💡 카테고리별 연간 지출 총액을 <strong>백만원 단위</strong>로 3개 연도({REPORT_YEARS[0]}·{REPORT_YEARS[1]}·{REPORT_YEARS[2]}) 입력하세요.
            회계 시스템이나 매입처 집계 자료에서 숫자 확인.
          </p>
        </div>
        <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
          <thead><tr style={{ borderBottom: `1px solid ${T.g200}`, background: T.g50 }}>
            <th style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, fontWeight: 600, color: T.g500, width: "10%" }}>카테고리</th>
            <th style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, fontWeight: 600, color: T.g500, width: "20%" }}>항목</th>
            {REPORT_YEARS.map(y => (
              <th key={y} style={{ padding: "10px 8px", textAlign: "center", fontSize: 11, fontWeight: 600, color: y === YEAR_LATEST ? T.g800 : T.g500 }}>
                {y}년{y === YEAR_LATEST ? " (최신)" : ""}<br/>
                <span style={{ fontSize: 9, fontWeight: 400, color: T.g400 }}>(백만원)</span>
              </th>
            ))}
            <th style={{ padding: "10px 14px", textAlign: "right", fontSize: 11, fontWeight: 600, color: T.g500 }}>최신 배출량<br/><span style={{ fontSize: 9, fontWeight: 400, color: T.g400 }}>(tCO₂eq)</span></th>
          </tr></thead>
          <tbody>{S3.map((c, i) => {
            const mine = ce(c.dept);
            const latestCost = getS3Year(c.id, YEAR_LATEST);
            const em = c.ef ? latestCost * c.ef : 0;
            const hasLatestInput = latestCost > 0;
            const needInput = mine && ud !== "all" && !hasLatestInput && c.id !== "c7";
            return (
              <tr key={c.id} style={{ borderBottom: i < S3.length - 1 ? `1px solid ${T.g100}` : "none", opacity: mine ? 1 : 0.5, background: needInput ? '#fff5f5' : "transparent" }}>
                <td style={{ padding: "10px 14px", fontSize: 11, color: T.g500 }}>{c.c}</td>
                <td style={{ padding: "10px 14px", fontWeight: 500, color: T.g800, fontSize: 12 }}>
                  {c.name}
                  <div style={{ fontSize: 10, color: T.g400, marginTop: 2 }}>{DEPTS[c.dept].name.split(" · ")[0]}</div>
                </td>
                {REPORT_YEARS.map(y => {
                  const v = getS3Year(c.id, y);
                  const isLatest = y === YEAR_LATEST;
                  const hl = mine && ud !== "all" && !v && isLatest && c.id !== "c7";
                  return (
                    <td key={y} style={{ padding: "6px 4px", textAlign: "center" }}>
                      {c.id === "c7" ? (
                        <span style={{ fontSize: 10, color: T.g400 }}>별도 산정</span>
                      ) : (
                        <input type="number" value={v || ""} disabled={!mine}
                          onChange={e => setS3Year(c.id, y, e.target.value)}
                          placeholder={hl ? "입력" : "0"}
                          style={{
                            width: "100%", padding: "6px 8px", borderRadius: 5,
                            border: hl ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
                            background: isLatest ? T.white : T.g50,
                            color: T.g900, textAlign: "right", fontSize: 12,
                            opacity: mine ? 1 : 0.5, fontWeight: 600
                          }} />
                      )}
                    </td>
                  );
                })}
                <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'", fontSize: 13 }}>
                  {em.toFixed(1)}
                </td>
              </tr>
            );
          })}</tbody>
        </table>
      </div>
    );
  };

  const parseExcel = (wb) => {
    try {
      const parsed = {};
      let formatDetected = "";
      
      // ━━━ 포맷 A: 고객사 공식 Scope 3 템플릿 (Category 1~15 시트 분리) ━━━
      // 특징: 시트명 "Category 1", "Category 2" ... 카테고리별로 시트 분리
      const categorySheets = wb.SheetNames.filter(n => /^Category\s*\d+$/i.test(n.trim()));
      if (categorySheets.length >= 5) {
        formatDetected = "카테고리별 시트 분리 포맷";
        const catMap = { 1: "c1", 2: "c2", 4: "c4", 5: "c5", 6: "c6", 7: "c7" };
        
        for (const sn of categorySheets) {
          const catNum = parseInt(sn.match(/\d+/)[0]);
          const catId = catMap[catNum];
          if (!catId) continue;
          
          const ws = wb.Sheets[sn];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
          
          // "GHG Emission" 또는 "tCO2eq" 포함 셀의 "계" 행에서 값 추출
          // 또는 "비용 기반" 또는 "Spend-based" 섹션에서 지출 비용 합산
          let totalTco2 = 0;
          let totalCost = 0;
          
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i] || [];
            const firstCol = String(r[0] || "");
            // "계" 행에서 tCO2eq 값 찾기
            if (firstCol.trim() === "계") {
              for (let j = 0; j < r.length; j++) {
                const v = parseFloat(r[j]);
                if (!isNaN(v) && v > 0 && v < 1e9) {
                  // GHG Emission이 들어간 열인지 확인
                  const hdr = rows.slice(0, i).reverse().find(row => row && row.some(c => String(c || "").includes("GHG Emission")));
                  if (hdr) {
                    const emCol = hdr.findIndex(c => String(c || "").includes("GHG Emission"));
                    if (emCol === j) { totalTco2 += v; break; }
                  }
                }
              }
            }
            // "지출 비용" 또는 "백만원" 행에서 값 합산 (비용 기반 섹션)
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "");
              if (cell.includes("지출 비용") || cell.includes("Spend")) {
                // 같은 행에서 숫자 찾기
                for (let k = j + 1; k < r.length; k++) {
                  const v = parseFloat(r[k]);
                  if (!isNaN(v) && v > 0) { totalCost += v; break; }
                }
              }
            }
          }
          
          // 비용 기반 섹션에서 직접 합계 추출
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i] || [];
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "");
              if ((cell.includes("지출 비용") && cell.includes("백만원")) || cell === "계") {
                const next = rows[i + 1];
                // 이 열에 있는 숫자들 합산 시도
                const headerRowIdx = i;
                for (let r2 = i + 1; r2 < Math.min(i + 50, rows.length); r2++) {
                  const dataRow = rows[r2] || [];
                  const v = parseFloat(dataRow[j]);
                  if (!isNaN(v) && v > 0 && v < 1e9) totalCost += v;
                }
                break;
              }
            }
          }
          
          if (totalCost > 0 && !parsed[catId]) {
            parsed[catId] = Math.round(totalCost * 10) / 10;
          }
        }
      }
      
      // ━━━ 포맷 B: 공급망 Scope3 통합 시트 (카테고리 세로 나열) ━━━
      // 특징: 시트명 "Scope3", 카테고리 1~15를 한 시트에 세로로 나열
      if (Object.keys(parsed).length === 0) {
        const sheetB = wb.SheetNames.find(n => n.includes("Scope3") || n.includes("Scope 3"));
        if (sheetB) {
          const ws = wb.Sheets[sheetB];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
          
          let hdrRow = -1, catCol = -1, emCol = -1;
          for (let i = 0; i < Math.min(20, rows.length); i++) {
            const r = rows[i] || [];
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "").trim();
              if (cell.includes("카테고리") || cell.includes("Scope 3 카테고리")) { catCol = j; hdrRow = i; }
              if (cell.includes("배출량") && cell.includes("tCO2")) emCol = j;
            }
            if (hdrRow >= 0 && emCol >= 0) break;
          }
          
          if (hdrRow >= 0) {
            formatDetected = "공급망 Scope3 통합 시트 포맷";
            const catMap = {
              "1. 구매": "c1", "2. 구매한 자본재": "c2", "2. 자본재": "c2",
              "4. 업스트림": "c4", "5. 운영중 폐기물": "c5", "5. 폐기물": "c5",
              "6. 임직원 출장": "c6", "6. 출장": "c6", "7. 임직원 출퇴근": "c7", "7. 통근": "c7"
            };
            
            for (let i = hdrRow + 1; i < Math.min(hdrRow + 25, rows.length); i++) {
              const r = rows[i] || [];
              const catName = String(r[catCol] || "").trim();
              if (!catName || catName.includes("예시")) continue;
              
              const emission = parseFloat(r[emCol]);
              if (!emission) continue;
              
              for (const [key, id] of Object.entries(catMap)) {
                if (catName.startsWith(key.split(". ")[0] + ".") || catName.includes(key.split(". ")[1] || "")) {
                  // 이미 배출량 tCO2eq이므로 역산: 비용(백만원) = 배출량 / 배출계수
                  const cat = S3.find(c => c.id === id);
                  if (cat && cat.ef) {
                    parsed[id] = Math.round(emission / cat.ef * 10) / 10;
                  } else if (id === "c7") {
                    // 통근은 ef null이므로 배출량을 비용처럼 저장
                    parsed[id] = Math.round(emission * 10) / 10;
                  }
                  break;
                }
              }
            }
          }
        }
      }
      
      // ━━━ 포맷 C: 일반 매입처 집계 엑셀 (키워드 분류) ━━━
      if (Object.keys(parsed).length === 0) {
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        
        let catCol = -1, costCol = -1, headerRow = -1;
        for (let i = 0; i < Math.min(10, rows.length); i++) {
          const row = rows[i] || [];
          for (let j = 0; j < row.length; j++) {
            const cell = String(row[j] || "").trim();
            if (cell.includes("카테고리") || cell.includes("구분") || cell.includes("거래처") || cell.includes("품목")) catCol = j;
            if (cell.includes("비용") || cell.includes("금액") || cell.includes("지출")) costCol = j;
          }
          if (catCol >= 0 && costCol >= 0) { headerRow = i; break; }
        }
        
        if (costCol >= 0) {
          formatDetected = "매입처 집계 (키워드 자동 분류)";
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i] || [];
            const cat = String(row[catCol] || "").trim();
            const cost = parseFloat(row[costCol]);
            if (!cat || !cost) continue;
            
            let catId = null;
            if (cat.includes("원재료") || cat.includes("원부자재") || cat.includes("부품") || cat.includes("Cat.1") || cat.includes("구매")) catId = "c1";
            else if (cat.includes("설비") || cat.includes("기계") || cat.includes("자본재") || cat.includes("Cat.2")) catId = "c2";
            else if (cat.includes("운송") || cat.includes("물류") || cat.includes("배송") || cat.includes("Cat.4")) catId = "c4";
            else if (cat.includes("폐기") || cat.includes("처리") || cat.includes("Cat.5")) catId = "c5";
            else if (cat.includes("출장") || cat.includes("항공") || cat.includes("숙박") || cat.includes("Cat.6")) catId = "c6";
            
            if (catId) {
              const costInMil = cost >= 1000000 ? cost / 1000000 : cost;
              parsed[catId] = (parsed[catId] || 0) + costInMil;
            }
          }
        }
      }
      
      const count = Object.keys(parsed).length;
      if (count === 0) {
        return { 
          error: "Scope 3 데이터를 찾을 수 없습니다.\n\n지원 포맷:\n① 카테고리별 시트 분리 포맷 — 'Category 1' ~ 'Category 15' 시트\n② 공급망 Scope3 통합 시트 포맷 — 'Scope3' 시트에 카테고리별 배출량 표\n③ 매입처 집계 — [카테고리/거래처][비용] 형식, 키워드 자동 분류" 
        };
      }
      
      return {
        message: `✅ ${formatDetected} 인식 완료 (${count}개 카테고리)`,
        preview: Object.entries(parsed).map(([k, v]) => {
          const cat = S3.find(c => c.id === k);
          return `• ${cat?.c} ${cat?.name}: ${v.toLocaleString(undefined, {maximumFractionDigits: 1})} 백만원`;
        }).join("\n"),
        apply: () => {
          Object.entries(parsed).forEach(([k, v]) => {
            // 연도별 구조 유지, 최신 연도에 저장
            const current = data[k];
            let yearObj = (typeof current === "object" && current !== null) ? { ...current } : {};
            if (typeof current === "number" && current > 0 && !yearObj[YEAR_LATEST]) {
              yearObj[YEAR_LATEST] = current; // 기존 단일 숫자 보존
            }
            yearObj[YEAR_LATEST] = v; // 추출된 값은 최신 연도에
            set(k, yearObj);
          });
        }
      };
    } catch (e) {
      return { error: "엑셀 파싱 오류: " + e.message };
    }
  };

  return (
    <div>
      <InputTabs mode={mode} onChange={setMode}/>
      {(mode === "yearly" || mode === "monthly") && renderYearly()}
      {mode === "excel" && (
        <ExcelUpload
          hint="고객사 요청 템플릿이나 회계 자료 그대로 올리세요"
          expectedFormat={"✅ 지원 포맷:\n① 카테고리별 시트 분리 포맷 — 'Category 1' ~ 'Category 15' 시트가 각각 있는 엑셀, 각 시트의 비용 기반 산정 섹션 자동 추출\n② 공급망 Scope3 통합 시트 포맷 — 'Scope3' 시트에 카테고리 1~15가 세로로 나열된 표\n③ 매입처 집계 — 키워드로 자동 분류 (원재료→Cat.1, 설비→Cat.2, 운송→Cat.4, 폐기→Cat.5, 출장→Cat.6)"}
          onParse={parseExcel}
          onApplied={() => setTimeout(() => setMode("yearly"), 1500)}
        />
      )}
    </div>
  );
}

function TableInput({ value, onChange, disabled }) {
  const rows = value || [{}];
  const cols = ["항목", "2024 실적", "2025 계획", "단위", "비고"];
  return (
    <div>
      <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
        <thead><tr>{cols.map((c,i) =>
          <th key={i} style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.g500, fontSize: 12, borderBottom: `1px solid ${T.g200}` }}>{c}</th>
        )}<th style={{width:28}}/></tr></thead>
        <tbody>{rows.map((row, ri) => (
          <tr key={ri}>{cols.map((_, ci) => (
            <td key={ci} style={{ padding: "3px 3px" }}>
              <input type="text" value={row[ci] || ""} disabled={disabled}
                onChange={e => {
                  const newRows = [...rows];
                  if (!newRows[ri]) newRows[ri] = {};
                  newRows[ri] = { ...newRows[ri], [ci]: e.target.value };
                  onChange(newRows);
                }}
                style={{ width: "100%", padding: "7px 10px", borderRadius: 6, border: `1px solid ${T.g200}`, background: disabled ? T.g50 : T.white, color: T.g800, fontSize: 13, opacity: disabled ? 0.5 : 1 }} />
            </td>
          ))}<td>{!disabled && ri > 0 && (
            <button onClick={() => {
              const newRows = [...rows]; newRows.splice(ri, 1); onChange(newRows);
            }} style={{ background: "none", border: "none", color: T.g400, cursor: "pointer", fontSize: 16 }}>×</button>
          )}</td></tr>
        ))}</tbody>
      </table>
      {!disabled && <button onClick={() => onChange([...rows, {}])}
        style={{ marginTop: 6, fontSize: 12, fontWeight: 500, color: T.g500, background: "none", border: `1px dashed ${T.g300}`, padding: "5px 12px", borderRadius: 6, cursor: "pointer" }}>+ 행 추가</button>}
    </div>
  );
}

function DisclosureGuide({ code }) {
  const guide = DISCLOSURE_GUIDES[code];
  const [open, setOpen] = useState(true);
  if (!guide) return null;
  
  return (
    <div style={{
      background: "linear-gradient(135deg, " + T.blueBg + " 0%, " + T.violetBg + " 100%)",
      border: `1px solid ${T.blue}33`, borderRadius: 12, padding: open ? 20 : 12, marginBottom: 20,
      transition: "padding 0.2s"
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}
        onClick={() => setOpen(!open)}>
        <span style={{ fontSize: 22 }}>{guide.icon}</span>
        <span style={{ fontSize: 12, fontWeight: 700, color: T.blue, letterSpacing: "0.04em" }}>📘 이 공시가 뭔가요?</span>
        <span style={{ marginLeft: "auto", fontSize: 11, color: T.g500 }}>⏱ {guide.time}</span>
        <span style={{ fontSize: 14, color: T.g400, transition: "transform 0.2s", transform: open ? "rotate(180deg)" : "rotate(0deg)" }}>▼</span>
      </div>
      
      {open && (
        <div style={{ marginTop: 14 }}>
          {/* 한 줄 요약 */}
          <div style={{ background: T.white, padding: 14, borderRadius: 8, marginBottom: 12 }}>
            <p style={{ fontSize: 14, fontWeight: 600, color: T.g800, lineHeight: 1.6, margin: 0 }}>
              💬 <span style={{ color: T.g600, fontWeight: 500 }}>"{guide.simple}"</span>
            </p>
          </div>
          
          {/* 핵심 개념 */}
          {guide.keyConcept && (
            <div style={{ background: T.white, padding: 14, borderRadius: 8, marginBottom: 12 }}>
              <p style={{ fontSize: 13, fontWeight: 700, color: T.g800, marginBottom: 6 }}>
                🤔 {guide.keyConcept.title}
              </p>
              <p style={{ fontSize: 12, color: T.g600, lineHeight: 1.7, whiteSpace: "pre-wrap", margin: 0 }}>
                {guide.keyConcept.body}
              </p>
            </div>
          )}
          
          {/* 무엇을 작성 + 팁 (2열) */}
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 12 }}>
            <div style={{ background: T.white, padding: 14, borderRadius: 8 }}>
              <p style={{ fontSize: 12, fontWeight: 700, color: T.g800, marginBottom: 8 }}>📝 무엇을 작성하나요?</p>
              <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, color: T.g600, lineHeight: 1.8 }}>
                {guide.whatToWrite.map((item, i) => <li key={i}>{item}</li>)}
              </ul>
            </div>
            <div style={{ background: T.amberBg, padding: 14, borderRadius: 8, border: `1px solid ${T.amber}33` }}>
              <p style={{ fontSize: 12, fontWeight: 700, color: T.g800, marginBottom: 6 }}>💡 팁</p>
              <p style={{ fontSize: 11, color: T.g600, lineHeight: 1.7, margin: 0 }}>{guide.tip}</p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function GlossaryTooltip({ termKey, children }) {
  const [open, setOpen] = useState(false);
  const term = GLOSSARY[termKey];
  if (!term) return <span>{children}</span>;
  
  return (
    <>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
        {children}
        <button onClick={(e) => { e.stopPropagation(); setOpen(true); }}

            width: 18, height: 18, borderRadius: "50%", fontSize: 11,
            fontWeight: 700, cursor: "pointer", padding: 0, lineHeight: 1,
            display: "inline-flex", alignItems: "center", justifyContent: "center"
          }}
          title={term.title}>?</button>
      </span>
      {open && (
        <div onClick={() => setOpen(false)}
          style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
            zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center",
            padding: 20
          }}>

              background: T.white, borderRadius: 12, padding: 24,
