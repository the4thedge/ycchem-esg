// ═══════════════════════════════════════════
// 법정 배출계수 · 순발열량 · GWP

    units: [
      { key: "ℓ", label: "ℓ (리터)", factor: 1, hint: "" },
      { key: "㎘", label: "㎘", factor: 1000, hint: "" },
    ]},
  { id: "bcoil", name: "B-C유 (중유)", baseUnit: "ℓ", ncv: 39.6, co2: 77400, ch4: 10, n2o: 0.6, dept: "fac",

// 연료 사용량(기본단위) → 배출량 (tCO₂eq)
// 공식: 사용량 × NCV × EF × GWP / 10⁶
const calc = (amt, ncv, co2EF, ch4EF, n2oEF) => {
  if (!amt) return { e: 0, t: 0, co2: 0, ch4: 0, n2o: 0 };
  const e = amt * ncv / 1000000; // TJ
  const co2 = e * co2EF / 1000 * GWP.co2;
  const ch4 = e * ch4EF / 1000 * GWP.ch4;
  const n2o = e * n2oEF / 1000 * GWP.n2o;
  return { e: e * 1000, co2, ch4, n2o, t: co2 + ch4 + n2o };
};

// ═══════════════════════════════════════════
// 공통 컴포넌트: 엑셀 업로드
// ═══════════════════════════════════════════
function ExcelUpload({ templateName, expectedFormat, onParse, hint }) {
  const [fileName, setFileName] = useState("");
  const [error, setError] = useState("");
  const [preview, setPreview] = useState(null);

  const handleFile = async (file) => {
    if (!file) return;
    setFileName(file.name);
    setError("");
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: "array" });
      const result = onParse(wb);
      if (result.error) {
        setError(result.error);
        setPreview(null);
      } else {
        setPreview(result);
      }
    } catch (e) {
      setError("파일 읽기 실패: " + e.message);
    }
  };

  return (
    <div>
      <div style={{ padding: 16, background: T.g50, borderRadius: 10, marginBottom: 12 }}>
        <p style={{ fontSize: 13, color: T.g600, lineHeight: 1.6, marginBottom: 8 }}>
          <strong>📖 {hint || "자동 인식 가능 형식:"}</strong>
        </p>
        <p style={{ fontSize: 12, color: T.g500, lineHeight: 1.6 }}>{expectedFormat}</p>
      </div>

      <label style={{ display: "block" }}>
        <div style={{
          border: `2px dashed ${T.g300}`, borderRadius: 12, padding: "32px 20px",
          textAlign: "center", cursor: "pointer", background: T.g50,
          transition: "all 0.15s"
        }}
          onDragOver={e => { e.preventDefault(); e.currentTarget.style.background = T.blueBg; e.currentTarget.style.borderColor = T.blue; }}
          onDragLeave={e => { e.currentTarget.style.background = T.g50; e.currentTarget.style.borderColor = T.g300; }}
          onDrop={e => {
            e.preventDefault();
            e.currentTarget.style.background = T.g50;
            e.currentTarget.style.borderColor = T.g300;
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
          }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📁</div>
          <p style={{ fontSize: 14, fontWeight: 600, color: T.g700, marginBottom: 4 }}>
            엑셀 파일을 여기에 드롭하거나 클릭해서 선택
          </p>
          <p style={{ fontSize: 12, color: T.g400 }}>.xlsx, .xls 지원</p>
        </div>
        <input type="file" accept=".xlsx,.xls" style={{ display: "none" }}
          onChange={e => handleFile(e.target.files[0])} />
      </label>

      {fileName && !error && (
        <p style={{ fontSize: 13, color: T.emerald, marginTop: 10 }}>
          ✅ 파일: <strong>{fileName}</strong>
        </p>
      )}

      {error && (
        <div style={{ marginTop: 10, padding: 12, background: T.roseBg, borderRadius: 8, border: `1px solid ${T.rose}33` }}>
          <p style={{ fontSize: 13, color: T.rose, fontWeight: 500 }}>⚠ {error}</p>
          <p style={{ fontSize: 12, color: T.g500, marginTop: 4 }}>템플릿을 다운로드하여 양식에 맞춰 작성해주세요.</p>
        </div>
      )}

      {preview && preview.preview && (
        <div style={{ marginTop: 12, padding: 16, background: T.emeraldBg, borderRadius: 10, border: `1px solid ${T.emerald}33` }}>
          <p style={{ fontSize: 13, fontWeight: 600, color: T.g800, marginBottom: 8 }}>
            ✅ {preview.message}
          </p>
          <pre style={{ fontSize: 12, color: T.g600, background: T.white, padding: 10, borderRadius: 6, overflow: "auto", maxHeight: 200 }}>
            {preview.preview}
          </pre>
          <button onClick={() => preview.apply()}
            style={{ marginTop: 10, padding: "8px 18px", borderRadius: 6, border: "none",
              background: T.emerald, color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            적용하기
          </button>
        </div>
      )}
    </div>
  );
}

// 공통 컴포넌트: 연료별 입력 행 (연간)
// ═══════════════════════════════════════════
function FuelRowYearly({ fuel, value, unitKey, onChange, onUnitChange, disabled, highlightEmpty }) {
  const selectedUnit = (fuel.units || []).find(u => u.key === unitKey) || (fuel.units || [])[0];
  const factor = selectedUnit?.factor || 1;
  const baseAmt = (parseFloat(value) || 0) * factor;
  const em = calc(baseAmt, fuel.ncv, fuel.co2, fuel.ch4, fuel.n2o);
  const isEmpty = !value;
  const highlight = highlightEmpty && isEmpty && !disabled;
  
  return (
    <tr style={{ borderBottom: `1px solid ${T.g100}`, background: highlight ? '#fff5f5' : "transparent" }}>
      <td style={{ padding: "12px 14px", fontWeight: 500, color: T.g800 }}>{fuel.name}</td>
      <td style={{ padding: "8px 6px" }}>
        <div style={{ display: "flex", gap: 6 }}>
          <input type="number" step="0.01" value={value || ""} disabled={disabled}
            onChange={e => onChange(e.target.value)}
            placeholder={highlight ? "입력 필요" : "0"}
            style={{
              flex: 1, padding: "8px 12px", borderRadius: 6,
              border: highlight ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
              background: disabled ? T.g50 : T.white, color: T.g900,
              textAlign: "right", fontSize: 14, fontWeight: 600,
              opacity: disabled ? 0.5 : 1, minWidth: 100
            }} />
          <select value={unitKey || selectedUnit?.key} disabled={disabled}
            onChange={e => onUnitChange(e.target.value)}
            style={{
              padding: "8px 10px", borderRadius: 6, border: `1px solid ${T.g200}`,
              background: T.white, fontSize: 13, color: T.g700, cursor: "pointer",
              opacity: disabled ? 0.5 : 1
            }}>
            {(fuel.units || []).map(u => (
              <option key={u.key} value={u.key}>{u.label}</option>
            ))}
          </select>
        </div>
        {selectedUnit?.hint && <p style={{ fontSize: 11, color: T.g400, marginTop: 4, paddingLeft: 2 }}>💡 {selectedUnit.hint}</p>}
      </td>
      <td style={{ padding: "12px 14px", textAlign: "right", fontSize: 12, color: T.g500 }}>
        {baseAmt > 0 ? `${baseAmt.toLocaleString(undefined,{maximumFractionDigits:1})} ${fuel.baseUnit}` : "-"}
      </td>
      <td style={{ padding: "12px 14px", textAlign: "right", color: T.g500, fontSize: 13 }}>
        {em.e > 0 ? em.e.toFixed(3) : "-"}
      </td>
      <td style={{ padding: "12px 14px", textAlign: "right", fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>
        {em.t > 0 ? em.t.toFixed(2) : "-"}
      </td>
    </tr>
  );
}

// ═══════════════════════════════════════════
// Scope 1 · 고정연소 + 이동연소
// ═══════════════════════════════════════════
function Scope1P({ data, set, ud }) {
  const [mode, setMode] = useState("yearly");
  const [units, setUnits] = useState({});
  const ce = d => ud === "all" || ud === d;

  const setUnit = (fuelId, unitKey) => setUnits(p => ({ ...p, [fuelId]: unitKey }));

  // data 구조: { lng: 450, lng_unit: "Nm³", lpg: 12, lpg_unit: "톤", ..., _monthly: { lng: [월1~12] } }
  const getValue = (fuelId) => data[fuelId] || "";
  const getUnit = (fuelId, fuel) => data[fuelId + "_unit"] || units[fuelId] || (fuel.units?.[0]?.key);

  const renderYearlyTable = (title, fuels, dk) => {
    let sum = 0;
    const visibleFuels = fuels.filter(f => ce(f.dept) || ud === "all" || true); // 다 보여주되 비담당은 disable
    return (
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>{title}</span>
          <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>{DEPTS[dk].name}</span>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
          <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
            <thead><tr style={{ borderBottom: `1px solid ${T.g200}`, background: T.g50 }}>
              <th style={{ padding: "12px 14px", textAlign: "left", fontSize: 12, fontWeight: 600, color: T.g500 }}>연료</th>
              <th style={{ padding: "12px 14px", textAlign: "left", fontSize: 12, fontWeight: 600, color: T.g500, width: "40%" }}>입력값 + 단위 선택</th>
              <th style={{ padding: "12px 14px", textAlign: "right", fontSize: 12, fontWeight: 600, color: T.g500 }}>{`환산값 (${fuels[0]?.baseUnit || ""})`}</th>
              <th style={{ padding: "12px 14px", textAlign: "right", fontSize: 12, fontWeight: 600, color: T.g500 }}>에너지 (TJ)</th>
              <th style={{ padding: "12px 14px", textAlign: "right", fontSize: 12, fontWeight: 600, color: T.g500 }}>배출량 (tCO₂eq)</th>
            </tr></thead>
            <tbody>
              {fuels.map(f => {
                const canEdit = ce(f.dept);
                const val = getValue(f.id);
                const uk = getUnit(f.id, f);
                const unit = (f.units || []).find(u => u.key === uk) || (f.units || [])[0];
                const baseAmt = (parseFloat(val) || 0) * (unit?.factor || 1);
                sum += calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
                return (
                  <FuelRowYearly key={f.id} fuel={f}
                    value={val} unitKey={uk}
                    onChange={v => set(f.id, v)}
                    onUnitChange={u => { setUnit(f.id, u); set(f.id + "_unit", u); }}
                    disabled={!canEdit}
                    highlightEmpty={ud !== "all"}
                  />
                );
              })}
              <tr style={{ background: T.g50, borderTop: `1px solid ${T.g200}` }}>
                <td colSpan="4" style={{ padding: "12px 14px", fontSize: 13, fontWeight: 600, color: T.g600, textAlign: "right" }}>소계</td>
                <td style={{ padding: "12px 14px", textAlign: "right", fontWeight: 700, fontSize: 16, color: T.g900, fontFeatureSettings: "'tnum'" }}>{sum.toFixed(2)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  const renderMonthlyTable = (title, fuels, dk) => {
    return (
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>{title}</span>
          <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>{DEPTS[dk].name}</span>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden", padding: 16 }}>
          {fuels.map(f => {
            const canEdit = ce(f.dept);
            const monthly = data["_monthly_" + f.id] || [];
            const uk = getUnit(f.id, f);
            const unit = (f.units || []).find(u => u.key === uk) || (f.units || [])[0];
            let sum = 0;
            return (
              <div key={f.id} style={{ marginBottom: 18, paddingBottom: 18, borderBottom: `1px solid ${T.g100}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>{f.name}</span>
                  <select value={uk} disabled={!canEdit}
                    onChange={e => set(f.id + "_unit", e.target.value)}
                    style={{ padding: "4px 8px", borderRadius: 6, border: `1px solid ${T.g200}`, background: T.white, fontSize: 12, color: T.g700 }}>
                    {(f.units || []).map(u => <option key={u.key} value={u.key}>{u.key}</option>)}
                  </select>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6 }}>
                  {MO.map((m, i) => {
                    const v = monthly[i] || "";
                    const highlight = canEdit && ud !== "all" && !v;
                    sum += parseFloat(v) || 0;
                    return (
                      <div key={i}>
                        <p style={{ fontSize: 11, color: T.g500, marginBottom: 3 }}>{m}</p>
                        <input type="number" value={v} disabled={!canEdit}
                          onChange={e => {
                            const newMonthly = [...monthly]; newMonthly[i] = e.target.value;
                            set("_monthly_" + f.id, newMonthly);
                          }}
                          style={{
                            width: "100%", padding: "6px 8px", borderRadius: 5,
                            border: highlight ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
                            fontSize: 13, textAlign: "right", fontWeight: 500,
                            background: canEdit ? T.white : T.g50, opacity: canEdit ? 1 : 0.5
                          }} />
                      </div>
                    );
                  })}
                </div>
                <div style={{ marginTop: 8, textAlign: "right", fontSize: 12, color: T.g500 }}>
                  연간 합계: <strong style={{ color: T.g800 }}>{sum.toLocaleString()}</strong> {uk}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const parseExcel = (wb) => {
    try {
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // 포맷 자동 감지 (3가지 실전 포맷 + 템플릿)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      // 연료명 매칭 유틸
      const matchFuel = (name) => {
        if (!name) return null;
        const n = String(name).toUpperCase();
        if (n.includes("LNG") || n.includes("도시가스")) return SF.find(f => f.id === "lng");
        if (n.includes("LPG") && (n.includes("차량") || n.includes("이동"))) return MF.find(f => f.id === "lpg_m");
        if (n.includes("LPG") || n.includes("프로판")) return SF.find(f => f.id === "lpg");
        if (n.includes("휘발유") || n.includes("GASOLINE")) return MF.find(f => f.id === "gas");
        if (n.includes("경유") && (n.includes("보일러"))) return SF.find(f => f.id === "diesel_b");
        if (n.includes("경유") || n.includes("디젤") || n.includes("DIESEL")) return MF.find(f => f.id === "diesel_m");
        if (n.includes("등유") || n.includes("KEROSENE")) return SF.find(f => f.id === "kero");
        if (n.includes("B-C") || n.includes("BC유") || n.includes("중유")) return SF.find(f => f.id === "bcoil");
        return null;
      };
      
      const matchUnit = (fuel, unitStr) => {
        if (!fuel) return null;
        const u = String(unitStr || "").trim();
        return (fuel.units || []).find(opt => u.includes(opt.key) || opt.key.includes(u)) || fuel.units?.[0];
      };

      const parsed = [];
      let formatDetected = "unknown";
      
      // ━━━ 포맷 A: 월별 시계열 인벤토리 툴 (세로 월별 × 가로 연료) ━━━
      // 특징: "활동도 입력" 시트, R5 연료명, R9 단위, R10~ 월별 데이터, 연도별 합계 행
      const sheetA = wb.SheetNames.find(n => n.includes("활동도") || n.includes("1 활동"));
      if (sheetA) {
        const ws = wb.Sheets[sheetA];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        
        // 유효 데이터 있는 가장 최근 연도 찾기
        const currentYear = new Date().getFullYear();
        const candidateRows = [];
        for (let i = 15; i < Math.min(150, rows.length); i++) {
          const r = rows[i] || [];
          const v = r[1];
          const yr = parseInt(v);
          if (!isNaN(yr) && yr >= 2020 && yr <= currentYear + 1 && String(v).trim() === String(yr)) {
            let hasData = false;
            const unitRow = rows[8] || [];
            for (let c = 2; c < r.length; c++) {
              const val = parseFloat(r[c]);
              const unit = String(unitRow[c] || "");
              if (val > 0 && unit !== "원" && unit !== "천원") { hasData = true; break; }
            }
            if (hasData) candidateRows.push({ row: i, year: yr });
          }
        }
        
        const annualRow = candidateRows.length > 0 
          ? candidateRows.reduce((max, c) => c.year > max.year ? c : max).row 
          : -1;
        
        if (annualRow > 0) {
          formatDetected = "월별 시계열 인벤토리 포맷";
          const fuelNameRow = rows[4] || [];
          const unitRow = rows[8] || [];
          const valRow = rows[annualRow] || [];
          
          for (let c = 2; c < valRow.length; c++) {
            const fuelName = fuelNameRow[c];
            const unit = unitRow[c];
            const val = parseFloat(valRow[c]);
            if (!val || !fuelName) continue;
            if (unit && (String(unit).includes("원") && !String(unit).includes("Nm"))) continue;
            if (String(fuelName).includes("전력") || String(fuelName).includes("스팀")) continue;
            
            const fuel = matchFuel(fuelName);
            if (!fuel) continue;
            
            const matchedUnit = matchUnit(fuel, unit);
            const existing = parsed.find(p => p.fuelId === fuel.id);
            if (existing) {
              existing.amount += val;
            } else {
              parsed.push({ 
                fuelId: fuel.id, 
                fuelName: fuel.name, 
                amount: val, 
                unit: matchedUnit?.key || fuel.baseUnit,
                source: `${String(rows[annualRow][1])}년 합계`
              });
            }
          }
        }
      }
      
      // ━━━ 포맷 B: 공급망 가치사슬 관리 툴 (사업장·시설별 행 나열) ━━━
      // 특징: "Scope1&2" 시트, 헤더 "사업장 | 시설 | 연료명 | 활동자료 | 단위"
      if (parsed.length === 0) {
        const sheetB = wb.SheetNames.find(n => n.includes("Scope1") || n.includes("Scope 1") || n.includes("Scope1&2"));
        if (sheetB) {
          const ws = wb.Sheets[sheetB];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
          
          let hdrRow = -1, fuelCol = -1, amtCol = -1, unitCol = -1, facCol = -1;
          for (let i = 0; i < Math.min(15, rows.length); i++) {
            const r = rows[i] || [];
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "").trim();
              if (cell === "연료명") { fuelCol = j; hdrRow = i; }
              if (cell === "활동자료" || cell === "사용량") amtCol = j;
              if (cell === "단위") unitCol = j;
              if (cell === "배출시설" || cell === "시설") facCol = j;
            }
            if (fuelCol >= 0 && amtCol >= 0) break;
          }
          
          if (hdrRow >= 0 && fuelCol >= 0 && amtCol >= 0) {
            formatDetected = "공급망 가치사슬 관리 툴 포맷";
            for (let i = hdrRow + 1; i < rows.length; i++) {
              const r = rows[i] || [];
              const fuelName = r[fuelCol];
              const val = parseFloat(r[amtCol]);
              if (!fuelName || !val) continue;
              const facName = facCol >= 0 ? String(r[facCol] || "") : "";
              if (facName.includes("예)") || String(r[0] || "").includes("예시")) continue;
              
              const fuel = matchFuel(fuelName);
              if (!fuel) continue;
              const matchedUnit = matchUnit(fuel, r[unitCol]);
              
              const existing = parsed.find(p => p.fuelId === fuel.id);
              if (existing) {
                existing.amount += val;
              } else {
                parsed.push({
                  fuelId: fuel.id,
                  fuelName: fuel.name,
                  amount: val,
                  unit: matchedUnit?.key || fuel.baseUnit
                });
              }
            }
          }
        }
      }
      
      // ━━━ 포맷 C: 우리 템플릿 / 범용 ━━━
      if (parsed.length === 0) {
        const sheetName = wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        
        let headerRow = -1;
        let fuelCol = -1, amountCol = -1, unitCol = -1;
        for (let i = 0; i < Math.min(10, rows.length); i++) {
          const row = rows[i] || [];
          for (let j = 0; j < row.length; j++) {
            const cell = String(row[j] || "").trim();
            if (cell.includes("연료") || cell.includes("품목")) { fuelCol = j; headerRow = i; }
            if (cell.includes("사용") || cell.includes("소비") || cell.includes("수량") || cell === "량") amountCol = j;
            if (cell.includes("단위")) unitCol = j;
          }
          if (headerRow >= 0 && amountCol >= 0) break;
        }
        
        if (headerRow >= 0 && amountCol >= 0) {
          formatDetected = "범용 템플릿";
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i] || [];
            const name = String(row[fuelCol] || "").trim();
            const amt = parseFloat(row[amountCol]);
            if (!name || !amt) continue;
            const fuel = matchFuel(name);
            if (!fuel) continue;
            const unitStr = unitCol >= 0 ? String(row[unitCol] || "").trim() : fuel.baseUnit;
            const matchedUnit = matchUnit(fuel, unitStr);
            parsed.push({ 
              fuelId: fuel.id, 
              fuelName: fuel.name, 
              amount: amt, 
              unit: matchedUnit?.key || fuel.baseUnit 
            });
          }
        }
      }
      
      if (parsed.length === 0) {
        return { 
          error: "인식 가능한 연료 데이터가 없습니다.\n\n지원 포맷:\n① 월별 시계열 인벤토리 포맷 ('활동도 입력' 시트, 연도별 합계 행)\n② 공급망 가치사슬 관리 툴 포맷 (사업장·시설별 행 나열)\n③ 범용 포맷 ([연료] [사용량] [단위] 헤더)" 
        };
      }
      
      return {
        message: `✅ ${formatDetected} 인식 완료 (${parsed.length}개 연료)`,
        preview: parsed.map(p => {
          const baseUnit = [...SF, ...MF].find(f => f.id === p.fuelId)?.baseUnit;
          return `• ${p.fuelName}: ${p.amount.toLocaleString(undefined, {maximumFractionDigits: 2})} ${p.unit}${p.source ? ` [${p.source}]` : ""}`;
        }).join("\n"),
        apply: () => {
          parsed.forEach(p => {
            set(p.fuelId, p.amount);
            set(p.fuelId + "_unit", p.unit);
          });
        }
      };
    } catch (e) {
      return { error: "엑셀 파싱 오류: " + e.message };
    }
  };

  return (
    <div>
      <InputTabs mode={mode} onChange={setMode}/>
      
      {mode === "yearly" && (
        <div>
          {renderYearlyTable("🔥 고정연소 (보일러·발전기·난방)", SF, "fac")}
          {renderYearlyTable("🚗 이동연소 (업무 차량)", MF, "admin")}
        </div>
      )}
      
      {mode === "monthly" && (
        <div>
          {renderMonthlyTable("🔥 고정연소 (월별)", SF, "fac")}
          {renderMonthlyTable("🚗 이동연소 (월별)", MF, "admin")}
        </div>
      )}
      
      {mode === "excel" && (
        <ExcelUpload
          hint="업체에서 이미 쓰던 엑셀 그대로 올리세요. 자동으로 포맷 감지합니다."
          expectedFormat={"✅ 지원 포맷:\n① 월별 시계열 인벤토리 포맷 — '활동도 입력' 시트에서 연도별 합계 자동 추출\n② 공급망 가치사슬 관리 툴 포맷 — 사업장·시설별 연료 사용량 표\n③ 범용 포맷 — 첫 행에 [연료] [사용량] [단위] 헤더가 있는 엑셀\n\n💡 연료명은 'LNG', 'LPG', '경유', '휘발유', '등유', 'B-C유' 자동 인식"}
          onParse={parseExcel}
        />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════
// Scope 2 · 전력
// ═══════════════════════════════════════════
function Scope2P({ data, set, ud }) {
  const [mode, setMode] = useState("yearly");
  const ce = ud === "all" || ud === "admin";

  // data: { yearly_kwh: 1250400, monthly: [1월~12월], input_type: "원" }
  const inputType = data.input_type || "kWh"; // kWh | 원

  const getKwhFromValue = (val) => {
    if (!val) return 0;
    if (inputType === "kWh") return parseFloat(val);
    if (inputType === "원") return parseFloat(val) / 165; // 산업용 을 평균 165원/kWh
    return parseFloat(val);
  };

  const renderYearly = () => {
    const val = data.yearly_val || "";
    const kwh = getKwhFromValue(val);
    const mwh = kwh / 1000;
    const co2 = mwh * EFS2;
    const highlight = ce && ud !== "all" && !val;
    
    return (
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>연간 총 전력 사용량</span>
          <span style={{ fontSize: 12, color: T.g400, marginLeft: "auto" }}>배출계수 {EFS2} tCO₂eq/MWh (2023 최신)</span>
        </div>
        <p style={{ fontSize: 13, color: T.g500, marginBottom: 14, lineHeight: 1.6 }}>
          💡 한전 사이버지점 → 연간 사용량 조회 → 12개월 합계를 한 번에 입력하시면 됩니다
        </p>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <input type="number" value={val} disabled={!ce}
            onChange={e => set("yearly_val", e.target.value)}
            placeholder={highlight ? "연간 합계 입력 필요" : "1,250,400"}
            style={{
              flex: 1, padding: "14px 18px", borderRadius: 10,
              border: highlight ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
              fontSize: 18, fontWeight: 600, textAlign: "right",
              background: ce ? T.white : T.g50, opacity: ce ? 1 : 0.5
            }} />
          <select value={inputType} disabled={!ce}
            onChange={e => set("input_type", e.target.value)}
            style={{
              padding: "14px 16px", borderRadius: 10, border: `1px solid ${T.g200}`,
              background: T.white, fontSize: 15, fontWeight: 500, color: T.g700, cursor: "pointer"
            }}>
            <option value="kWh">kWh</option>
            <option value="원">원 (전기요금)</option>
          </select>
        </div>
        {inputType === "원" && (
          <p style={{ fontSize: 11, color: T.g400, marginTop: 6 }}>
            💡 산업용 평균 단가 165원/kWh로 역산 (2024년 기준)
          </p>
        )}
        
        {kwh > 0 && (
          <div style={{ marginTop: 16, padding: 16, background: T.g50, borderRadius: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 13, color: T.g500 }}>사용량</span>
              <span style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>
                {kwh.toLocaleString(undefined, { maximumFractionDigits: 0 })} kWh · {mwh.toFixed(2)} MWh
              </span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
              <span style={{ fontSize: 13, color: T.g500 }}>배출량 (Scope 2)</span>
              <span style={{ fontSize: 18, fontWeight: 700, color: T.g900 }}>
                {co2.toFixed(2)} tCO₂eq
              </span>
            </div>
          </div>
        )}
      </div>
    );
  };

  const renderMonthly = () => {
    let total = 0;
    return (
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>월별 전력 사용량</span>
          <span style={{ fontSize: 12, color: T.g400, marginLeft: "auto" }}>배출계수 {EFS2} tCO₂eq/MWh</span>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16 }}>
          {[0, 6].map(start => (
            <div key={start}>
              {[...Array(6)].map((_, idx) => {
                const i = start + idx;
                const v = data[i] || "";
                const kwh = parseFloat(v) || 0;
                total += kwh;
                const highlight = ce && ud !== "all" && !v;
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                    <span style={{ fontSize: 12, fontWeight: 500, color: T.g500, width: 30 }}>{MO[i]}</span>
                    <input type="number" value={v} disabled={!ce}
                      onChange={e => set(i, parseFloat(e.target.value) || 0)}
                      placeholder={highlight ? "입력" : "0"}
                      style={{
                        flex: 1, padding: "7px 10px", borderRadius: 6,
                        border: highlight ? `2px solid ${T.rose}` : `1px solid ${T.g200}`,
                        fontSize: 13, textAlign: "right", fontWeight: 500,
                        background: ce ? T.white : T.g50, opacity: ce ? 1 : 0.5
                      }} />
                    <span style={{ fontSize: 11, color: T.g400, width: 30 }}>kWh</span>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
        <div style={{ marginTop: 16, padding: 14, background: T.g50, borderRadius: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: 13, color: T.g500 }}>연간 합계</span>
            <span style={{ fontSize: 15, fontWeight: 700, color: T.g900 }}>
              {total.toLocaleString()} kWh · {(total * EFS2 / 1000).toFixed(2)} tCO₂eq
            </span>
          </div>
        </div>
      </div>
    );
  };

  const parseExcel = (wb) => {
    try {
      // ━━━ 포맷 A: 월별 시계열 인벤토리 툴 (전력 칼럼 자동 추출) ━━━
      const sheetA = wb.SheetNames.find(n => n.includes("활동도") || n.includes("1 활동"));
      if (sheetA) {
        const ws = wb.Sheets[sheetA];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        
        // 유효 데이터 있는 가장 최근 연도 찾기
        const currentYear = new Date().getFullYear();
        const candidateRows = [];
        for (let i = 15; i < Math.min(150, rows.length); i++) {
          const r = rows[i] || [];
          const yr = parseInt(r[1]);
          if (!isNaN(yr) && yr >= 2020 && yr <= currentYear + 1 && String(r[1]).trim() === String(yr)) {
            let hasData = false;
            const unitRow = rows[8] || [];
            for (let c = 2; c < r.length; c++) {
              const val = parseFloat(r[c]);
              const unit = String(unitRow[c] || "");
              if (val > 0 && unit !== "원" && unit !== "천원") { hasData = true; break; }
            }
            if (hasData) candidateRows.push({ row: i, year: yr });
          }
        }
        
        const annualRow = candidateRows.length > 0 
          ? candidateRows.reduce((max, c) => c.year > max.year ? c : max).row 
          : -1;
        
        if (annualRow > 0) {
          const fuelNameRow = rows[4] || [];
          const unitRow = rows[8] || [];
          const valRow = rows[annualRow] || [];
          
          let totalKwh = 0;
          for (let c = 2; c < valRow.length; c++) {
            const fuelName = String(fuelNameRow[c] || "");
            const unit = String(unitRow[c] || "");
            const val = parseFloat(valRow[c]);
            if (!val) continue;
            if (fuelName.includes("전력") && unit === "kWh") {
              totalKwh += val;
            }
          }
          
          if (totalKwh > 0) {
            return {
              message: `✅ 월별 시계열 인벤토리 포맷 인식 완료 (${String(rows[annualRow][1])}년)`,
              preview: `연간 전력 사용량: ${totalKwh.toLocaleString()} kWh\n= ${(totalKwh/1000).toFixed(2)} MWh\n= ${(totalKwh/1000 * EFS2).toFixed(2)} tCO₂eq (배출계수 ${EFS2})`,
              apply: () => {
                set("yearly_val", totalKwh);
                set("input_type", "kWh");
                setMode("yearly");
              }
            };
          }
        }
      }
      
      // ━━━ 포맷 B: 공급망 가치사슬 관리 툴 (Scope1&2 시트) ━━━
      const sheetB = wb.SheetNames.find(n => n.includes("Scope1&2") || n.includes("Scope 1&2") || (n.includes("Scope2") && !n.includes("EF")));
      if (sheetB) {
        const ws = wb.Sheets[sheetB];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        
        // 헤더에 "전력" 또는 kWh 행 찾기
        let totalKwh = 0;
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i] || [];
          for (let j = 0; j < r.length; j++) {
            const cell = String(r[j] || "");
            if (cell.includes("전력") || cell.includes("외부 전기") || cell.includes("구매전력")) {
              // 같은 행에서 kWh/MWh 값 찾기
              for (let k = j + 1; k < r.length; k++) {
                const val = parseFloat(r[k]);
                if (!isNaN(val) && val > 100) {
                  // 단위 열 확인
                  const unitCellValue = String(r[k+1] || "").trim();
                  if (unitCellValue.toLowerCase().includes("kwh")) totalKwh += val;
                  else if (unitCellValue.toLowerCase().includes("mwh")) totalKwh += val * 1000;
                  break;
                }
              }
            }
          }
        }
        
        if (totalKwh > 0) {
          return {
            message: `✅ 공급망 가치사슬 관리 툴 포맷 인식 완료`,
            preview: `연간 전력 사용량: ${totalKwh.toLocaleString()} kWh\n= ${(totalKwh/1000).toFixed(2)} MWh\n= ${(totalKwh/1000 * EFS2).toFixed(2)} tCO₂eq`,
            apply: () => {
              set("yearly_val", totalKwh);
              set("input_type", "kWh");
              setMode("yearly");
            }
          };
        }
      }
      
      // ━━━ 포맷 C: 한전 사이버지점 / 월별 일반 ━━━
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
      
      // 월 행 찾기 + kWh 열 찾기
      let monthCol = -1, kwhCol = -1, headerRow = -1;
      for (let i = 0; i < Math.min(15, rows.length); i++) {
        const row = rows[i] || [];
        for (let j = 0; j < row.length; j++) {
          const cell = String(row[j] || "").trim();
          if (cell.includes("청구년월") || cell === "년월" || cell === "월" || cell.includes("사용월")) monthCol = j;
          if (cell.includes("kWh") || cell.includes("사용량") || cell.includes("사용전력")) kwhCol = j;
        }
        if (monthCol >= 0 && kwhCol >= 0) { headerRow = i; break; }
      }
      
      if (kwhCol < 0) return { 
        error: "전력 데이터를 찾을 수 없습니다.\n\n지원 포맷:\n① 월별 시계열 인벤토리 포맷 ('활동도 입력' 시트)\n② 공급망 가치사슬 관리 툴 포맷\n③ 한전 사이버지점/한전ON 다운로드 (청구년월·사용량)\n④ 범용 [월 | 사용량(kWh)] 형식" 
      };
      
      // 12개월 데이터 추출
      const monthly = new Array(12).fill(null);
      for (let i = headerRow + 1; i < rows.length; i++) {
        const row = rows[i] || [];
        const kwh = parseFloat(row[kwhCol]);
        if (!kwh) continue;
        
        let monthNum = -1;
        if (monthCol >= 0) {
          const m = String(row[monthCol]).match(/2\d{3}[-.\s]*?(\d{1,2})|(\d{1,2})월/);
          if (m) monthNum = parseInt(m[1] || m[2]) - 1;
        }
        if (monthNum < 0 || monthNum > 11) monthNum = monthly.findIndex(v => v === null);
        if (monthNum >= 0 && monthNum < 12) monthly[monthNum] = kwh;
      }
      
      const count = monthly.filter(v => v).length;
      if (count === 0) return { error: "월별 데이터를 찾을 수 없습니다." };
      
      return {
        message: `✅ 월별 전력 데이터 인식 완료 (${count}개월)`,
        preview: monthly.map((v, i) => v ? `${MO[i]}: ${v.toLocaleString()} kWh` : `${MO[i]}: -`).join("\n"),
        apply: () => {
          monthly.forEach((v, i) => { if (v) set(i, v); });
          setMode("monthly");
        }
      };
    } catch (e) {
      return { error: "엑셀 파싱 오류: " + e.message };
    }
  };

  return (
    <div>
      <InputTabs mode={mode} onChange={setMode}/>
      {mode === "yearly" && renderYearly()}
      {mode === "monthly" && renderMonthly()}
      {mode === "excel" && (
        <ExcelUpload
          hint="업체에서 이미 쓰던 엑셀 그대로 올리세요. 자동으로 포맷 감지합니다."
          expectedFormat={"✅ 지원 포맷:\n① 월별 시계열 인벤토리 포맷 — '활동도 입력' 시트에서 전력 사용량 자동 추출\n② 공급망 가치사슬 관리 툴 포맷 — 사업장별 전력 사용 데이터\n③ 한전 사이버지점/한전ON 다운로드 — 청구년월 + 사용량(kWh) 표\n④ 범용 — [월 | 사용량(kWh)] 형식 엑셀"}
          onParse={parseExcel}
        />
      )}
    </div>
  );
}

function Scope3P({ data, set, ud }) {
  const [mode, setMode] = useState("yearly");
  const ce = d => ud === "all" || ud === d;

  const renderYearly = () => {
    return (
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
        <div style={{ padding: "14px 20px", borderBottom: `1px solid ${T.g100}`, background: T.g50 }}>
          <p style={{ fontSize: 13, color: T.g600, lineHeight: 1.6 }}>
            💡 카테고리별 연간 지출 총액을 <strong>백만원 단위</strong>로 입력하세요.
            회계 시스템이나 매입처 집계 자료에서 숫자 확인.
          </p>
        </div>
        <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
          <thead><tr style={{ borderBottom: `1px solid ${T.g200}` }}>
            {["카테고리", "항목", "담당", "비용 (백만원)", "배출계수", "배출량 (tCO₂eq)"].map(h =>
              <th key={h} style={{ padding: "12px 14px", textAlign: ["항목","카테고리","담당"].includes(h) ? "left" : "right", fontSize: 12, fontWeight: 600, color: T.g500 }}>{h}</th>
            )}
          </tr></thead>
          <tbody>{S3.map((c, i) => {
            const mine = ce(c.dept);
            const cost = data[c.id] || 0;
            const em = c.ef ? cost * c.ef : 0;
            const needInput = mine && ud !== "all" && !cost && c.id !== "c7";
            return <tr key={c.id} style={{ borderBottom: i < S3.length - 1 ? `1px solid ${T.g100}` : "none", opacity: mine ? 1 : 0.5, background: needInput ? '#fff5f5' : "transparent" }}>
              <td style={{ padding: "10px 14px", fontSize: 12, color: T.g500 }}>{c.c}</td>
              <td style={{ padding: "10px 14px", fontWeight: 500, color: T.g800 }}>{c.name}</td>
              <td style={{ padding: "10px 14px", fontSize: 12, color: T.g500 }}>{DEPTS[c.dept].name.split(" · ")[0]}</td>
              <td style={{ padding: "6px 4px", textAlign: "right" }}>
                {c.id === "c7" ? <span style={{ fontSize: 12, color: T.g400 }}>별도 산정</span> :
                  <input type="number" value={data[c.id] || ""} disabled={!mine} onChange={e => set(c.id, parseFloat(e.target.value) || 0)}
                    placeholder={needInput ? "입력" : "0"}
                    style={{ width: 120, padding: "8px 12px", borderRadius: 6, border: needInput ? `2px solid ${T.rose}` : `1px solid ${T.g200}`, background: mine ? T.white : T.g50, color: T.g900, textAlign: "right", fontSize: 14, opacity: mine ? 1 : 0.5, fontWeight: 600 }} />}
              </td>
              <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 12, color: T.g500 }}>{c.ef || "-"}</td>
              <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: T.g900, fontFeatureSettings: "'tnum'" }}>{em.toFixed(1)}</td>
            </tr>;
          })}</tbody>
        </table>
      </div>
    );
  };

  const parseExcel = (wb) => {
    try {
      const parsed = {};
      let formatDetected = "";
      
      // ━━━ 포맷 A: 고객사 공식 Scope 3 템플릿 (Category 1~15 시트 분리) ━━━
      // 특징: 시트명 "Category 1", "Category 2" ... 카테고리별로 시트 분리
      const categorySheets = wb.SheetNames.filter(n => /^Category\s*\d+$/i.test(n.trim()));
      if (categorySheets.length >= 5) {
        formatDetected = "카테고리별 시트 분리 포맷";
        const catMap = { 1: "c1", 2: "c2", 4: "c4", 5: "c5", 6: "c6", 7: "c7" };
        
        for (const sn of categorySheets) {
          const catNum = parseInt(sn.match(/\d+/)[0]);
          const catId = catMap[catNum];
          if (!catId) continue;
          
          const ws = wb.Sheets[sn];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
          
          // "GHG Emission" 또는 "tCO2eq" 포함 셀의 "계" 행에서 값 추출
          // 또는 "비용 기반" 또는 "Spend-based" 섹션에서 지출 비용 합산
          let totalTco2 = 0;
          let totalCost = 0;
          
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i] || [];
            const firstCol = String(r[0] || "");
            // "계" 행에서 tCO2eq 값 찾기
            if (firstCol.trim() === "계") {
              for (let j = 0; j < r.length; j++) {
                const v = parseFloat(r[j]);
                if (!isNaN(v) && v > 0 && v < 1e9) {
                  // GHG Emission이 들어간 열인지 확인
                  const hdr = rows.slice(0, i).reverse().find(row => row && row.some(c => String(c || "").includes("GHG Emission")));
                  if (hdr) {
                    const emCol = hdr.findIndex(c => String(c || "").includes("GHG Emission"));
                    if (emCol === j) { totalTco2 += v; break; }
                  }
                }
              }
            }
            // "지출 비용" 또는 "백만원" 행에서 값 합산 (비용 기반 섹션)
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "");
              if (cell.includes("지출 비용") || cell.includes("Spend")) {
                // 같은 행에서 숫자 찾기
                for (let k = j + 1; k < r.length; k++) {
                  const v = parseFloat(r[k]);
                  if (!isNaN(v) && v > 0) { totalCost += v; break; }
                }
              }
            }
          }
          
          // 비용 기반 섹션에서 직접 합계 추출
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i] || [];
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "");
              if ((cell.includes("지출 비용") && cell.includes("백만원")) || cell === "계") {
                const next = rows[i + 1];
                // 이 열에 있는 숫자들 합산 시도
                const headerRowIdx = i;
                for (let r2 = i + 1; r2 < Math.min(i + 50, rows.length); r2++) {
                  const dataRow = rows[r2] || [];
                  const v = parseFloat(dataRow[j]);
                  if (!isNaN(v) && v > 0 && v < 1e9) totalCost += v;
                }
                break;
              }
            }
          }
          
          if (totalCost > 0 && !parsed[catId]) {
            parsed[catId] = Math.round(totalCost * 10) / 10;
          }
        }
      }
      
      // ━━━ 포맷 B: 공급망 Scope3 통합 시트 (카테고리 세로 나열) ━━━
      // 특징: 시트명 "Scope3", 카테고리 1~15를 한 시트에 세로로 나열
      if (Object.keys(parsed).length === 0) {
        const sheetB = wb.SheetNames.find(n => n.includes("Scope3") || n.includes("Scope 3"));
        if (sheetB) {
          const ws = wb.Sheets[sheetB];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
          
          let hdrRow = -1, catCol = -1, emCol = -1;
          for (let i = 0; i < Math.min(20, rows.length); i++) {
            const r = rows[i] || [];
            for (let j = 0; j < r.length; j++) {
              const cell = String(r[j] || "").trim();
              if (cell.includes("카테고리") || cell.includes("Scope 3 카테고리")) { catCol = j; hdrRow = i; }
              if (cell.includes("배출량") && cell.includes("tCO2")) emCol = j;
            }
            if (hdrRow >= 0 && emCol >= 0) break;
          }
          
          if (hdrRow >= 0) {
            formatDetected = "공급망 Scope3 통합 시트 포맷";
            const catMap = {
              "1. 구매": "c1", "2. 구매한 자본재": "c2", "2. 자본재": "c2",
              "4. 업스트림": "c4", "5. 운영중 폐기물": "c5", "5. 폐기물": "c5",
              "6. 임직원 출장": "c6", "6. 출장": "c6", "7. 임직원 출퇴근": "c7", "7. 통근": "c7"
            };
            
            for (let i = hdrRow + 1; i < Math.min(hdrRow + 25, rows.length); i++) {
              const r = rows[i] || [];
              const catName = String(r[catCol] || "").trim();
              if (!catName || catName.includes("예시")) continue;
              
              const emission = parseFloat(r[emCol]);
              if (!emission) continue;
              
              for (const [key, id] of Object.entries(catMap)) {
                if (catName.startsWith(key.split(". ")[0] + ".") || catName.includes(key.split(". ")[1] || "")) {
                  // 이미 배출량 tCO2eq이므로 역산: 비용(백만원) = 배출량 / 배출계수
                  const cat = S3.find(c => c.id === id);
                  if (cat && cat.ef) {
                    parsed[id] = Math.round(emission / cat.ef * 10) / 10;
                  } else if (id === "c7") {
                    // 통근은 ef null이므로 배출량을 비용처럼 저장
                    parsed[id] = Math.round(emission * 10) / 10;
                  }
                  break;
                }
              }
            }
          }
        }
      }
      
      // ━━━ 포맷 C: 일반 매입처 집계 엑셀 (키워드 분류) ━━━
      if (Object.keys(parsed).length === 0) {
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        
        let catCol = -1, costCol = -1, headerRow = -1;
        for (let i = 0; i < Math.min(10, rows.length); i++) {
          const row = rows[i] || [];
          for (let j = 0; j < row.length; j++) {
            const cell = String(row[j] || "").trim();
            if (cell.includes("카테고리") || cell.includes("구분") || cell.includes("거래처") || cell.includes("품목")) catCol = j;
            if (cell.includes("비용") || cell.includes("금액") || cell.includes("지출")) costCol = j;
          }
          if (catCol >= 0 && costCol >= 0) { headerRow = i; break; }
        }
        
        if (costCol >= 0) {
          formatDetected = "매입처 집계 (키워드 자동 분류)";
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i] || [];
            const cat = String(row[catCol] || "").trim();
            const cost = parseFloat(row[costCol]);
            if (!cat || !cost) continue;
            
            let catId = null;
            if (cat.includes("원재료") || cat.includes("원부자재") || cat.includes("부품") || cat.includes("Cat.1") || cat.includes("구매")) catId = "c1";
            else if (cat.includes("설비") || cat.includes("기계") || cat.includes("자본재") || cat.includes("Cat.2")) catId = "c2";
            else if (cat.includes("운송") || cat.includes("물류") || cat.includes("배송") || cat.includes("Cat.4")) catId = "c4";
            else if (cat.includes("폐기") || cat.includes("처리") || cat.includes("Cat.5")) catId = "c5";
            else if (cat.includes("출장") || cat.includes("항공") || cat.includes("숙박") || cat.includes("Cat.6")) catId = "c6";
            
            if (catId) {
              const costInMil = cost >= 1000000 ? cost / 1000000 : cost;
              parsed[catId] = (parsed[catId] || 0) + costInMil;
            }
          }
        }
      }
      
      const count = Object.keys(parsed).length;
      if (count === 0) {
        return { 
          error: "Scope 3 데이터를 찾을 수 없습니다.\n\n지원 포맷:\n① 카테고리별 시트 분리 포맷 — 'Category 1' ~ 'Category 15' 시트\n② 공급망 Scope3 통합 시트 포맷 — 'Scope3' 시트에 카테고리별 배출량 표\n③ 매입처 집계 — [카테고리/거래처][비용] 형식, 키워드 자동 분류" 
        };
      }
      
      return {
        message: `✅ ${formatDetected} 인식 완료 (${count}개 카테고리)`,
        preview: Object.entries(parsed).map(([k, v]) => {
          const cat = S3.find(c => c.id === k);
          return `• ${cat?.c} ${cat?.name}: ${v.toLocaleString(undefined, {maximumFractionDigits: 1})} 백만원`;
        }).join("\n"),
        apply: () => {
          Object.entries(parsed).forEach(([k, v]) => set(k, v));
        }
      };
    } catch (e) {
      return { error: "엑셀 파싱 오류: " + e.message };
    }
  };

  return (
    <div>
      <InputTabs mode={mode} onChange={setMode}/>
      {(mode === "yearly" || mode === "monthly") && renderYearly()}
      {mode === "excel" && (
        <ExcelUpload
          hint="고객사 요청 템플릿이나 회계 자료 그대로 올리세요"
          expectedFormat={"✅ 지원 포맷:\n① 카테고리별 시트 분리 포맷 — 'Category 1' ~ 'Category 15' 시트가 각각 있는 엑셀, 각 시트의 비용 기반 산정 섹션 자동 추출\n② 공급망 Scope3 통합 시트 포맷 — 'Scope3' 시트에 카테고리 1~15가 세로로 나열된 표\n③ 매입처 집계 — 키워드로 자동 분류 (원재료→Cat.1, 설비→Cat.2, 운송→Cat.4, 폐기→Cat.5, 출장→Cat.6)"}
          onParse={parseExcel}
        />
      )}
    </div>
  );
}

function TableInput({ value, onChange, disabled }) {
  const rows = value || [{}];
  const cols = ["항목", "2024 실적", "2025 계획", "단위", "비고"];
  return (
    <div>
      <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
        <thead><tr>{cols.map((c,i) =>
          <th key={i} style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.g500, fontSize: 12, borderBottom: `1px solid ${T.g200}` }}>{c}</th>
        )}<th style={{width:28}}/></tr></thead>
        <tbody>{rows.map((row, ri) => (
          <tr key={ri}>{cols.map((_, ci) => (
            <td key={ci} style={{ padding: "3px 3px" }}>
              <input type="text" value={row[ci] || ""} disabled={disabled}
                onChange={e => {
                  const newRows = [...rows];
                  if (!newRows[ri]) newRows[ri] = {};
                  newRows[ri] = { ...newRows[ri], [ci]: e.target.value };
                  onChange(newRows);
                }}
                style={{ width: "100%", padding: "7px 10px", borderRadius: 6, border: `1px solid ${T.g200}`, background: disabled ? T.g50 : T.white, color: T.g800, fontSize: 13, opacity: disabled ? 0.5 : 1 }} />
            </td>
          ))}<td>{!disabled && ri > 0 && (
            <button onClick={() => {
              const newRows = [...rows]; newRows.splice(ri, 1); onChange(newRows);
            }} style={{ background: "none", border: "none", color: T.g400, cursor: "pointer", fontSize: 16 }}>×</button>
          )}</td></tr>
        ))}</tbody>
      </table>
      {!disabled && <button onClick={() => onChange([...rows, {}])}
        style={{ marginTop: 6, fontSize: 12, fontWeight: 500, color: T.g500, background: "none", border: `1px dashed ${T.g300}`, padding: "5px 12px", borderRadius: 6, cursor: "pointer" }}>+ 행 추가</button>}
    </div>
  );
}

function BlockPanel({ standard, blocks, blockData, setBlockData, scopeData, setS1, setS2, setS3, ud, isAdmin, griMap, vsmeMap }) {
  const [exOpen, setExOpen] = useState({});
  const [otherOpen, setOtherOpen] = useState(false);
  const ce = d => ud === "all" || ud === d;

  const isScope = b => ['scope1_table','scope2_table','scope3_table'].includes(b.input_type);
  const myBlocks = blocks.filter(b => isScope(b) || ce(b.default_dept));
  const otherBlocks = blocks.filter(b => !isScope(b) && !ce(b.default_dept));

  const renderBlock = (block, isMine) => {
    const v = blockData[block.id];
    const ok = isMine;
    const griCodes = (griMap[block.id] || []).join(", ");
    const vsmeCodes = (vsmeMap[block.id] || []).join(", ");

    // Scope 블록 (기존 컴포넌트 재활용)
    if (block.input_type === 'scope1_table' || block.input_type === 'scope2_table' || block.input_type === 'scope3_table') {
      let child;
      let scopeNeedInput = false;
      if (block.input_type === 'scope1_table') {
        child = <Scope1P data={scopeData.s1} set={setS1} ud={ud}/>;
        const myFuels = [...SF, ...MF].filter(f => ud === 'all' || f.dept === ud);
        scopeNeedInput = myFuels.length > 0 && myFuels.every(f => !scopeData.s1[f.id]);
      } else if (block.input_type === 'scope2_table') {
        child = <Scope2P data={scopeData.s2} set={setS2} ud={ud}/>;
        scopeNeedInput = (ud === 'all' || ud === 'admin') && !Object.values(scopeData.s2 || {}).some(v => v);
      } else {
        child = <Scope3P data={scopeData.s3} set={setS3} ud={ud}/>;
        const myCat = S3.filter(c => c.id !== 'c7' && (ud === 'all' || c.dept === ud));
        scopeNeedInput = myCat.length > 0 && myCat.every(c => !scopeData.s3[c.id]);
      }
      const scopeHighlight = scopeNeedInput && ud !== 'all';
      return (
        <div key={block.id} style={{ background: scopeHighlight ? '#fff5f5' : T.white, borderRadius: 12, border: scopeHighlight ? `1px solid ${T.rose}44` : `1px solid ${T.g200}`, overflow: "hidden", borderLeft: scopeHighlight ? `3px solid ${T.rose}` : `3px solid ${T.g900}` }}>
          <div style={{ padding: "16px 24px", borderBottom: `1px solid ${T.g100}` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              {scopeHighlight && <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: T.rose, padding: "3px 10px", borderRadius: 4, letterSpacing: "0.03em" }}>✍ 입력 필요</span>}
              <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>{block.title}</span>
              {griCodes && <span style={{ fontSize: 11, color: T.g400 }}>📊 GRI {griCodes}</span>}
              {vsmeCodes && <span style={{ fontSize: 11, color: T.g400 }}>📋 VSME {vsmeCodes}</span>}
            </div>
            <p style={{ fontSize: 13, color: T.g500, marginTop: 6 }}>{block.guide}</p>
          </div>
          <div style={{ padding: 24 }}>{child}</div>
        </div>
      );
    }

    // text/table 블록
    const done = block.input_type === "text"
      ? (v?.content_text && v.content_text.length > 10)
      : (v?.content_json && v.content_json.length > 0 && v.content_json.some(r => Object.values(r||{}).some(x => x)));

    const needInput = isMine && !done && ud !== "all";
    const leftBorder = !isMine ? "1px solid " + T.g200
                     : done ? `3px solid ${T.emerald}`
                     : `3px solid ${T.rose}`;
    const cardBg = needInput ? '#fff5f5' : T.white;

    return (
      <div key={block.id} style={{ background: cardBg, borderRadius: 12, border: needInput ? `1px solid ${T.rose}44` : `1px solid ${T.g200}`, overflow: "hidden", borderLeft: leftBorder, opacity: isMine ? 1 : 0.55 }}>
        <div style={{ padding: "16px 24px", borderBottom: `1px solid ${T.g100}`, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            {needInput && <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: T.rose, padding: "3px 10px", borderRadius: 4, letterSpacing: "0.03em" }}>✍ 입력 필요</span>}
            {isMine && done && ud !== "all" && <span style={{ fontSize: 11, fontWeight: 600, color: T.emerald, background: T.emeraldBg, padding: "3px 10px", borderRadius: 4 }}>✓ 완료</span>}
            {block.critical && !done && <span style={{ fontSize: 11, fontWeight: 700, color: T.rose }}>⚠ 필수</span>}
            <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>{block.title}</span>
            <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>{DEPTS[block.default_dept]?.name || block.default_dept}</span>
          </div>
          {(isMine || isAdmin) && <button onClick={() => setExOpen(p => ({...p, [block.id]: !p[block.id]}))}
            style={{ fontSize: 12, fontWeight: 500, color: exOpen[block.id] ? T.g600 : T.g400, background: "none", border: `1px solid ${T.g200}`, padding: "5px 12px", borderRadius: 6, cursor: "pointer" }}>
            {exOpen[block.id] ? "닫기" : "예시 보기"}
          </button>}
        </div>

        {(isMine || isAdmin) && (
          <>
            <div style={{ padding: "10px 24px", background: T.g50 }}>
              <p style={{ fontSize: 13, color: T.g500, lineHeight: 1.6 }}>{block.guide}</p>
              <div style={{ display: "flex", gap: 12, marginTop: 6, flexWrap: "wrap" }}>
                {griCodes && <span style={{ fontSize: 11, color: T.g400 }}>📊 GRI {griCodes}</span>}
                {vsmeCodes && <span style={{ fontSize: 11, color: T.g400 }}>📋 VSME {vsmeCodes}</span>}
              </div>
            </div>

            {exOpen[block.id] && block.example && (
              <div style={{ margin: "12px 24px 0", padding: "16px 20px", background: T.g50, borderRadius: 8, borderLeft: `2px solid ${T.g300}` }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: T.g500, marginBottom: 8 }}>베스트 프랙티스 예시</p>
                <p style={{ fontSize: 13, color: T.g600, lineHeight: 1.8 }}>{block.example}</p>
                {block.input_type === "text" && ok && (
                  <button onClick={() => setBlockData(block.id, { content_text: block.example })}
                    style={{ marginTop: 10, fontSize: 12, fontWeight: 500, color: T.g600, background: T.white, border: `1px solid ${T.g300}`, padding: "6px 14px", borderRadius: 6, cursor: "pointer" }}>
                    이 예시 기반으로 작성
                  </button>
                )}
              </div>
            )}

            <div style={{ padding: "16px 24px" }}>
              {block.input_type === "text" ? (
                <div>
                  <textarea value={v?.content_text || ""} disabled={!ok && !isAdmin} rows={5}
                    onChange={e => setBlockData(block.id, { content_text: e.target.value })}
                    placeholder={block.placeholder}
                    style={{ width: "100%", padding: "12px 16px", borderRadius: 8, border: `1px solid ${T.g200}`, background: (ok||isAdmin) ? T.white : T.g50, color: T.g800, fontSize: 14, lineHeight: 1.8, resize: "vertical", opacity: (ok||isAdmin) ? 1 : 0.5 }} />
                  <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 4 }}>
                    <span style={{ fontSize: 11, color: T.g400 }}>{(v?.content_text || "").length}자</span>
                  </div>
                </div>
              ) : (
                <TableInput
                  value={v?.content_json || [{}]}
                  onChange={rows => setBlockData(block.id, { content_json: rows })}
                  disabled={!ok && !isAdmin}
                />
              )}
            </div>
          </>
        )}

        {!isMine && !isAdmin && done && (
          <div style={{ padding: "12px 24px", background: T.g50 }}>
            <p style={{ fontSize: 12, color: T.g400 }}>작성 완료</p>
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.g400 }}>{standard.category}</span>
          <span style={{ color: T.g300 }}>·</span>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>{standard.title}</h2>
        </div>
        <p style={{ fontSize: 14, color: T.g500 }}>{standard.description}</p>
      </div>

      {ud !== "all" && myBlocks.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <p style={{ fontSize: 12, fontWeight: 600, color: T.g500, marginBottom: 12, letterSpacing: "0.04em" }}>내 담당 항목 ({myBlocks.length})</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {myBlocks.map(b => renderBlock(b, true))}
          </div>
        </div>
      )}

      {ud !== "all" && otherBlocks.length > 0 && (
        <div>
          <button onClick={() => setOtherOpen(!otherOpen)}
            style={{ fontSize: 12, fontWeight: 500, color: T.g400, background: "none", border: "none", cursor: "pointer", padding: "8px 0", display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 10, transform: otherOpen ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s", display: "inline-block" }}>▶</span>

          </button>
          {otherOpen && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 4 }}>
              {otherBlocks.map(b => renderBlock(b, false))}
            </div>
          )}
        </div>
      )}

      {ud === "all" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {blocks.map(b => renderBlock(b, true))}
        </div>
      )}
    </div>
  );
}

function Dash({ scopeData, blockData, blocks, standards }) {
  // Scope 1: 연간 + 월별 합산, 단위 환산 적용
  let s1total = 0;
  [...SF, ...MF].forEach(f => {
    const val = scopeData.s1[f.id] || 0;
    const uk = scopeData.s1[f.id + "_unit"] || (f.units?.[0]?.key);
    const unit = (f.units || []).find(u => u.key === uk) || f.units?.[0];
    const baseAmt = (parseFloat(val) || 0) * (unit?.factor || 1);
    s1total += calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
    // 월별도 추가
    const monthly = scopeData.s1["_monthly_" + f.id];
    if (monthly && Array.isArray(monthly)) {
      const sum = monthly.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      s1total += calc(sum * (unit?.factor || 1), f.ncv, f.co2, f.ch4, f.n2o).t;
    }
  });
  
  // Scope 2: 연간 또는 월별
  let s2total = 0;
  const yearlyVal = scopeData.s2.yearly_val;
  if (yearlyVal) {
    const inputType = scopeData.s2.input_type || "kWh";
    const kwh = inputType === "원" ? (parseFloat(yearlyVal) || 0) / 165 : (parseFloat(yearlyVal) || 0);
    s2total = (kwh / 1000) * EFS2;
  } else {
    for (let i = 0; i < 12; i++) s2total += ((scopeData.s2[i] || 0) / 1000) * EFS2;
  }
  
  // Scope 3
  let s3total = 0;
  S3.forEach(c => { if (c.ef) s3total += (scopeData.s3[c.id] || 0) * c.ef; });
  const grand = s1total + s2total + s3total;

  const totalBlocks = blocks.length;
  const isDone = (b) => {
    if (b.input_type === 'scope1_table') {
      return [...SF, ...MF].some(f => scopeData.s1[f.id]) ||
             Object.keys(scopeData.s1).some(k => k.startsWith("_monthly_") && Array.isArray(scopeData.s1[k]) && scopeData.s1[k].some(v => v));
    }
    if (b.input_type === 'scope2_table') {
      return scopeData.s2.yearly_val || Object.keys(scopeData.s2).some(k => !isNaN(parseInt(k)) && scopeData.s2[k]);
    }
    if (b.input_type === 'scope3_table') return S3.some(c => c.id !== 'c7' && scopeData.s3[c.id]);
    const v = blockData[b.id];
    if (b.input_type === 'text') return v?.content_text && v.content_text.length > 10;
    return v?.content_json && v.content_json.length > 0 && v.content_json.some(r => Object.values(r||{}).some(x => x));
  };
  const doneBlocks = blocks.filter(isDone).length;
  const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;

  return <div>
    <div style={{ marginBottom: 28 }}>
      <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>Dashboard</h2>
      <p style={{ fontSize: 14, color: T.g500, marginTop: 2 }}>2025년 온실가스 배출량 및 GRI 작성 현황</p>
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 16 }}>
      <KPI label="총 배출량" value={grand} unit="tCO₂eq" />
      <KPI label="Scope 1" value={s1total} unit="tCO₂eq · 직접배출" />
      <KPI label="Scope 2" value={s2total} unit="tCO₂eq · 전력" />
      <KPI label="Scope 3" value={s3total} unit="tCO₂eq · 공급망" />
    </div>
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>전체 입력 진행률</span>
        <span style={{ fontSize: 24, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{pct}%</span>
      </div>
      <Bar pct={pct} color={T.g900} h={6}/>
      <div style={{ marginTop: 16 }}>
        {standards.map(s => {
          const sBlocks = blocks.filter(b => b.gri_code === s.code);
          const sDone = sBlocks.filter(isDone).length;
          const p = sBlocks.length ? Math.round(sDone / sBlocks.length * 100) : 0;
          return <div key={s.code} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
            <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 200 }}>{s.title}</span>
            <div style={{ flex: 1 }}><Bar pct={p} color={T.g500} h={4}/></div>
            <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{sDone}/{sBlocks.length}</span>
          </div>;
        })}
      </div>
    </div>
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24 }}>
      <span style={{ fontSize: 14, fontWeight: 600, color: T.g800, display: "block", marginBottom: 16 }}>부서별 담당 항목 진행률</span>
      {Object.entries(DEPTS).map(([k, d]) => {
        const deptBlocks = blocks.filter(b => b.default_dept === k);
        if (!deptBlocks.length) return null;
        const deptDone = deptBlocks.filter(isDone).length;
        const p = Math.round(deptDone / deptBlocks.length * 100);
        return <div key={k} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 120 }}>{d.name.split(" · ")[0]}</span>
          <div style={{ flex: 1 }}><Bar pct={p} color={d.color} h={4}/></div>
          <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{deptDone}/{deptBlocks.length}</span>
        </div>;
      })}
    </div>
  </div>;
}

function App() {
  const [user, setUser] = useState(null);
  const [pg, setPg] = useState("dash");
  const [scopeData, setScopeData] = useState({ s1: {}, s2: {}, s3: {} });
  const [blockData, setBlockDataState] = useState({});
  const [standards, setStandards] = useState([]);
  const [blocks, setBlocks] = useState([]);
  const [griMap, setGriMap] = useState({});
  const [vsmeMap, setVsmeMap] = useState({});
  const [saving, setSaving] = useState(false);
  const [loaded, setLoaded] = useState(false);

  const SB_URL = "https://jwveemnpjsxzpjmeuggw.supabase.co";
  const SB_KEY = "sb_publishable_fehbLAN41_B_-ArqmJbX1w_zgw4kxxg";

  const sbFetch = useCallback(async (path, opts = {}) => {
    const res = await fetch(SB_URL + "/rest/v1/" + path, {
      ...opts,
      headers: {
        "apikey": SB_KEY,
        "Authorization": "Bearer " + SB_KEY,
        "Content-Type": "application/json",
        "Prefer": opts.method === "PATCH" ? "return=minimal" : "return=representation",
        ...(opts.headers || {}),
      },
    });
    if (!res.ok) { console.error("Supabase error:", res.status, await res.text()); return null; }
    try { return await res.json(); } catch(e) { return true; }
  }, []);

  const loadAll = useCallback(async () => {
    try {
      const rows = await sbFetch("esg_data?select=category,data");
      if (rows && rows.length > 0) {
        const sd = { s1:{}, s2:{}, s3:{} };
        rows.forEach(r => {
          if (r.category === "s1") sd.s1 = r.data || {};
          else if (r.category === "s2") sd.s2 = r.data || {};
          else if (r.category === "s3") sd.s3 = r.data || {};
        });
        setScopeData(sd);
      }
      const stds = await sbFetch("gri_standards?select=*&order=display_order");
      if (stds) setStandards(stds);
      const bls = await sbFetch("input_blocks?select=*&order=display_order");
      if (bls) setBlocks(bls);
      const gms = await sbFetch("block_gri_mapping?select=block_id,gri_disclosure");
      if (gms) { const m = {}; gms.forEach(g => { (m[g.block_id] = m[g.block_id] || []).push(g.gri_disclosure); }); setGriMap(m); }
      const vms = await sbFetch("block_vsme_mapping?select=block_id,vsme_code");
      if (vms) { const m = {}; vms.forEach(v => { (m[v.block_id] = m[v.block_id] || []).push(v.vsme_code); }); setVsmeMap(m); }
      const bds = await sbFetch("block_data?select=*");
      if (bds) { const m = {}; bds.forEach(d => { m[d.block_id] = { content_text: d.content_text, content_json: d.content_json, status: d.status }; }); setBlockDataState(m); }
    } catch(e) { console.log("Load error:", e); }
    setLoaded(true);
  }, [sbFetch]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const scopeTimer = React.useRef(null);
  const saveScope = useCallback((cat, val) => {
    if (scopeTimer.current) clearTimeout(scopeTimer.current);
    setSaving(true);
    scopeTimer.current = setTimeout(async () => {
      try {
        await sbFetch("esg_data?category=eq." + cat, {
          method: "PATCH",
          body: JSON.stringify({ data: val, updated_at: new Date().toISOString() }),
        });
      } catch(e) { console.log("Save error:", e); }
      setSaving(false);
    }, 800);
  }, [sbFetch]);

  const blockTimer = React.useRef(null);
  const blockPendingRef = React.useRef({});
  const setBlockData = useCallback((blockId, data) => {
    setBlockDataState(prev => {
      const merged = { ...prev, [blockId]: { ...prev[blockId], ...data } };
      blockPendingRef.current[blockId] = merged[blockId];
      return merged;
    });
    if (blockTimer.current) clearTimeout(blockTimer.current);
    setSaving(true);
    blockTimer.current = setTimeout(async () => {
      const pending = { ...blockPendingRef.current };
      blockPendingRef.current = {};
      for (const [bid, val] of Object.entries(pending)) {
        try {
          const payload = {
            block_id: bid,
            company_id: 'ycchem',
            content_text: val.content_text || null,
            content_json: val.content_json || null,
            updated_at: new Date().toISOString(),
          };
          await sbFetch("block_data", {
            method: "POST",
            body: JSON.stringify(payload),
            headers: { "Prefer": "resolution=merge-duplicates,return=minimal" }
          });
        } catch(e) { console.log("Block save error:", e); }
      }
      setSaving(false);
    }, 800);
  }, [sbFetch]);

  const setS1 = useCallback((id, v) => {
    setScopeData(d => { const n = { ...d, s1: { ...d.s1, [id]: v } }; saveScope("s1", n.s1); return n; });
  }, [saveScope]);
  const setS2 = useCallback((i, v) => {
    setScopeData(d => { const n = { ...d, s2: { ...d.s2, [i]: v } }; saveScope("s2", n.s2); return n; });
  }, [saveScope]);
  const setS3 = useCallback((id, v) => {
    setScopeData(d => { const n = { ...d, s3: { ...d.s3, [id]: v } }; saveScope("s3", n.s3); return n; });
  }, [saveScope]);

  if (!loaded) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: T.g50 }}>
      <style>{globalCSS}</style>
      <div style={{ textAlign: "center" }}>
        <p style={{ fontSize: 15, fontWeight: 600, color: T.g500 }}>데이터 로딩 중...</p>
      </div>
    </div>
  );

  if (!user) return <Login onLogin={u => { setUser(u); setPg("dash"); }}/>;
  const dept = DEPTS[user.dept] || { name: "관리자", color: T.g900 };

  return (
    <div style={{ display: "flex", minHeight: "100vh", background: T.g50 }}>
      <style>{globalCSS}</style>
      {saving && <div style={{ position: "fixed", top: 12, right: 12, zIndex: 999, fontSize: 12, fontWeight: 500, color: T.g400, background: T.white, border: `1px solid ${T.g200}`, padding: "6px 14px", borderRadius: 6 }}>저장 중...</div>}

      <div style={{ width: 240, background: T.white, borderRight: `1px solid ${T.g200}`, padding: "20px 0", display: "flex", flexDirection: "column" }}>
        <div style={{ padding: "0 20px 20px", borderBottom: `1px solid ${T.g100}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="5" fill={T.g900}/><path d="M7 8h10M7 12h7M7 16h9" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"/></svg>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: T.g900, letterSpacing: "-0.01em" }}>ESG Platform</div>
              <div style={{ fontSize: 10, color: T.g400 }}>the4thedge.com</div>
            </div>
          </div>
        </div>

        <div style={{ flex: 1, padding: "12px 10px", overflowY: "auto" }}>
          <p style={{ fontSize: 10, fontWeight: 700, color: T.g400, letterSpacing: "0.08em", padding: "8px 10px 4px", textTransform: "uppercase" }}>Overview</p>
          <button onClick={() => setPg("dash")}
            style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "none", background: pg === "dash" ? T.g100 : "transparent", color: pg === "dash" ? T.g900 : T.g500, fontSize: 13, fontWeight: pg === "dash" ? 600 : 400, textAlign: "left", cursor: "pointer", marginBottom: 2 }}>
            Dashboard
          </button>

          <p style={{ fontSize: 10, fontWeight: 700, color: T.g400, letterSpacing: "0.08em", padding: "14px 10px 4px", textTransform: "uppercase" }}>GRI 표준</p>
          {standards.map(s => (
            <button key={s.code} onClick={() => setPg("gri_" + s.code)}
              style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "none", background: pg === "gri_" + s.code ? T.g100 : "transparent", color: pg === "gri_" + s.code ? T.g900 : T.g500, fontSize: 13, fontWeight: pg === "gri_" + s.code ? 600 : 400, textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 2 }}>
              <span>{s.title.replace("GRI " + s.code + ": ", "").replace(/ 202\d/, "").replace(/ 201\d/, "")}</span>
              <span style={{ fontSize: 11, color: T.g400 }}>{s.code}</span>
            </button>
          ))}
        </div>

        <div style={{ padding: "12px 16px", borderTop: `1px solid ${T.g100}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <div style={{ width: 28, height: 28, borderRadius: 6, background: T.g200, color: T.g600, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 600 }}>{user.name[0]}</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>{user.name}</div>
              <div style={{ fontSize: 11, color: T.g400 }}>{dept.name}</div>
            </div>
          </div>
          <button onClick={() => setUser(null)}
            style={{ width: "100%", padding: "6px", borderRadius: 6, border: `1px solid ${T.g200}`, background: "none", color: T.g500, fontSize: 12, cursor: "pointer" }}>
            로그아웃
          </button>
        </div>
      </div>

      <div style={{ flex: 1, padding: "32px 40px", overflowY: "auto", maxHeight: "100vh" }}>
        {pg === "dash" && <Dash scopeData={scopeData} blockData={blockData} blocks={blocks} standards={standards}/>}
        {standards.map(s => {
          if (pg !== "gri_" + s.code) return null;
          const sBlocks = blocks.filter(b => b.gri_code === s.code);
          return <BlockPanel key={s.code} standard={s} blocks={sBlocks} blockData={blockData} setBlockData={setBlockData}
            scopeData={scopeData} setS1={setS1} setS2={setS2} setS3={setS3}
            ud={user.dept} isAdmin={user.dept === "all"} griMap={griMap} vsmeMap={vsmeMap}/>;
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
