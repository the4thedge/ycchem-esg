// ═══════════════════════════════════════════════════════════════════════
// 🎯 단계별 작성 컴포넌트 — 한 번에 항목 1개, 진행바, 뒤로/앞으로
// ═══════════════════════════════════════════════════════════════════════
function QuizLayered({ quiz, savedAnswers, savedText, onSave, disabled }) {
  const [mode, setMode] = useState(savedText ? "saved" : "quiz"); // quiz | preview | saved | manual
  const [stepIdx, setStepIdx] = useState(0);
  const [answers, setAnswers] = useState(savedAnswers || {});
  const [manualText, setManualText] = useState(savedText || "");
  const [editingStep, setEditingStep] = useState(null); // 특정 단계만 수정 중
  
  const steps = quiz.steps;
  const step = steps[stepIdx];
  const progress = Math.round(((stepIdx + 1) / steps.length) * 100);
  const canNext = step && (
    step.type === "single" ? !!answers[step.id] :
    step.type === "multi" ? (answers[step.id] || []).length > 0 : true
  );
  const isLast = stepIdx === steps.length - 1;
  
  // 답변을 사람이 읽을 수 있는 라벨로 변환
  const renderAnswer = (stepDef, ans) => {
    if (!ans) return <span style={{ color: T.g400 }}>(미선택)</span>;
    if (stepDef.type === "single") {
      const opt = stepDef.options.find(o => o.key === ans);
      return opt?.label || ans;
    }
    if (stepDef.type === "multi") {
      const labels = (ans || []).map(k => stepDef.options.find(o => o.key === k)?.label).filter(Boolean);
      return labels.length ? labels.join(", ") : <span style={{ color: T.g400 }}>(미선택)</span>;
    }
    return String(ans);
  };
  
  // 저장된 답 보기 모드 (새로운 프로세스 표시 형태)
  if (mode === "saved") {
    return (
      <div>
        {/* 헤더 */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.emerald, padding: "3px 10px", borderRadius: 4 }}>
            ✅ 작성 완료
          </span>
          <span style={{ fontSize: 11, color: T.g500 }}>{steps.length}개 항목 모두 선택됨</span>
          {!disabled && (
            <button onClick={() => { 
              setMode("quiz"); 
              setStepIdx(0); 
              setAnswers({}); 
            }}
              style={{ 
                marginLeft: "auto", fontSize: 11, color: T.rose, 
                background: T.white, border: `1px solid ${T.rose}`, 
                padding: "4px 10px", borderRadius: 4, cursor: "pointer", fontWeight: 500
              }}>
              🔄 처음부터 다시 작성
            </button>
          )}
        </div>
        
        {/* 작성 프로세스 전체 표시 */}
        <div style={{ background: T.g50, border: `1px solid ${T.g200}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: T.g600, marginBottom: 12, letterSpacing: "0.04em" }}>
            📋 작성하신 내용
          </p>
          {steps.map((s, i) => (
            <div key={s.id} style={{
              display: "flex", alignItems: "flex-start", gap: 10,
              padding: "10px 0",
              borderTop: i > 0 ? `1px solid ${T.g200}` : "none"
            }}>
              <span style={{
                flexShrink: 0, width: 22, height: 22, borderRadius: "50%",
                background: T.emerald, color: T.white, fontSize: 11, fontWeight: 700,
                display: "inline-flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 12, color: T.g500, marginBottom: 3 }}>
                  {s.question}
                </p>
                <p style={{ fontSize: 13, fontWeight: 600, color: T.g800, margin: 0 }}>
                  → {renderAnswer(s, answers[s.id])}
                </p>
              </div>
              {!disabled && (
                <button onClick={() => { 
                  setEditingStep(i); 
                  setStepIdx(i); 
                  setMode("quiz"); 
                }}
                  style={{
                    fontSize: 11, color: T.blue, background: T.blueBg,
                    border: "none", padding: "4px 10px", borderRadius: 4, 
                    cursor: "pointer", fontWeight: 500, whiteSpace: "nowrap"
                  }}>
                  ✏️ 이것만 수정
                </button>
              )}
            </div>
          ))}
        </div>
        
        {/* 검토된 문안 */}
        <div style={{ background: T.violetBg, border: `1px solid ${T.violet}33`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: T.violet }}>📝 검토된 문안</span>
            {!disabled && (
              <button onClick={() => setMode("manual")}
                style={{
                  marginLeft: "auto", fontSize: 11, color: T.g600,
                  background: T.white, border: `1px solid ${T.g300}`,
                  padding: "3px 8px", borderRadius: 4, cursor: "pointer"
                }}>
                ✏️ 내용 수정
              </button>
            )}
          </div>
          <p style={{ fontSize: 13, color: T.g800, lineHeight: 1.7, margin: 0, whiteSpace: "pre-wrap" }}>
            {savedText}
          </p>
        </div>
      </div>
    );
  }
  
  // 직접 수정 모드
  if (mode === "manual") {
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <span style={{ fontSize: 12, fontWeight: 700, color: T.g600 }}>✏️ 내용 수정</span>
          <button onClick={() => setMode(savedText ? "saved" : "quiz")}
            style={{ marginLeft: "auto", fontSize: 11, color: T.g500, background: "none", border: `1px solid ${T.g300}`, padding: "3px 8px", borderRadius: 4, cursor: "pointer" }}>
            ← 취소
          </button>
        </div>
        <textarea value={manualText} onChange={e => setManualText(e.target.value)}
          disabled={disabled} rows={8}
          style={{ width: "100%", padding: "12px 14px", borderRadius: 8, border: `1px solid ${T.g200}`, fontSize: 13, lineHeight: 1.7, fontFamily: "inherit", resize: "vertical" }}/>
        <button onClick={() => { onSave({ answers, text: manualText }); setMode("saved"); }}
          disabled={!manualText.trim()}
          style={{ marginTop: 10, padding: "8px 16px", background: T.emerald, color: T.white, border: "none", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: manualText.trim() ? "pointer" : "not-allowed", opacity: manualText.trim() ? 1 : 0.5 }}>
          💾 저장
        </button>
      </div>
    );
  }
  
  // 미리보기 모드
  if (mode === "preview") {
    const text = quiz.assemble(answers);
    return (
      <div>
        {/* 작성한 항목 요약 (미리보기에도 표시) */}
        <div style={{ background: T.g50, border: `1px solid ${T.g200}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: T.g600, marginBottom: 10, letterSpacing: "0.04em" }}>📋 작성 내용 확인</p>
          {steps.map((s, i) => (
            <div key={s.id} style={{
              padding: "8px 0",
              borderTop: i > 0 ? `1px solid ${T.g200}` : "none",
              display: "flex", gap: 10
            }}>
              <span style={{
                flexShrink: 0, width: 20, height: 20, borderRadius: "50%",
                background: T.emerald, color: T.white, fontSize: 10, fontWeight: 700,
                display: "inline-flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 11, color: T.g500, margin: "0 0 2px" }}>{s.question}</p>
                <p style={{ fontSize: 12, fontWeight: 600, color: T.g800, margin: 0 }}>→ {renderAnswer(s, answers[s.id])}</p>
              </div>
              <button onClick={() => { setStepIdx(i); setMode("quiz"); }}
                style={{
                  fontSize: 10, color: T.blue, background: T.blueBg,
                  border: "none", padding: "3px 8px", borderRadius: 4, cursor: "pointer",
                  alignSelf: "flex-start", whiteSpace: "nowrap"
                }}>✏️ 수정</button>
            </div>
          ))}
        </div>
        
        <div style={{ background: T.violetBg, border: `1px solid ${T.violet}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.violet, marginBottom: 8 }}>📝 검토된 문안 (미리보기)</div>
          <p style={{ fontSize: 13, color: T.g800, lineHeight: 1.7, margin: 0 }}>{text}</p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { onSave({ answers, text }); setMode("saved"); }}
            disabled={disabled}
            style={{ flex: 1, padding: "10px 16px", background: T.emerald, color: T.white, border: "none", borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            ✅ 이대로 저장
          </button>
          <button onClick={() => { setManualText(text); setMode("manual"); }}
            style={{ padding: "10px 16px", background: T.white, color: T.g600, border: `1px solid ${T.g300}`, borderRadius: 6, fontSize: 13, cursor: "pointer" }}>
            ✏️ 직접 수정
          </button>
        </div>
      </div>
    );
  }
  
  // 작성 모드 (단계별)
  const select = (v) => {
    setAnswers(prev => ({ ...prev, [step.id]: v }));
  };
  const toggleMulti = (key) => {
    setAnswers(prev => {
      const cur = prev[step.id] || [];
      return { ...prev, [step.id]: cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key] };
    });
  };
  
  // 이 단계만 수정 모드인 경우: 저장 후 saved로 바로 복귀
  const handleNextOrSave = () => {
    if (editingStep !== null) {
      // 특정 단계만 수정 중 → 완료 후 바로 saved 복귀하며 문안 재조립
      const newText = quiz.assemble(answers);
      onSave({ answers, text: newText });
      setEditingStep(null);
      setMode("saved");
    } else if (isLast) {
      setMode("preview");
    } else {
      setStepIdx(stepIdx + 1);
    }
  };
  
  return (
    <div>
      {/* 진행 표시 — editingStep 모드일 때는 '이 항목만 수정 중' 뱃지 */}
      {editingStep !== null ? (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16,
          background: T.blueBg, border: `1px solid ${T.blue}33`, padding: "8px 12px", borderRadius: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.blue }}>✏️ 이 항목만 수정 중</span>
          <span style={{ fontSize: 11, color: T.g600 }}>· 저장하면 완료 화면으로 돌아갑니다</span>
          <button onClick={() => { setEditingStep(null); setMode("saved"); }}
            style={{ marginLeft: "auto", fontSize: 11, color: T.g500, background: "none", 
              border: `1px solid ${T.g300}`, padding: "3px 8px", borderRadius: 4, cursor: "pointer" }}>
            ← 취소
          </button>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: T.g500 }}>작성 진행: {stepIdx + 1} / {steps.length}</span>
          <div style={{ flex: 1, height: 6, background: T.g100, borderRadius: 999, overflow: "hidden" }}>
            <div style={{ width: `${progress}%`, height: "100%", background: T.emerald, transition: "width 0.3s" }}/>
          </div>
        </div>
      )}
      
      {/* 질문 */}
      <div style={{ marginBottom: 16 }}>
        <h4 style={{ fontSize: 15, fontWeight: 700, color: T.g900, marginBottom: 6, lineHeight: 1.5 }}>
          {step.question}
        </h4>
        {step.hint && (
          <p style={{ fontSize: 12, color: T.g500, lineHeight: 1.6 }}>💡 {step.hint}</p>
        )}
      </div>
      
      {/* 선택지 */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
        {step.options.map(opt => {
          const selected = step.type === "single" 
            ? answers[step.id] === opt.key
            : (answers[step.id] || []).includes(opt.key);
          return (
            <button key={opt.key}
              onClick={() => step.type === "single" ? select(opt.key) : toggleMulti(opt.key)}
              disabled={disabled}
              style={{
                textAlign: "left", padding: "12px 14px",
                background: selected ? T.emeraldBg : T.white,
                border: `1.5px solid ${selected ? T.emerald : T.g200}`,
                borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer",
                display: "flex", alignItems: "flex-start", gap: 10,
                transition: "all 0.15s"
              }}>
              <span style={{
                width: 18, height: 18, flexShrink: 0,
                borderRadius: step.type === "single" ? "50%" : 4,
                border: `2px solid ${selected ? T.emerald : T.g300}`,
                background: selected ? T.emerald : T.white,
                marginTop: 2,
                display: "inline-flex", alignItems: "center", justifyContent: "center",
                color: T.white, fontSize: 11, fontWeight: 700
              }}>{selected ? "✓" : ""}</span>
              <span style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>{opt.label}</div>
                {opt.desc && <div style={{ fontSize: 11, color: T.g500, marginTop: 2 }}>{opt.desc}</div>}
              </span>
            </button>
          );
        })}
      </div>
      
      {/* 네비게이션 */}
      <div style={{ display: "flex", gap: 8 }}>
        {stepIdx > 0 && editingStep === null && (
          <button onClick={() => setStepIdx(stepIdx - 1)}
            style={{ padding: "10px 14px", background: T.white, color: T.g600, border: `1px solid ${T.g300}`, borderRadius: 6, fontSize: 13, cursor: "pointer" }}>
            ← 이전
          </button>
        )}
        <button onClick={handleNextOrSave}
          disabled={!canNext}
          style={{
            flex: 1, padding: "10px 16px",
            background: canNext ? T.emerald : T.g200, color: T.white,
            border: "none", borderRadius: 6, fontSize: 14, fontWeight: 600,
            cursor: canNext ? "pointer" : "not-allowed"
          }}>
          {editingStep !== null ? "💾 저장하고 완료 화면으로" : (isLast ? "📝 작성 결과 보기 →" : "다음 →")}
        </button>
      </div>
    </div>
  );
}

// Sub-field 입력 컴포넌트 (단일 필드)
function SubField({ field, value, onChange, disabled }) {
  const [showTpl, setShowTpl] = useState(false);
  const handleType = (v) => onChange({ ...value, v });
  
  const renderInput = () => {
    if (field.type === "quiz") {
      const quizMap = { 
        "102-1a": QUIZ_102_1a,
        "102-1b": QUIZ_102_1b,
        "102-1d": QUIZ_102_1d,
        "102-1e": QUIZ_102_1e,
        "102-1g": QUIZ_102_1g,
        "102-1j": QUIZ_102_1j,
        "102-2b": QUIZ_102_2b,
        "102-3": QUIZ_102_3,
        "102-4": QUIZ_102_4,
      };
      const quiz = quizMap[field.quiz];
      if (!quiz) return <div style={{ color: T.rose }}>작성 트리 '{field.quiz}' 미정의</div>;
      return (
        <QuizLayered 
          quiz={quiz}
          savedAnswers={value?.answers}
          savedText={value?.v}
          onSave={(result) => onChange({ answers: result.answers, v: result.text })}
          disabled={disabled}
        />
      );
    }
    if (field.type === "textarea") {
      return (
        <textarea
          value={value?.v || ""}
          onChange={e => handleType(e.target.value)}
          disabled={disabled}
          rows={field.rows || 3}
          placeholder={field.placeholder || field.hint || ""}
          style={{
            width: "100%", padding: "12px 14px", borderRadius: 8,
            border: `1px solid ${T.g200}`, fontSize: 14, lineHeight: 1.6,
            fontFamily: "inherit", resize: "vertical",
            background: disabled ? T.g50 : T.white, color: T.g800
          }}
        />
      );
    }
    if (field.type === "number") {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <input
            type="number" value={value?.v || ""}
            onChange={e => handleType(e.target.value)}
            disabled={disabled}
            placeholder="숫자 입력"
            style={{
              flex: 1, padding: "10px 12px", borderRadius: 8,
              border: `1px solid ${T.g200}`, fontSize: 14,
              background: disabled ? T.g50 : T.white, textAlign: "right"
            }}
          />
          <span style={{ fontSize: 13, color: T.g500, fontWeight: 500 }}>{field.unit}</span>
        </div>
      );
    }
    if (field.type === "radio") {
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {field.options.map((opt, i) => (
            <label key={i} style={{
              display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px",
              border: `1px solid ${value?.v === opt ? T.emerald : T.g200}`,
              borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer",
              background: value?.v === opt ? T.emeraldBg : T.white,
              fontSize: 13, lineHeight: 1.5
            }}>
              <input type="radio" name={field.id} value={opt}
                checked={value?.v === opt}
                onChange={e => handleType(e.target.value)}
                disabled={disabled}
                style={{ marginTop: 2 }}/>
              <span style={{ color: T.g700, flex: 1 }}>{opt}</span>
            </label>
          ))}
        </div>
      );
    }
    if (field.type === "checkbox") {
      const selected = value?.v || [];
      const toggle = (opt) => {
        const next = selected.includes(opt) ? selected.filter(x => x !== opt) : [...selected, opt];
        handleType(next);
      };
      return (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {field.options.map((opt, i) => (
            <label key={i} style={{
              display: "flex", alignItems: "center", gap: 6, padding: "6px 10px",
              border: `1px solid ${selected.includes(opt) ? T.emerald : T.g200}`,
              borderRadius: 6, cursor: disabled ? "not-allowed" : "pointer",
              background: selected.includes(opt) ? T.emeraldBg : T.white,
              fontSize: 12
            }}>
              <input type="checkbox" checked={selected.includes(opt)}
                onChange={() => toggle(opt)} disabled={disabled}/>
              <span style={{ color: T.g700 }}>{opt}</span>
            </label>
          ))}
        </div>
      );
    }
    return null;
  };
  
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{
          fontSize: 10, fontWeight: 700, color: T.emerald,
          background: T.emeraldBg, padding: "2px 6px", borderRadius: 4
        }}>{field.gri}</span>
        <label style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>
          {field.glossary ? (
            <GlossaryTooltip termKey={field.glossary}>{field.label}</GlossaryTooltip>
          ) : field.label}
        </label>
        {field.template && field.type !== "quiz" && !disabled && (
          <button onClick={() => {
            handleType(field.template);
            setShowTpl(false);
          }} style={{
            marginLeft: "auto", fontSize: 11, color: T.blue, background: T.blueBg,
            border: "none", padding: "3px 8px", borderRadius: 4, cursor: "pointer", fontWeight: 500
          }}>📝 예시 문구 채우기</button>
        )}
      </div>
      {field.hint && (
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 8, lineHeight: 1.5 }}>💡 {field.hint}</p>
      )}
      {renderInput()}
    </div>
  );
}

// 기후변화 대응 대시보드 그래프 (Recharts)
function ClimateGraphs({ scopeData, blockData }) {
  const R = window.Recharts;
  if (!R) return null;
  const { BarChart, Bar, LineChart, Line, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = R;
  
  // Scope 1 3년치
  const s1Yearly = calcScope1Yearly(scopeData.s1);
  const s1Latest = s1Yearly[2] || 0;
  
  // Scope 2 (현재 단일 연도, 최신 연도에 매핑)
  // Scope 2 연도별 계산 (3년치 구조 + 호환)
  const calcScope2 = (s2, year) => {
    // yearly_val_YYYY 우선 체크
    let val = parseFloat(s2["yearly_val_" + year]) || 0;
    // 호환: yearly_val 단일 값은 최신 연도에만 매핑
    if (!val && year === YEAR_LATEST) {
      val = parseFloat(s2.yearly_val) || 0;
    }
    // 월별 데이터 합산
    if (!val) {
      const monthly = s2["_monthly_" + year];
      if (Array.isArray(monthly)) {
        val = monthly.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      } else if (year === YEAR_LATEST) {
        // 기존 구조: data[0..11]
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += parseFloat(s2[i]) || 0;
        if (sum > 0) val = sum;
      }
    }
    const kwh = (s2.input_type === "원") ? val / 165 : val;
    return (kwh / 1000) * getPowerEF(year);
  };
  
  const s2Yearly = REPORT_YEARS.map(y => calcScope2(scopeData.s2, y));
  const s2Latest = s2Yearly[2] || 0;
  
  // Scope 3 연도별 계산 (3년치 객체 구조 + 단일 숫자 호환)
  const calcScope3 = (s3, year) => {
    return S3.reduce((sum, c) => {
      if (c.id === "c7") {
        // 통근은 별도 구조 (최신 연도에만)
        if (year !== YEAR_LATEST) return sum;
        const d = s3.commute || {};
        return sum + ((d.people||0) * (d.distance||0) * 250 * 0.17 / 1000);
      }
      const raw = s3[c.id];
      let val = 0;
      if (typeof raw === "object" && raw !== null) {
        val = parseFloat(raw[year]) || 0;
      } else if (year === YEAR_LATEST) {
        val = parseFloat(raw) || 0;
      }
      return sum + val * (c.ef || 0);
    }, 0);
  };
  
  const s3Yearly = REPORT_YEARS.map(y => calcScope3(scopeData.s3, y));
  const s3Latest = s3Yearly[2] || 0;
  
  // 1. 3년 추세 (Scope 1, 2, 3 모두 연도별)
  const yearlyTrend = REPORT_YEARS.map((y, i) => ({
    year: y + "",
    "Scope 1": +(s1Yearly[i] || 0).toFixed(2),
    "Scope 2": +(s2Yearly[i] || 0).toFixed(2),
    "Scope 3": +(s3Yearly[i] || 0).toFixed(2),
  }));
  
  // 2. 최신 연도 Scope 1·2·3 비교
  const scopeData123 = [
    { name: "Scope 1", value: +s1Latest.toFixed(2), fill: T.rose },
    { name: "Scope 2", value: +s2Latest.toFixed(2), fill: T.amber },
    { name: "Scope 3", value: +s3Latest.toFixed(2), fill: T.violet },
  ];
  
  // 3. Scope 1 breakdown (최신 연도 기준)
  const stationaryTotal = SF.reduce((sum, f) => {
    const amt = getYearValue(scopeData.s1[f.id], YEAR_LATEST);
    if (!amt) return sum;
    const unit = scopeData.s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const baseAmt = conv ? amt * conv.factor : amt;
    return sum + calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
  }, 0);
  const mobileTotal = MF.reduce((sum, f) => {
    const amt = getYearValue(scopeData.s1[f.id], YEAR_LATEST);
    if (!amt) return sum;
    const unit = scopeData.s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const baseAmt = conv ? amt * conv.factor : amt;
    return sum + calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
  }, 0);
  
  const s1Breakdown = [];
  if (stationaryTotal > 0) s1Breakdown.push({ name: "고정연소", value: +stationaryTotal.toFixed(2), fill: T.blue });
  if (mobileTotal > 0) s1Breakdown.push({ name: "이동연소", value: +mobileTotal.toFixed(2), fill: T.indigo });
  
  // 4. 감축 목표 진척
  const baseYearEmission = parseFloat(blockData["_102_sub"]?.["4_base_year_emission"]?.v) || (s1Latest + s2Latest);
  const currentEmission = s1Latest + s2Latest;
  const targetAnnual = parseFloat(blockData["_102_sub"]?.["4_target_short"]?.v) || 1.5;
  const targetEmission = baseYearEmission * (1 - targetAnnual/100);
  const progress = baseYearEmission > 0 ? Math.max(0, Math.min(100, ((baseYearEmission - currentEmission) / (baseYearEmission - targetEmission)) * 100)) : 0;
  
  const total = s1Latest + s2Latest + s3Latest;
  const s1HasMultiYear = s1Yearly.some(v => v > 0);
  
  if (total < 0.01 && !s1HasMultiYear) {
    return (
      <div style={{ padding: 40, textAlign: "center", background: T.g50, borderRadius: 12, color: T.g500 }}>
        💡 Scope 1/2/3 배출량 데이터를 입력하면 그래프가 실시간으로 표시됩니다.
      </div>
    );
  }
  
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
      {/* 그래프 1: 3년 추세 막대그래프 (전체 폭) */}
      <div style={{ gridColumn: "1 / -1", background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800 }}>📈 3년 배출량 추세 ({REPORT_YEARS[0]}~{REPORT_YEARS[2]})</h4>
          {s1Yearly[1] > 0 && s1Yearly[2] > 0 && (
            <span style={{
              fontSize: 11, fontWeight: 700,
              color: s1Yearly[2] < s1Yearly[1] ? T.emerald : T.rose,
              background: s1Yearly[2] < s1Yearly[1] ? T.emeraldBg : T.roseBg,
              padding: "2px 8px", borderRadius: 4
            }}>
              Scope 1 전년 대비 {s1Yearly[2] < s1Yearly[1] ? "▼" : "▲"} {Math.abs((s1Yearly[2]-s1Yearly[1])/s1Yearly[1]*100).toFixed(1)}%
            </span>
          )}
        </div>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>단위: tCO₂eq · GRI 102-5/6/7 · Scope 1·2·3 전체 3년치 추이</p>
        <ResponsiveContainer width="100%" height={260}>
          <BarChart data={yearlyTrend}>
            <CartesianGrid strokeDasharray="3 3" stroke={T.g200}/>
            <XAxis dataKey="year" tick={{fontSize: 12}}/>
            <YAxis tick={{fontSize: 12}}/>
            <Tooltip/>
            <Legend wrapperStyle={{fontSize: 12}}/>
            <Bar dataKey="Scope 1" fill={T.rose} radius={[4, 4, 0, 0]}/>
            <Bar dataKey="Scope 2" fill={T.amber} radius={[4, 4, 0, 0]}/>
            <Bar dataKey="Scope 3" fill={T.violet} radius={[4, 4, 0, 0]}/>
          </BarChart>
        </ResponsiveContainer>
      </div>
      
      {/* 그래프 2: 최신 연도 Scope 1·2·3 */}
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 4 }}>{YEAR_LATEST}년 Scope 1·2·3</h4>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>최신 연도 기준 · tCO₂eq</p>
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={scopeData123}>
            <CartesianGrid strokeDasharray="3 3" stroke={T.g200}/>
            <XAxis dataKey="name" tick={{fontSize: 12}}/>
            <YAxis tick={{fontSize: 12}}/>
            <Tooltip/>
            <Bar dataKey="value" radius={[6, 6, 0, 0]}>
              {scopeData123.map((e, i) => <Cell key={i} fill={e.fill}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      
      {/* 그래프 3: Scope 1 breakdown */}
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 4 }}>Scope 1 배출원 ({YEAR_LATEST})</h4>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>고정연소 vs 이동연소</p>
        {s1Breakdown.length > 0 ? (
          <ResponsiveContainer width="100%" height={220}>
            <PieChart>
              <Pie data={s1Breakdown} cx="50%" cy="50%" innerRadius={50} outerRadius={85} dataKey="value" label={(e) => `${e.name}: ${e.value}t`}>
                {s1Breakdown.map((e, i) => <Cell key={i} fill={e.fill}/>)}
              </Pie>
              <Tooltip/>
            </PieChart>
          </ResponsiveContainer>
        ) : (
          <div style={{ padding: 40, textAlign: "center", color: T.g400, fontSize: 12 }}>Scope 1 데이터 없음</div>
        )}
      </div>
      
      {/* 그래프 4: 감축 목표 진척 게이지 */}
      <div style={{ gridColumn: "1 / -1", background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 4 }}>감축 목표 진척률</h4>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>
          기준연도 배출량: {baseYearEmission.toFixed(1)} tCO₂eq · 연간 목표: -{targetAnnual}% · GRI 102-4-i
        </p>
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          <div style={{ flex: 1, background: T.g100, borderRadius: 999, height: 30, overflow: "hidden", position: "relative" }}>
            <div style={{
              background: progress >= 80 ? T.emerald : progress >= 50 ? T.amber : T.rose,
              height: "100%", width: `${progress}%`, borderRadius: 999, transition: "width 0.4s"
            }}/>
            <span style={{
              position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
              fontSize: 12, fontWeight: 700, color: T.white, mixBlendMode: "difference"
            }}>{progress.toFixed(0)}%</span>
          </div>
          <div style={{ fontSize: 14, fontWeight: 700, color: T.g800, minWidth: 120, textAlign: "right" }}>
            현재: {currentEmission.toFixed(1)} tCO₂eq
          </div>
        </div>
      </div>
    </div>
  );
}

function calcScope1Total(s1, targetYear) {
  const year = targetYear || YEAR_LATEST;
  let total = 0;
  [...SF, ...MF].forEach(f => {
    const raw = s1[f.id];
    const amt = getYearValue(raw, year);
    const unit = s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const factor = conv?.factor || 1;
    if (amt) {
      total += calc(amt * factor, f.ncv, f.co2, f.ch4, f.n2o).t;
    }
    // 월별 데이터 (연도별 객체 · 기존 배열 호환)
    const monthly = s1["_monthly_" + f.id];
    let arr = null;
    if (Array.isArray(monthly)) {
      arr = year === YEAR_LATEST ? monthly : null;
    } else if (monthly && typeof monthly === "object") {
      arr = Array.isArray(monthly[year]) ? monthly[year] : null;
    }
    if (arr && arr.length > 0) {
      const sum = arr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      total += calc(sum * factor, f.ncv, f.co2, f.ch4, f.n2o).t;
    }
  });
  return total;
}

// 3년치 Scope 1 배출량 배열 반환 [2023, 2024, 2025]
function calcScope1Yearly(s1) {
  return REPORT_YEARS.map(y => calcScope1Total(s1, y));
}

// GRI 102 고급 입력 페이지 (서술 공시 sub-block 렌더)
function GRI102AdvancedPanel({ disclosureCode, blockData, setBlockData, disabled }) {
  const disclosure = GRI102_FIELDS[disclosureCode];
  if (!disclosure) return null;
  
  const storedKey = "_102_sub";
  const stored = blockData[storedKey] || {};
  
  const updateField = (fid, v) => {
    const next = { ...stored, [fid]: v };
    setBlockData(storedKey, { content_json: next });
  };
  
  const filledCount = disclosure.fields.filter(f => {
    const v = stored[f.id]?.v;
    if (Array.isArray(v)) return v.length > 0;
    return v && String(v).trim().length > 0;
  }).length;
  const progress = Math.round((filledCount / disclosure.fields.length) * 100);
  
  return (
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 20 }}>
      <div style={{ marginBottom: 20, paddingBottom: 16, borderBottom: `1px solid ${T.g100}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.emerald, padding: "3px 10px", borderRadius: 4 }}>
            공시 {disclosureCode}
          </span>
          <h3 style={{ fontSize: 17, fontWeight: 700, color: T.g900 }}>
            {disclosure.glossary ? (
              <GlossaryTooltip termKey={disclosure.glossary}>{disclosure.title}</GlossaryTooltip>
            ) : disclosure.title}
          </h3>
          <span style={{ marginLeft: "auto", fontSize: 12, fontWeight: 600, color: progress >= 80 ? T.emerald : progress >= 40 ? T.amber : T.rose }}>
            {filledCount}/{disclosure.fields.length} · {progress}%
          </span>
        </div>
        <p style={{ fontSize: 13, color: T.g500, lineHeight: 1.6 }}>{disclosure.desc}</p>
      </div>
      
      {/* 📘 공시 일반 설명 박스 */}
      <DisclosureGuide code={disclosureCode}/>
      
      {disclosure.fields.map(field => (
        <SubField key={field.id} field={field} 
          value={stored[field.id]} 
          onChange={v => updateField(field.id, v)}
          disabled={disabled}/>
      ))}
    </div>
  );
}

function ReportPreview({ scopeData, blockData }) {
  const sub = blockData["_102_sub"] || {};
  const getText = (fid) => {
    const v = sub[fid];
    if (!v) return null;
    if (typeof v === "object" && v.v) return v.v;
    if (typeof v === "string") return v;
    return null;
  };
  const getNumber = (fid) => {
    const v = sub[fid];
    if (!v) return null;
    if (typeof v === "object" && v.v) return v.v;
    if (typeof v === "string" || typeof v === "number") return v;
    return null;
  };
  
  // 3년치 배출량 계산
  const s1Yearly = calcScope1Yearly(scopeData.s1);
  
  const calcS2 = (year) => {
    const s2 = scopeData.s2;
    let v = parseFloat(s2["yearly_val_" + year]) || 0;
    if (!v && year === YEAR_LATEST) v = parseFloat(s2.yearly_val) || 0;
    if (!v) {
      const m = s2["_monthly_" + year];
      if (Array.isArray(m)) v = m.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      else if (year === YEAR_LATEST) {
        for (let i = 0; i < 12; i++) v += parseFloat(s2[i]) || 0;
      }
    }
    const kwh = s2.input_type === "원" ? v / 165 : v;
    return (kwh / 1000) * getPowerEF(year);
  };
  const s2Yearly = REPORT_YEARS.map(y => calcS2(y));
  
  const calcS3 = (year) => S3.reduce((sum, c) => {
    if (c.id === "c7" && year !== YEAR_LATEST) return sum;
    const raw = scopeData.s3[c.id];
    let val = 0;
    if (typeof raw === "object" && raw !== null) val = parseFloat(raw[year]) || 0;
    else if (year === YEAR_LATEST) val = parseFloat(raw) || 0;
    return sum + val * (c.ef || 0);
  }, 0);
  const s3Yearly = REPORT_YEARS.map(y => calcS3(y));
  
  const totalYearly = REPORT_YEARS.map((_, i) => s1Yearly[i] + s2Yearly[i] + s3Yearly[i]);
  
  // 감축률 (2023 대비 2025)
  const reductionPct = totalYearly[0] > 0 
    ? ((totalYearly[0] - totalYearly[2]) / totalYearly[0] * 100).toFixed(1)
    : null;
  
  const baseYear = getNumber("4_base_year") || REPORT_YEARS[0];
  const targetShort = getNumber("4_target_short") || "1.5";
  const targetMid = getNumber("4_target_mid") || "10";
  const targetLong = getNumber("4_target_long") || "20";
  
  const capex = getNumber("1c_capex");
  const opex = getNumber("1c_opex");
  const revenue = getNumber("1c_revenue");
  
  // 카드 컴포넌트
  const Card = ({ icon, title, subtitle, children, color }) => (
    <div style={{
      background: T.white, borderRadius: 12, padding: 20,
      border: `1px solid ${T.g200}`,
      borderTop: `4px solid ${color}`,
      minHeight: 300, display: "flex", flexDirection: "column"
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
        <span style={{ fontSize: 18 }}>{icon}</span>
        <h3 style={{ fontSize: 15, fontWeight: 700, color: T.g900 }}>{title}</h3>
      </div>
      <p style={{ fontSize: 11, color: T.g400, marginBottom: 14, letterSpacing: "0.04em", textTransform: "uppercase" }}>{subtitle}</p>
      <div style={{ flex: 1 }}>{children}</div>
    </div>
  );

  return (
    <div style={{ maxWidth: 1200, margin: "0 auto" }}>
      {/* 헤더 */}
      <div style={{ marginBottom: 24, paddingBottom: 16, borderBottom: `2px solid ${T.g900}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.g900, padding: "4px 10px", borderRadius: 4, letterSpacing: "0.06em" }}>
            GRI 102 · 기후변화 2025
          </span>
          <span style={{ fontSize: 11, color: T.g500 }}>보고 기간: {REPORT_YEARS[0]} ~ {REPORT_YEARS[2]}</span>
        </div>
        <h1 style={{ fontSize: 26, fontWeight: 800, color: T.g900, letterSpacing: "-0.02em", marginBottom: 4 }}>
          기후변화 대응 보고서
        </h1>
        <p style={{ fontSize: 13, color: T.g500 }}>
          파리협정 1.5°C 부합 전환 계획 · 감축 목표 및 이행 현황 · 공정한 전환
        </p>
      </div>
      
      {/* 상단 요약 KPI */}

function Dash({ scopeData, blockData, blocks, standards }) {
  // Scope 1: 최신 연도 기준 (3년치 구조 호환)
  let s1total = calcScope1Total(scopeData.s1, YEAR_LATEST);
  // 월별 추가 (연도별 구조 + 기존 배열 호환)
  [...SF, ...MF].forEach(f => {
    const uk = scopeData.s1[f.id + "_unit"] || (f.units?.[0]?.key);
    const unit = (f.units || []).find(u => u.key === uk) || f.units?.[0];
    const monthly = scopeData.s1["_monthly_" + f.id];
    let monthlyArr = null;
    if (Array.isArray(monthly)) {
      monthlyArr = monthly; // 기존 구조
    } else if (monthly && typeof monthly === "object") {
      monthlyArr = Array.isArray(monthly[YEAR_LATEST]) ? monthly[YEAR_LATEST] : null;
    }
    if (monthlyArr && monthlyArr.length > 0) {
      const sum = monthlyArr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      s1total += calc(sum * (unit?.factor || 1), f.ncv, f.co2, f.ch4, f.n2o).t;
    }
  });
  
  // Scope 2: 최신 연도 기준 (3년치 구조 호환)
  let s2total = 0;
  {
    const s2 = scopeData.s2;
    const inputType = s2.input_type || "kWh";
    // yearly_val_2025 (최신) 우선 → 호환 yearly_val → 월별 합계
    let v = parseFloat(s2["yearly_val_" + YEAR_LATEST]) || parseFloat(s2.yearly_val) || 0;
    if (!v) {
      const monthly = s2["_monthly_" + YEAR_LATEST];
      if (Array.isArray(monthly)) {
        v = monthly.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      } else {
        for (let i = 0; i < 12; i++) v += parseFloat(s2[i]) || 0;
      }
    }
    const kwh = inputType === "원" ? v / 165 : v;
    s2total = (kwh / 1000) * getPowerEF(YEAR_LATEST);
  }
  
  // Scope 3
  // Scope 3: 최신 연도 기준 (3년치 구조 호환)
  let s3total = 0;
  S3.forEach(c => {
    if (!c.ef) return;
    const raw = scopeData.s3[c.id];
    let v = 0;
    if (typeof raw === "object" && raw !== null) {
      v = parseFloat(raw[YEAR_LATEST]) || 0;
    } else {
      v = parseFloat(raw) || 0;
    }
    s3total += v * c.ef;
  });
  const grand = s1total + s2total + s3total;

  const totalBlocks = blocks.length;
  const isDone = (b) => {
    if (b.input_type === 'scope1_table') {
      const hasYearly = [...SF, ...MF].some(f => {
        const v = scopeData.s1[f.id];
        if (typeof v === "number") return v > 0;
        if (typeof v === "object" && v !== null) return Object.values(v).some(x => parseFloat(x) > 0);
        return parseFloat(v) > 0;
      });
      const hasMonthly = Object.keys(scopeData.s1).some(k => {
        if (!k.startsWith("_monthly_")) return false;
        const m = scopeData.s1[k];
        if (Array.isArray(m)) return m.some(v => v);
        if (m && typeof m === "object") return Object.values(m).some(arr => Array.isArray(arr) && arr.some(v => v));
        return false;
      });
      return hasYearly || hasMonthly;
    }
    if (b.input_type === 'scope2_table') {
      return scopeData.s2.yearly_val || Object.keys(scopeData.s2).some(k => !isNaN(parseInt(k)) && scopeData.s2[k]);
    }
    if (b.input_type === 'scope3_table') return S3.some(c => {
      if (c.id === 'c7') return false;
      const raw = scopeData.s3[c.id];
      if (typeof raw === "object" && raw !== null) return Object.values(raw).some(x => parseFloat(x) > 0);
      return parseFloat(raw) > 0;
    });
    const v = blockData[b.id];
    if (b.input_type === 'text') return v?.content_text && v.content_text.length > 10;
    return v?.content_json && v.content_json.length > 0 && v.content_json.some(r => Object.values(r||{}).some(x => x));
  };
  const doneBlocks = blocks.filter(isDone).length;
  const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;

  return <div>
    <div style={{ marginBottom: 28 }}>
      <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>Dashboard</h2>
      <p style={{ fontSize: 14, color: T.g500, marginTop: 2 }}>2025년 온실가스 배출량 및 GRI 작성 현황</p>
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 16 }}>
      <KPI label="총 배출량" value={grand} unit="tCO₂eq" />
      <KPI label="Scope 1" value={s1total} unit="tCO₂eq · 직접배출" />
      <KPI label="Scope 2" value={s2total} unit="tCO₂eq · 전력" />
      <KPI label="Scope 3" value={s3total} unit="tCO₂eq · 공급망" />
    </div>
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>전체 입력 진행률</span>
        <span style={{ fontSize: 24, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{pct}%</span>
      </div>
      <Bar pct={pct} color={T.g900} h={6}/>
      <div style={{ marginTop: 16 }}>
        {standards.map(s => {
          const sBlocks = blocks.filter(b => b.gri_code === s.code);
          const sDone = sBlocks.filter(isDone).length;
          const p = sBlocks.length ? Math.round(sDone / sBlocks.length * 100) : 0;
          return <div key={s.code} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
            <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 200 }}>{s.title}</span>
            <div style={{ flex: 1 }}><Bar pct={p} color={T.g500} h={4}/></div>
            <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{sDone}/{sBlocks.length}</span>
          </div>;
        })}
      </div>
    </div>
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24 }}>
      <span style={{ fontSize: 14, fontWeight: 600, color: T.g800, display: "block", marginBottom: 16 }}>부서별 담당 항목 진행률</span>
      {Object.entries(DEPTS).map(([k, d]) => {
        const deptBlocks = blocks.filter(b => b.default_dept === k);
        if (!deptBlocks.length) return null;
        const deptDone = deptBlocks.filter(isDone).length;
        const p = Math.round(deptDone / deptBlocks.length * 100);
        return <div key={k} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 120 }}>{d.name.split(" · ")[0]}</span>
          <div style={{ flex: 1 }}><Bar pct={p} color={d.color} h={4}/></div>
          <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{deptDone}/{deptBlocks.length}</span>
        </div>;
      })}
    </div>
  </div>;
}

    if (scopeTimer.current) clearTimeout(scopeTimer.current);
    setSaving(true);
    scopeTimer.current = setTimeout(async () => {
      try {
        await sbFetch("esg_data?category=eq." + cat, {
          method: "PATCH",
          body: JSON.stringify({ data: val, updated_at: new Date().toISOString() }),
        });
      } catch(e) { console.log("Save error:", e); }
      setSaving(false);
    }, 800);
  }, [sbFetch]);

  const blockTimer = React.useRef(null);
  const blockPendingRef = React.useRef({});
  const setBlockData = useCallback((blockId, data) => {
    setBlockDataState(prev => {
      const merged = { ...prev, [blockId]: { ...prev[blockId], ...data } };
      blockPendingRef.current[blockId] = merged[blockId];
      return merged;
    });
    if (blockTimer.current) clearTimeout(blockTimer.current);
    setSaving(true);
    blockTimer.current = setTimeout(async () => {
      const pending = { ...blockPendingRef.current };
      blockPendingRef.current = {};
      for (const [bid, val] of Object.entries(pending)) {
        try {
          const payload = {
            block_id: bid,
            company_id: 'ycchem',
            content_text: val.content_text || null,
            content_json: val.content_json || null,
            updated_at: new Date().toISOString(),
          };
          await sbFetch("block_data", {
            method: "POST",
            body: JSON.stringify(payload),
            headers: { "Prefer": "resolution=merge-duplicates,return=minimal" }
          });
        } catch(e) { console.log("Block save error:", e); }
      }
      setSaving(false);
    }, 800);
  }, [sbFetch]);

  const setS1 = useCallback((id, v) => {
    setScopeData(d => { const n = { ...d, s1: { ...d.s1, [id]: v } }; saveScope("s1", n.s1); return n; });
  }, [saveScope]);
  const setS2 = useCallback((i, v) => {
    setScopeData(d => { const n = { ...d, s2: { ...d.s2, [i]: v } }; saveScope("s2", n.s2); return n; });
  }, [saveScope]);
  const setS3 = useCallback((id, v) => {
    setScopeData(d => { const n = { ...d, s3: { ...d.s3, [id]: v } }; saveScope("s3", n.s3); return n; });
  }, [saveScope]);

  if (!loaded) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: T.g50 }}>
      <style>{globalCSS}</style>
      <div style={{ textAlign: "center" }}>
        <p style={{ fontSize: 15, fontWeight: 600, color: T.g500 }}>데이터 로딩 중...</p>
      </div>
    </div>
  );

  if (!user) return <Login onLogin={u => { setUser(u); setPg("dash"); }}/>;
  const dept = DEPTS[user.dept] || { name: "관리자", color: T.g900 };

  return (
    <div style={{ display: "flex", minHeight: "100vh", background: T.g50 }}>
      <style>{globalCSS}</style>
      {saving && <div style={{ position: "fixed", top: 12, right: 12, zIndex: 999, fontSize: 12, fontWeight: 500, color: T.g400, background: T.white, border: `1px solid ${T.g200}`, padding: "6px 14px", borderRadius: 6 }}>저장 중...</div>}

      <div style={{ width: 240, background: T.white, borderRight: `1px solid ${T.g200}`, padding: "20px 0", display: "flex", flexDirection: "column" }}>
        <div style={{ padding: "0 20px 20px", borderBottom: `1px solid ${T.g100}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="5" fill={T.g900}/><path d="M7 8h10M7 12h7M7 16h9" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"/></svg>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: T.g900, letterSpacing: "-0.01em" }}>ESG Platform</div>
              <div style={{ fontSize: 10, color: T.g400 }}>the4thedge.com</div>
            </div>
          </div>
        </div>

        <div style={{ flex: 1, padding: "12px 10px", overflowY: "auto" }}>
          <p style={{ fontSize: 10, fontWeight: 700, color: T.g400, letterSpacing: "0.08em", padding: "8px 10px 4px", textTransform: "uppercase" }}>Overview</p>
          <button onClick={() => setPg("dash")}
            style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "none", background: pg === "dash" ? T.g100 : "transparent", color: pg === "dash" ? T.g900 : T.g500, fontSize: 13, fontWeight: pg === "dash" ? 600 : 400, textAlign: "left", cursor: "pointer", marginBottom: 2 }}>
            Dashboard
          </button>
          <button onClick={() => setPg("report")}
            style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "none", background: pg === "report" ? T.g100 : "transparent", color: pg === "report" ? T.g900 : T.g500, fontSize: 13, fontWeight: pg === "report" ? 600 : 400, textAlign: "left", cursor: "pointer", marginBottom: 2, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span>📄 보고서 미리보기</span>
            <span style={{ fontSize: 9, background: T.emerald, color: T.white, padding: "1px 6px", borderRadius: 3, fontWeight: 700 }}>NEW</span>
          </button>

          <p style={{ fontSize: 10, fontWeight: 700, color: T.g400, letterSpacing: "0.08em", padding: "14px 10px 4px", textTransform: "uppercase" }}>GRI 표준</p>
          {standards.map(s => (
            <button key={s.code} onClick={() => setPg("gri_" + s.code)}
              style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "none", background: pg === "gri_" + s.code ? T.g100 : "transparent", color: pg === "gri_" + s.code ? T.g900 : T.g500, fontSize: 13, fontWeight: pg === "gri_" + s.code ? 600 : 400, textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 2 }}>
              <span>{s.title.replace("GRI " + s.code + ": ", "").replace(/ 202\d/, "").replace(/ 201\d/, "")}</span>
              <span style={{ fontSize: 11, color: T.g400 }}>{s.code}</span>
            </button>
          ))}
        </div>

        <div style={{ padding: "12px 16px", borderTop: `1px solid ${T.g100}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <div style={{ width: 28, height: 28, borderRadius: 6, background: T.g200, color: T.g600, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 600 }}>{user.name[0]}</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>{user.name}</div>
              <div style={{ fontSize: 11, color: T.g400 }}>{dept.name}</div>
            </div>
          </div>
          <button onClick={() => setUser(null)}
            style={{ width: "100%", padding: "6px", borderRadius: 6, border: `1px solid ${T.g200}`, background: "none", color: T.g500, fontSize: 12, cursor: "pointer" }}>
            로그아웃
          </button>
        </div>
      </div>

      <div style={{ flex: 1, padding: "32px 40px", overflowY: "auto", maxHeight: "100vh" }}>
        {pg === "dash" && <Dash scopeData={scopeData} blockData={blockData} blocks={blocks} standards={standards}/>}
        {pg === "report" && <ReportPreview scopeData={scopeData} blockData={blockData}/>}
        {standards.map(s => {
          if (pg !== "gri_" + s.code) return null;
          const sBlocks = blocks.filter(b => b.gri_code === s.code);
          return <BlockPanel key={s.code} standard={s} blocks={sBlocks} blockData={blockData} setBlockData={setBlockData}
            scopeData={scopeData} setS1={setS1} setS2={setS2} setS3={setS3}
            ud={user.dept} isAdmin={user.dept === "all"} griMap={griMap} vsmeMap={vsmeMap}/>;
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
