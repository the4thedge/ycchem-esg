      anon: "윤리경영 홈페이지를 통해 익명 신고가 가능하며, 제보자 보호 규정을 운영합니다.",
      external: "외부 감사법인이 운영하는 신고센터를 통해 독립성을 확보합니다.",
      both: "내부 익명 신고 채널과 외부 감사법인 신고센터를 이중 운영하여 독립성과 접근성을 모두 확보합니다.",
      basic: "일반 고충처리 채널을 통해 신고가 가능합니다."
    }[ans.channel] || "";
    return `당사는 뇌물·리베이트 수수를 엄격히 금지하며, ${c} 반부패 원칙을 명시하고 있습니다. ${p}. ${ch}`;
  }
};

// ═══════════════════════════════════════════════════════════════════════
// 🎯 단계별 작성 컴포넌트 — 한 번에 항목 1개, 진행바, 뒤로/앞으로
// ═══════════════════════════════════════════════════════════════════════
function QuizLayered({ quiz, savedAnswers, savedText, onSave, disabled }) {
  const [mode, setMode] = useState(savedText ? "saved" : "quiz"); // quiz | preview | saved | manual
  const [stepIdx, setStepIdx] = useState(0);
  const [answers, setAnswers] = useState(savedAnswers || {});
  const [manualText, setManualText] = useState(savedText || "");
  const [editingStep, setEditingStep] = useState(null); // 특정 단계만 수정 중
  
  const steps = quiz.steps;
  const step = steps[stepIdx];
  const progress = Math.round(((stepIdx + 1) / steps.length) * 100);
  const canNext = step && (
    step.type === "single" ? !!answers[step.id] :
    step.type === "multi" ? (answers[step.id] || []).length > 0 : true
  );
  const isLast = stepIdx === steps.length - 1;
  
  // 답변을 사람이 읽을 수 있는 라벨로 변환
  const renderAnswer = (stepDef, ans) => {
    if (!ans) return <span style={{ color: T.g400 }}>(미선택)</span>;
    if (stepDef.type === "single") {
      const opt = stepDef.options.find(o => o.key === ans);
      return opt?.label || ans;
    }
    if (stepDef.type === "multi") {
      const labels = (ans || []).map(k => stepDef.options.find(o => o.key === k)?.label).filter(Boolean);
      return labels.length ? labels.join(", ") : <span style={{ color: T.g400 }}>(미선택)</span>;
    }
    return String(ans);
  };
  
  // 저장된 답 보기 모드 (새로운 프로세스 표시 형태)
  if (mode === "saved") {
    return (
      <div>
        {/* 헤더 */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.emerald, padding: "3px 10px", borderRadius: 4 }}>
            ✅ 작성 완료
          </span>
          <span style={{ fontSize: 11, color: T.g500 }}>{steps.length}개 항목 모두 선택됨</span>
          {!disabled && (
            <button onClick={() => { 
              setMode("quiz"); 
              setStepIdx(0); 
              setAnswers({}); 
            }}
              style={{ 
                marginLeft: "auto", fontSize: 11, color: T.rose, 
                background: T.white, border: `1px solid ${T.rose}`, 
                padding: "4px 10px", borderRadius: 4, cursor: "pointer", fontWeight: 500
              }}>
              🔄 처음부터 다시 작성
            </button>
          )}
        </div>
        
        {/* 작성 프로세스 전체 표시 */}
        <div style={{ background: T.g50, border: `1px solid ${T.g200}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: T.g600, marginBottom: 12, letterSpacing: "0.04em" }}>
            📋 작성하신 내용
          </p>
          {steps.map((s, i) => (
            <div key={s.id} style={{
              display: "flex", alignItems: "flex-start", gap: 10,
              padding: "10px 0",
              borderTop: i > 0 ? `1px solid ${T.g200}` : "none"
            }}>
              <span style={{
                flexShrink: 0, width: 22, height: 22, borderRadius: "50%",
                background: T.emerald, color: T.white, fontSize: 11, fontWeight: 700,
                display: "inline-flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 12, color: T.g500, marginBottom: 3 }}>
                  {s.question}
                </p>
                <p style={{ fontSize: 13, fontWeight: 600, color: T.g800, margin: 0 }}>
                  → {renderAnswer(s, answers[s.id])}
                </p>
              </div>
              {!disabled && (
                <button onClick={() => { 
                  setEditingStep(i); 
                  setStepIdx(i); 
                  setMode("quiz"); 
                }}
                  style={{
                    fontSize: 11, color: T.blue, background: T.blueBg,
                    border: "none", padding: "4px 10px", borderRadius: 4, 
                    cursor: "pointer", fontWeight: 500, whiteSpace: "nowrap"
                  }}>
                  ✏️ 이것만 수정
                </button>
              )}
            </div>
          ))}
        </div>
        
        {/* 검토된 문안 */}
        <div style={{ background: T.violetBg, border: `1px solid ${T.violet}33`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: T.violet }}>📝 검토된 문안</span>
            {!disabled && (
              <button onClick={() => setMode("manual")}
                style={{
                  marginLeft: "auto", fontSize: 11, color: T.g600,
                  background: T.white, border: `1px solid ${T.g300}`,
                  padding: "3px 8px", borderRadius: 4, cursor: "pointer"
                }}>
                ✏️ 내용 수정
              </button>
            )}
          </div>
          <p style={{ fontSize: 13, color: T.g800, lineHeight: 1.7, margin: 0, whiteSpace: "pre-wrap" }}>
            {savedText}
          </p>
        </div>
      </div>
    );
  }
  
  // 직접 수정 모드
  if (mode === "manual") {
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, padding: "8px 12px", background: T.blueBg, border: `1px solid ${T.blue}33`, borderRadius: 8 }}>
          <span style={{ fontSize: 12, fontWeight: 700, color: T.blue }}>✏️ 직접 서술 모드</span>
          <span style={{ fontSize: 11, color: T.g500 }}>· 퀴즈가 안 맞을 때 자유롭게 작성</span>
          <button onClick={() => { setMode("quiz"); setStepIdx(0); }}
            style={{ marginLeft: "auto", fontSize: 11, color: T.emerald, background: T.white, border: `1px solid ${T.emerald}`, padding: "3px 8px", borderRadius: 4, cursor: "pointer", fontWeight: 600 }}>
            ← 퀴즈로 돌아가기
          </button>
        </div>
        <textarea value={manualText} onChange={e => setManualText(e.target.value)}
          disabled={disabled} rows={8}
          placeholder="이 항목에 대한 내용을 자유롭게 작성하세요."
          style={{ width: "100%", padding: "12px 14px", borderRadius: 8, border: `1px solid ${T.g200}`, fontSize: 13, lineHeight: 1.7, fontFamily: "inherit", resize: "vertical" }}/>
        <button onClick={() => { onSave({ answers, text: manualText }); setMode("saved"); }}
          disabled={!manualText.trim()}
          style={{ marginTop: 10, padding: "8px 16px", background: T.emerald, color: T.white, border: "none", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: manualText.trim() ? "pointer" : "not-allowed", opacity: manualText.trim() ? 1 : 0.5 }}>
          💾 저장
        </button>
      </div>
    );
  }
  
  // 미리보기 모드
  if (mode === "preview") {
    const text = quiz.assemble(answers);
    return (
      <div>
        {/* 작성한 항목 요약 (미리보기에도 표시) */}
        <div style={{ background: T.g50, border: `1px solid ${T.g200}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: T.g600, marginBottom: 10, letterSpacing: "0.04em" }}>📋 작성 내용 확인</p>
          {steps.map((s, i) => (
            <div key={s.id} style={{
              padding: "8px 0",
              borderTop: i > 0 ? `1px solid ${T.g200}` : "none",
              display: "flex", gap: 10
            }}>
              <span style={{
                flexShrink: 0, width: 20, height: 20, borderRadius: "50%",
                background: T.emerald, color: T.white, fontSize: 10, fontWeight: 700,
                display: "inline-flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 11, color: T.g500, margin: "0 0 2px" }}>{s.question}</p>
                <p style={{ fontSize: 12, fontWeight: 600, color: T.g800, margin: 0 }}>→ {renderAnswer(s, answers[s.id])}</p>
              </div>
              <button onClick={() => { setStepIdx(i); setMode("quiz"); }}
                style={{
                  fontSize: 10, color: T.blue, background: T.blueBg,
                  border: "none", padding: "3px 8px", borderRadius: 4, cursor: "pointer",
                  alignSelf: "flex-start", whiteSpace: "nowrap"
                }}>✏️ 수정</button>
            </div>
          ))}
        </div>
        
        <div style={{ background: T.violetBg, border: `1px solid ${T.violet}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.violet, marginBottom: 8 }}>📝 검토된 문안 (미리보기)</div>
          <p style={{ fontSize: 13, color: T.g800, lineHeight: 1.7, margin: 0 }}>{text}</p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { onSave({ answers, text }); setMode("saved"); }}
            disabled={disabled}
            style={{ flex: 1, padding: "10px 16px", background: T.emerald, color: T.white, border: "none", borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            ✅ 이대로 저장
          </button>
          <button onClick={() => { setManualText(text); setMode("manual"); }}
            style={{ padding: "10px 16px", background: T.white, color: T.g600, border: `1px solid ${T.g300}`, borderRadius: 6, fontSize: 13, cursor: "pointer" }}>
            ✏️ 직접 수정
          </button>
        </div>
      </div>
    );
  }
  
  // 작성 모드 (단계별)
  const select = (v) => {
    setAnswers(prev => ({ ...prev, [step.id]: v }));
  };
  const toggleMulti = (key) => {
    setAnswers(prev => {
      const cur = prev[step.id] || [];
      return { ...prev, [step.id]: cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key] };
    });
  };
  
  // 이 단계만 수정 모드인 경우: 저장 후 saved로 바로 복귀
  const handleNextOrSave = () => {
    if (editingStep !== null) {
      // 특정 단계만 수정 중 → 완료 후 바로 saved 복귀하며 문안 재조립
      const newText = quiz.assemble(answers);
      onSave({ answers, text: newText });
      setEditingStep(null);
      setMode("saved");
    } else if (isLast) {
      setMode("preview");
    } else {
      setStepIdx(stepIdx + 1);
    }
  };
  
  return (
    <div>
      {/* 진행 표시 — editingStep 모드일 때는 '이 항목만 수정 중' 뱃지 */}
      {editingStep !== null ? (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16,
          background: T.blueBg, border: `1px solid ${T.blue}33`, padding: "8px 12px", borderRadius: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.blue }}>✏️ 이 항목만 수정 중</span>
          <span style={{ fontSize: 11, color: T.g600 }}>· 저장하면 완료 화면으로 돌아갑니다</span>
          <button onClick={() => { setEditingStep(null); setMode("saved"); }}
            style={{ marginLeft: "auto", fontSize: 11, color: T.g500, background: "none", 
              border: `1px solid ${T.g300}`, padding: "3px 8px", borderRadius: 4, cursor: "pointer" }}>
            ← 취소
          </button>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: T.g500 }}>작성 진행: {stepIdx + 1} / {steps.length}</span>
          <div style={{ flex: 1, height: 6, background: T.g100, borderRadius: 999, overflow: "hidden" }}>
            <div style={{ width: `${progress}%`, height: "100%", background: T.emerald, transition: "width 0.3s" }}/>
          </div>
          {!disabled && (
            <button onClick={() => { setManualText(savedText || ""); setMode("manual"); }}
              style={{ fontSize: 10, color: T.g500, background: T.white, border: `1px solid ${T.g300}`,
                padding: "3px 8px", borderRadius: 4, cursor: "pointer", whiteSpace: "nowrap" }}
              title="퀴즈 대신 자유롭게 서술하고 싶을 때">
              ✏️ 직접 서술
            </button>
          )}
        </div>
      )}
      
      {/* 질문 */}
      <div style={{ marginBottom: 16 }}>
        <h4 style={{ fontSize: 15, fontWeight: 700, color: T.g900, marginBottom: 6, lineHeight: 1.5 }}>
          {step.question}
        </h4>
        {step.hint && (
          <p style={{ fontSize: 12, color: T.g500, lineHeight: 1.6 }}>💡 {step.hint}</p>
        )}
      </div>
      
      {/* 선택지 */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
        {step.options.map(opt => {
          const selected = step.type === "single" 
            ? answers[step.id] === opt.key
            : (answers[step.id] || []).includes(opt.key);
          return (
            <button key={opt.key}
              onClick={() => step.type === "single" ? select(opt.key) : toggleMulti(opt.key)}
              disabled={disabled}
              style={{
                textAlign: "left", padding: "12px 14px",
                background: selected ? T.emeraldBg : T.white,
                border: `1.5px solid ${selected ? T.emerald : T.g200}`,
                borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer",
                display: "flex", alignItems: "flex-start", gap: 10,
                transition: "all 0.15s"
              }}>
              <span style={{
                width: 18, height: 18, flexShrink: 0,
                borderRadius: step.type === "single" ? "50%" : 4,
                border: `2px solid ${selected ? T.emerald : T.g300}`,
                background: selected ? T.emerald : T.white,
                marginTop: 2,
                display: "inline-flex", alignItems: "center", justifyContent: "center",
                color: T.white, fontSize: 11, fontWeight: 700
              }}>{selected ? "✓" : ""}</span>
              <span style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>{opt.label}</div>
                {opt.desc && <div style={{ fontSize: 11, color: T.g500, marginTop: 2 }}>{opt.desc}</div>}
              </span>
            </button>
          );
        })}
      </div>
      
      {/* 네비게이션 */}
      <div style={{ display: "flex", gap: 8 }}>
        {stepIdx > 0 && editingStep === null && (
          <button onClick={() => setStepIdx(stepIdx - 1)}
            style={{ padding: "10px 14px", background: T.white, color: T.g600, border: `1px solid ${T.g300}`, borderRadius: 6, fontSize: 13, cursor: "pointer" }}>
            ← 이전
          </button>
        )}
        <button onClick={handleNextOrSave}
          disabled={!canNext}
          style={{
            flex: 1, padding: "10px 16px",
            background: canNext ? T.emerald : T.g200, color: T.white,
            border: "none", borderRadius: 6, fontSize: 14, fontWeight: 600,
            cursor: canNext ? "pointer" : "not-allowed"
          }}>
          {editingStep !== null ? "💾 저장하고 완료 화면으로" : (isLast ? "📝 작성 결과 보기 →" : "다음 →")}
        </button>
      </div>
    </div>
  );
}

// Sub-field 입력 컴포넌트 (단일 필드)
function SubField({ field, value, onChange, disabled }) {
  const [showTpl, setShowTpl] = useState(false);
  const handleType = (v) => onChange({ ...value, v });
  
  const renderInput = () => {
    if (field.type === "quiz") {
      const quizMap = { 
        "102-1a": QUIZ_102_1a,
        "102-1b": QUIZ_102_1b,
        "102-1d": QUIZ_102_1d,
        "102-1e": QUIZ_102_1e,
        "102-1g": QUIZ_102_1g,
        "102-1j": QUIZ_102_1j,
        "102-2b": QUIZ_102_2b,
        "102-3": QUIZ_102_3,
        "102-4": QUIZ_102_4,
        "305-air-ctrl": QUIZ_305_AIR_CTRL,
        "305-chem-inc": QUIZ_305_CHEM_INC,
        "305-chem-mgmt": QUIZ_305_CHEM_MGMT,
        "305-policy": QUIZ_305_POLICY,
        "103-reduction": QUIZ_103_REDUCTION,
        "103-policy-statement": QUIZ_103_POLICY_STATEMENT,
        "103-policy-gov": QUIZ_103_POLICY_GOV,
        "306-policy": QUIZ_306_POLICY,
        "303-policy": QUIZ_303_POLICY,
        "403-policy": QUIZ_403_POLICY,
        "2-governance": QUIZ_2_GOVERNANCE,
        "103-base-reason": QUIZ_103_BASE_REASON,
        "103-target": QUIZ_103_TARGET,
        "306-activities": QUIZ_306_ACTIVITIES,
        "303-reduction": QUIZ_303_REDUCTION,
        "403-health-edu": QUIZ_403_HEALTH_EDU,
        "2-anticorruption": QUIZ_2_ANTICORRUPTION,
      };
      const quiz = quizMap[field.quiz];
      if (!quiz) return <div style={{ color: T.rose }}>작성 트리 '{field.quiz}' 미정의</div>;
      return (
        <QuizLayered 
          quiz={quiz}
          savedAnswers={value?.answers}
          savedText={value?.v}
          onSave={(result) => onChange({ answers: result.answers, v: result.text })}
          disabled={disabled}
        />
      );
    }
    if (field.type === "textarea") {
      return (
        <textarea
          value={value?.v || ""}
          onChange={e => handleType(e.target.value)}
          disabled={disabled}
          rows={field.rows || 3}
          placeholder={field.placeholder || field.hint || ""}
          style={{
            width: "100%", padding: "12px 14px", borderRadius: 8,
            border: `1px solid ${T.g200}`, fontSize: 14, lineHeight: 1.6,
            fontFamily: "inherit", resize: "vertical",
            background: disabled ? T.g50 : T.white, color: T.g800
          }}
        />
      );
    }
    if (field.type === "number") {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <input
            type="number" value={value?.v || ""}
            onChange={e => handleType(e.target.value)}
            disabled={disabled}
            placeholder="숫자 입력"
            style={{
              flex: 1, padding: "10px 12px", borderRadius: 8,
              border: `1px solid ${T.g200}`, fontSize: 14,
              background: disabled ? T.g50 : T.white, textAlign: "right"
            }}
          />
          <span style={{ fontSize: 13, color: T.g500, fontWeight: 500 }}>{field.unit}</span>
        </div>
      );
    }
    if (field.type === "radio") {
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {field.options.map((opt, i) => (
            <label key={i} style={{
              display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px",
              border: `1px solid ${value?.v === opt ? T.emerald : T.g200}`,
              borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer",
              background: value?.v === opt ? T.emeraldBg : T.white,
              fontSize: 13, lineHeight: 1.5
            }}>
              <input type="radio" name={field.id} value={opt}
                checked={value?.v === opt}
                onChange={e => handleType(e.target.value)}
                disabled={disabled}
                style={{ marginTop: 2 }}/>
              <span style={{ color: T.g700, flex: 1 }}>{opt}</span>
            </label>
          ))}
        </div>
      );
    }
    if (field.type === "checkbox") {
      const selected = value?.v || [];
      const toggle = (opt) => {
        const next = selected.includes(opt) ? selected.filter(x => x !== opt) : [...selected, opt];
        handleType(next);
      };
      return (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {field.options.map((opt, i) => (
            <label key={i} style={{
              display: "flex", alignItems: "center", gap: 6, padding: "6px 10px",
              border: `1px solid ${selected.includes(opt) ? T.emerald : T.g200}`,
              borderRadius: 6, cursor: disabled ? "not-allowed" : "pointer",
              background: selected.includes(opt) ? T.emeraldBg : T.white,
              fontSize: 12
            }}>
              <input type="checkbox" checked={selected.includes(opt)}
                onChange={() => toggle(opt)} disabled={disabled}/>
              <span style={{ color: T.g700 }}>{opt}</span>
            </label>
          ))}
        </div>
      );
    }
    return null;
  };
  
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{
          fontSize: 10, fontWeight: 700, color: T.emerald,
          background: T.emeraldBg, padding: "2px 6px", borderRadius: 4
        }}>{field.gri}</span>
        <label style={{ fontSize: 13, fontWeight: 600, color: T.g800 }}>
          {field.glossary ? (
            <GlossaryTooltip termKey={field.glossary}>{field.label}</GlossaryTooltip>
          ) : field.label}
        </label>
        {field.template && field.type !== "quiz" && !disabled && (
          <button onClick={() => {
            handleType(field.template);
            setShowTpl(false);
          }} style={{
            marginLeft: "auto", fontSize: 11, color: T.blue, background: T.blueBg,
            border: "none", padding: "3px 8px", borderRadius: 4, cursor: "pointer", fontWeight: 500
          }}>📝 예시 문구 채우기</button>
        )}
      </div>
      {field.hint && (
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 8, lineHeight: 1.5 }}>💡 {field.hint}</p>
      )}
      {renderInput()}
    </div>
  );
}

// 기후변화 대응 대시보드 그래프 (Recharts)
function ClimateGraphs({ scopeData, blockData }) {
  const R = window.Recharts;
  if (!R) return null;
  const { BarChart, Bar, LineChart, Line, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = R;
  
  // Scope 1 3년치
  const s1Yearly = calcScope1Yearly(scopeData.s1);
  const s1Latest = s1Yearly[2] || 0;
  
  // Scope 2 (현재 단일 연도, 최신 연도에 매핑)
  // Scope 2 연도별 계산 (3년치 구조 + 호환)
  const calcScope2 = (s2, year) => {
    // yearly_val_YYYY 우선 체크
    let val = parseFloat(s2["yearly_val_" + year]) || 0;
    // 호환: yearly_val 단일 값은 최신 연도에만 매핑
    if (!val && year === YEAR_LATEST) {
      val = parseFloat(s2.yearly_val) || 0;
    }
    // 월별 데이터 합산
    if (!val) {
      const monthly = s2["_monthly_" + year];
      if (Array.isArray(monthly)) {
        val = monthly.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      } else if (year === YEAR_LATEST) {
        // 기존 구조: data[0..11]
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += parseFloat(s2[i]) || 0;
        if (sum > 0) val = sum;
      }
    }
    const kwh = (s2.input_type === "원") ? val / 165 : val;
    return (kwh / 1000) * getPowerEF(year);
  };
  
  const s2Yearly = REPORT_YEARS.map(y => calcScope2(scopeData.s2, y));
  const s2Latest = s2Yearly[2] || 0;
  
  // Scope 3 연도별 계산 (3년치 객체 구조 + 단일 숫자 호환)
  const calcScope3 = (s3, year) => {
    return S3.reduce((sum, c) => {
      if (c.id === "c7") {
        // 통근은 별도 구조 (최신 연도에만)
        if (year !== YEAR_LATEST) return sum;
        const d = s3.commute || {};
        return sum + ((d.people||0) * (d.distance||0) * 250 * 0.17 / 1000);
      }
      const raw = s3[c.id];
      let val = 0;
      if (typeof raw === "object" && raw !== null) {
        val = parseFloat(raw[year]) || 0;
      } else if (year === YEAR_LATEST) {
        val = parseFloat(raw) || 0;
      }
      return sum + val * (c.ef || 0);
    }, 0);
  };
  
  const s3Yearly = REPORT_YEARS.map(y => calcScope3(scopeData.s3, y));
  const s3Latest = s3Yearly[2] || 0;
  
  // 1. 3년 추세 (Scope 1, 2, 3 모두 연도별)
  const yearlyTrend = REPORT_YEARS.map((y, i) => ({
    year: y + "",
    "Scope 1": +(s1Yearly[i] || 0).toFixed(2),
    "Scope 2": +(s2Yearly[i] || 0).toFixed(2),
    "Scope 3": +(s3Yearly[i] || 0).toFixed(2),
  }));
  
  // 2. 최신 연도 Scope 1·2·3 비교
  const scopeData123 = [
    { name: "Scope 1", value: +s1Latest.toFixed(2), fill: T.rose },
    { name: "Scope 2", value: +s2Latest.toFixed(2), fill: T.amber },
    { name: "Scope 3", value: +s3Latest.toFixed(2), fill: T.violet },
  ];
  
  // 3. Scope 1 breakdown (최신 연도 기준)
  const stationaryTotal = SF.reduce((sum, f) => {
    const amt = getYearValue(scopeData.s1[f.id], YEAR_LATEST);
    if (!amt) return sum;
    const unit = scopeData.s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const baseAmt = conv ? amt * conv.factor : amt;
    return sum + calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
  }, 0);
  const mobileTotal = MF.reduce((sum, f) => {
    const amt = getYearValue(scopeData.s1[f.id], YEAR_LATEST);
    if (!amt) return sum;
    const unit = scopeData.s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const baseAmt = conv ? amt * conv.factor : amt;
    return sum + calc(baseAmt, f.ncv, f.co2, f.ch4, f.n2o).t;
  }, 0);
  
  const s1Breakdown = [];
  if (stationaryTotal > 0) s1Breakdown.push({ name: "고정연소", value: +stationaryTotal.toFixed(2), fill: T.blue });
  if (mobileTotal > 0) s1Breakdown.push({ name: "이동연소", value: +mobileTotal.toFixed(2), fill: T.indigo });
  
  // 4. 감축 목표 진척
  const baseYearEmission = parseFloat(blockData["_102_sub"]?.["4_base_year_emission"]?.v) || (s1Latest + s2Latest);
  const currentEmission = s1Latest + s2Latest;
  const targetAnnual = parseFloat(blockData["_102_sub"]?.["4_target_short"]?.v) || 1.5;
  const targetEmission = baseYearEmission * (1 - targetAnnual/100);
  const progress = baseYearEmission > 0 ? Math.max(0, Math.min(100, ((baseYearEmission - currentEmission) / (baseYearEmission - targetEmission)) * 100)) : 0;
  
  const total = s1Latest + s2Latest + s3Latest;
  const s1HasMultiYear = s1Yearly.some(v => v > 0);
  
  if (total < 0.01 && !s1HasMultiYear) {
    return (
      <div style={{ padding: 40, textAlign: "center", background: T.g50, borderRadius: 12, color: T.g500 }}>
        💡 Scope 1/2/3 배출량 데이터를 입력하면 그래프가 실시간으로 표시됩니다.
      </div>
    );
  }
  
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
      {/* 그래프 1: 3년 추세 막대그래프 (전체 폭) */}
      <div style={{ gridColumn: "1 / -1", background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800 }}>📈 3년 배출량 추세 ({REPORT_YEARS[0]}~{REPORT_YEARS[2]})</h4>
          {s1Yearly[1] > 0 && s1Yearly[2] > 0 && (
            <span style={{
              fontSize: 11, fontWeight: 700,
              color: s1Yearly[2] < s1Yearly[1] ? T.emerald : T.rose,
              background: s1Yearly[2] < s1Yearly[1] ? T.emeraldBg : T.roseBg,
              padding: "2px 8px", borderRadius: 4
            }}>
              Scope 1 전년 대비 {s1Yearly[2] < s1Yearly[1] ? "▼" : "▲"} {Math.abs((s1Yearly[2]-s1Yearly[1])/s1Yearly[1]*100).toFixed(1)}%
            </span>
          )}
        </div>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>단위: tCO₂eq · GRI 102-5/6/7 · Scope 1·2·3 전체 3년치 추이</p>
        <ResponsiveContainer width="100%" height={260}>
          <BarChart data={yearlyTrend}>
            <CartesianGrid strokeDasharray="3 3" stroke={T.g200}/>
            <XAxis dataKey="year" tick={{fontSize: 12}}/>
            <YAxis tick={{fontSize: 12}}/>
            <Tooltip/>
            <Legend wrapperStyle={{fontSize: 12}}/>
            <Bar dataKey="Scope 1" fill={T.rose} radius={[4, 4, 0, 0]}/>
            <Bar dataKey="Scope 2" fill={T.amber} radius={[4, 4, 0, 0]}/>
            <Bar dataKey="Scope 3" fill={T.violet} radius={[4, 4, 0, 0]}/>
          </BarChart>
        </ResponsiveContainer>
      </div>
      
      {/* 그래프 2: 최신 연도 Scope 1·2·3 */}
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 4 }}>{YEAR_LATEST}년 Scope 1·2·3</h4>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>최신 연도 기준 · tCO₂eq</p>
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={scopeData123}>
            <CartesianGrid strokeDasharray="3 3" stroke={T.g200}/>
            <XAxis dataKey="name" tick={{fontSize: 12}}/>
            <YAxis tick={{fontSize: 12}}/>
            <Tooltip/>
            <Bar dataKey="value" radius={[6, 6, 0, 0]}>
              {scopeData123.map((e, i) => <Cell key={i} fill={e.fill}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      
      {/* 그래프 3: Scope 1 breakdown */}
      <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 4 }}>Scope 1 배출원 ({YEAR_LATEST})</h4>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>고정연소 vs 이동연소</p>
        {s1Breakdown.length > 0 ? (
          <ResponsiveContainer width="100%" height={220}>
            <PieChart>
              <Pie data={s1Breakdown} cx="50%" cy="50%" innerRadius={50} outerRadius={85} dataKey="value" label={(e) => `${e.name}: ${e.value}t`}>
                {s1Breakdown.map((e, i) => <Cell key={i} fill={e.fill}/>)}
              </Pie>
              <Tooltip/>
            </PieChart>
          </ResponsiveContainer>
        ) : (
          <div style={{ padding: 40, textAlign: "center", color: T.g400, fontSize: 12 }}>Scope 1 데이터 없음</div>
        )}
      </div>
      
      {/* 그래프 4: 감축 목표 진척 게이지 */}
      <div style={{ gridColumn: "1 / -1", background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
        <h4 style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 4 }}>감축 목표 진척률</h4>
        <p style={{ fontSize: 11, color: T.g400, marginBottom: 16 }}>
          기준연도 배출량: {baseYearEmission.toFixed(1)} tCO₂eq · 연간 목표: -{targetAnnual}% · GRI 102-4-i
        </p>
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          <div style={{ flex: 1, background: T.g100, borderRadius: 999, height: 30, overflow: "hidden", position: "relative" }}>
            <div style={{
              background: progress >= 80 ? T.emerald : progress >= 50 ? T.amber : T.rose,
              height: "100%", width: `${progress}%`, borderRadius: 999, transition: "width 0.4s"
            }}/>
            <span style={{
              position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
              fontSize: 12, fontWeight: 700, color: T.white, mixBlendMode: "difference"
            }}>{progress.toFixed(0)}%</span>
          </div>
          <div style={{ fontSize: 14, fontWeight: 700, color: T.g800, minWidth: 120, textAlign: "right" }}>
            현재: {currentEmission.toFixed(1)} tCO₂eq
          </div>
        </div>
      </div>
    </div>
  );
}

function calcScope1Total(s1, targetYear) {
  const year = targetYear || YEAR_LATEST;
  let total = 0;
  [...SF, ...MF].forEach(f => {
    const raw = s1[f.id];
    const amt = getYearValue(raw, year);
    const unit = s1[f.id + "_unit"] || f.baseUnit;
    const conv = (f.units || []).find(u => u.key === unit);
    const factor = conv?.factor || 1;
    // ═ v25 수정: 연간 데이터 우선. 연간이 있으면 월별은 무시 (중복 합산 방지) ═
    if (amt > 0) {
      total += calc(amt * factor, f.ncv, f.co2, f.ch4, f.n2o).t;
      return; // 이 연료는 끝
    }
    // 연간 값이 0일 때만 월별 합산 사용
    const monthly = s1["_monthly_" + f.id];
    let arr = null;
    if (Array.isArray(monthly)) {
      arr = year === YEAR_LATEST ? monthly : null;
    } else if (monthly && typeof monthly === "object") {
      arr = Array.isArray(monthly[year]) ? monthly[year] : null;
    }
    if (arr && arr.length > 0) {
      const sum = arr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      if (sum > 0) total += calc(sum * factor, f.ncv, f.co2, f.ch4, f.n2o).t;
    }
  });
  return total;
}

// 3년치 Scope 1 배출량 배열 반환 [2023, 2024, 2025]
function calcScope1Yearly(s1) {
  return REPORT_YEARS.map(y => calcScope1Total(s1, y));
}

// GRI 102 고급 입력 페이지 (서술 공시 sub-block 렌더)
function GRI102AdvancedPanel({ disclosureCode, blockData, setBlockData, disabled }) {
  const disclosure = GRI102_FIELDS[disclosureCode];
  if (!disclosure) return null;
  
  const storedKey = "_102_sub";
  const stored = blockData[storedKey] || {};
  
  const updateField = (fid, v) => {
    const next = { ...stored, [fid]: v };
    setBlockData(storedKey, { content_json: next });
  };
  
  const filledCount = disclosure.fields.filter(f => {
    const v = stored[f.id]?.v;
    if (Array.isArray(v)) return v.length > 0;
    return v && String(v).trim().length > 0;
  }).length;
  const progress = Math.round((filledCount / disclosure.fields.length) * 100);
  
  return (
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 20 }}>
      <div style={{ marginBottom: 20, paddingBottom: 16, borderBottom: `1px solid ${T.g100}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.emerald, padding: "3px 10px", borderRadius: 4 }}>
            공시 {disclosureCode}
          </span>
          <h3 style={{ fontSize: 17, fontWeight: 700, color: T.g900 }}>
            {disclosure.glossary ? (
              <GlossaryTooltip termKey={disclosure.glossary}>{disclosure.title}</GlossaryTooltip>
            ) : disclosure.title}
          </h3>
          <span style={{ marginLeft: "auto", fontSize: 12, fontWeight: 600, color: progress >= 80 ? T.emerald : progress >= 40 ? T.amber : T.rose }}>
            {filledCount}/{disclosure.fields.length} · {progress}%
          </span>
        </div>
        <p style={{ fontSize: 13, color: T.g500, lineHeight: 1.6 }}>{disclosure.desc}</p>
      </div>
      
      {/* 📘 공시 일반 설명 박스 */}
      <DisclosureGuide code={disclosureCode}/>
      
      {disclosure.fields.map(field => (
        <SubField key={field.id} field={field} 
          value={stored[field.id]} 
          onChange={v => updateField(field.id, v)}
          disabled={disabled}/>
      ))}
    </div>
  );
}

  const visibleBlocks = standard.code === "102"

    const needInput = isMine && !done && ud !== "all";
    const leftBorder = !isMine ? "1px solid " + T.g200
                     : done ? `3px solid ${T.emerald}`
                     : `3px solid ${T.rose}`;
    const cardBg = needInput ? '#fff5f5' : T.white;

    return (
      <div key={block.id} style={{ background: cardBg, borderRadius: 12, border: needInput ? `1px solid ${T.rose}44` : `1px solid ${T.g200}`, overflow: "hidden", borderLeft: leftBorder, opacity: isMine ? 1 : 0.55 }}>
        <div style={{ padding: "16px 24px", borderBottom: `1px solid ${T.g100}`, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            {needInput && <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", background: T.rose, padding: "3px 10px", borderRadius: 4, letterSpacing: "0.03em" }}>✍ 입력 필요</span>}
            {isMine && done && ud !== "all" && <span style={{ fontSize: 11, fontWeight: 600, color: T.emerald, background: T.emeraldBg, padding: "3px 10px", borderRadius: 4 }}>✓ 완료</span>}
            {block.critical && !done && <span style={{ fontSize: 11, fontWeight: 700, color: T.rose }}>⚠ 필수</span>}
            <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>{block.title}</span>
            <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>{DEPTS[block.default_dept]?.name || block.default_dept}</span>
          </div>
          {(isMine || isAdmin) && <button onClick={() => setExOpen(p => ({...p, [block.id]: !p[block.id]}))}
            style={{ fontSize: 12, fontWeight: 500, color: exOpen[block.id] ? T.g600 : T.g400, background: "none", border: `1px solid ${T.g200}`, padding: "5px 12px", borderRadius: 6, cursor: "pointer" }}>
            {exOpen[block.id] ? "닫기" : "예시 보기"}
          </button>}
        </div>

        {(isMine || isAdmin) && (
          <>
            <div style={{ padding: "10px 24px", background: T.g50 }}>
              <p style={{ fontSize: 13, color: T.g500, lineHeight: 1.6 }}>{block.guide}</p>
              <div style={{ display: "flex", gap: 12, marginTop: 6, flexWrap: "wrap" }}>
                {griCodes && <span style={{ fontSize: 11, color: T.g400 }}>📊 GRI {griCodes}</span>}
                {vsmeCodes && <span style={{ fontSize: 11, color: T.g400 }}>📋 VSME {vsmeCodes}</span>}
              </div>
            </div>

            {exOpen[block.id] && block.example && (
              <div style={{ margin: "12px 24px 0", padding: "16px 20px", background: T.g50, borderRadius: 8, borderLeft: `2px solid ${T.g300}` }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: T.g500, marginBottom: 8 }}>베스트 프랙티스 예시</p>
                <p style={{ fontSize: 13, color: T.g600, lineHeight: 1.8 }}>{block.example}</p>
                {block.input_type === "text" && ok && (
                  <button onClick={() => setBlockData(block.id, { content_text: block.example })}
                    style={{ marginTop: 10, fontSize: 12, fontWeight: 500, color: T.g600, background: T.white, border: `1px solid ${T.g300}`, padding: "6px 14px", borderRadius: 6, cursor: "pointer" }}>
                    이 예시 기반으로 작성
                  </button>
                )}
              </div>
            )}

            <div style={{ padding: "16px 24px" }}>
              {block.input_type === "text" ? (
                <div>
                  <textarea value={v?.content_text || ""} disabled={!ok && !isAdmin} rows={5}
                    onChange={e => setBlockData(block.id, { content_text: e.target.value })}
                    placeholder={block.placeholder}
                    style={{ width: "100%", padding: "12px 16px", borderRadius: 8, border: `1px solid ${T.g200}`, background: (ok||isAdmin) ? T.white : T.g50, color: T.g800, fontSize: 14, lineHeight: 1.8, resize: "vertical", opacity: (ok||isAdmin) ? 1 : 0.5 }} />
                  <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 4 }}>
                    <span style={{ fontSize: 11, color: T.g400 }}>{(v?.content_text || "").length}자</span>
                  </div>
                </div>
              ) : (
                <TableInput
                  value={v?.content_json || [{}]}
                  onChange={rows => setBlockData(block.id, { content_json: rows })}
                  disabled={!ok && !isAdmin}
                />
              )}
            </div>
          </>
        )}

        {!isMine && !isAdmin && done && (
          <div style={{ padding: "12px 24px", background: T.g50 }}>
            <p style={{ fontSize: 12, color: T.g400 }}>작성 완료</p>
          </div>
        )}
      </div>
    );
  };

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // GRI 102 서브페이지 렌더링 (subPage에 따라 다른 내용)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if (standard.code === "102") {
    const scopeBlocks = blocks.filter(b => isScope(b));
    const s1Block = scopeBlocks.find(b => b.input_type === 'scope1_table');
    const s2Block = scopeBlocks.find(b => b.input_type === 'scope2_table');
    const s3Block = scopeBlocks.find(b => b.input_type === 'scope3_table');
    
    const renderHeader = (icon, subtitle) => (
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.g400 }}>{standard.category}</span>
          <span style={{ color: T.g300 }}>·</span>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>{icon} {standard.title}</h2>
        </div>
        <p style={{ fontSize: 14, color: T.g500 }}>{subtitle}</p>
      </div>
    );
    
    // 배출량 페이지 (최상단 · 기본)
    if (subPage === "emissions" || !subPage) {
      return (
        <div>
          {renderHeader("📊", "Scope 1 · 2 · 3 배출량 입력 — 활동량을 입력하면 최신 배출계수로 tCO₂eq 자동 계산")}
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {s1Block && renderBlock(s1Block, true)}
            {s2Block && renderBlock(s2Block, true)}
            {s3Block && renderBlock(s3Block, true)}
          </div>
        </div>
      );
    }
    
    // 대시보드 페이지
    if (subPage === "dashboard") {
      return (
        <div>
          {renderHeader("📈", "실시간 배출량 그래프 · 감축 목표 진척률 · 3년 추세")}
          <ClimateGraphs scopeData={scopeData} blockData={blockData}/>
        </div>
      );
    }
    
    // 서술 공시 페이지 (각 공시별)
    const disclosureMap = {
      "transition": { code: "102-1", icon: "📝", title: "전환계획", subtitle: "파리협정 1.5°C 부합 전환계획 수립 — GRI 102-1", dept: ["env", "mgmt"] },
      "adaptation": { code: "102-2", icon: "🌊", title: "적응계획", subtitle: "기후변화 물리적 리스크 대응 계획 — GRI 102-2", dept: ["env", "fac"] },
      "just": { code: "102-3", icon: "👥", title: "공정한 전환", subtitle: "직원·지역사회 영향 관리 — GRI 102-3", dept: ["mgmt", "admin"] },
      "target": { code: "102-4", icon: "🎯", title: "감축 목표", subtitle: "단기·중기·장기 감축 목표 설정 — GRI 102-4", dept: ["env"] },
      "removal": { code: "102-9", icon: "🌳", title: "가치사슬 제거", subtitle: "가치사슬 내 탄소 제거 활동 — GRI 102-9", dept: ["env"] },
      "credit": { code: "102-10", icon: "💳", title: "탄소 크레딧", subtitle: "탄소 크레딧 구매·사용 정책 — GRI 102-10", dept: ["mgmt"] },
    };
    
    const discl = disclosureMap[subPage];
    if (discl) {
      const isUserDisabled = !isAdmin && !discl.dept.some(d => ce(d));
      return (
        <div>
          {renderHeader(discl.icon, discl.subtitle)}
          <GRI102AdvancedPanel 
            disclosureCode={discl.code} 
            blockData={blockData} 
            setBlockData={setBlockData} 
            disabled={isUserDisabled}/>
        </div>
      );
    }
    
    // 기본값: 배출량으로
    return (
      <div>
        {renderHeader("📊", "Scope 1 · 2 · 3 배출량 입력")}
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          {s1Block && renderBlock(s1Block, true)}
          {s2Block && renderBlock(s2Block, true)}
          {s3Block && renderBlock(s3Block, true)}
        </div>
      </div>
    );
  }
  
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 그 외 GRI 표준 (기존 로직 유지)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.g400 }}>{standard.category}</span>
          <span style={{ color: T.g300 }}>·</span>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>{standard.title}</h2>
        </div>
        <p style={{ fontSize: 14, color: T.g500 }}>{standard.description}</p>
      </div>

      {ud !== "all" && myBlocks.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <p style={{ fontSize: 12, fontWeight: 600, color: T.g500, marginBottom: 12, letterSpacing: "0.04em" }}>내 담당 항목 ({myBlocks.length})</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {myBlocks.map(b => renderBlock(b, true))}
          </div>
        </div>
      )}

      {ud !== "all" && otherBlocks.length > 0 && (
        <div>
          <button onClick={() => setOtherOpen(!otherOpen)}
            style={{ fontSize: 12, fontWeight: 500, color: T.g400, background: "none", border: "none", cursor: "pointer", padding: "8px 0", display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 10, transform: otherOpen ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s", display: "inline-block" }}>▶</span>
            다른 부서 항목 ({otherBlocks.length})
          </button>
          {otherOpen && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 4 }}>
              {otherBlocks.map(b => renderBlock(b, false))}
            </div>
          )}
        </div>
      )}

      {ud === "all" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {visibleBlocks.map(b => renderBlock(b, true))}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// ⚡ GRI 103: 에너지 2025
// ═══════════════════════════════════════════════════════════════════════
function GRI103Panel({ subPage, scopeData, blockData, setBlockData, ud, isAdmin }) {
  const ce = d => ud === "all" || ud === d;
  const isUserEnv = ce("env") || isAdmin;
  
  const energyMeta = blockData["_103_meta"] || {};
  const setEnergyMeta = (key, val) => {
    setBlockData(d => ({ ...d, "_103_meta": { ...(d["_103_meta"] || {}), [key]: val } }));
  };
  
  const calcFuelEnergyGJ = (year) => {
    let total = 0;
    const s1 = scopeData.s1 || {};
    const fuelMap = { gas: "gasoline", diesel_m: "diesel", diesel_b: "diesel", lng: "lng", lpg: "lpg", lpg_m: "lpg", kero: "kero", bcoil: "bcoil" };
    for (const [fId, mapId] of Object.entries(fuelMap)) {
      const raw = s1[fId];
      let amount = 0;
      if (typeof raw === "object" && raw !== null) amount = parseFloat(raw[year]) || 0;
      else if (year === YEAR_LATEST) amount = parseFloat(raw) || 0;
      if (amount > 0) total += fuelToGJ(mapId, amount);
    }
    return total;
  };
  
  const calcElectricityGJ = (year) => {
    const s2 = scopeData.s2 || {};
    let kwh = parseFloat(s2["yearly_val_" + year]) || 0;
    if (!kwh && year === YEAR_LATEST) kwh = parseFloat(s2.yearly_val) || 0;
    if (!kwh) {
      const m = s2["_monthly_" + year];
      if (Array.isArray(m)) kwh = m.reduce((a, b) => a + (parseFloat(b) || 0), 0);
    }
    return kwhToGJ(kwh);
  };
  
  const getSelfRenewableGJ = (year) => parseFloat(energyMeta["self_renew_" + year]) || 0;
  
  const calcTotalEnergyGJ = (year) => 
    calcFuelEnergyGJ(year) + calcElectricityGJ(year) + getSelfRenewableGJ(year);
  
  const energyByYear = REPORT_YEARS.map(y => ({
    year: y,
    fuel: calcFuelEnergyGJ(y),
    electricity: calcElectricityGJ(y),
    renewable: getSelfRenewableGJ(y),
    total: calcTotalEnergyGJ(y),
  }));
  
  const Header = ({ icon, sub }) => (
    <div style={{ marginBottom: 24 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
        <span style={{ fontSize: 13, fontWeight: 500, color: T.g400 }}>환경</span>
        <span style={{ color: T.g300 }}>·</span>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>{icon} GRI 103: 에너지 2025</h2>
      </div>
      <p style={{ fontSize: 14, color: T.g500 }}>{sub}</p>
    </div>
  );
  
  if (subPage === "consumption" || !subPage) {
    const latest = energyByYear[2];
    const renewablePct = latest.total > 0 ? (latest.renewable / latest.total * 100) : 0;
    return (
      <div>
        <Header icon="⚡" sub="조직 내 총 에너지 소비량 (GRI 103-2) — 연료·구매전력·자체생산 재생에너지 자동 합산"/>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
          <div style={{ background: T.blueBg, border: `1px solid ${T.blue}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>총 에너지 소비 ({YEAR_LATEST})</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.total.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ</p>
          </div>
          <div style={{ background: T.amberBg, border: `1px solid ${T.amber}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>연료 (Scope 1)</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.fuel.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ · 비재생</p>
          </div>
          <div style={{ background: T.violetBg, border: `1px solid ${T.violet}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>구매전력 (Scope 2)</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.electricity.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>GJ</p>
          </div>
          <div style={{ background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>재생에너지 비율</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{renewablePct.toFixed(1)}%</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>자체 생산 기준</p>
          </div>
        </div>
        <div style={{ padding: 14, background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, marginBottom: 16 }}>
          <p style={{ fontSize: 13, fontWeight: 700, color: T.g800, marginBottom: 4 }}>🔗 GRI 102와 자동 연동</p>
          <p style={{ fontSize: 12, color: T.g600, lineHeight: 1.6 }}>
            Scope 1 연료(휘발유·경유·LNG·LPG·등유 등)와 Scope 2 전력은 GRI 102에서 입력한 데이터를 <strong>발열량 기준으로 자동 환산(GJ)</strong>합니다.
            여기서는 <strong>자체 생산 재생에너지</strong>(태양광·풍력 자가소비)만 별도로 입력하세요.
          </p>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden", marginBottom: 20 }}>
          <div style={{ padding: "14px 20px", borderBottom: `1px solid ${T.g100}`, background: T.g50 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: T.g800 }}>📊 3년치 에너지 소비량 (단위: GJ)</p>
          </div>
          <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${T.g200}` }}>
                <th style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, color: T.g500, fontWeight: 600 }}>구분</th>
                {REPORT_YEARS.map(y => (
                  <th key={y} style={{ padding: "10px 14px", textAlign: "right", fontSize: 11, color: y === YEAR_LATEST ? T.g800 : T.g500, fontWeight: 600 }}>
                    {y}년{y === YEAR_LATEST ? " (최신)" : ""}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              <tr style={{ borderBottom: `1px solid ${T.g100}` }}>
                <td style={{ padding: "10px 14px", color: T.g700 }}>🔥 연료 소비 (비재생) <span style={{ fontSize: 10, color: T.g400 }}>- 103-2-a</span></td>
                {energyByYear.map(e => (
                  <td key={e.year} style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: T.g800, fontFeatureSettings: "'tnum'" }}>
                    {e.fuel > 0 ? e.fuel.toFixed(1) : "-"}
                  </td>
                ))}
              </tr>
              <tr style={{ borderBottom: `1px solid ${T.g100}` }}>
                <td style={{ padding: "10px 14px", color: T.g700 }}>⚡ 구매 전력 <span style={{ fontSize: 10, color: T.g400 }}>- 103-2-b</span></td>
                {energyByYear.map(e => (
                  <td key={e.year} style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: T.g800, fontFeatureSettings: "'tnum'" }}>
                    {e.electricity > 0 ? e.electricity.toFixed(1) : "-"}
                  </td>
                ))}
              </tr>
              <tr style={{ borderBottom: `1px solid ${T.g100}` }}>
                <td style={{ padding: "10px 14px", color: T.g700 }}>☀️ 자체 생산 재생에너지 <span style={{ fontSize: 10, color: T.g400 }}>- 103-2-c · 수동 입력 (GJ)</span></td>
                {REPORT_YEARS.map(y => (
                  <td key={y} style={{ padding: "4px 8px", textAlign: "right" }}>
                    <input type="number" value={energyMeta["self_renew_" + y] || ""}
                      disabled={!isUserEnv}
                      onChange={e => setEnergyMeta("self_renew_" + y, e.target.value)}
                      placeholder="0"
                      style={{ width: 100, padding: "6px 10px", borderRadius: 5, border: `1px solid ${T.g200}`,
                        fontSize: 12, fontWeight: 600, textAlign: "right", background: isUserEnv ? T.white : T.g50 }} />
                  </td>
                ))}
              </tr>
              <tr style={{ background: T.g50 }}>
                <td style={{ padding: "12px 14px", color: T.g900, fontWeight: 800 }}>조직 내 총 에너지 소비</td>
                {energyByYear.map(e => (
                  <td key={e.year} style={{ padding: "12px 14px", textAlign: "right", fontWeight: 800, color: T.g900, fontSize: 14, fontFeatureSettings: "'tnum'" }}>
                    {e.total.toFixed(1)}
                  </td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
        <p style={{ fontSize: 11, color: T.g400, lineHeight: 1.6, paddingTop: 8 }}>
          💡 발열량 출처: 환경부고시 제2024-155호 [별표 12] · 전력 환산: 1 kWh = 0.0036 GJ · 연료 → MJ 발열량 × 사용량 → GJ.
        </p>
      </div>
    );
  }
  
  if (subPage === "intensity") {
    const latest = energyByYear[2];
    const revenue = parseFloat(energyMeta["revenue_" + YEAR_LATEST]) || 0;
    const production = parseFloat(energyMeta["production_" + YEAR_LATEST]) || 0;
    const employees = parseFloat(energyMeta["employees_" + YEAR_LATEST]) || 0;

              { key: "revenue", label: "매출액 (억원)", icon: "💰" },
              { key: "production", label: "생산량 (톤)", icon: "🏭" },

              <div key={m.key}>

        </div>
      </div>

  }
  
  if (subPage === "reduction") {
    const baseYear = parseInt(energyMeta["base_year"]) || REPORT_YEARS[0];

          <div style={{ background: reduction > 0 ? T.emeraldBg : T.roseBg, border: `1px solid ${reduction > 0 ? T.emerald : T.rose}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>감축률</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: reduction > 0 ? T.emerald : T.rose, fontFeatureSettings: "'tnum'" }}>
              {reduction > 0 ? "▼" : "▲"} {Math.abs(reductionPct).toFixed(1)}%
            </p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>기준 대비</p>
          </div>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 20 }}>
          <p style={{ fontSize: 14, fontWeight: 700, color: T.g800, marginBottom: 6 }}>📝 감축 활동 서술</p>
          <p style={{ fontSize: 11, color: T.g500, marginBottom: 14 }}>4개 질문에 답하시면 감축 활동 문안이 자동 완성됩니다.</p>
          <QuizLayered 
            quiz={QUIZ_103_REDUCTION}
            savedAnswers={(energyMeta["reduction_data"] && energyMeta["reduction_data"].answers) || null}
            savedText={(energyMeta["reduction_data"] && energyMeta["reduction_data"].v) || null}
            onSave={(result) => setEnergyMeta("reduction_data", { answers: result.answers, v: result.text })}
            disabled={!isUserEnv}
          />
        </div>
      </div>
    );
  }
  
  if (subPage === "policy") {
    return (
      <div>

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

          <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 16 }}>

            <p style={{ fontSize: 11, color: T.g500, marginBottom: 14 }}>3개 질문에 답하시면 정책 방침이 자동 완성됩니다.</p>
            <QuizLayered 
              quiz={QUIZ_103_POLICY_STATEMENT}
              savedAnswers={(energyMeta["policy_statement_data"] && energyMeta["policy_statement_data"].answers) || null}
              savedText={(energyMeta["policy_statement_data"] && energyMeta["policy_statement_data"].v) || null}
              onSave={(result) => setEnergyMeta("policy_statement_data", { answers: result.answers, v: result.text })}
              disabled={!isUserEnv}
            />
          </div>

          {/* 거버넌스 - 퀴즈 */}
          <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 16 }}>

            <QuizLayered 
              quiz={QUIZ_103_POLICY_GOV}
              savedAnswers={(energyMeta["policy_gov_data"] && energyMeta["policy_gov_data"].answers) || null}
              savedText={(energyMeta["policy_gov_data"] && energyMeta["policy_gov_data"].v) || null}
              onSave={(result) => setEnergyMeta("policy_gov_data", { answers: result.answers, v: result.text })}
              disabled={!isUserEnv}
            />
          </div>

          {/* 목표 수치 - 퀴즈 */}
          <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 16 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: T.g800, marginBottom: 6 }}>에너지 관리 목표 (수치)</p>
            <p style={{ fontSize: 11, color: T.g500, marginBottom: 14 }}>3개 질문에 답하시면 단기·중기·장기 목표가 자동 설정됩니다.</p>
            <QuizLayered 
              quiz={QUIZ_103_TARGET}
              savedAnswers={(energyMeta["target_data"] && energyMeta["target_data"].answers) || null}
              savedText={(energyMeta["target_data"] && energyMeta["target_data"].v) || null}
              onSave={(result) => setEnergyMeta("target_data", { answers: result.answers, v: result.text })}
              disabled={!isUserEnv}
            />
          </div>
        </div>
      </div>
    );
  }
  
  return null;
}

// 🗑️ GRI 306: 폐기물 2020
// ═══════════════════════════════════════════════════════════════════════
function GRI306Panel({ subPage, blockData, setBlockData, ud, isAdmin }) {
  const ce = d => ud === "all" || ud === d;
  const isUserFac = ce("fac") || ce("env") || isAdmin;
  const wasteMeta = blockData["_306_meta"] || {};
  const setWasteMeta = (key, val) => {
    setBlockData(d => ({ ...d, "_306_meta": { ...(d["_306_meta"] || {}), [key]: val } }));
  };
  
  const WASTE_TYPES = [
    { id: "general", name: "일반폐기물 (사업장)", hazard: false },
    { id: "designated", name: "지정폐기물 (유해)", hazard: true },
    { id: "recycle_paper", name: "재활용 (종이·골판지)", recyclable: true },
    { id: "recycle_plastic", name: "재활용 (플라스틱)", recyclable: true },
    { id: "recycle_metal", name: "재활용 (금속)", recyclable: true },
    { id: "sludge", name: "폐수처리 슬러지", hazard: true },
  ];
  
  const getAmount = (wId, year) => parseFloat(wasteMeta[wId + "_" + year]) || 0;
  
  const yearTotals = REPORT_YEARS.map(y => {
    const t = WASTE_TYPES.reduce((acc, w) => {
      const amount = getAmount(w.id, y);
      acc.total += amount;
      if (w.hazard) acc.hazard += amount;
      if (w.recyclable) acc.recycle += amount;
      return acc;
    }, { total: 0, hazard: 0, recycle: 0 });
    t.recyclePct = t.total > 0 ? (t.recycle / t.total * 100) : 0;
    t.year = y;
    return t;
  });
  
  const Header = ({ icon, sub }) => (
    <div style={{ marginBottom: 24 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
        <span style={{ fontSize: 13, fontWeight: 500, color: T.g400 }}>환경</span>
        <span style={{ color: T.g300 }}>·</span>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>{icon} GRI 306: 폐기물 2020</h2>
      </div>
      <p style={{ fontSize: 14, color: T.g500 }}>{sub}</p>
    </div>
  );
  
  if (subPage === "generation" || !subPage) {
    const latest = yearTotals[2];
    return (
      <div>
        <Header icon="🗑️" sub="폐기물 발생·재활용·처분 (GRI 306-3, 4, 5) — 일반·지정·재활용 3년치 관리"/>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
          <div style={{ background: T.blueBg, border: `1px solid ${T.blue}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>총 발생량 ({YEAR_LATEST})</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.total.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>ton</p>
          </div>
          <div style={{ background: T.roseBg, border: `1px solid ${T.rose}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>지정폐기물 (유해)</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.hazard.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>ton</p>
          </div>
          <div style={{ background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>재활용량</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.recycle.toFixed(1)}</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>ton</p>
          </div>
          <div style={{ background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, padding: 16 }}>
            <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>재활용률</p>
            <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{latest.recyclePct.toFixed(1)}%</p>
            <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>전체 대비</p>
          </div>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
          <div style={{ padding: "14px 20px", borderBottom: `1px solid ${T.g100}`, background: T.g50 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: T.g800 }}>📊 폐기물 종류별 3년치 발생량 (단위: ton)</p>
            <p style={{ fontSize: 11, color: T.g500, marginTop: 4 }}>💡 사업장 폐기물 배출자 신고서 또는 올바로시스템 데이터 활용</p>
          </div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${T.g200}`, background: T.g50 }}>
                <th style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, color: T.g500, fontWeight: 600 }}>종류</th>
                <th style={{ padding: "10px 14px", textAlign: "center", fontSize: 11, color: T.g500, fontWeight: 600, width: 90 }}>특성</th>
                {REPORT_YEARS.map(y => (
                  <th key={y} style={{ padding: "10px 8px", textAlign: "center", fontSize: 11, color: y === YEAR_LATEST ? T.g800 : T.g500, fontWeight: 600 }}>
                    {y}년{y === YEAR_LATEST ? " (최신)" : ""}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {WASTE_TYPES.map((w, i) => (
                <tr key={w.id} style={{ borderBottom: i < WASTE_TYPES.length - 1 ? `1px solid ${T.g100}` : "none" }}>
                  <td style={{ padding: "10px 14px", fontWeight: 500, color: T.g800 }}>{w.name}</td>
                  <td style={{ padding: "10px 14px", textAlign: "center", fontSize: 10 }}>
                    {w.hazard && <span style={{ color: T.rose, fontWeight: 700, background: T.roseBg, padding: "2px 6px", borderRadius: 3 }}>⚠ 유해</span>}
                    {w.recyclable && <span style={{ color: T.emerald, fontWeight: 700, background: T.emeraldBg, padding: "2px 6px", borderRadius: 3 }}>♻ 재활용</span>}
                  </td>
                  {REPORT_YEARS.map(y => (
                    <td key={y} style={{ padding: "6px 4px", textAlign: "center" }}>
                      <input type="number" value={wasteMeta[w.id + "_" + y] || ""}
                        disabled={!isUserFac}
                        onChange={e => setWasteMeta(w.id + "_" + y, e.target.value)}
                        placeholder="0"
                        style={{ width: "90%", padding: "6px 8px", borderRadius: 5, border: `1px solid ${T.g200}`,
                          fontSize: 12, fontWeight: 600, textAlign: "right", background: isUserFac ? T.white : T.g50 }} />
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p style={{ fontSize: 11, color: T.g400, lineHeight: 1.6, marginTop: 12 }}>
          💡 <strong>306-3 발생량</strong>: 전체 합계 · <strong>306-4 재활용</strong>: ♻ 태그 · <strong>306-5 처분</strong>: 일반·지정폐기물.
          근거: 폐기물관리법 시행령 [별표 4, 5].
        </p>
      </div>
    );
  }
  
  if (subPage === "policy") {
    return (
      <div>
        <Header icon="📝" sub="폐기물 관리 정책 (GRI 306-1, 2) — 자원순환 목표·감량·재활용"/>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {/* 통합 정책 - 퀴즈 */}
          <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 16 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: T.g800, marginBottom: 6 }}>폐기물 관리 정책 (통합)</p>
            <p style={{ fontSize: 11, color: T.g500, marginBottom: 14 }}>4개 질문에 답하시면 폐기물 정책 문안이 자동 완성됩니다.</p>
            <QuizLayered 
              quiz={QUIZ_306_POLICY}
              savedAnswers={(wasteMeta["policy_data"] && wasteMeta["policy_data"].answers) || null}
              savedText={(wasteMeta["policy_data"] && wasteMeta["policy_data"].v) || null}
              onSave={(result) => setWasteMeta("policy_data", { answers: result.answers, v: result.text })}
              disabled={!isUserFac}
            />
          </div>
          
          {/* 재활용·감량 활동 + 법규 - 퀴즈 */}
          <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 16 }}>

            <p style={{ fontSize: 11, color: T.g500, marginBottom: 14 }}>3개 질문에 답하시면 활동 문안이 자동 완성됩니다.</p>
            <QuizLayered

// 📄 보고서 미리보기 (POLICY · ACTIONS · METRICS · TARGETS 4칸)
// 와이씨켐 v9 스타일 레이아웃
// ═══════════════════════════════════════════════════════════════════════
function ReportPreview({ scopeData, blockData }) {
  const sub = blockData["_102_sub"] || {};
  const getText = (fid) => {
    const v = sub[fid];
    if (!v) return null;
    if (typeof v === "object" && v.v) return v.v;
    if (typeof v === "string") return v;
    return null;
  };
  const getNumber = (fid) => {
    const v = sub[fid];
    if (!v) return null;
    if (typeof v === "object" && v.v) return v.v;
    if (typeof v === "string" || typeof v === "number") return v;
    return null;
  };
  
  // 3년치 배출량 계산
  const s1Yearly = calcScope1Yearly(scopeData.s1);
  
  const calcS2 = (year) => {
    const s2 = scopeData.s2;
    let v = parseFloat(s2["yearly_val_" + year]) || 0;
    if (!v && year === YEAR_LATEST) v = parseFloat(s2.yearly_val) || 0;
    if (!v) {
      const m = s2["_monthly_" + year];
      if (Array.isArray(m)) v = m.reduce((a, b) => a + (parseFloat(b) || 0), 0);
      else if (year === YEAR_LATEST) {
        for (let i = 0; i < 12; i++) v += parseFloat(s2[i]) || 0;
      }
    }
    const kwh = s2.input_type === "원" ? v / 165 : v;
    return (kwh / 1000) * getPowerEF(year);
  };
  const s2Yearly = REPORT_YEARS.map(y => calcS2(y));
  
  const calcS3 = (year) => S3.reduce((sum, c) => {
    if (c.id === "c7" && year !== YEAR_LATEST) return sum;
    const raw = scopeData.s3[c.id];
    let val = 0;
    if (typeof raw === "object" && raw !== null) val = parseFloat(raw[year]) || 0;
    else if (year === YEAR_LATEST) val = parseFloat(raw) || 0;
    return sum + val * (c.ef || 0);
  }, 0);
  const s3Yearly = REPORT_YEARS.map(y => calcS3(y));
  
  const totalYearly = REPORT_YEARS.map((_, i) => s1Yearly[i] + s2Yearly[i] + s3Yearly[i]);
  
  // 감축률 (2023 대비 2025)
  const reductionPct = totalYearly[0] > 0 
    ? ((totalYearly[0] - totalYearly[2]) / totalYearly[0] * 100).toFixed(1)
    : null;
  
  const baseYear = getNumber("4_base_year") || REPORT_YEARS[0];
  const targetShort = getNumber("4_target_short") || "1.5";
  const targetMid = getNumber("4_target_mid") || "10";
  const targetLong = getNumber("4_target_long") || "20";
  
  const capex = getNumber("1c_capex");
  const opex = getNumber("1c_opex");
  const revenue = getNumber("1c_revenue");
  
  // 카드 컴포넌트
  const Card = ({ icon, title, subtitle, children, color }) => (
    <div style={{
      background: T.white, borderRadius: 12, padding: 20,
      border: `1px solid ${T.g200}`,
      borderTop: `4px solid ${color}`,
      minHeight: 300, display: "flex", flexDirection: "column"
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
        <span style={{ fontSize: 18 }}>{icon}</span>
        <h3 style={{ fontSize: 15, fontWeight: 700, color: T.g900 }}>{title}</h3>
      </div>
      <p style={{ fontSize: 11, color: T.g400, marginBottom: 14, letterSpacing: "0.04em", textTransform: "uppercase" }}>{subtitle}</p>
      <div style={{ flex: 1 }}>{children}</div>
    </div>
  );

  return (
    <div style={{ maxWidth: 1200, margin: "0 auto" }}>
      {/* 헤더 */}
      <div style={{ marginBottom: 24, paddingBottom: 16, borderBottom: `2px solid ${T.g900}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: T.white, background: T.g900, padding: "4px 10px", borderRadius: 4, letterSpacing: "0.06em" }}>
            GRI 102 · 기후변화 2025
          </span>
          <span style={{ fontSize: 11, color: T.g500 }}>보고 기간: {REPORT_YEARS[0]} ~ {REPORT_YEARS[2]}</span>
        </div>
        <h1 style={{ fontSize: 26, fontWeight: 800, color: T.g900, letterSpacing: "-0.02em", marginBottom: 4 }}>
          기후변화 대응 보고서
        </h1>
        <p style={{ fontSize: 13, color: T.g500 }}>
          파리협정 1.5°C 부합 전환 계획 · 감축 목표 및 이행 현황 · 공정한 전환
        </p>
      </div>
      
      {/* 상단 요약 KPI */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 24 }}>
        <div style={{ background: T.emeraldBg, border: `1px solid ${T.emerald}33`, borderRadius: 10, padding: 16 }}>
          <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>TOTAL EMISSIONS ({YEAR_LATEST})</p>
          <p style={{ fontSize: 22, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>
            {totalYearly[2].toFixed(1)}

          <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>tCO₂eq</p>
        </div>
        <div style={{ background: T.blueBg, border: `1px solid ${T.blue}33`, borderRadius: 10, padding: 16 }}>
          <p style={{ fontSize: 10, color: T.g500, letterSpacing: "0.06em", marginBottom: 4 }}>YEAR-OVER-YEAR</p>
          <p style={{ fontSize: 22, fontWeight: 700, color: reductionPct && +reductionPct > 0 ? T.emerald : T.rose, fontFeatureSettings: "'tnum'" }}>
            {reductionPct !== null ? (+reductionPct > 0 ? "▼" : "▲") + " " + Math.abs(+reductionPct) + "%" : "-"}

          <p style={{ fontSize: 11, color: T.g600, marginTop: 2 }}>{REPORT_YEARS[0]} → {REPORT_YEARS[2]}</p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 24 }}>
        
        {/* POLICY */}
        <Card icon="📜" title="POLICY" subtitle="정책 및 거버넌스 · GRI 102-1-a, 1-d" color={T.blue}>
