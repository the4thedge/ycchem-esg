<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG 데이터 플랫폼 · 와이씨켐</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback, useEffect } = React;

const T = {
  bg: "#f9fafb", white: "#ffffff",
  g50: "#f9fafb", g100: "#f3f4f6", g200: "#e5e7eb", g300: "#d1d5db",
  g400: "#9ca3af", g500: "#6b7280", g600: "#4b5563", g700: "#374151", g800: "#1f2937", g900: "#111827",
  blue: "#3b82f6", indigo: "#6366f1", emerald: "#10b981", amber: "#f59e0b", rose: "#ef4444", violet: "#8b5cf6",
  blueBg: "rgba(59,130,246,0.08)", emeraldBg: "rgba(16,185,129,0.08)", roseBg: "rgba(239,68,68,0.08)", violetBg: "rgba(139,92,246,0.08)", amberBg: "rgba(245,158,11,0.08)",
};

const DEPTS = {
  env: { name: "환경안전 · 환경", color: T.emerald },
  fac: { name: "환경안전 · 시설", color: T.amber },
  admin: { name: "총무과", color: T.blue },
  mgmt: { name: "경영기획", color: T.violet },
  prod: { name: "생산부", color: T.rose },
  purch: { name: "구매/SCM", color: "#f97316" },
};

const USERS = {
  env: { id: "env", name: "김환경", dept: "env", pw: "1234" },
  fac: { id: "fac", name: "이시설", dept: "fac", pw: "1234" },
  admin: { id: "admin", name: "박총무", dept: "admin", pw: "1234" },
  mgmt: { id: "mgmt", name: "최기획", dept: "mgmt", pw: "1234" },
  prod: { id: "prod", name: "정생산", dept: "prod", pw: "1234" },
  purch: { id: "purch", name: "한구매", dept: "purch", pw: "1234" },
  super: { id: "super", name: "곽종수", dept: "all", pw: "admin" },
};

const SF = [
  { id: "lng", name: "LNG (도시가스)", u: "천Nm³", ncv: 43.98, co2: 56100, ch4: 5, n2o: 0.1, dept: "fac" },
  { id: "lpg", name: "LPG (프로판)", u: "톤", ncv: 50.23, co2: 63100, ch4: 5, n2o: 0.1, dept: "fac" },
  { id: "kero", name: "등유", u: "㎘", ncv: 34.76, co2: 71900, ch4: 10, n2o: 0.6, dept: "fac" },
  { id: "diesel_b", name: "경유 (보일러)", u: "㎘", ncv: 35.29, co2: 74100, ch4: 10, n2o: 0.6, dept: "fac" },
  { id: "bcoil", name: "B-C유", u: "㎘", ncv: 39.99, co2: 77400, ch4: 10, n2o: 0.6, dept: "fac" },
];
const MF = [
  { id: "gas", name: "휘발유", u: "㎘", ncv: 31.0, co2: 69300, ch4: 33, n2o: 3.2, dept: "admin" },
  { id: "diesel_m", name: "경유 (차량)", u: "㎘", ncv: 35.29, co2: 74100, ch4: 3.9, n2o: 3.9, dept: "admin" },
  { id: "lpg_m", name: "LPG (차량)", u: "㎘", ncv: 28.73, co2: 63100, ch4: 62, n2o: 0.2, dept: "admin" },
];
const MO = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const S3 = [
  { id: "c1", name: "구매 제품·서비스", c: "Cat.1", dept: "purch", ef: 1.1895 },
  { id: "c2", name: "자본재", c: "Cat.2", dept: "mgmt", ef: 0.7368 },
  { id: "c4", name: "업스트림 운송", c: "Cat.4", dept: "purch", ef: 0.8522 },
  { id: "c5", name: "폐기물", c: "Cat.5", dept: "env", ef: 2.1703 },
  { id: "c6", name: "출장", c: "Cat.6", dept: "admin", ef: 0.8522 },
  { id: "c7", name: "직원 통근", c: "Cat.7", dept: "mgmt", ef: null },
];
const EFS2 = 0.4594;
const calc = (c,ncv,co2,ch4,n2o) => {if(!c)return{e:0,t:0,co2:0,ch4:0,n2o:0};const e=c*ncv/1000;return{e,co2:e*co2/1000,ch4:e*ch4/1000*25,n2o:e*n2o/1000*298,t:e*co2/1000+e*ch4/1000*25+e*n2o/1000*298};};

const globalCSS = `
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
* { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; box-sizing: border-box; margin: 0; }
::selection { background: ${T.blue}22; }
input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 2px ${T.blue}33; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: ${T.g300}; border-radius: 10px; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
`;

const KPI = ({ label, value, unit, color }) => (
  <div style={{ padding: "20px 24px", background: T.white, borderRadius: 12, border: `1px solid ${T.g200}` }}>
    <p style={{ fontSize: 13, fontWeight: 500, color: T.g500, marginBottom: 8 }}>{label}</p>
    <p style={{ fontSize: 30, fontWeight: 700, color: color || T.g900, letterSpacing: "-0.03em", lineHeight: 1 }}>
      {typeof value === "number" ? value.toLocaleString(undefined, { maximumFractionDigits: 1 }) : value}
    </p>
    <p style={{ fontSize: 12, color: T.g400, marginTop: 6 }}>{unit}</p>
  </div>
);

const Bar = ({ pct, color, h = 4 }) => (
  <div style={{ width: "100%", height: h, borderRadius: h, background: T.g100, overflow: "hidden" }}>
    <div style={{ width: `${Math.max(pct, 1)}%`, height: "100%", borderRadius: h, background: color, transition: "width 0.5s ease" }} />
  </div>
);

function Login({ onLogin }) {
  const [sel, setSel] = useState(null);
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  return (
    <div style={{ minHeight: "100vh", display: "flex", background: T.g50 }}>
      <style>{globalCSS}</style>
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ width: 400 }}>
          <div style={{ marginBottom: 40 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 32 }}>
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill={T.g900}/><path d="M8 9h12M8 14h8M8 19h10" stroke="#fff" strokeWidth="2" strokeLinecap="round"/></svg>
              <span style={{ fontSize: 16, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>The 4th Edge</span>
            </div>
            <h1 style={{ fontSize: 28, fontWeight: 700, color: T.g900, letterSpacing: "-0.03em", lineHeight: 1.2 }}>ESG 데이터 플랫폼</h1>
            <p style={{ fontSize: 15, color: T.g500, marginTop: 8 }}>와이씨켐 GRI 2025 데이터 수집</p>
          </div>
          <div style={{ marginBottom: 24 }}>
            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: T.g700, marginBottom: 8 }}>담당 부서</label>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
              {Object.entries(DEPTS).map(([k, d]) => (
                <button key={k} onClick={() => { setSel(k); setErr(""); setPw(""); }}
                  style={{ padding: "12px 8px", borderRadius: 8, border: `1px solid ${sel === k ? T.g900 : T.g200}`, background: sel === k ? T.g50 : T.white, cursor: "pointer", textAlign: "center" }}>
                  <div style={{ fontSize: 13, fontWeight: sel === k ? 600 : 400, color: sel === k ? T.g900 : T.g600 }}>{d.name.split(" · ")[0]}</div>
                  {d.name.includes("·") && <div style={{ fontSize: 11, color: T.g400, marginTop: 1 }}>{d.name.split(" · ")[1]}</div>}
                </button>
              ))}
            </div>
            <button onClick={() => { setSel("super"); setErr(""); setPw(""); }}
              style={{ width: "100%", marginTop: 6, padding: "10px", borderRadius: 8, border: `1px solid ${sel === "super" ? T.g900 : T.g200}`, background: sel === "super" ? T.g50 : T.white, cursor: "pointer", fontSize: 13, fontWeight: sel === "super" ? 600 : 400, color: sel === "super" ? T.g900 : T.g500 }}>
              관리자 (전체 조회)
            </button>
          </div>
          {sel && (
            <div>
              <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: T.g700, marginBottom: 8 }}>비밀번호</label>
              <input type="password" value={pw} placeholder="입력하세요"
                onChange={e => { setPw(e.target.value); setErr(""); }}
                onKeyDown={e => { if (e.key === "Enter") { const u = USERS[sel]; if (u && pw === u.pw) onLogin(u); else setErr("비밀번호를 확인하세요"); }}}
                style={{ width: "100%", padding: "10px 14px", borderRadius: 8, border: `1.5px solid ${err ? T.rose : T.g200}`, background: T.white, fontSize: 14, color: T.g900 }} />
              {err && <p style={{ fontSize: 12, color: T.rose, marginTop: 6 }}>{err}</p>}
              <button onClick={() => { const u = USERS[sel]; if (u && pw === u.pw) onLogin(u); else setErr("비밀번호를 확인하세요"); }}
                style={{ width: "100%", marginTop: 12, padding: "11px", borderRadius: 8, border: "none", background: T.g900, color: T.white, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                로그인
              </button>
              <p style={{ fontSize: 11, color: T.g400, textAlign: "center", marginTop: 16 }}>테스트: 1234 / 관리자: admin</p>
            </div>
          )}
        </div>
      </div>
      <div style={{ width: "45%", background: T.g900, display: "flex", alignItems: "center", justifyContent: "center", padding: 60 }}>
        <div>
          <p style={{ fontSize: 13, fontWeight: 600, color: T.g400, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 16 }}>GRI Standards 2025</p>
          <p style={{ fontSize: 36, fontWeight: 700, color: T.white, letterSpacing: "-0.03em", lineHeight: 1.3 }}>담당자 친화<br/>입력 블록</p>
          <p style={{ fontSize: 15, color: T.g400, marginTop: 16, lineHeight: 1.7 }}>GRI 번호 몰라도 됩니다.<br/>작성하기 쉬운 순서로 입력하면<br/>시스템이 자동으로 GRI 매핑합니다.</p>
        </div>
      </div>
    </div>
  );
}

function Scope1P({ data, set, ud }) {
  const ce = d => ud==="all"||ud===d;
  const Tbl = ({ title, fuels, dk }) => {
    let sum = 0;
    return (
      <div style={{ marginBottom: 24 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
          <span style={{ fontSize:14, fontWeight:600, color:T.g800 }}>{title}</span>
          <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>{DEPTS[dk].name}</span>
        </div>
        <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
          <table style={{ width:"100%", fontSize:13, borderCollapse:"collapse" }}>
            <thead><tr style={{ borderBottom:`1px solid ${T.g200}` }}>
              {["연료","소비량","단위","에너지 (TJ)","합계 (tCO₂eq)"].map(h =>
                <th key={h} style={{ padding:"12px 14px", textAlign: h==="연료"?"left":"right", fontSize:12, fontWeight:600, color:T.g500 }}>{h}</th>
              )}
            </tr></thead>
            <tbody>{fuels.map((f,i) => {
              const em = calc(data[f.id]||0,f.ncv,f.co2,f.ch4,f.n2o); sum += em.t;
              const canEdit = ce(f.dept);
              return <tr key={f.id} style={{ borderBottom: i < fuels.length-1 ? `1px solid ${T.g100}` : "none" }}>
                <td style={{ padding:"10px 14px", fontWeight:500, color:T.g800 }}>{f.name}</td>
                <td style={{ padding:"6px 4px", textAlign:"right" }}>
                  <input type="number" step="0.01" value={data[f.id]||""} disabled={!canEdit} onChange={e => set(f.id,parseFloat(e.target.value)||0)}
                    style={{ width:90, padding:"7px 10px", borderRadius:6, border:`1px solid ${T.g200}`, background: canEdit ? T.white : T.g50, color:T.g900, textAlign:"right", fontSize:14, fontWeight:600, opacity: canEdit ? 1 : 0.5 }} />
                </td>
                <td style={{ padding:"10px 14px", textAlign:"right", fontSize:12, color:T.g500 }}>{f.u}</td>
                <td style={{ padding:"10px 14px", textAlign:"right", color:T.g500, fontSize:13 }}>{em.e.toFixed(2)}</td>
                <td style={{ padding:"10px 14px", textAlign:"right", fontWeight:600, color:T.g900, fontFeatureSettings:"'tnum'" }}>{em.t.toFixed(2)}</td>
              </tr>;
            })}
            <tr style={{ background:T.g50, borderTop:`1px solid ${T.g200}` }}>
              <td colSpan="4" style={{ padding:"12px 14px", fontSize:13, fontWeight:600, color:T.g600, textAlign:"right" }}>소계</td>
              <td style={{ padding:"12px 14px", textAlign:"right", fontWeight:700, fontSize:16, color:T.g900, fontFeatureSettings:"'tnum'" }}>{sum.toFixed(2)}</td>
            </tr></tbody>
          </table>
        </div>
      </div>
    );
  };
  return (
    <div>
      <Tbl title="고정연소 (보일러·발전기)" fuels={SF} dk="fac"/>
      <Tbl title="이동연소 (차량)" fuels={MF} dk="admin"/>
    </div>
  );
}

function Scope2P({ data, set, ud }) {
  const ce = ud === "all" || ud === "admin";
  let total = 0;
  return (
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
      <div style={{ padding: "12px 20px", borderBottom: `1px solid ${T.g100}`, display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>월별 전력 사용량</span>
        <span style={{ fontSize: 12, fontWeight: 500, color: T.g400 }}>총무과</span>
        <span style={{ fontSize: 11, color: T.g400, marginLeft: "auto" }}>배출계수 {EFS2} tCO₂eq/MWh</span>
      </div>
      <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
        <thead><tr style={{ borderBottom: `1px solid ${T.g200}` }}>
          {["월", "사용량 (kWh)", "MWh", "배출량 (tCO₂eq)"].map(h =>
            <th key={h} style={{ padding: "12px 14px", textAlign: h === "월" ? "left" : "right", fontSize: 12, fontWeight: 600, color: T.g500 }}>{h}</th>
          )}
        </tr></thead>
        <tbody>{MO.map((m, i) => {
          const kwh = data[i] || 0;
          const mwh = kwh / 1000;
          const co2 = mwh * EFS2;
          total += co2;
          return <tr key={i} style={{ borderBottom: i < 11 ? `1px solid ${T.g100}` : "none" }}>
            <td style={{ padding: "10px 14px", fontWeight: 500, color: T.g800 }}>{m}</td>
            <td style={{ padding: "6px 4px", textAlign: "right" }}>
              <input type="number" value={data[i] || ""} disabled={!ce} onChange={e => set(i, parseFloat(e.target.value) || 0)}
                style={{ width: 120, padding: "7px 10px", borderRadius: 6, border: `1px solid ${T.g200}`, background: ce ? T.white : T.g50, color: T.g900, textAlign: "right", fontSize: 14, fontWeight: 600, opacity: ce ? 1 : 0.5 }} />
            </td>
            <td style={{ padding: "10px 14px", textAlign: "right", color: T.g500, fontSize: 13 }}>{mwh.toFixed(3)}</td>
            <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: T.g900, fontFeatureSettings: "'tnum'" }}>{co2.toFixed(2)}</td>
          </tr>;
        })}
        <tr style={{ background: T.g50, borderTop: `1px solid ${T.g200}` }}>
          <td colSpan="3" style={{ padding: "12px 14px", fontSize: 13, fontWeight: 600, color: T.g600, textAlign: "right" }}>연간 합계</td>
          <td style={{ padding: "12px 14px", textAlign: "right", fontWeight: 700, fontSize: 16, color: T.g900, fontFeatureSettings: "'tnum'" }}>{total.toFixed(2)}</td>
        </tr></tbody>
      </table>
    </div>
  );
}

function Scope3P({ data, set, ud }) {
  const ce = d => ud === "all" || ud === d;
  return (
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, overflow: "hidden" }}>
      <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
        <thead><tr style={{ borderBottom: `1px solid ${T.g200}` }}>
          {["카테고리", "항목", "담당", "비용 (백만원)", "배출계수", "배출량 (tCO₂eq)"].map(h =>
            <th key={h} style={{ padding: "12px 14px", textAlign: ["항목","카테고리","담당"].includes(h) ? "left" : "right", fontSize: 12, fontWeight: 600, color: T.g500 }}>{h}</th>
          )}
        </tr></thead>
        <tbody>{S3.map((c, i) => {
          const mine = ce(c.dept);
          const cost = data[c.id] || 0;
          const em = c.ef ? cost * c.ef : 0;
          return <tr key={c.id} style={{ borderBottom: i < S3.length - 1 ? `1px solid ${T.g100}` : "none", opacity: mine ? 1 : 0.5 }}>
            <td style={{ padding: "10px 14px", fontSize: 12, color: T.g500 }}>{c.c}</td>
            <td style={{ padding: "10px 14px", fontWeight: 500, color: T.g800 }}>{c.name}</td>
            <td style={{ padding: "10px 14px", fontSize: 12, color: T.g500 }}>{DEPTS[c.dept].name.split(" · ")[0]}</td>
            <td style={{ padding: "6px 4px", textAlign: "right" }}>
              {c.id === "c7" ? <span style={{ fontSize: 12, color: T.g400 }}>별도 산정</span> :
                <input type="number" value={data[c.id] || ""} disabled={!mine} onChange={e => set(c.id, parseFloat(e.target.value) || 0)}
                  style={{ width: 100, padding: "7px 10px", borderRadius: 6, border: `1px solid ${T.g200}`, background: mine ? T.white : T.g50, color: T.g900, textAlign: "right", fontSize: 13, opacity: mine ? 1 : 0.5 }} />}
            </td>
            <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 12, color: T.g500 }}>{c.ef || "-"}</td>
            <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 600, color: T.g900, fontFeatureSettings: "'tnum'" }}>{em.toFixed(1)}</td>
          </tr>;
        })}</tbody>
      </table>
    </div>
  );
}

function TableInput({ value, onChange, disabled }) {
  const rows = value || [{}];
  const cols = ["항목", "2024 실적", "2025 계획", "단위", "비고"];
  return (
    <div>
      <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
        <thead><tr>{cols.map((c,i) =>
          <th key={i} style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.g500, fontSize: 12, borderBottom: `1px solid ${T.g200}` }}>{c}</th>
        )}<th style={{width:28}}/></tr></thead>
        <tbody>{rows.map((row, ri) => (
          <tr key={ri}>{cols.map((_, ci) => (
            <td key={ci} style={{ padding: "3px 3px" }}>
              <input type="text" value={row[ci] || ""} disabled={disabled}
                onChange={e => {
                  const newRows = [...rows];
                  if (!newRows[ri]) newRows[ri] = {};
                  newRows[ri] = { ...newRows[ri], [ci]: e.target.value };
                  onChange(newRows);
                }}
                style={{ width: "100%", padding: "7px 10px", borderRadius: 6, border: `1px solid ${T.g200}`, background: disabled ? T.g50 : T.white, color: T.g800, fontSize: 13, opacity: disabled ? 0.5 : 1 }} />
            </td>
          ))}<td>{!disabled && ri > 0 && (
            <button onClick={() => {
              const newRows = [...rows]; newRows.splice(ri, 1); onChange(newRows);
            }} style={{ background: "none", border: "none", color: T.g400, cursor: "pointer", fontSize: 16 }}>×</button>
          )}</td></tr>
        ))}</tbody>
      </table>
      {!disabled && <button onClick={() => onChange([...rows, {}])}
        style={{ marginTop: 6, fontSize: 12, fontWeight: 500, color: T.g500, background: "none", border: `1px dashed ${T.g300}`, padding: "5px 12px", borderRadius: 6, cursor: "pointer" }}>+ 행 추가</button>}
    </div>
  );
}

function BlockPanel({ standard, blocks, blockData, setBlockData, scopeData, setS1, setS2, setS3, ud, isAdmin, griMap, vsmeMap }) {
  const [exOpen, setExOpen] = useState({});
  const [otherOpen, setOtherOpen] = useState(false);
  const ce = d => ud === "all" || ud === d;

  const isScope = b => ['scope1_table','scope2_table','scope3_table'].includes(b.input_type);
  const myBlocks = blocks.filter(b => isScope(b) || ce(b.default_dept));
  const otherBlocks = blocks.filter(b => !isScope(b) && !ce(b.default_dept));

            <div style={{ padding: "10px 24px", background: T.g50 }}>

                <p style={{ fontSize: 13, color: T.g600, lineHeight: 1.8 }}>{block.example}</p>
                {block.input_type === "text" && ok && (

function Dash({ scopeData, blockData, blocks, standards }) {
  let s1total = 0;
  SF.forEach(f => s1total += calc(scopeData.s1[f.id]||0, f.ncv, f.co2, f.ch4, f.n2o).t);
  MF.forEach(f => s1total += calc(scopeData.s1[f.id]||0, f.ncv, f.co2, f.ch4, f.n2o).t);
  let s2total = 0;
  for(let i=0;i<12;i++) s2total += ((scopeData.s2[i]||0)/1000) * EFS2;
  let s3total = 0;
  S3.forEach(c => { if(c.ef) s3total += (scopeData.s3[c.id]||0) * c.ef; });
  const grand = s1total + s2total + s3total;

  const totalBlocks = blocks.length;
  const isDone = (b) => {
    if (b.input_type === 'scope1_table') return SF.filter(f => scopeData.s1[f.id]).length + MF.filter(f => scopeData.s1[f.id]).length > 0;
    if (b.input_type === 'scope2_table') return Object.values(scopeData.s2 || {}).some(v => v);
    if (b.input_type === 'scope3_table') return S3.filter(c => c.id !== 'c7' && scopeData.s3[c.id]).length > 0;
    const v = blockData[b.id];
    if (b.input_type === 'text') return v?.content_text && v.content_text.length > 10;
    return v?.content_json && v.content_json.length > 0 && v.content_json.some(r => Object.values(r||{}).some(x => x));
  };
  const doneBlocks = blocks.filter(isDone).length;
  const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;

  return <div>
    <div style={{ marginBottom: 28 }}>
      <h2 style={{ fontSize: 22, fontWeight: 700, color: T.g900, letterSpacing: "-0.02em" }}>Dashboard</h2>
      <p style={{ fontSize: 14, color: T.g500, marginTop: 2 }}>2025년 온실가스 배출량 및 GRI 작성 현황</p>
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 16 }}>
      <KPI label="총 배출량" value={grand} unit="tCO₂eq" />
      <KPI label="Scope 1" value={s1total} unit="tCO₂eq · 직접배출" />
      <KPI label="Scope 2" value={s2total} unit="tCO₂eq · 전력" />
      <KPI label="Scope 3" value={s3total} unit="tCO₂eq · 공급망" />
    </div>
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24, marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <span style={{ fontSize: 14, fontWeight: 600, color: T.g800 }}>전체 입력 진행률</span>
        <span style={{ fontSize: 24, fontWeight: 700, color: T.g900, fontFeatureSettings: "'tnum'" }}>{pct}%</span>
      </div>
      <Bar pct={pct} color={T.g900} h={6}/>
      <div style={{ marginTop: 16 }}>
        {standards.map(s => {
          const sBlocks = blocks.filter(b => b.gri_code === s.code);
          const sDone = sBlocks.filter(isDone).length;
          const p = sBlocks.length ? Math.round(sDone / sBlocks.length * 100) : 0;
          return <div key={s.code} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
            <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 200 }}>{s.title}</span>
            <div style={{ flex: 1 }}><Bar pct={p} color={T.g500} h={4}/></div>
            <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{sDone}/{sBlocks.length}</span>
          </div>;
        })}
      </div>
    </div>
    <div style={{ background: T.white, borderRadius: 12, border: `1px solid ${T.g200}`, padding: 24 }}>
      <span style={{ fontSize: 14, fontWeight: 600, color: T.g800, display: "block", marginBottom: 16 }}>부서별 담당 항목 진행률</span>
      {Object.entries(DEPTS).map(([k, d]) => {
        const deptBlocks = blocks.filter(b => b.default_dept === k);
        if (!deptBlocks.length) return null;
        const deptDone = deptBlocks.filter(isDone).length;
        const p = Math.round(deptDone / deptBlocks.length * 100);
        return <div key={k} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.g600, width: 120 }}>{d.name.split(" · ")[0]}</span>
          <div style={{ flex: 1 }}><Bar pct={p} color={d.color} h={4}/></div>
          <span style={{ fontSize: 12, fontWeight: 600, color: T.g500, width: 60, textAlign: "right", fontFeatureSettings: "'tnum'" }}>{deptDone}/{deptBlocks.length}</span>
        </div>;
      })}
    </div>
  </div>;
}

          if (pg !== "gri_" + s.code) return null;
          const sBlocks = blocks.filter(b => b.gri_code === s.code);
          return <BlockPanel key={s.code} standard={s} blocks={sBlocks} blockData={blockData} setBlockData={setBlockData}
            scopeData={scopeData} setS1={setS1} setS2={setS2} setS3={setS3}
            ud={user.dept} isAdmin={user.dept === "all"} griMap={griMap} vsmeMap={vsmeMap}/>;
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
